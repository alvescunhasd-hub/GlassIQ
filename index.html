<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlassIQ v2.4 - Fenêtrage</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8f9fb; }
    select, input, textarea, button { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const S = {
  label: { display:"block", fontSize:12, fontWeight:700, color:"#374151", letterSpacing:"0.06em", textTransform:"uppercase", marginBottom:6 },
  input: { width:"100%", padding:"9px 12px", borderRadius:8, fontSize:13, border:"1.5px solid #e5e7eb", outline:"none", background:"#fff", color:"#1a1a2e", boxSizing:"border-box" },
  btnPrimary: { padding:"10px 22px", borderRadius:8, fontSize:13, fontWeight:700, cursor:"pointer", background:"#1a1a2e", color:"#fff", border:"none" },
  btnSecondary: { padding:"8px 16px", borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer", background:"#f3f4f6", color:"#374151", border:"1.5px solid #e5e7eb" },
  btnDanger: { padding:"8px 14px", borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer", background:"#fee2e2", color:"#991b1b", border:"1.5px solid #fca5a5" },
  card: { background:"#fff", borderRadius:12, border:"1px solid #e5e7eb", padding:"16px 18px", marginBottom:14 },
};

function PageFenetrage(){
  const [cadreL, setCadreL] = useState(4800);
  const [cadreH, setCadreH] = useState(2650);
  const [colonnes, setColonnes] = useState([1200, 2400, 3600]);
  const [traverses, setTraverses] = useState([2100]);
  const [sections, setSections] = useState([]);
  const [vitrages, setVitrages] = useState({});
  const [pression, setPression] = useState(800);

  // Générer les sections quand cadre/colonnes/traverses changent
  useEffect(() => {
    if (!cadreL || !cadreH) return;

    const cols = [0, ...colonnes.filter(c => c > 0 && c < cadreL), cadreL].sort((a, b) => a - b);
    const trav = [0, ...traverses.filter(t => t > 0 && t < cadreH), cadreH].sort((a, b) => a - b);

    const newSections = [];
    for (let i = 0; i < cols.length - 1; i++) {
      for (let j = 0; j < trav.length - 1; j++) {
        const id = `${i}-${j}`;
        const x1 = cols[i], x2 = cols[i + 1];
        const y1 = trav[j], y2 = trav[j + 1];
        newSections.push({
          id,
          x1, x2, y1, y2,
          L: x2 - x1,
          H: y2 - y1,
          type: "fixe",
          surface: ((x2 - x1) * (y2 - y1)) / 1e6,
        });
      }
    }
    setSections(newSections);
  }, [cadreL, cadreH, colonnes, traverses]);

  const handleAddColonne = () => {
    const val = prompt("Position colonne (mm) :");
    if (val) {
      const newVal = parseInt(val);
      if (newVal > 0 && newVal < cadreL && !colonnes.includes(newVal)) {
        setColonnes([...colonnes, newVal].sort((a, b) => a - b));
      }
    }
  };

  const handleAddTraverse = () => {
    const val = prompt("Position traverse (mm) :");
    if (val) {
      const newVal = parseInt(val);
      if (newVal > 0 && newVal < cadreH && !traverses.includes(newVal)) {
        setTraverses([...traverses, newVal].sort((a, b) => a - b));
      }
    }
  };

  const handleUpdateSection = (id, field, value) => {
    setSections(sections.map(s => s.id === id ? { ...s, [field]: value } : s));
  };

  const handleUpdateVitrage = (id, vitrage) => {
    setVitrages({ ...vitrages, [id]: vitrage });
  };

  const handleDeleteColonne = (idx) => {
    setColonnes(colonnes.filter((_, i) => i !== idx));
  };

  const handleDeleteTraverse = (idx) => {
    setTraverses(traverses.filter((_, i) => i !== idx));
  };

  // Visualisation 2D
  const scale = 0.15;
  const svgWidth = cadreL * scale + 40;
  const svgHeight = cadreH * scale + 40;

  const surfaceFixe = sections.filter(s => s.type === "fixe").reduce((a, s) => a + s.surface, 0);
  const surfaceOuvrant = sections.filter(s => s.type === "ouvrant").reduce((a, s) => a + s.surface, 0);
  const surfaceFixeHaute = sections.filter(s => s.type === "fixe_haute").reduce((a, s) => a + s.surface, 0);

  return (
    <div>
      <div style={S.card}>
        <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 14, color: "#1a1a2e" }}>
          📐 Fenêtrage Châssis avec Traverses
        </div>
        <div style={{ fontSize: 13, color: "#666", marginBottom: 16 }}>
          Définissez les dimensions, colonnes et traverses, puis attribuez le type et le vitrage à chaque section.
        </div>

        {/* Dimensions globales */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
          <div>
            <label style={S.label}>Largeur cadre (mm)</label>
            <input type="number" value={cadreL} onChange={e => setCadreL(parseInt(e.target.value))} style={S.input} />
          </div>
          <div>
            <label style={S.label}>Hauteur cadre (mm)</label>
            <input type="number" value={cadreH} onChange={e => setCadreH(parseInt(e.target.value))} style={S.input} />
          </div>
        </div>

        {/* Colonnes et traverses */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#374151", marginBottom: 8 }}>🔽 Colonnes (X mm)</div>
            {colonnes.map((col, idx) => (
              <div key={idx} style={{ display: "flex", gap: 8, marginBottom: 6 }}>
                <input
                  type="number"
                  value={col}
                  onChange={e => {
                    const newCols = [...colonnes];
                    newCols[idx] = parseInt(e.target.value);
                    setColonnes(newCols.sort((a, b) => a - b));
                  }}
                  style={{ ...S.input, flex: 1 }}
                />
                <button onClick={() => handleDeleteColonne(idx)} style={S.btnDanger}>✕</button>
              </div>
            ))}
            <button onClick={handleAddColonne} style={{ ...S.btnSecondary, width: "100%", marginTop: 8 }}>➕ Ajouter</button>
          </div>

          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#374151", marginBottom: 8 }}>➡️ Traverses (Y mm)</div>
            {traverses.map((trav, idx) => (
              <div key={idx} style={{ display: "flex", gap: 8, marginBottom: 6 }}>
                <input
                  type="number"
                  value={trav}
                  onChange={e => {
                    const newTravs = [...traverses];
                    newTravs[idx] = parseInt(e.target.value);
                    setTraverses(newTravs.sort((a, b) => a - b));
                  }}
                  style={{ ...S.input, flex: 1 }}
                />
                <button onClick={() => handleDeleteTraverse(idx)} style={S.btnDanger}>✕</button>
              </div>
            ))}
            <button onClick={handleAddTraverse} style={{ ...S.btnSecondary, width: "100%", marginTop: 8 }}>➕ Ajouter</button>
          </div>
        </div>

        {/* Pression */}
        <div style={{ marginBottom: 16 }}>
          <label style={S.label}>Pression vent (Pa)</label>
          <input type="number" value={pression} onChange={e => setPression(parseInt(e.target.value))} style={S.input} />
        </div>
      </div>

      {/* Visualisation 2D */}
      {sections.length > 0 && (
        <div style={S.card}>
          <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 12 }}>📊 Vue 2D</div>
          <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} style={{ border: "1px solid #e5e7eb", borderRadius: 8, background: "#fafafa", width: "100%", maxWidth: 600 }}>
            {/* Colonnes */}
            {[0, ...colonnes, cadreL].map((x, i) => (
              <line key={`col-${i}`} x1={20 + x * scale} y1={20} x2={20 + x * scale} y2={20 + cadreH * scale} stroke="#d1d5db" strokeWidth="1" />
            ))}
            {/* Traverses */}
            {[0, ...traverses, cadreH].map((y, i) => (
              <line key={`trav-${i}`} x1={20} y1={20 + y * scale} x2={20 + cadreL * scale} y2={20 + y * scale} stroke="#d1d5db" strokeWidth="1" />
            ))}
            {/* Sections */}
            {sections.map(sec => (
              <g key={sec.id}>
                <rect x={20 + sec.x1 * scale} y={20 + sec.y1 * scale} width={(sec.x2 - sec.x1) * scale} height={(sec.y2 - sec.y1) * scale} fill={sec.type === "ouvrant" ? "#fef08a" : "#e0f2fe"} stroke="#64748b" strokeWidth="1" opacity="0.6" />
                <text x={20 + (sec.x1 + sec.x2) / 2 * scale} y={20 + (sec.y1 + sec.y2) / 2 * scale} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill="#1a1a2e" fontWeight="600">{sec.L}×{sec.H}</text>
              </g>
            ))}
          </svg>
        </div>
      )}

      {/* Tableau sections */}
      {sections.length > 0 && (
        <div style={S.card}>
          <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 14 }}>📋 Sections détail</div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ background: "#f3f4f6", borderBottom: "2px solid #e5e7eb" }}>
                  <th style={{ padding: 8, textAlign: "left", fontWeight: 700 }}>ID</th>
                  <th style={{ padding: 8, textAlign: "left", fontWeight: 700 }}>L×H (mm)</th>
                  <th style={{ padding: 8, textAlign: "left", fontWeight: 700 }}>Surface (m²)</th>
                  <th style={{ padding: 8, textAlign: "left", fontWeight: 700 }}>Type</th>
                  <th style={{ padding: 8, textAlign: "left", fontWeight: 700 }}>Vitrage</th>
                </tr>
              </thead>
              <tbody>
                {sections.map(sec => (
                  <tr key={sec.id} style={{ borderBottom: "1px solid #e5e7eb" }}>
                    <td style={{ padding: 8, fontWeight: 600 }}>{sec.id}</td>
                    <td style={{ padding: 8 }}>{sec.L}×{sec.H}</td>
                    <td style={{ padding: 8 }}>{sec.surface.toFixed(4)}</td>
                    <td style={{ padding: 8 }}>
                      <select value={sec.type} onChange={e => handleUpdateSection(sec.id, "type", e.target.value)} style={{ ...S.input, padding: 4, fontSize: 11 }}>
                        <option value="fixe">Fixe</option>
                        <option value="ouvrant">Ouvrant (Porte)</option>
                        <option value="fixe_haute">Fixe haute</option>
                      </select>
                    </td>
                    <td style={{ padding: 8 }}>
                      <input type="text" placeholder="Ex: 44.2S/16/4" value={vitrages[sec.id] || ""} onChange={e => handleUpdateVitrage(sec.id, e.target.value)} style={{ ...S.input, padding: 4, fontSize: 11 }} />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Résumé */}
          <div style={{ marginTop: 16, padding: 12, background: "#f9fafb", borderRadius: 8 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>📊 Résumé</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, fontSize: 12 }}>
              <div>
                <div style={{ color: "#6b7280", fontSize: 11 }}>FIXE</div>
                <div style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e" }}>{surfaceFixe.toFixed(2)}</div>
                <div style={{ color: "#9ca3af", fontSize: 11 }}>m²</div>
              </div>
              <div>
                <div style={{ color: "#6b7280", fontSize: 11 }}>OUVRANT</div>
                <div style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e" }}>{surfaceOuvrant.toFixed(2)}</div>
                <div style={{ color: "#9ca3af", fontSize: 11 }}>m²</div>
              </div>
              <div>
                <div style={{ color: "#6b7280", fontSize: 11 }}>FIXE HAUTE</div>
                <div style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e" }}>{surfaceFixeHaute.toFixed(2)}</div>
                <div style={{ color: "#9ca3af", fontSize: 11 }}>m²</div>
              </div>
            </div>
            <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #e5e7eb", fontSize: 14, fontWeight: 700, color: "#1a1a2e" }}>
              TOTAL : {(surfaceFixe + surfaceOuvrant + surfaceFixeHaute).toFixed(2)} m²
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  return (
    <div style={{ fontFamily: "'Segoe UI',system-ui,sans-serif", minHeight: "100vh", background: "#f8f9fb" }}>
      <div style={{ background: "#1a1a2e", color: "#fff", padding: "16px 20px", borderBottom: "1px solid rgba(255,255,255,0.08)" }}>
        <div style={{ maxWidth: 960, margin: "0 auto", display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 32, height: 32, borderRadius: 8, background: "linear-gradient(135deg,#4ade80,#22c55e)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🪟</div>
          <div>
            <div style={{ fontWeight: 800, fontSize: 16 }}>GlassIQ v2.4</div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.5)" }}>Fenêtrage Châssis</div>
          </div>
        </div>
      </div>
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "22px 16px" }}>
        <PageFenetrage />
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
