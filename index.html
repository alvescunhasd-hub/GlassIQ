// Champs de prescription alimentés par le comparateur
const CHAMPS_COMPARATEUR=["gamme","vitrage","rw","rwctr","rapport","correction","uw","aev","epaisseur_dtu","epaisseur_reelle","poids_m2","poids_vantail"];

// ── PAGE 3 : COMPARATEUR MULTI-CRITÈRES ───────────────────────────────────
function PageComparateur({db,projet,setProjet,setPage}){
  const [results,setResults]=useState(null);
  const [loading,setLoading]=useState(false);
  const [selEl,setSelEl]=useState(0);
  const prescs=projet.prescriptions||{};// système retenu = lu dans le projet (persistant)
  const [vlibre,setVlibre]=useState({compo:"",sysId:"",verre:"recuit"});// vérificateur de vitrage libre
  const el=projet.elements[selEl]||projet.elements[0];
  const pression=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const ventEl=el?calcVentElement(el,projet):null;

  const chercher=async()=>{
    if(!el)return;
    setLoading(true);
    await new Promise(r=>setTimeout(r,200));
    const ratr=parseInt(el.ratr)||36;
    // Surface de référence pour la correction acoustique : châssis entier ; pour une
    // façade, le plus grand vitrage (les PV façade portent sur des modules, pas 40 m²).
    let surf=null;
    if(el.largeur&&el.hauteur){
      if(el.type==="facade"){const pan=panneauxCalcul(el);surf=pan.length?Math.max(...pan.map(p=>p.largeur*p.hauteur/1e6)):null;}
      else surf=(+el.largeur/1000)*(+el.hauteur/1000);
    }
    const va=verifAllege(el);
    const allegeReq=va.protection_requise&&!el.allege_opaque;
    const solutions=[];
    for(const sys of db.systemes){
      if(!Array.isArray(sys.tests)||sys.tests.length===0)continue;
      if(el.type==="facade"&&sys.famille!=="Façade")continue;
      if(el.type==="chassis"&&sys.famille==="Façade")continue;
      // Un système Coulissant n'est pas fabricable en ouvrant battant (OB/OF) et inversement.
      if(el.type==="chassis"){
        const estCoulissant=/coulissant/i.test(el.soustype||"");
        const sysEstCoulissant=sys.famille==="Coulissant";
        if(estCoulissant!==sysEstCoulissant)continue;
      }
      const bpc={};
      for(const test of sys.tests){
        const st=((+test.dim_L||0)/1000)*((+test.dim_H||0)/1000);let corr=0;
        if(surf&&st>0&&surf>st){const r=surf/st;if(r<=1.5)corr=-1;else if(r<=2.0)corr=-2;else corr=-3;}
        for(const v of (test.vitrages||[])){
          const rc=(+v.rwctr)+corr;
          if(isFinite(rc)&&rc>=ratr){const k=v.composition;if(!bpc[k]||rc<bpc[k].rc)bpc[k]={...v,rc,corr,test};}
        }
      }
      const matches=Object.values(bpc).sort((a,b)=>a.rc-b.rc);
      if(!matches.length)continue;
      // Composition proposée : la plus "juste" acoustiquement PARMI celles qui passent
      // les contrôles mécaniques (feuillure, poids, résistance, flèche, allège).
      const evals=matches.map(m=>{
        const v=verifVitrage(m.composition,+el.largeur||1230,+el.hauteur||1480,sys,el,projet);
        const al=allegeReq?verifFeuilleteAllege(m.composition).ok:null;
        const k=[v?v.feuillure_ok:null,v?v.poids_ok:null,v?v.resistance_ok:null,v?v.fleche_verre_ok:null,al].filter(c=>c===false).length;
        return {m,v,al,k};
      }).sort((a,b)=>a.k!==b.k?a.k-b.k:a.m.rc-b.m.rc);
      const best=evals[0].m, vBest=evals[0].v, allege_ok=evals[0].al;
      const th=verifThermique(sys,el,projet);
      const uw_ok=parseFloat(projet.uw_max)>0?th.ok:null;
      const aev=verifAEV(sys,pression,el.type==="facade",projet.aev_min);
      const dta=statutDTA(sys.validite);
      const dta_ok=dta.statut==="expire"?false:dta.statut==="inconnu"?null:true;
      const vd=verifDimensions(sys,+el.largeur,+el.hauteur,el);
      const dim_ok=vd.statut==="hors"?false:vd.statut==="ok"?true:null;
      const ep_ok=vBest?vBest.feuillure_ok:null;
      const poids_ok=vBest?vBest.poids_ok:null;
      const resistance_ok=vBest?vBest.resistance_ok:null;
      const fleche_verre_ok=vBest?vBest.fleche_verre_ok:null;
      const ko=[uw_ok,aev.ok,ep_ok,poids_ok,resistance_ok,fleche_verre_ok,dta_ok,dim_ok,allege_ok].filter(c=>c===false).length;
      solutions.push({sys,best,allMatches:matches,uw_ok,th,aev_ok:aev.ok,aev_note:aev.note,ep_ok,poids_ok,resistance_ok,fleche_verre_ok,dta_ok,dim_ok,allege_ok,ko});
    }
    solutions.sort((a,b)=>a.ko!==b.ko?a.ko-b.ko:a.best.rc-b.best.rc);
    setResults(solutions);setLoading(false);
  };

  // Injecte le système retenu dans projet.prescriptions[elId]. Une nouvelle retenue
  // efface les modifications manuelles de ces champs en page Prescription (sinon
  // elles masqueraient le nouveau choix).
  const prescPour=(e,sys,best,serie)=>{
    const th=verifThermique(sys,e,projet);
    const v=verifVitrage(best.composition,+e.largeur||1230,+e.hauteur||1480,sys,e,projet);
    const ve=calcVentElement(e,projet,sys);
    return {
      elId:e.id, sysId:sys.id,
      gamme:`${sys.marque} ${sys.nom}`,
      vitrage:best.composition,
      rw:`${best.rw} dB`,
      rwctr:`${best.rc} dB`,
      rapport:best.test.rapport,
      correction:best.corr!==0?`${best.corr} dB`:"0 dB",
      uw:th.cfg?`${th.cfg.uw} W/m²K`:"",
      aev:sys.aev&&sys.aev.length>0?sys.aev.map(a=>`${a.A}/${a.E}/${a.V}`).join(" | "):"",
      epaisseur_dtu:ve?`${ve.dtu.eRequired} mm`:"",
      epaisseur_reelle:v?`${v.epaisseur_totale} mm`:"",
      poids_m2:v?`${v.poids_m2} kg/m²`:"",
      poids_vantail:v&&v.poids_vantail!=null?`${v.poids_vantail} kg`:"",
      ...(serie?{serie_depuis:serie}:{}),
    };
  };
  const enregistrer=(liste)=>setProjet(p=>{
    const ov={...(p.presc_overrides||{})};
    const pr={...(p.prescriptions||{})};
    liste.forEach(x=>{
      if(ov[x.elId]){const o={...ov[x.elId]};CHAMPS_COMPARATEUR.forEach(k=>{delete o[k];});ov[x.elId]=o;}
      pr[x.elId]=x;
    });
    return {...p,prescriptions:pr,presc_overrides:ov};
  });
  // Injecte le système retenu dans projet.prescriptions[elId]. Une nouvelle retenue
  // efface les modifications manuelles de ces champs en page Prescription (sinon
  // elles masqueraient le nouveau choix).
  const utiliser=(sys,best)=>enregistrer([prescPour(el,sys,best)]);
  // Série : mêmes éléments que celui analysé (même type, même système au chiffrage —
  // ou même type d'ouvrage s'il n'y a pas de chiffrage), pas encore prescrits.
  const groupeDe=e=>e.chiffrage&&e.chiffrage.systeme?e.chiffrage.systeme:(e.type==="facade"?"façade":e.soustype||"");
  const serie=el?projet.elements.filter(e=>e.id!==el.id&&e.type===el.type&&groupeDe(e)===groupeDe(el)&&!prescs[e.id]):[];
  const utiliserSerie=(sys,best)=>enregistrer([prescPour(el,sys,best),...serie.map(e=>prescPour(e,sys,best,el.label))]);

  // Résumé des éléments déjà confirmés
  const nbConfirmed=projet.elements.filter(e=>prescs[e.id]).length;
  const allConfirmed=projet.elements.length>0&&nbConfirmed>=projet.elements.length;

  return <div>
    <StepBar current={3} setPage={setPage}/>
    <div style={{...S.card,background:"#eef2ff",border:"1px solid #c7d2fe",marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:600,color:"#3730a3",marginBottom:4}}>⚖ Comparateur multi-critères — acoustique + AEV vent + thermique + feuillure</div>
      <div style={{fontSize:12,color:"#3730a3"}}>Sélectionne l'élément, analyse, puis clique <strong>"✓ Retenir ce système"</strong> — la prescription se remplit automatiquement.</div>
    </div>

    {/* Sélection élément + statut */}
    <div style={{marginBottom:14}}>
      <label style={S.label}>Élément à analyser</label>
      <div style={{fontSize:11,color:"#6b7280",marginBottom:6}}>Analyse un élément type, puis « ⧉ + N autres » pour retenir le même système et le même vitrage sur tous les éléments du même système non encore prescrits (contrôles DTU 39, poids et feuillure recalculés pour chacun).</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {projet.elements.map((e,i)=>{
          const done=prescs[e.id];
          return <button key={i} onClick={()=>{setSelEl(i);setResults(null);}} style={{padding:"7px 14px",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",border:"1.5px solid",background:selEl===i?"#1a1a2e":done?"#f0fdf4":"#f9fafb",color:selEl===i?"#fff":done?"#065f46":"#374151",borderColor:selEl===i?"#1a1a2e":done?"#6ee7b7":"#e5e7eb"}}>
            {done?"✓ ":""}{e.label} <span style={{fontSize:11,opacity:0.7}}>RA,tr {e.ratr} dB</span>
          </button>;
        })}
      </div>
      {nbConfirmed>0&&<div style={{marginTop:8,fontSize:12,color:"#065f46"}}>{nbConfirmed}/{projet.elements.length} élément{nbConfirmed>1?"s":""} confirmé{nbConfirmed>1?"s":""}</div>}
    </div>

    {el&&<div style={{...S.card,background:"#f9fafb",marginBottom:14}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12}}>
        <Stat label="RA,tr requis" value={`≥ ${el.ratr} dB`} hi/><Stat label="Uw max" value={projet.uw_max?`≤ ${projet.uw_max}`:"Non précisé"}/><Stat label="g max" value={projet.g_max?`≤ ${projet.g_max}`:"Non précisé"}/><Stat label="Pression vent" value={pression?`${pression} Pa`:"Non calculée"}/><Stat label="Épaisseur DTU 39" value={ventEl?`≥ ${ventEl.dtu.eRequired} mm`:"Non calculée"}/>
      </div>
      {prescs[el.id]&&<div style={{marginTop:10,padding:"8px 12px",background:"#d1fae5",borderRadius:8,fontSize:12,color:"#065f46",fontWeight:600}}>
        ✓ Système retenu : <strong>{prescs[el.id].gamme}</strong> — {prescs[el.id].vitrage} — RA,tr {prescs[el.id].rwctr}
      </div>}
    </div>}

    <button onClick={chercher} disabled={loading||!el} style={S.btnPrimary}>{loading?"Analyse…":"⚖ Analyser les systèmes compatibles"}</button>

    {/* ── VÉRIFICATEUR DE VITRAGE LIBRE ─────────────────────────────────────
        Teste N'IMPORTE QUELLE composition (même non testée en base) sur l'élément
        courant : eR (résistance), eF (flèche), poids, feuillure. Le contrôle
        acoustique n'est PAS inclus ici (il exige un PV d'essai réel, non calculable). */}
    {el&&(()=>{
      const sysV=db.systemes.find(s=>s.id===vlibre.sysId)||null;
      let res=null;
      if(vlibre.compo.trim()){
        res=verifVitrage(vlibre.compo.trim(),+el.largeur||1230,+el.hauteur||1480,sysV,el,{...projet,type_verre:vlibre.verre});
      }
      const sysList=db.systemes.filter(s=>{
        if(el.type==="facade")return s.famille==="Façade";
        if(s.famille==="Façade")return false;
        const estC=/coulissant/i.test(el.soustype||"");
        return estC?s.famille==="Coulissant":s.famille!=="Coulissant";
      });
      return <div style={{...S.card,marginTop:14,background:"#fffbeb",border:"1px solid #fde68a"}}>
        <div style={{fontSize:13,fontWeight:700,color:"#92400e",marginBottom:8}}>🔬 Vérificateur de vitrage libre</div>
        <div style={{fontSize:11,color:"#92400e",marginBottom:10}}>Teste une composition de ton choix (même non testée en base) sur <strong>{el.label||"l'élément courant"}</strong> — résistance, flèche, poids, feuillure. L'acoustique n'est pas vérifiée ici (elle exige un PV d'essai réel).</div>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr",gap:10,marginBottom:10}}>
          <div><label style={{...S.label,fontSize:10}}>Composition (ex: 55.2/16/44.2s)</label><input type="text" value={vlibre.compo} placeholder="55.2/16/44.2s" onChange={e=>setVlibre(v=>({...v,compo:e.target.value}))} style={S.input}/></div>
          <div><label style={{...S.label,fontSize:10}}>Système (feuillure)</label><select value={vlibre.sysId} onChange={e=>setVlibre(v=>({...v,sysId:e.target.value}))} style={S.input}><option value="">— choisir —</option>{sysList.map(s=><option key={s.id} value={s.id}>{s.marque} {s.nom}</option>)}</select></div>
          <div><label style={{...S.label,fontSize:10}}>Type de verre</label><select value={vlibre.verre} onChange={e=>setVlibre(v=>({...v,verre:e.target.value}))} style={S.input}>{Object.entries(EPS3_TYPES).map(([k,val])=><option key={k} value={k}>{val.label}</option>)}</select></div>
        </div>
        {res&&<div style={{padding:"12px 14px",background:"#fff",borderRadius:8,border:"1px solid #e5e7eb"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:8}}>
            <div><div style={{fontSize:10,color:"#6b7280"}}>Épaisseur totale</div><div style={{fontSize:15,fontWeight:700,color:res.feuillure_ok===false?"#991b1b":"#1a1a2e"}}>{res.epaisseur_totale} mm {sysV?(res.feuillure_ok===false?"✗":"✓"):""}</div>{sysV&&<div style={{fontSize:9,color:"#9ca3af"}}>feuillure {sysV.epaisseur_min}–{sysV.epaisseur_max}mm</div>}</div>
            <div><div style={{fontSize:10,color:"#6b7280"}}>Poids {res.isFacade?"/panneau":res.nb_vantaux===0?"/fixe":"/vantail"}</div><div style={{fontSize:15,fontWeight:700,color:res.poids_ok===false?"#991b1b":"#1a1a2e"}}>{res.poids_vantail} kg {sysV?(res.poids_ok===false?"✗":"✓"):""}</div>{res.poids_max&&<div style={{fontSize:9,color:"#9ca3af"}}>max {res.poids_max} kg</div>}</div>
            <div><div style={{fontSize:10,color:"#6b7280"}}>Résistance (Art.8)</div><div style={{fontSize:15,fontWeight:700,color:res.resistance_ok===false?"#991b1b":"#059669"}}>{res.eR_reel!=null?"eR "+res.eR_reel+" mm":"—"} {res.resistance_ok===false?"✗":res.resistance_ok?"✓":""}</div>{res.dtu_verre&&<div style={{fontSize:9,color:"#9ca3af"}}>requis ≥ {(res.dtu_verre.e1*res.dtu_verre.c).toFixed(2)} mm</div>}</div>
            <div><div style={{fontSize:10,color:"#6b7280"}}>Flèche (Art.9)</div><div style={{fontSize:15,fontWeight:700,color:res.fleche_verre_ok===false?"#991b1b":"#059669"}}>{res.eF_reel!=null?"eF "+res.eF_reel+" mm":"—"} {res.fleche_verre_ok===false?"✗":res.fleche_verre_ok?"✓":""}</div>{res.dtu_verre&&<div style={{fontSize:9,color:"#9ca3af"}}>requis ≥ {res.dtu_verre.eF_requis} mm</div>}{res.fleche_obtenue!=null&&<div style={{fontSize:9,color:res.fleche_obtenue>res.dtu_verre.flecheMax?"#991b1b":"#059669",fontWeight:600}}>flèche {res.fleche_obtenue} / {res.dtu_verre.flecheMax} mm {res.fleche_obtenue>res.dtu_verre.flecheMax?"✗":"✓"}</div>}</div>
          </div>
          {res.base_label&&<div style={{fontSize:10,color:"#6b7280",marginBottom:2}}>Poids calculé sur : {res.base_label}{res.controle_ferrure===false?" — fixe, pas de limite ferrure":""}</div>}
          {res.base_calcul&&<div style={{fontSize:10,color:"#6b7280",marginBottom:6}}>Résistance / flèche : {res.base_calcul}</div>}
          {(()=>{
            const checks=[res.feuillure_ok,res.poids_ok,res.resistance_ok,res.fleche_verre_ok];
            const anyFail=checks.some(c=>c===false);
            const allEval=res.dtu_verre&&sysV;
            return <div style={{padding:"8px 12px",borderRadius:6,fontWeight:700,fontSize:13,background:anyFail?"#fef2f2":allEval?"#f0fdf4":"#f9fafb",color:anyFail?"#991b1b":allEval?"#065f46":"#6b7280"}}>
              {!sysV?"⚠ Choisis un système pour vérifier la feuillure et le poids":anyFail?"✗ Cette composition NE convient PAS (voir critères en rouge)":allEval?"✓ Composition compatible (résistance, flèche, poids, feuillure)":"Renseigne la pression de vent (étape vent) pour la vérif résistance/flèche"}
            </div>;
          })()}
        </div>}
        {vlibre.compo.trim()&&!res&&<div style={{fontSize:12,color:"#991b1b"}}>Composition non reconnue — format attendu verre/lame/verre, ex. 44.2 · 6/16/44.2s · 10/12/44.2 Ac · 1010.4/16/8</div>}
      </div>;
    })()}

    {results&&<div style={{marginTop:20}}>
      <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}><strong>{results.length}</strong> système{results.length>1?"s":""} conforme{results.length>1?"s":""} acoustiquement — triés par conformité globale</div>
      {results.map(({sys,best:bestAlgo,allMatches,uw_ok,th,aev_ok,aev_note,dta_ok,dim_ok,allege_ok,ko},i)=>{
        const allOk=ko===0;const bc=allOk?"#6ee7b7":ko>=2?"#fca5a5":"#fde68a";const bg=allOk?"#f0fdf4":ko>=2?"#fff1f2":"#fffbeb";
        const pr=prescs[el.id];
        const isRetenu=!!pr&&(pr.sysId?pr.sysId===sys.id:pr.gamme===`${sys.marque} ${sys.nom}`);
        // Si ce système est retenu, on affiche la composition RÉELLEMENT choisie par
        // l'utilisateur (qui peut être une "autre composition compatible"), pas celle
        // proposée par défaut par l'algorithme — sinon la sélection ne se reflète jamais.
        const best=isRetenu?(allMatches.find(m=>m.composition===pr.vitrage)||bestAlgo):bestAlgo;
        const vCard=verifVitrage(best.composition,+el.largeur||1230,+el.hauteur||1480,sys,el,projet);
        return <div key={sys.id} style={{...S.card,border:isRetenu?"2px solid #059669":(`1.5px solid ${bc}`),background:isRetenu?"#f0fdf4":bg,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{width:26,height:26,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,background:isRetenu?"#059669":allOk?"#d1fae5":ko>=2?"#fee2e2":"#fef3c7",color:isRetenu?"#fff":undefined}}>{isRetenu?"★":allOk?"✓":ko>=2?"✗":"⚠"}</span>
              <div><div style={{fontWeight:800,fontSize:15,color:"#1a1a2e"}}>{sys.marque} {sys.nom}</div><div style={{fontSize:12,color:"#6b7280"}}>{sys.famille} · DTA: {sys.dta||"—"} · Feuillure: {sys.epaisseur_min}–{sys.epaisseur_max}mm</div>
              {(()=>{const st=statutDTA(sys.validite);return <div style={{display:"inline-block",marginTop:4,padding:"2px 8px",borderRadius:5,fontSize:11,fontWeight:700,color:st.couleur,background:st.bg,border:`1px solid ${st.couleur}33`}}>{st.statut==="expire"?"⛔ ":st.statut==="bientot"?"⚠ ":st.statut==="inconnu"?"? ":"✓ "}{st.texte}</div>;})()}
              {(()=>{const vd=verifDimensions(sys,+el.largeur,+el.hauteur,el);if(vd.statut==="aucune")return null;return <div style={{display:"inline-block",marginTop:4,marginLeft:6,padding:"2px 8px",borderRadius:5,fontSize:11,fontWeight:700,color:vd.couleur,background:vd.bg,border:`1px solid ${vd.couleur}33`}}>{vd.statut==="hors"?"📐 ⚠ ":"📐 ✓ "}{vd.texte}</div>;})()}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <div style={{textAlign:"right"}}><div style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:"#374151"}}>{best.composition}</div><div style={{fontSize:12,color:"#059669"}}>RA,tr {best.rc} dB{best.corr!==0?` (corrigé ${best.corr} dB)`:""}</div><div style={{fontSize:11,color:"#6b7280"}}>Rapport {best.test.rapport}</div></div>
              <button onClick={()=>utiliser(sys,best,allMatches)} style={{padding:"8px 14px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:"none",background:isRetenu?"#059669":"#1a1a2e",color:"#fff",whiteSpace:"nowrap"}}>
                {isRetenu?"★ Retenu":"✓ Retenir ce système"}
              </button>
              {serie.length>0&&<button onClick={()=>utiliserSerie(sys,best)} title={"Éléments concernés : "+serie.map(e=>e.label).join(", ")} style={{padding:"8px 12px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",border:"1.5px solid #1a1a2e",background:"#fff",color:"#1a1a2e",whiteSpace:"nowrap"}}>
                ⧉ + {serie.length} autre{serie.length>1?"s":""} {groupeDe(el)}
              </button>}
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,columnGap:16}}>
            <CheckRow label="Acoustique RA,tr" ok={true} note={`${best.rc} dB ≥ ${el.ratr} dB`}/>
            <CheckRow label="Thermique Uw" ok={uw_ok} note={!(parseFloat(projet.uw_max)>0)?"Uw max non précisé":th&&th.cfg?`Uw ${th.cfg.uw} / max ${projet.uw_max}`:"Données manquantes"}/>
            <CheckRow label={el.type==="facade"?"Vent — essai façade":"Vent — classe V"} ok={aev_ok} note={aev_note}/>
            <CheckRow label="Épaisseur feuillure" ok={vCard?vCard.feuillure_ok:null} note={vCard?`${vCard.epaisseur_totale} mm (${sys.epaisseur_min}–${sys.epaisseur_max})`:"Non vérifiable"}/>
            <CheckRow label="Validité DTA" ok={dta_ok} note={dta_ok===null?"Non renseignée":dta_ok?"Valide":"Expiré"}/>
            <CheckRow label="Domaine d'emploi" ok={dim_ok} note={dim_ok===null?"Non vérifié":dim_ok?"Dans le domaine":"Hors domaine"}/>
          </div>
          {th&&th.cfg&&parseFloat(projet.uw_max)>0&&<div style={{fontSize:10,color:"#9ca3af",marginTop:4}}>Thermique — config de référence : {th.note}</div>}
          {/* Vérification physique : poids vantail + épaisseur réelle vs feuillure */}
          {(()=>{
            const v=verifVitrage(best.composition,+el.largeur||1230,+el.hauteur||1480,sys,el,projet);
            if(!v)return <div style={{marginTop:8,padding:"8px 12px",background:"#fff7ed",borderRadius:8,border:"1px solid #fed7aa",fontSize:12,color:"#9a3412",fontWeight:600}}>⚠ Composition « {best.composition} » non analysable automatiquement — poids, feuillure, résistance et flèche NON vérifiés.</div>;
            return <div style={{marginTop:8,padding:"8px 12px",background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb"}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,alignItems:"center"}}>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>ÉPAISSEUR RÉELLE</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.feuillure_ok===false?"#991b1b":"#1a1a2e"}}>{v.epaisseur_totale} mm {v.feuillure_ok===false?"✗":v.feuillure_ok?"✓":""}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{v.type} · feuillure {v.feuillure_min}–{v.feuillure_max}mm</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>POIDS VITRAGE</div>
                  <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>{v.poids_m2} kg/m²</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{v.nb_verres} verre{v.nb_verres>1?"s":""}{v.lames_air.length?" · lame "+v.lames_air.join("+")+"mm":""}</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>{v.isFacade?"POIDS / PANNEAU":(v.nb_vantaux===0?"POIDS / FIXE":"POIDS VANTAIL")} ({v.surface} m²)</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.poids_ok===false?"#991b1b":v.poids_ok?"#059669":"#1a1a2e"}}>{v.poids_vantail} kg {v.poids_ok===false?"✗":v.poids_ok?"✓":""}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{v.base_label} · {v.controle_ferrure===false?"fixe : pas de limite ferrure":`max ${v.isFacade?"appui":"ferrure"} : ${v.poids_max?v.poids_max+" kg":"non renseigné"}`}</div>
                </div>
                <div>
                  {v.poids_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ {v.isFacade?"Panneau trop lourd pour l'appui vitrage":"Vantail trop lourd pour la quincaillerie"}</div>}
                  {v.feuillure_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ Épaisseur incompatible feuillure</div>}
                  {v.resistance_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ Résistance au vent insuffisante (Art.8)</div>}
                  {v.fleche_verre_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ Flèche du vitrage excessive (Art.9)</div>}
                  {v.poids_ok!==false&&v.feuillure_ok!==false&&v.resistance_ok!==false&&v.fleche_verre_ok!==false&&<div style={{fontSize:11,color:"#059669",fontWeight:600,lineHeight:1.4}}>✓ Faisabilité mécanique OK</div>}
                </div>
              </div>
              {/* Résistance & flèche du vitrage — NF DTU 39 P4 Art.8-9 */}
              {v.dtu_verre&&<div style={{marginTop:8,paddingTop:8,borderTop:"1px solid #e5e7eb",display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>RÉSISTANCE AU VENT (Art.8)</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.resistance_ok===false?"#991b1b":"#059669"}}>eR = {v.eR_reel} mm {v.resistance_ok===false?"✗":"✓"}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>requis ≥ {(v.dtu_verre.e1*v.dtu_verre.c).toFixed(2)} mm (e1×c)</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>FLÈCHE DU VITRAGE (Art.9)</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.fleche_verre_ok===false?"#991b1b":"#059669"}}>eF = {v.eF_reel} mm {v.fleche_verre_ok===false?"✗":"✓"}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>requis ≥ {v.dtu_verre.eF_requis} mm (déformation ≤ {v.dtu_verre.flecheMax}mm)</div>
                  {v.fleche_obtenue!=null&&<div style={{fontSize:10,color:v.fleche_obtenue>v.dtu_verre.flecheMax?"#991b1b":"#059669",fontWeight:600,marginTop:2}}>↳ flèche obtenue : {v.fleche_obtenue} mm / {v.dtu_verre.flecheMax} mm {v.fleche_obtenue>v.dtu_verre.flecheMax?"✗":"✓"}</div>}
                </div>
              </div>}
              {v.base_calcul&&<div style={{fontSize:10,color:"#6b7280",marginTop:6}}>Résistance / flèche calculées sur : {v.base_calcul}</div>}
              {/* Détail partie par partie — châssis/façade composé */}
              {v.detail_panneaux&&v.detail_panneaux.length>1&&<div style={{marginTop:8,padding:"8px 12px",background:"#faf5ff",borderRadius:8,border:"1px solid #e9d5ff"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#6b21a8",marginBottom:6}}>📋 Détail par partie ({v.detail_panneaux.length} types de panneaux)</div>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead><tr style={{color:"#6b7280",textAlign:"left"}}>
                      <th style={{padding:"3px 6px"}}>Partie</th><th style={{padding:"3px 6px"}}>Dim.</th><th style={{padding:"3px 6px"}}>Qté</th>
                      <th style={{padding:"3px 6px"}}>Requis</th><th style={{padding:"3px 6px"}}>eR={v.eR_reel}</th>
                      <th style={{padding:"3px 6px"}}>Flèche</th><th style={{padding:"3px 6px"}}>/adm.</th>
                    </tr></thead>
                    <tbody>
                      {v.detail_panneaux.map((d,di)=>(
                        <tr key={di} style={{borderTop:"1px solid #f3e8ff"}}>
                          <td style={{padding:"3px 6px"}}>{d.type==="ouvrant"?"🔓 ouvrant":d.type==="porte"?"🚪 porte":"▢ fixe"}{d.label?` ${d.label}`:""}</td>
                          <td style={{padding:"3px 6px",fontFamily:"monospace"}}>{d.largeur}×{d.hauteur}</td>
                          <td style={{padding:"3px 6px"}}>{d.qte}</td>
                          <td style={{padding:"3px 6px"}}>≥{d.requis} mm</td>
                          <td style={{padding:"3px 6px",fontWeight:700,color:d.res_ok?"#059669":"#991b1b"}}>{d.res_ok?"✓":"✗"}</td>
                          <td style={{padding:"3px 6px"}}>{d.fleche_obtenue!=null?d.fleche_obtenue+" mm":"—"}</td>
                          <td style={{padding:"3px 6px",fontWeight:700,color:d.fleche_ok===false?"#991b1b":d.fleche_ok?"#059669":"#9ca3af"}}>{d.fleche_ok===false?"✗":d.fleche_ok?"✓":"—"}/{d.fleche_max}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{fontSize:10,color:"#9ca3af",marginTop:4}}>Le verdict global n'est ✓ que si TOUTES les parties sont conformes. eR / eF sont des propriétés du vitrage ; seuls le « requis » et la flèche changent selon la taille de chaque partie.</div>
              </div>}
              {/* Suggestions de découpage si vantail trop lourd */}
              {v.poids_decoupage&&v.poids_decoupage.length>0&&<div style={{marginTop:8,padding:"8px 12px",background:"#eff6ff",borderRadius:8,border:"1px solid #bfdbfe"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#1e40af",marginBottom:6}}>💡 Solutions de découpage pour passer sous {v.poids_max} kg/vantail :</div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {v.poids_decoupage.map((opt,oi)=>(
                    <div key={oi} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#1e3a8a"}}>
                      <span style={{background:"#dbeafe",borderRadius:6,padding:"2px 8px",fontWeight:600,fontSize:11}}>{opt.poids} kg/vtl ✓</span>
                      <strong>{opt.label}</strong>
                      <span style={{color:"#6b7280",fontSize:11}}>— {opt.detail}</span>
                    </div>
                  ))}
                </div>
                <div style={{fontSize:10,color:"#6b7280",marginTop:6}}>Renseigne le nombre de vantaux (ou une largeur de fixe) dans la composition du châssis en étape 1 pour valider automatiquement.</div>
              </div>}
            </div>;
          })()}
          {/* Sécurité allège — feuilleté obligatoire si vitrage fait garde-corps */}
          {(()=>{
            const va=verifAllege(el);
            if(!va.protection_requise||el.allege_opaque)return null;
            const fa=verifFeuilleteAllege(best.composition);
            const okc=fa.ok===true;
            return <div style={{marginTop:8,padding:"7px 12px",borderRadius:8,background:okc?"#f0fdf4":"#fef2f2",border:`1px solid ${okc?"#bbf7d0":"#fecaca"}`,fontSize:12,color:okc?"#065f46":"#991b1b",fontWeight:600}}>
              {okc?`✓ Sécurité allège — ${best.composition} : ${fa.texte} (classe 1B1 EN 12600, NF DTU 39 P5)`:`⚠ Sécurité allège — ${best.composition} : ${fa.texte} (vitrage faisant garde-corps, NF DTU 39 P5 / EN 12600 classe 1B1)`}
              <div style={{fontSize:10,fontWeight:400,color:"#6b7280",marginTop:2}}>Composition lue de l'extérieur vers l'intérieur.</div>
            </div>;
          })()}
          {/* Autres compositions compatibles */}
          {allMatches.length>1&&<div style={{marginTop:8}}>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>Autres compositions compatibles :</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {allMatches.filter(m=>m.composition!==best.composition).map((m,mi)=><button key={mi} onClick={()=>utiliser(sys,m,allMatches)} style={{padding:"3px 10px",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer",border:"1px solid #d1d5db",background:"#fff",color:"#374151",fontFamily:"monospace"}}>{m.composition} — {m.rc} dB</button>)}
            </div>
          </div>}
          {best.corr!==0&&<div style={{marginTop:8,padding:"6px 10px",background:"#fef3c7",borderRadius:6,fontSize:12,color:"#92400e"}}>⚠ Correction dimensionnelle {best.corr} dB (surface projet &gt; surface essai)</div>}
        </div>;
      })}
      <div style={{display:"flex",gap:10,marginTop:10,flexWrap:"wrap",alignItems:"center"}}>
        {allConfirmed&&<div style={{fontSize:13,color:"#059669",fontWeight:600}}>✓ Tous les éléments ont un système retenu</div>}
        <button onClick={()=>setPage("prescription")} style={{...S.btnPrimary,background:"#059669"}}>📄 Étape 5 — Voir la prescription →</button>
      </div>
    </div>}
  </div>;
}

// ── PAGE 4 : CONTRÔLE SOLAIRE ─────────────────────────────────────────────
function PageControleSolaire({projet,setProjet}){
  const [controles]=useState(()=>getControles());
  const [tlMin,setTlMin]=useState(projet.tl_min||"");
  const [fsMax,setFsMax]=useState(projet.g_max||"");
  const [ugMax,setUgMax]=useState("");
  const [mf,setMf]=useState("");
  const [results,setResults]=useState(null);
  const marques=[...new Set(controles.map(c=>c.marque))];
  const chercher=()=>{let f=controles.filter(c=>(!tlMin||c.tl>=+tlMin)&&(!fsMax||c.fs<=+fsMax)&&(!ugMax||c.ug<=+ugMax));if(mf)f=f.filter(c=>c.marque===mf);setResults(f.sort((a,b)=>b.tl-a.tl));};
  return <div>
    {projet.g_max&&<div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",marginBottom:14}}><div style={{fontSize:12,color:"#92400e"}}>☀ Facteur solaire g max du projet : <strong>{projet.g_max}</strong> — pré-rempli depuis l'étape 1</div></div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Marque</label><select value={mf} onChange={e=>setMf(e.target.value)} style={S.input}><option value="">Toutes</option>{marques.map(m=><option key={m}>{m}</option>)}</select></div>
      <div><label style={S.label}>TL min (%)</label><input type="number" value={tlMin} onChange={e=>setTlMin(e.target.value)} placeholder={projet.tl_min||"ex : 60"} style={S.input}/></div>
      <div><label style={S.label}>FS max</label><input type="number" step="0.01" value={fsMax} onChange={e=>setFsMax(e.target.value)} placeholder={projet.g_max||"ex : 0.35"} style={S.input}/></div>
      <div><label style={S.label}>Ug max (W/m².K)</label><input type="number" step="0.1" value={ugMax} onChange={e=>setUgMax(e.target.value)} placeholder="ex : 1.1" style={S.input}/></div>
    </div>
    <button onClick={chercher} style={S.btnPrimary}>☀ Trouver le contrôle solaire</button>
    {results&&<div style={{marginTop:18}}>
      <div style={{fontSize:13,color:"#6b7280",marginBottom:10}}>{results.length} référence{results.length>1?"s":""}</div>
      {results.length===0&&<div style={{padding:14,background:"#fff1f2",borderRadius:10,color:"#991b1b",fontSize:13}}>Aucune référence — assouplissez les critères</div>}
      {results.map((c,i)=><div key={c.id} style={{...S.card,border:i===0?"1.5px solid #6ee7b7":"1px solid #e5e7eb",background:i===0?"#f0fdf4":"#fff",marginBottom:8}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr 1fr",gap:10,alignItems:"center"}}>
          <div><div style={{fontWeight:700,fontSize:14}}>{c.ref}</div><div style={{fontSize:12,color:"#6b7280"}}>{c.marque} · {c.gamme}</div></div>
          <Stat label="TL" value={`${c.tl}%`} hi={i===0}/><Stat label="FS" value={c.fs}/><Stat label="Ug" value={`${c.ug} W/m²K`}/>
          <div style={{fontSize:12,color:"#6b7280",fontStyle:"italic"}}>{c.note}</div>
          <button onClick={()=>{setProjet(p=>({...p,controle_ref:c.ref,controle_tl:c.tl+"%",controle_fs:c.fs,controle_ug:c.ug+" W/m²K"}));alert(`✓ ${c.ref} ajouté`);}} style={{...S.btnSecondary,fontSize:12}}>➕ Utiliser</button>
        </div>
      </div>)}
    </div>}
  </div>;
}

// ── PAGE 5 : PRESCRIPTION ─────────────────────────────────────────────────
// Valeurs TOUJOURS recalculées depuis le projet (comparateur, contrôle solaire,
// calcul vent). CORRIGÉ v2.5 : les modifications manuelles faites ici sont
// enregistrées dans le projet (presc_overrides / presc_lignes_sup) — elles ne sont
// plus perdues en changeant de page et partent avec la sauvegarde / l'export.
function PagePrescription({projet,setProjet,setPage}){
  const prescs=projet.prescriptions||{};
  const ov=projet.presc_overrides||{};
  const sup=projet.presc_lignes_sup||[];
  const pression=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const epProjet=epaisseurDTUProjet(projet);
  const typos=[
    ...projet.elements.map(el=>{
      const p=prescs[el.id]||{};
      const ve=calcVentElement(el,projet);
      const base={
        id:el.id,label:el.label,dims:el.largeur&&el.hauteur?`${el.largeur}×${el.hauteur}mm`:"",
        orientation:el.orientation||"",usage:el.usage||"",rw_requis:el.ratr?"RA,tr ≥ "+el.ratr+" dB":"",
        type_element:el.type==="facade"?"Façade rideau":"Châssis",
        gamme:p.gamme||(el.chiffrage&&el.chiffrage.systeme?el.chiffrage.systeme+" (chiffrage)":""),vitrage:p.vitrage||(el.chiffrage&&el.chiffrage.composition)||"",rw:p.rw||"",rwctr:p.rwctr||"",rapport:p.rapport||"",correction:p.correction||"0 dB",
        controle:projet.controle_ref||"",tl:projet.controle_tl||"",fs:projet.controle_fs!=null&&projet.controle_fs!==""?String(projet.controle_fs):"",ug:projet.controle_ug||"",
        epaisseur_dtu:ve?`${ve.dtu.eRequired} mm`:(p.epaisseur_dtu||""),aev:p.aev||"",uw:p.uw||"",
        epaisseur_reelle:p.epaisseur_reelle||"",poids_m2:p.poids_m2||"",poids_vantail:p.poids_vantail||"",
      };
      const o=ov[el.id]||{};
      return {...base,...o,_sup:false,_modifie:Object.keys(o).length>0,
        _facade:el.type==="facade"?analyseFacade(el):null,_allege:verifAllege(el),_rc3:!!el.rc3_requis,_allege_opaque:!!el.allege_opaque};
    }),
    ...sup.map(l=>({...l,_sup:true,_modifie:false,_facade:null,_allege:{protection_requise:false},_rc3:false,_allege_opaque:false})),
  ];
  const upd=(ty,k,v)=>setProjet(p=>{
    if(ty._sup)return {...p,presc_lignes_sup:(p.presc_lignes_sup||[]).map(l=>l.id===ty.id?{...l,[k]:v}:l)};
    const o=p.presc_overrides||{};
    return {...p,presc_overrides:{...o,[ty.id]:{...(o[ty.id]||{}),[k]:v}}};
  });
  const reinit=(id)=>setProjet(p=>{const o={...(p.presc_overrides||{})};delete o[id];return {...p,presc_overrides:o};});
  const addT=()=>setProjet(p=>{
    const l=p.presc_lignes_sup||[];
    return {...p,presc_lignes_sup:[...l,{id:"L"+Date.now(),label:`Élément ${p.elements.length+l.length+1}`,dims:"",orientation:"",usage:"",rw_requis:"",type_element:"Châssis",gamme:"",vitrage:"",rw:"",rwctr:"",rapport:"",correction:"0 dB",controle:"",tl:"",fs:"",ug:"",epaisseur_dtu:"",aev:"",uw:"",epaisseur_reelle:"",poids_m2:"",poids_vantail:""}]};
  });
  const delSup=(id)=>setProjet(p=>({...p,presc_lignes_sup:(p.presc_lignes_sup||[]).filter(l=>l.id!==id)}));
  const champ=(ty,l,k,ph)=><div key={k} style={{marginBottom:4}}><div style={{fontSize:9,color:"#6b7280",marginBottom:1}}>{l}</div><input value={ty[k]||""} onChange={e=>upd(ty,k,e.target.value)} placeholder={ph} style={{...S.input,fontSize:11,padding:"3px 7px",background:"#fff"}}/></div>;
  const lignesPV=typos.filter(t=>t.gamme);
  return <div>
    <StepBar current={5} setPage={setPage}/>
    <div className="no-print" style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      <button onClick={()=>window.print()} style={{...S.btnPrimary,background:"#059669"}}>📄 Exporter PDF</button>
      <button onClick={addT} style={S.btnSecondary}>+ Ajouter ligne</button>
      <button onClick={()=>setPage("comparateur")} style={{...S.btnSecondary,background:"#eef2ff",borderColor:"#c7d2fe",color:"#3730a3"}}>⚖ Retour comparateur</button>
    </div>
    <div style={{background:"#fff",borderRadius:14,padding:"24px 32px",boxShadow:"0 4px 24px rgba(0,0,0,0.08)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,paddingBottom:12,borderBottom:"3px solid #1a1a2e"}}>
        <div><div style={{fontSize:18,fontWeight:800,color:"#1a1a2e"}}>🪟 GlassIQ v2.6</div><div style={{fontSize:11,color:"#6b7280"}}>Note de choix vitrage</div></div>
        <div style={{textAlign:"right",fontSize:12}}><div style={{fontWeight:700,fontSize:14,color:"#1a1a2e"}}>PRESCRIPTION VITRAGE</div><div style={{color:"#6b7280",marginTop:2}}>{new Date().toLocaleDateString("fr-FR")}</div></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:10,marginBottom:12,padding:"10px 14px",background:"#f8f9fb",borderRadius:10,border:"1px solid #e5e7eb"}}>
        <div><div style={{fontSize:10,color:"#9ca3af",marginBottom:1}}>PROJET</div><div style={{fontSize:14,fontWeight:700,color:"#1a1a2e"}}>{projet.nom||"—"}</div></div>
        <div><div style={{fontSize:10,color:"#9ca3af",marginBottom:1}}>MOA</div><div style={{fontSize:12,color:"#374151"}}>{projet.moa||"—"}</div></div>
        <div><div style={{fontSize:10,color:"#9ca3af",marginBottom:1}}>MOE</div><div style={{fontSize:12,color:"#374151"}}>{projet.moe||"—"}</div></div>
        <div><div style={{fontSize:10,color:"#9ca3af",marginBottom:1}}>RÉDACTEUR</div><div style={{fontSize:12,color:"#374151"}}>{projet.redacteur||"—"}</div></div>
      </div>
      {pression&&<div style={{marginBottom:12,padding:"10px 14px",background:"#f0f9ff",borderRadius:10,border:"1px solid #bae6fd"}}>
        <div style={{fontSize:10,fontWeight:700,color:"#0369a1",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>💨 Données vent</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
          {[["Zone",ZONES_VENT[projet.zone_vent]?.split("—")[0]||"—"],["Terrain",TERRAINS[projet.cat_terrain]?.split("—")[0]||"—"],["Hauteur",projet.hauteur_bat?projet.hauteur_bat+" m":"—"],["Pression DTU 39",pression+" Pa"],["Épaisseur min. (pire élément)",epProjet||"—"]].map(([l,v])=><div key={l}><div style={{fontSize:10,color:"#0369a1"}}>{l}</div><div style={{fontSize:12,fontWeight:700,color:"#1e40af"}}>{v}</div></div>)}
        </div>
      </div>}
      <div style={{marginBottom:12,padding:"10px 14px",background:"#fffbeb",borderRadius:10,border:"1px solid #fde68a"}}>
        <div style={{fontSize:10,fontWeight:700,color:"#92400e",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>📋 Exigences CCTP</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
          {[["AEV minimum",projet.aev_min||"—"],["Uw max",projet.uw_max?projet.uw_max+" W/m²K":"—"],["g max",projet.g_max||"—"],["TL min",projet.tl_min?projet.tl_min+"%":"—"]].map(([l,v])=><div key={l}><div style={{fontSize:10,color:"#92400e"}}>{l}</div><div style={{fontSize:12,fontWeight:700,color:"#92400e"}}>{v}</div></div>)}
        </div>
      </div>
      <div style={{fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Prescriptions par élément</div>
      {typos.map(ty=><div key={ty.id} style={{marginBottom:12,borderRadius:10,overflow:"hidden",border:"1.5px solid #e5e7eb"}}>
        <div style={{background:"#1a1a2e",color:"#fff",padding:"8px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <input value={ty.label||""} onChange={e=>upd(ty,"label",e.target.value)} style={{background:"transparent",border:"none",color:"#fff",fontSize:13,fontWeight:700,width:150,outline:"none"}}/>
            <span style={{fontSize:11,background:"rgba(255,255,255,0.15)",padding:"2px 8px",borderRadius:10,color:"rgba(255,255,255,0.8)"}}>{ty.type_element}</span>
            <input value={ty.dims||""} onChange={e=>upd(ty,"dims",e.target.value)} placeholder="Dimensions" style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",fontSize:11,borderRadius:6,padding:"3px 8px",width:140,outline:"none"}}/>
            <input value={ty.rw_requis||""} onChange={e=>upd(ty,"rw_requis",e.target.value)} placeholder="RA,tr requis" style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",fontSize:11,borderRadius:6,padding:"3px 8px",width:120,outline:"none"}}/>
          </div>
          <div className="no-print" style={{display:"flex",gap:6}}>
            {ty._modifie&&<button onClick={()=>reinit(ty.id)} title="Revenir aux valeurs calculées" style={{fontSize:11,padding:"3px 8px",borderRadius:6,border:"1px solid rgba(255,255,255,0.3)",background:"transparent",color:"#fde68a",cursor:"pointer"}}>✎ modifié · ↺ valeurs calculées</button>}
            {ty._sup&&<button onClick={()=>delSup(ty.id)} style={{fontSize:11,padding:"3px 8px",borderRadius:6,border:"1px solid rgba(255,255,255,0.3)",background:"transparent",color:"#fca5a5",cursor:"pointer"}}>✕ supprimer</button>}
          </div>

// ── PAGE MÉTRÉ GLOBAL ──────────────────────────────────────────────────────
function PageProjets({projet,setProjet,setPage,onToast}){
  const [list,setList]=useState(()=>getProjets());
  const [confirmDel,setConfirmDel]=useState(null);
  const refresh=()=>setList(getProjets());

  const sauver=()=>{
    if(!projet.nom){onToast&&onToast("Donne d'abord un nom au projet (étape 1)","warn");setPage("projet");return;}
    const saved=sauverProjet(projet);
    setProjet(p=>({...p,_pid:saved._pid,_cree:saved._cree,_maj:saved._maj}));
    refresh();
    onToast&&onToast("Projet \""+saved.nom+"\" sauvegardé ✓","ok");
  };
  const charger=(p)=>{
    setProjet({...p});
    onToast&&onToast("Projet \""+p.nom+"\" chargé","ok");
    setPage("projet");
  };
  const dupliquer=(pid)=>{setList(dupliquerProjet(pid));onToast&&onToast("Projet dupliqué","ok");};
  const supprimer=(pid)=>{setList(supprimerProjet(pid));setConfirmDel(null);onToast&&onToast("Projet supprimé","warn");};
  const nouveau=()=>{
    setProjet({...defaultProjet,elements:[],_pid:null});
    onToast&&onToast("Nouveau projet vierge","ok");
    setPage("projet");
  };

  // Export / Import fichier
  const exporter=(p)=>{
    const blob=new Blob([JSON.stringify(p,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`GlassIQ_${(p.nom||"projet").replace(/[^a-z0-9]/gi,"_")}.json`;
    a.click();URL.revokeObjectURL(url);
  };
  const exporterTout=()=>{
    const blob=new Blob([JSON.stringify(getProjets(),null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="GlassIQ_tous_projets.json";a.click();URL.revokeObjectURL(url);
  };
  const importer=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        const arr=Array.isArray(data)?data:[data];
        const cur=getProjets();
        arr.forEach(p=>{
          if(!p._pid)p._pid=uid();
          if(cur.find(x=>x._pid===p._pid))p._pid=uid();
          p._importe=new Date().toISOString();
          cur.push(p);
        });
        saveProjets(cur);refresh();
        onToast&&onToast(arr.length+" projet(s) importé(s) ✓","ok");
      }catch(err){onToast&&onToast("Fichier invalide","warn");}
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const fmtDate=(iso)=>{if(!iso)return"—";const d=new Date(iso);return d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});};

  return <div>
    <div style={{...S.card,background:"#eff6ff",border:"1px solid #bfdbfe",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#1e40af",marginBottom:4}}>💾 Mes projets — sauvegarde & chargement</div>
      <div style={{fontSize:12,color:"#1e40af"}}>Sauvegarde tes affaires, retrouve-les, duplique-les. Exporte en fichier pour sauvegarder ailleurs ou partager avec un collègue.</div>
    </div>

    {/* Actions projet courant */}
    <div style={{...S.card,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:12,color:"#6b7280"}}>Projet en cours</div>
          <div style={{fontSize:16,fontWeight:700,color:"#1a1a2e"}}>{projet.nom||"Sans nom"}</div>
          {projet._pid&&<div style={{fontSize:11,color:"#9ca3af"}}>Dernière sauvegarde : {fmtDate(projet._maj)}</div>}
          {!projet._pid&&<div style={{fontSize:11,color:"#d97706"}}>Non sauvegardé</div>}
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={sauver} style={{...S.btnPrimary,background:"#059669"}}>💾 Sauvegarder</button>
          <button onClick={()=>exporter(projet)} style={S.btnSecondary}>⬇ Exporter ce projet</button>
          <button onClick={nouveau} style={S.btnSecondary}>＋ Nouveau projet</button>
        </div>
      </div>
    </div>

    {/* Import / export global */}
    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
      <label style={{...S.btnSecondary,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6}}>
        ⬆ Importer un fichier
        <input type="file" accept=".json,application/json" onChange={importer} style={{display:"none"}}/>
      </label>
      <button onClick={exporterTout} style={S.btnSecondary}>⬇ Exporter tous les projets</button>
    </div>

    {/* Liste des projets */}
    <div style={{fontSize:12,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>{list.length} projet{list.length>1?"s":""} enregistré{list.length>1?"s":""}</div>
    {list.length===0&&<div style={{...S.card,textAlign:"center",color:"#9ca3af",fontSize:13}}>Aucun projet enregistré. Sauvegarde ton projet en cours pour le retrouver ici.</div>}
    {list.slice().sort((a,b)=>(b._maj||"").localeCompare(a._maj||"")).map(p=>{
      const nbEl=p.elements?p.elements.length:0;
      const nbPresc=p.prescriptions?Object.keys(p.prescriptions).length:0;
      const isCurrent=p._pid===projet._pid;
      return <div key={p._pid} style={{...S.card,marginBottom:8,border:isCurrent?"2px solid #059669":"1px solid #e5e7eb"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div style={{flex:1,minWidth:200}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{fontSize:15,fontWeight:700,color:"#1a1a2e"}}>{p.nom||"Sans nom"}</div>
              {isCurrent&&<Badge color="green">en cours</Badge>}
            </div>
            <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{p.moa?p.moa+" · ":""}{nbEl} élément{nbEl>1?"s":""}{nbPresc>0?" · "+nbPresc+" prescrit"+(nbPresc>1?"s":""):""}</div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>Modifié {fmtDate(p._maj)}</div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <button onClick={()=>charger(p)} style={{...S.btnPrimary,padding:"7px 14px",fontSize:12}}>Charger</button>
            <button onClick={()=>dupliquer(p._pid)} style={{...S.btnSecondary,fontSize:12}}>Dupliquer</button>
            <button onClick={()=>exporter(p)} style={{...S.btnSecondary,fontSize:12}}>⬇</button>
            {confirmDel===p._pid
              ? <button onClick={()=>supprimer(p._pid)} style={{...S.btnSecondary,fontSize:12,background:"#fee2e2",borderColor:"#fca5a5",color:"#991b1b"}}>Confirmer ?</button>
              : <button onClick={()=>setConfirmDel(p._pid)} style={{...S.btnSecondary,fontSize:12,color:"#991b1b"}}>Supprimer</button>}
          </div>
        </div>
      </div>;
    })}

    <div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",marginTop:14,fontSize:12,color:"#92400e",lineHeight:1.5}}>
      💡 <strong>Important :</strong> les projets sont stockés dans ce navigateur. Pour ne rien perdre en cas de changement d'ordinateur ou de nettoyage du navigateur, exporte régulièrement tes projets en fichier (bouton ⬇). Tu pourras les réimporter n'importe où.
    </div>
  </div>;
}

            <td style={{padding:"7px 10px"}}>{t.poids_total?`${t.poids_total} kg`:"—"}</td>
