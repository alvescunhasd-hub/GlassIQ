// ── CALCUL FLÈCHE FAÇADE RIDEAU (Eurocode / DTU) ───────────────────────────
// Meneau = poutre sur 2 appuis (planchers), charge vent répartie.
// E aluminium = 70000 N/mm². Flèche admissible : valeur usuelle L/200 (à confirmer
// par le DTA du système — NF EN 13830 ne fixe pas de valeur universelle pour les
// façades rideaux ; seule la flèche des châssis fenêtres/portes est fixée par le
// NF DTU 39 P1-1 : L/150, max 15mm sous 800 Pa — cf. onglet dédié le cas échéant).
const E_ALU = 70000;
// Flèche admissible selon le critère : "200" → L/200 ; "175" → L/175 ;
// "200_15" → L/200 plafonné à 15 mm (plafond souvent associé à L/200 —
// à confirmer par le DTA du système / NF DTU 33.1).
function flecheAdmissible(L_mm,critere){
  if(critere==="200_15")return Math.min(L_mm/200,15);
  return L_mm/(+critere||200);
}
function flecheMeneau(pression_Pa, entraxe_m, portee_m, Ix_cm4, critere){
  const q = pression_Pa * entraxe_m / 1000; // N/mm
  const L = portee_m * 1000; // mm
  const I = Ix_cm4 * 1e4; // mm^4
  const f = (5 * q * Math.pow(L,4)) / (384 * E_ALU * I); // mm
  const adm = flecheAdmissible(L, critere||"200");
  return { fleche:+f.toFixed(1), adm:+adm.toFixed(1), ok:f<=adm, ratio:+(f/adm).toFixed(2) };
}
// Trouve les profilés meneaux qui passent pour un système donné
function profilesCompatibles(systeme, pression_Pa, entraxe_m, portee_m, critere){
  return PROFILES_FACADE
    .filter(p=>p.systeme===systeme && (p.type==="meneau"||p.type==="meneau_angle"))
    .map(p=>({...p, calc: flecheMeneau(pression_Pa, entraxe_m, portee_m, p.Ix, critere)}))
    .sort((a,b)=>a.Ix-b.Ix);
}
// Calcul INVERSE : inertie minimale requise (cm⁴) pour respecter le critère de flèche.
// I ≥ 5·q·L⁴/(384·E·f_adm). Universel : comparable à n'importe quel catalogue fabricant.
function inertieRequise(pression_Pa, entraxe_m, portee_m, critere){
  const q = pression_Pa * entraxe_m / 1000; // N/mm
  const L = portee_m * 1000; // mm
  const fAdm = flecheAdmissible(L, critere||"200"); // mm
  const I_mm4 = (5 * q * Math.pow(L,4)) / (384 * E_ALU * fAdm);
  return +(I_mm4 / 1e4).toFixed(1); // cm⁴
}

// ── ANALYSE TRAME FAÇADE — métré meneaux/traverses/ouvrants ────────────────
function analyseFacade(el){
  const L=(+el.largeur||0)/1000, H=(+el.hauteur||0)/1000; // m
  if(!L||!H)return null;

  if(el.mode_trame==="personnalisee"&&Array.isArray(el.panneaux)&&el.panneaux.length>0){
    // ── MODE PANNEAUX PERSONNALISÉS — trame irrégulière (tailles différentes) ──
    // Pour une façade où les panneaux n'ont pas tous la même dimension (porte,
    // fixes de tailles variées...), on ne peut pas déduire un entraxe unique.
    // L'utilisateur liste chaque panneau réel ; le métré et la vérification se
    // font à partir de cette liste, pas d'une trame régulière supposée.
    const panneaux=el.panneaux.map(p=>({...p,l:(+p.largeur||0)/1000,h:(+p.hauteur||0)/1000,qte:Math.max(1,+p.qte||1)}));
    let surf_totale=0,surf_ouvrants=0,surf_vitree_fixe=0,nb_ouvrants=0,nb_portes=0,nb_fixe=0;
    panneaux.forEach(p=>{
      const s=p.l*p.h*p.qte;
      surf_totale+=s;
      if(p.type==="ouvrant"){surf_ouvrants+=s;nb_ouvrants+=p.qte;}
      else if(p.type==="porte"){surf_ouvrants+=s;nb_portes+=p.qte;}
      else {surf_vitree_fixe+=s;nb_fixe+=p.qte;}
    });
    const nb_panneaux_total=panneaux.reduce((a,p)=>a+p.qte,0);
    return {
      L,H,mode:"personnalisee",panneaux,
      nb_meneaux:+el.nb_montants||null,nb_travees:null,
      ml_meneaux:null,ml_traverses:null,
      surf_totale:+surf_totale.toFixed(1),
      nb_ouvrants:nb_ouvrants+nb_portes,nb_portes,nb_fixe,
      surf_ouvrants:+surf_ouvrants.toFixed(1),
      surf_allege:0,
      surf_vitree_fixe:+surf_vitree_fixe.toFixed(1),
      entraxe_meneau:null,
      nb_panneaux_total,
    };
  }

  // ── MODE TRAME RÉGULIÈRE (par défaut) ──
  const trame=(+el.trame||1350)/1000; // m
  const nb_meneaux=Math.max(2,Math.round(L/trame)+1); // meneaux verticaux
  const nb_travees=nb_meneaux-1;
  const ml_meneaux=nb_meneaux*H; // ml verticaux
  const ml_traverses=L; // au moins 1 niveau haut+bas → approx 2×L mini, ici traverse par niveau
  const surf_totale=L*H;
  const nb_ouvrants=+el.nb_ouvrants||0;
  // Surface estimée d'un ouvrant standard (0.9 × hauteur de travée utile)
  const surf_ouvrant_unit=trame*0.9*(H>2.4?1.4:H*0.6);
  const surf_ouvrants=nb_ouvrants*surf_ouvrant_unit;
  const surf_allege=el.allege_opaque?L*((+el.allege_h||0)/1000):0;
  const surf_vitree_fixe=Math.max(0,surf_totale-surf_ouvrants-surf_allege);
  return {
    L,H,trame,nb_meneaux,nb_travees,
    ml_meneaux:+ml_meneaux.toFixed(1),
    ml_traverses:+(ml_traverses*Math.max(2,Math.ceil(H/2.5))).toFixed(1),
    surf_totale:+surf_totale.toFixed(1),
    nb_ouvrants,
    surf_ouvrants:+surf_ouvrants.toFixed(1),
    surf_allege:+surf_allege.toFixed(1),
    surf_vitree_fixe:+surf_vitree_fixe.toFixed(1),
    entraxe_meneau:+trame.toFixed(2),
  };
}

// ── MÉTRÉ GLOBAL PAR TYPOLOGIE ─────────────────────────────────────────────
// Regroupe les éléments STRICTEMENT identiques (dimensions, composition, panneaux,
// vitrage prescrit...) et calcule surfaces, linéaires, comptages et poids estimé.
// CORRIGÉ v2.5 : un châssis n'est plus compté à la fois en "vitré fixe" ET en
// "ouvrant" ; une fenêtre fixe n'est plus comptée comme ouvrant ; les châssis
// composés sont ventilés selon leurs panneaux.
function metreGlobal(elements, prescriptions){
  prescriptions=prescriptions||{};
  const keyOf=(el)=>{
    const pr=prescriptions[el.id]||{};
    return [el.type,el.largeur,el.hauteur,el.soustype,el.ratr,el.trame||"",el.nb_ouvrants||"",el.allege_opaque?"op":"vi",el.allege_h||"",el.haut_panneau||"",
      el.mode_trame||"",el.chassis_compose?"cc":"",el.nb_vantaux||"",el.larg_fixe||"",el.nb_montants||"",el.nb_traverses||"",
      JSON.stringify(el.panneaux||[]),pr.gamme||"",pr.vitrage||""].join("|");
  };
  const groups={};
  elements.forEach(el=>{
    const k=keyOf(el);
    if(!groups[k])groups[k]={modele:el,count:0,labels:[]};
    groups[k].count+=Math.max(1,parseInt(el.quantite)||1);
    groups[k].labels.push(el.label);
  });

  const typologies=Object.values(groups).map(g=>{
    const el=g.modele;
    const isFacade=el.type==="facade";
    const presc=prescriptions[el.id];
    const poids_m2=presc&&presc.poids_m2?parseFloat(presc.poids_m2):null;
    const L=(+el.largeur||0)/1000, H=(+el.hauteur||0)/1000;
    const modePerso=el.mode_trame==="personnalisee"&&Array.isArray(el.panneaux)&&el.panneaux.length>0;
    let surf_unit=0,surf_vitree=0,surf_ouvrants=0,surf_allege=0,ml_meneaux=0,ml_traverses=0,nb_meneaux=0,nb_ouvrants=0;
    const af=isFacade?analyseFacade(el):null;
    if(isFacade&&af){
      surf_unit=af.surf_totale; surf_vitree=af.surf_vitree_fixe; surf_ouvrants=af.surf_ouvrants; surf_allege=af.surf_allege;
      ml_meneaux=af.ml_meneaux||0; ml_traverses=af.ml_traverses||0; nb_meneaux=af.nb_meneaux||0; nb_ouvrants=af.nb_ouvrants||0;
    } else if(!isFacade&&modePerso){
      const ap=analyseFacade(el);
      surf_unit=+(L*H).toFixed(2);
      surf_vitree=ap?ap.surf_vitree_fixe:surf_unit; surf_ouvrants=ap?ap.surf_ouvrants:0; nb_ouvrants=ap?ap.nb_ouvrants:0;
    } else if(!isFacade&&el.soustype==="Fenêtre fixe"){
      surf_unit=+(L*H).toFixed(2); surf_vitree=surf_unit; surf_ouvrants=0; nb_ouvrants=0;
    } else if(!isFacade){
      surf_unit=+(L*H).toFixed(2);
      const lf=Math.min(L,Math.max(0,(+el.larg_fixe||0)/1000));
      surf_vitree=+(lf*H).toFixed(2); surf_ouvrants=+(surf_unit-surf_vitree).toFixed(2);
      nb_ouvrants=nbVantauxElement(el,null);
    }
    // Poids : vitrage uniquement (hors allège opaque, hors profilés)
    const surf_verre=(surf_vitree||0)+(surf_ouvrants||0);
    const poids_unit=poids_m2?+(poids_m2*surf_verre).toFixed(0):null;
    return {
      ...g, isFacade, el,
      surf_unit, surf_total:+(surf_unit*g.count).toFixed(1),
      surf_vitree_total:+(surf_vitree*g.count).toFixed(1),
      surf_ouvrants_total:+(surf_ouvrants*g.count).toFixed(1),
      surf_allege_total:+(surf_allege*g.count).toFixed(1),
      ml_meneaux_total:+(ml_meneaux*g.count).toFixed(1),
      ml_traverses_total:+(ml_traverses*g.count).toFixed(1),
      nb_meneaux_total:nb_meneaux*g.count,
      nb_ouvrants_total:nb_ouvrants*g.count,
      poids_m2, poids_total:poids_unit?+(poids_unit*g.count).toFixed(0):null,
      ratr:el.ratr, gamme:presc?presc.gamme:null, vitrage:presc?presc.vitrage:null,
    };
  });

  const T={
    nb_elements:elements.length,
    nb_typologies:typologies.length,
    surf_total:+typologies.reduce((s,t)=>s+t.surf_total,0).toFixed(1),
    surf_vitree:+typologies.reduce((s,t)=>s+t.surf_vitree_total,0).toFixed(1),
    surf_ouvrants:+typologies.reduce((s,t)=>s+t.surf_ouvrants_total,0).toFixed(1),
    surf_allege:+typologies.reduce((s,t)=>s+t.surf_allege_total,0).toFixed(1),
    ml_meneaux:+typologies.reduce((s,t)=>s+t.ml_meneaux_total,0).toFixed(1),
    ml_traverses:+typologies.reduce((s,t)=>s+t.ml_traverses_total,0).toFixed(1),
    nb_meneaux:typologies.reduce((s,t)=>s+t.nb_meneaux_total,0),
    nb_ouvrants:typologies.reduce((s,t)=>s+t.nb_ouvrants_total,0),
    nb_facades:typologies.filter(t=>t.isFacade).reduce((s,t)=>s+t.count,0),
    nb_chassis:typologies.filter(t=>!t.isFacade).reduce((s,t)=>s+t.count,0),
    poids_total:+typologies.reduce((s,t)=>s+(t.poids_total||0),0).toFixed(0),
  };
  return {typologies,totaux:T};
}

// ── SÉCURITÉ ALLÈGE — NF DTU 39 P5 / NF P01-012 ───────────────────────────────
// Règle : allège < 1.00m → protection contre chute requise, INDÉPENDAMMENT
// de la hauteur du bâtiment (contrairement au champ "hauteur vitrage/sol" qui
// lui sert uniquement à la correction de pression de vent DTU 39 — les deux
// notions sont physiquement différentes et ne doivent pas être confondues).
// Seule exception explicite : élément marqué "sans risque de chute" par
// l'utilisateur (ex. rez-de-chaussée sur terrain naturel, sans vide en contrebas).
function verifAllege(el){
  const allege_mm=+el.allege_h||0;
  const allege_m=allege_mm/1000;
  const sans_risque=!!el.sans_risque_chute;
  const protection_requise=allege_m<1.0 && !sans_risque;
  let exigence,classe_min,detail;
  if(sans_risque){
    exigence="Aucune exigence — sans risque de chute déclaré";
    classe_min=null;
    detail="Vérifier que ce cas (rez-de-chaussée sans vide en contrebas) est bien justifié";
  } else if(!protection_requise){
    exigence="Aucune exigence sécurité chute";
    classe_min=null;
    detail=`Allège ${allege_m.toFixed(2)}m ≥ 1m — pas de risque de chute`;
  } else if(el.allege_opaque){
    exigence="Allège opaque — garde-corps assuré par le remplissage";
    classe_min="1B1 (panneau)";
    detail="Vérifier la résistance aux chocs du panneau d'allège (NF P01-013 / NF P08-302)";
  } else {
    exigence="Vitrage faisant garde-corps — feuilleté obligatoire";
    classe_min="1B1 (EN 12600)";
    detail="Face intérieure (côté chute) feuilletée min 44.2 — classe 1B1 EN 12600 (NF DTU 39 P5)";
  }
  return {allege_m:+allege_m.toFixed(2),protection_requise,exigence,classe_min,detail};
}

// Sécurité chute (vitrage faisant garde-corps) : la face INTÉRIEURE — dernier verre,
// composition notée extérieur → intérieur — doit être un feuilleté ≥ 44.2
// (2 films mini, ≥ 8 mm de verre). CORRIGÉ v2.5 : l'ancienne version acceptait
// n'importe quel feuilleté, y compris côté extérieur.
function verifFeuilleteAllege(compo){
  const a=analyseComposition(compo);
  if(!a)return {ok:null,texte:"composition non analysable — vérifier manuellement"};
  const lamOk=p=>!!p&&p.components.length>=2&&(p.films||0)>=2&&p.components.reduce((x,y)=>x+y,0)>=8;
  const inner=a.panes[a.panes.length-1], outer=a.panes[0];
  if(lamOk(inner))return {ok:true,texte:"face intérieure feuilletée ≥ 44.2"};
  if(a.panes.length>1&&lamOk(outer))return {ok:false,texte:"feuilleté côté extérieur seulement — la face intérieure (côté chute) doit être feuilletée ≥ 44.2"};
  return {ok:false,texte:"pas de face intérieure feuilletée ≥ 44.2"};
}

const ZONES_VENT = {"1":"Region 1 — intérieur protégé","2":"Région 2 — majorité territoire","3":"Région 3 — littoral / montagne","4":"Région 4 — très exposé"};
// Catégories de terrain NF EN 1991-1-4 / NA (ordre = pression décroissante).
// CORRIGÉ v2.5 : les libellés de 0 et IV étaient inversés (IV affiché "mer / côte"
// alors que c'est la catégorie la MOINS exposée du tableau de pressions).
const TERRAINS = {"0":"Cat. 0 — mer / littoral exposé aux vents de mer, lacs ≥ 5 km","II":"Cat. II — rase campagne, obstacles isolés","IIIa":"Cat. IIIa — campagne bocagère, habitat dispersé","IIIb":"Cat. IIIb — zones urbanisées ou industrielles","IV":"Cat. IV — urbain dense (≥ 15 % de bâtiments > 15 m), forêts"};
const ORIENTATIONS = ['Nord','Nord-Est','Est','Sud-Est','Sud','Sud-Ouest','Ouest','Nord-Ouest','Toutes orientations'];
const USAGES = ['Chambre / bureau','Séjour / salle de classe','Couloir / communs','Façade côté rue','Façade côté cour','Façade pignon'];
const CHASSIS_TYPES = ['Fenêtre OB','Fenêtre OF','Fenêtre fixe','Porte-fenêtre','Coulissant','Porte'];
const FACADE_TYPES = ['Façade rideau FWS','Façade rideau CW','Façade VEC','Façade VEP','Verrière'];

function getTranche(h){const z=parseFloat(h);if(z<=9)return"H9";if(z<=18)return"H18";if(z<=28)return"H28";if(z<=50)return"H50";return"H100";}
function calcPression(zone,terrain,h){if(!zone||!terrain||!h||parseFloat(h)<=0)return null;return PRESSIONS_DTU39[zone]?.[terrain]?.[getTranche(h)]||null;}

// ── CLASSES VENT NF EN 12210 — pression d'essai P1 de chaque classe ─────────
// CORRIGÉ v2.5 : l'ancienne correspondance (≤1200 Pa → classe 2) acceptait un C2
// (essai à 800 Pa) pour 1100 Pa. Règle appliquée : P1 de la classe ≥ pression.
// Estimation à confirmer avec le FD P20-201 (guide de choix).
const CLASSES_V={1:400,2:800,3:1200,4:1600,5:2000};
function classeVRequise(pression){
  if(!pression)return null;
  for(const k of [1,2,3,4,5]) if(CLASSES_V[k]>=pression) return {classe:k,label:"V"+k+" min (essai "+CLASSES_V[k]+" Pa)"};
  return {classe:"E",label:"Exxx ≥ "+pression+" Pa (au-delà de la classe 5)"};
}
// Pression couverte par une ligne d'essai AEV (champ V) :
//  - valeur en Pa ("1200/1800", "2000 Pa", "E2400") → 1er nombre de 3-4 chiffres
//  - classe EN 12210 ("C3", "B2", "A3", "3") → pression P1 de la classe
// La lettre (A/B/C) est le critère de flèche du cadre, pas un niveau de pression.
function pressionCouverteAEV(V){
  if(V==null)return null;
  const s=String(V).trim();
  const num=s.match(/(\d{3,4})/);
  if(num)return parseInt(num[1],10);
  const cl=s.match(/^[ABC]?\s*([1-5])$/i);
  if(cl)return CLASSES_V[+cl[1]];
  return null;
}
// N° de classe EN 12210 (1-5) couvert par une ligne d'essai
function classeDepuisV(V){
  const s=String(V==null?"":V).trim();
  const cl=s.match(/^[ABC]?\s*([1-5])$/i);
  if(cl)return +cl[1];
  const num=s.match(/(\d{3,4})/);
  if(num){const p=+num[1];let k=null;for(const c of [1,2,3,4,5])if(CLASSES_V[c]<=p)k=c;return k;}
  return null;
}
// Classe V exigée par le CCTP ("A4 E9A V3" → 3 ; "A4 E9A C3" → 3)
function classeVExigeeCCTP(aev_min){const m=String(aev_min||"").match(/[VC]\s*([1-5])\b/i);return m?+m[1]:null;}
// Vent / AEV :
//  - FAÇADE : pression d'essai déclarée ≥ pression de calcul (règle GlassIQ).
//  - CHÂSSIS : meilleure classe V testée ≥ classe exigée par le CCTP. À défaut de
//    CCTP, estimation par la pression DTU 39 (indicatif : la pression DTU 39 sert au
//    dimensionnement du verre ; la classe exigible se lit dans le FD P20-201).
function verifAEV(sys,pression,isFacade,aev_min){
  if(!sys||!Array.isArray(sys.aev)||sys.aev.length===0)return {ok:null,max:null,note:"Pas d'essai AEV"};
  if(isFacade){
    if(!pression)return {ok:null,max:null,note:"Pression non calculée"};
    const vals=sys.aev.map(a=>pressionCouverteAEV(a.V)).filter(v=>v!=null);
    if(!vals.length)return {ok:null,max:null,note:"Pas d'essai exploitable"};
    const max=Math.max(...vals);
    return {ok:max>=pression,max,note:`essai ${max} / requis ${pression} Pa`};
  }
  const classes=sys.aev.map(a=>classeDepuisV(a.V)).filter(v=>v!=null);
  if(!classes.length)return {ok:null,max:null,note:"Pas d'essai exploitable"};
  const best=Math.max(...classes);
  const req=classeVExigeeCCTP(aev_min);
  if(req)return {ok:best>=req,max:best,note:`essai V${best} / CCTP V${req}`};
  if(pression){
    const cv=classeVRequise(pression);
    const reqP=cv.classe==="E"?6:cv.classe;
    return {ok:best>=reqP,max:best,note:`essai V${best} / estimé ${cv.classe==="E"?"> V5":"V"+cv.classe}`};
  }
  return {ok:null,max:best,note:`essai V${best} — exigence non précisée`};
}

const A3T=[[0.3,0.686],[0.5,1.143],[0.667,1.514],[1.0,2.0],[1.5,2.286],[2.0,2.357],[5.0,2.386]];
const A4T=[[0.0,2.1143],[0.1,2.1143],[0.2,2.1000],[0.3,2.1000],[0.4,1.8714],[0.5,1.6429],[0.6,1.4143],[0.7,1.1857],[0.8,0.9714],[0.9,0.8000],[1.0,0.6571]];
function interp(t,x){if(x<=t[0][0])return t[0][1];if(x>=t[t.length-1][0])return t[t.length-1][1];for(let i=0;i<t.length-1;i++){if(x>=t[i][0]&&x<=t[i+1][0]){const f=(x-t[i][0])/(t[i+1][0]-t[i][0]);return t[i][1]+f*(t[i+1][1]-t[i][1]);}}return t[t.length-1][1];}
// Vérifie les dimensions d'un châssis contre le domaine d'emploi du DTA.
// AVERTISSEMENT PUR — ne bloque jamais le calcul. Absence de données = pas de vérif.
// CORRIGÉ v2.5 : la ligne est choisie selon le nombre de vantaux, le fixe latéral
// et le type d'ouverture (OB / OF) ; les champs L/H sont acceptés comme l_max/h_max.
function verifDimensions(sys,larg,haut,el){
  const aucune={statut:"aucune",texte:null};
  if(!sys||!Array.isArray(sys.dimensions_max)||sys.dimensions_max.length===0)return aucune;
  if(!larg||!haut||!el||typeof el!=="object")return aucune;
  // Le domaine d'emploi concerne les châssis ouvrants simples
  if(el.type==="facade"||el.chassis_compose||el.soustype==="Fenêtre fixe")return aucune;
  const lignes=sys.dimensions_max
    .map(d=>({type:d.type||"",h_max:+(d.h_max!=null?d.h_max:d.H)||0,l_max:+(d.l_max!=null?d.l_max:d.L)||0}))
    .filter(d=>d.h_max>0&&d.l_max>0&&!/soufflet/i.test(d.type));
  if(!lignes.length)return aucune;
  const st=el.soustype||"";
  const nv=nbVantauxElement(el,sys);
  const avecFixe=(+el.larg_fixe||0)>0;
  let cand=lignes;
  const parNv=cand.filter(d=>nv>=2?/2 vantaux/i.test(d.type):/1 vantail/i.test(d.type));
  if(parNv.length)cand=parNv;
  const parFixe=cand.filter(d=>/fixe/i.test(d.type)===avecFixe);
  if(parFixe.length)cand=parFixe;
  const ouv=/\bOB\b/.test(st)?/OB/:(/\bOF\b|porte-?fen/i.test(st)?/OF|fran[cç]aise/i:null);
  if(ouv){const p=cand.filter(d=>ouv.test(d.type));if(p.length)cand=p;}
  // S'il reste plusieurs lignes : la plus permissive (pour ne pas alerter à tort)
  const ligne=cand.reduce((b,d)=>(!b||d.h_max*d.l_max>b.h_max*b.l_max)?d:b,null);
  if(!ligne)return aucune;
  const depH=haut>ligne.h_max, depL=larg>ligne.l_max;
  if(depH||depL){
    const details=[];
    if(depL)details.push(`largeur ${larg} > ${ligne.l_max} mm`);
    if(depH)details.push(`hauteur ${haut} > ${ligne.h_max} mm`);
    return {statut:"hors",ligne,texte:`Hors domaine d'emploi (${ligne.type}) : ${details.join(", ")} — à valider avec le fabricant`,couleur:"#9a3412",bg:"#fff7ed"};
  }
  return {statut:"ok",ligne,texte:`Dans le domaine d'emploi (${ligne.type} : max L ${ligne.l_max} × H ${ligne.h_max} mm)`,couleur:"#065f46",bg:"#f0fdf4"};
}

// Statut de validité d'un DTA à partir de sa date "JJ/MM/AAAA".
// Retourne {statut:'expire'|'bientot'|'ok'|'inconnu', jours, texte, couleur, bg}.
// 'bientot' = expire dans moins de 90 jours (à anticiper pour un chantier à venir).
function statutDTA(validiteStr){
  if(!validiteStr||!/^\d{2}\/\d{2}\/\d{4}$/.test(validiteStr))
    return {statut:"inconnu",jours:null,texte:"validité non renseignée",couleur:"#92400e",bg:"#fffbeb"};
  const [j,m,a]=validiteStr.split("/").map(Number);
  const dExp=new Date(a,m-1,j);
  const auj=new Date(); auj.setHours(0,0,0,0);
  const jours=Math.round((dExp-auj)/86400000);
  if(jours<0)   return {statut:"expire", jours,texte:`DTA EXPIRÉ depuis le ${validiteStr}`,couleur:"#991b1b",bg:"#fef2f2"};
  if(jours<=90) return {statut:"bientot",jours,texte:`DTA expire bientôt (${validiteStr}, dans ${jours} j)`,couleur:"#9a3412",bg:"#fff7ed"};
  return {statut:"ok",jours,texte:`DTA valide jusqu'au ${validiteStr}`,couleur:"#065f46",bg:"#f0fdf4"};
}

function calcDTU39(P,larg,haut,aL,aH,tv,hSol){
  const Lmm=Math.max(larg,haut),lmm=Math.min(larg,haut),L=Lmm/1000,l=lmm/1000,aT=aL+aH,c=parseFloat(hSol)<=6?0.9:1.0;
  let e1;
  // FORMULES CORRIGÉES le 22/07 d'après feuille de référence validée (CVidro DTU39).
  // BUG : l'ancienne version avait un facteur √10 de trop sur le cas "4 appuis L/l≤2,5"
  // (sqrt(L·l·10000·P/10)/100 au lieu de sqrt(L·l·P/100)), surestimant la résistance
  // requise d'un facteur ~3,16. Formule officielle 4 appuis quasi-carré :
  // e1 = √(L_m · l_m · P / 100). Bord libre / 2 appuis : l_m·√P/6,3 (inchangé, validé).
  if(aT>=4)e1=(L/l)<=2.5?Math.sqrt(L*l*P/100):l*Math.sqrt(P)/6.3;
  else if(aT===3)e1=(L/l)<=7.5?Math.sqrt(3*L*l*P/100):3*l*Math.sqrt(P)/6.3;
  else e1=L*Math.sqrt(P)/6.3;
  const alpha=aT>=4?interp(A4T,l/L):aT===3?interp(A3T,L/l):2.1143;
  const bmm=aT>=4?lmm:Lmm,b=bmm/1000;
  // Critère de flèche (Art. 9.2) : vitrage appuyé sur tout son pourtour (aT>=4) → 1/60
  // du petit côté, plafonné à 30mm. Vitrage à bord libre (aT<4) → 1/100 (simple) ou
  // 1/150 (double/isolant) du bord libre, plafonné à 50mm.
  let fMax;
  if(aT>=4) fMax=Math.min(bmm/60,30);
  else fMax=Math.min(bmm/(tv==="simple_lamine"?100:150),50);
  // e_F requis (Art.9, formule 29 réarrangée) — SANS coefficient ε : c'est la valeur
  // physique pure demandée par la pression/déflection, à comparer à l'eF RÉEL de la
  // composition (calcEquivalences), et non multipliée par ε comme dans une version précédente.
  // BUG CORRIGÉ (présent depuis la 1ère version) : b est en mètres et fMax déjà en mm,
  // exactement comme pour e1 (coefficient 6.3 sans conversion supplémentaire) — le
  // coefficient 1,5 et les valeurs α (qui intègrent déjà E=70GPa, cf. Annexe D du DTU)
  // ne nécessitent AUCUNE conversion /1000 ou ×1000 additionnelle. L'ancienne version
  // donnait des résultats ~1000× trop grands (ex. 52 000 mm au lieu de 5,2 mm).
  const eF_requis=Math.pow((alpha*P*Math.pow(b,4))/(1.5*fMax),1/3);
  const eRequired=Math.max(e1*c,eF_requis);
  return{e1:+e1.toFixed(2),eF_requis:+eF_requis.toFixed(2),eRequired:+eRequired.toFixed(2),alpha:+alpha.toFixed(4),c,flecheMax:+fMax.toFixed(1),aT};
}

// ── COEFFICIENTS D'ÉQUIVALENCE OFFICIELS — NF DTU 39 P4, Quadros 7/8/9 ─────
// Validés à l'identique contre les 11 exemples chiffrés du document (Art. 8 et 9).
const EPS1_ISOLANT = {2:1.6, 3:2.0}; // Quadro 7 : double=1.6, triple=2.0 (nb panneaux)
const EPS2_LAMINE = {2:1.3, 3:1.5, 4:1.6}; // Quadro 8 : nb composants verre du feuilleté
const EPS3_TYPES = { // Quadro 9 (types les plus courants en menuiserie/façade)
  recuit:{label:"Recuit standard (float)",eps3:1.0},
  durci:{label:"Durci (heat-strengthened)",eps3:0.8},
  trempe:{label:"Trempé (sécurité)",eps3:0.61},
  arme:{label:"Armé (fil)",eps3:1.3},
};
function eps2Lamine(n){return EPS2_LAMINE[n]||EPS2_LAMINE[Math.min(n,4)];}

// ── ANALYSE COMPOSITION VITRAGE — épaisseur réelle + poids ─────────────────
// Densité verre = 2.5 kg/m²/mm. PVB négligé en poids, compté en épaisseur (0.38/film).
// Notation : verre / lame / verre [/ lame / verre], de l'EXTÉRIEUR vers l'INTÉRIEUR.
// Formats : "44.2", "44.2s", "44.2 sil", "44.2 Ac", "664.2", "1010.4", "10/16/44.2",
//           "86.2s/24/64.2s", "10/12/44.2 Ac", "6/16/4/16/6"...
// CORRIGÉ v2.5 : si une partie n'est pas reconnue, TOUTE la composition est rejetée
// (avant : la partie était ignorée → "10/12/44.2 Ac" lu comme un 10 mm seul).
function splitLamine(digits){
  // "44"→[4,4] · "664"→[6,6,4] · "1010"→[10,10] · "1212"→[12,12]
  const single=digits.split('').map(Number);
  if(single.length>=2&&single.every(d=>d>=3))return single;
  if(digits.length%2===0){
    const pairs=[];
    for(let i=0;i<digits.length;i+=2)pairs.push(+digits.slice(i,i+2));
    if(pairs.every(d=>d>=3&&d<=25))return pairs;
  }
  return null;
}
function parseGlassPart(part){
  // Suffixes commerciaux sans effet mécanique : s / sil / silence / ac / acoustique
  let p=String(part).trim().toLowerCase();
  p=p.replace(/\s*(silence|sil|acoustique|acou|ac|a|s)\s*$/,"").trim();
  let m=p.match(/^(\d{2,4})\.(\d)$/);
  if(m){
    const verres=splitLamine(m[1]); const films=+m[2];
    if(!verres||films<1)return null;
    const epV=verres.reduce((x,y)=>x+y,0);
    return {ep:+(epV+films*0.38).toFixed(2),poids:+(epV*2.5).toFixed(1),components:verres,films};
  }
  m=p.match(/^(\d{1,2})$/);
  if(m){
    const e=+m[1];
    if(e<3||e>25)return null;
    return {ep:e,poids:+(e*2.5).toFixed(1),components:[e],films:0};
  }
  return null;
}

function analyseComposition(compo){
  if(!compo||typeof compo!=="string")return null;
  const parts=compo.split('/').map(p=>p.trim()).filter(Boolean);
  // 1 verre, ou verre/lame/verre, ou verre/lame/verre/lame/verre
  if(parts.length<1||parts.length>5||parts.length%2===0)return null;
  let epTotal=0,poidsTotal=0;const lames=[],panes=[];
  for(let i=0;i<parts.length;i++){
    if(i%2===1){
      const gm=parts[i].match(/^(\d{1,2})\s*(mm|ar|argon|air|kr|krypton)?$/i);
      if(!gm)return null;
      const g=+gm[1];
      if(g<4||g>32)return null;
      epTotal+=g; lames.push(g);
    } else {
      const r=parseGlassPart(parts[i]);
      if(!r)return null;
      epTotal+=r.ep; poidsTotal+=r.poids; panes.push({components:r.components,films:r.films});
    }
  }
  return {
    epaisseur_totale:+epTotal.toFixed(1),
    poids_m2:+poidsTotal.toFixed(1),
    nb_verres:panes.length,
    lames_air:lames,
    panes,
    type:panes.length>=3?"Triple vitrage":panes.length===2?"Double vitrage":"Vitrage simple"
  };
}

// ── ÉQUIVALENCES RÉSISTANCE (Art.8) & FLÈCHE (Art.9) — NF DTU 39 P4 ────────
// Calculées à partir de la composition RÉELLE (panes), validées à l'identique
// contre les 11 exemples chiffrés officiels du document (écart nul).
// verre_type_eps3 : coefficient ε3 du type de verre (uniforme sur la composition —
// simplification si la composition mélange plusieurs types de verre différents).
function calcEquivalences(panes, eps3){
  eps3=eps3||1.0;
  const n=panes.length;
  if(n===0)return null;
  if(n===1){
    const p=panes[0];
    if(p.components.length===1){
      // Monolithique simple : eR = e/ε3 ; eF = e
      return {eR:+(p.components[0]/eps3).toFixed(2), eF:+p.components[0].toFixed(2)};
    }
    // Feuilleté simple : eR = Σe/(0.9×ε2×ε3) ; eF = Σe/ε2
    const somme=p.components.reduce((a,b)=>a+b,0);
    const eps2=eps2Lamine(p.components.length);
    return {eR:+(somme/(0.9*eps2*eps3)).toFixed(2), eF:+(somme/eps2).toFixed(2)};
  }
  // Vitrage isolant (double ou triple) : chaque panneau contribue sa propre
  // équivalence (directe si monolithique, /(0.9×ε2) ou /ε2 si feuilleté),
  // le tout divisé par ε1(nb panneaux)×0.9×ε3 (résistance) ou ε1 seul (flèche).
  const eps1=EPS1_ISOLANT[n]||EPS1_ISOLANT[3];
  let sumR=0,sumF=0;
  for(const p of panes){
    if(p.components.length===1){
      sumR+=p.components[0]; sumF+=p.components[0];
    } else {
      const somme=p.components.reduce((a,b)=>a+b,0);
      const eps2=eps2Lamine(p.components.length);
      sumR+=somme/(0.9*eps2); sumF+=somme/eps2;
    }
  }
  return {eR:+(sumR/(eps1*0.9*eps3)).toFixed(2), eF:+(sumF/eps1).toFixed(2)};
}

// ── VITRAGES À VÉRIFIER (résistance / flèche) ──────────────────────────────
// Un calcul DTU 39 P4 se fait sur chaque vitrage INDÉPENDANT (posé dans sa
// feuillure), jamais sur l'élément entier. CORRIGÉ v2.5 : l'étape "Calcul vent"
// calculait une façade de 12 m comme un seul vitrage.
function nbVantauxElement(el,sys){
  const soustype=(el&&el.soustype)||"";
  const famille=(sys&&sys.famille)||"";
  const defautSoustype=/coulissant|porte-?fen/i.test(soustype)?2:/fen[êe]tre|porte\b/i.test(soustype)?1:null;
  const defautFamille=/coulissant|porte-?fen/i.test(famille)?2:1;
  return Math.max(1,+el.nb_vantaux||(sys&&sys.vantaux_defaut)||defautSoustype||defautFamille);
}
function panneauxCalcul(el,sys){
  const L=+el.largeur||0, H=+el.hauteur||0;
  if(!L||!H)return [];
  // 1) Panneaux personnalisés (façade ou châssis composé)
  if(el.mode_trame==="personnalisee"&&Array.isArray(el.panneaux)&&el.panneaux.length>0){
    const list=el.panneaux.filter(p=>+p.largeur>0&&+p.hauteur>0)
      .map(p=>({largeur:+p.largeur,hauteur:+p.hauteur,type:p.type||"fixe",label:p.label||"",qte:Math.max(1,+p.qte||1)}));
    if(list.length)return list;
  }
  // 2) Façade trame régulière : entraxe × hauteur de panneau (saisie ou estimée)
  if(el.type==="facade"){
    const trame=+el.trame||1350;
    let hp=+el.haut_panneau||0;
    if(!(hp>0)){const nb=Math.max(1,Math.ceil((H/1000)/2.2));hp=H/nb;}
    return [{largeur:Math.round(trame),hauteur:Math.round(hp),type:"fixe",label:"panneau de trame"+(+el.haut_panneau>0?"":", hauteur estimée"),qte:1}];
  }
  // 3) Châssis fixe (éventuellement divisé en grille)
  if(el.soustype==="Fenêtre fixe"){
    const nm=Math.max(0,+el.nb_montants||0), nt=Math.max(0,+el.nb_traverses||0);
    if(nm>0||nt>0)return [{largeur:Math.round(L/(nm+1)),hauteur:Math.round(H/(nt+1)),type:"fixe",label:"carreau, grille "+(nm+1)+"×"+(nt+1),qte:(nm+1)*(nt+1)}];
    return [{largeur:L,hauteur:H,type:"fixe",label:"",qte:1}];
  }
  // 4) Châssis ouvrant : vantaux (+ partie fixe accolée, vérifiée aussi)
  const nv=nbVantauxElement(el,sys);
  const lf=Math.max(0,Math.min(L,+el.larg_fixe||0));
  const lv=Math.round((L-lf)/nv);
  const list=[];
  if(lv>0)list.push({largeur:lv,hauteur:H,type:/^porte$/i.test(el.soustype||"")?"porte":"ouvrant",label:nv>1?nv+" vantaux":"",qte:nv});
  if(lf>0)list.push({largeur:Math.round(lf),hauteur:H,type:"fixe",label:"fixe accolé",qte:1});
  return list;
}
// Résistance (Art.7-8) et flèche (Art.9) d'une composition sur une liste de vitrages.
// Verdict = TOUS conformes. Pire cas déterminé SÉPARÉMENT pour la résistance
// (e1×c max) et pour la flèche (eF requis max).
function evalPanneaux(panneaux,pression,equiv,projet){
  const hs=+projet.hauteur_sol||3;
  let pireR=null,pireF=null;
  const detail=panneaux.map(p=>{
    const d=calcDTU39(pression,p.largeur,p.hauteur,2,2,projet.type_vitrage,hs);
    const req=+(d.e1*d.c).toFixed(2);
    const pc=Math.min(p.largeur,p.hauteur)/1000;
    const flP=equiv.eF>0?+(d.alpha*(pression/1.5)*(Math.pow(pc,4)/Math.pow(equiv.eF,3))).toFixed(2):null;
    const row={...p,requis:req,eF_requis:d.eF_requis,fleche_max:d.flecheMax,fleche_obtenue:flP,
      res_ok:equiv.eR>=req,
      fleche_ok:flP!=null?flP<=d.flecheMax:equiv.eF>=d.eF_requis,
      dtu:d};
    if(!pireR||req>pireR.requis)pireR=row;
    if(!pireF||d.eF_requis>pireF.eF_requis)pireF=row;
    return row;
  });
  return {detail,pireR,pireF,resistance_ok:detail.every(r=>r.res_ok),fleche_ok:detail.every(r=>r.fleche_ok)};
}
// Épaisseur DTU 39 minimale d'un élément = vitrage le plus défavorable
function calcVentElement(el,projet,sys){
  const pression=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const pan=panneauxCalcul(el,sys);
  if(!pression||!pan.length)return null;
  let pire=null;
  pan.forEach(p=>{
    const d=calcDTU39(pression,p.largeur,p.hauteur,2,2,projet.type_vitrage,+projet.hauteur_sol||3);
    if(!pire||d.eRequired>pire.dtu.eRequired)pire={panneau:p,dtu:d};
  });
  return {...pire,nb:pan.length,pression};
}
function epaisseurDTUProjet(projet){
  const vals=(projet.elements||[]).map(el=>calcVentElement(el,projet)).filter(Boolean).map(r=>r.dtu.eRequired);
  return vals.length?Math.max(...vals)+" mm":"";
}
// Thermique : ligne du catalogue correspondant au type d'élément (fenêtre / PF,
// 1 ou 2 vantaux) et au Ug du vitrage choisi. CORRIGÉ v2.5 : avant, il suffisait
// qu'UNE configuration quelconque du catalogue passe pour afficher "Conforme".
function verifThermique(sys,el,projet){
  const th=((sys&&sys.thermique)||[]).filter(t=>typeof t.uw==="number"&&isFinite(t.uw));
  if(!th.length)return {ok:null,cfg:null,note:"Données thermiques manquantes"};
  let cand=th;
  if(el&&el.type!=="facade"){
    const estPorte=/porte/i.test(el.soustype||"");
    const byKind=cand.filter(t=>estPorte?/porte/i.test(t.config):/^fen[êe]tre/i.test(t.config));
    if(byKind.length)cand=byKind;
    const nv=nbVantauxElement(el,sys);
    const byNv=cand.filter(t=>nv>=2?/2 vtx|2 vantaux/i.test(t.config):/1 vtl|1 vantail/i.test(t.config));
    if(byNv.length)cand=byNv;
  }
  const ugVit=parseFloat(projet&&projet.controle_ug);
  let ugNote="";
  if(ugVit>0){
    // Une config testée avec un Ug égal ou moins bon reste du côté de la sécurité
    const byUg=cand.filter(t=>typeof t.ug==="number"&&t.ug>=ugVit-1e-9);
    if(byUg.length)cand=byUg; else ugNote=` — aucune config au Ug ${ugVit}, valeur catalogue`;
  }
  const best=cand.reduce((b,t)=>(!b||t.uw<b.uw)?t:b,null);
  const uwMax=parseFloat(projet&&projet.uw_max);
  return {ok:uwMax>0?best.uw<=uwMax:null,cfg:best,note:`Uw ${best.uw} W/m²K · ${best.config}${ugNote}`};
}

// ── VÉRIFICATION D'UNE COMPOSITION SUR UN ÉLÉMENT ──────────────────────────
// Poids (ferrure / appui), feuillure, résistance (Art.7-8) et flèche (Art.9).
// CORRIGÉ v2.5 : le tableau "détail par partie" utilisait eR/eF avant leur calcul
// (tout ✗) ; la flèche globale était calculée sur un autre panneau que le pire cas.
function verifVitrage(compo,largeur_mm,hauteur_mm,sys,el,projet){
  const a=analyseComposition(compo);
  if(!a)return null;
  const elx={...(el||{}),largeur:largeur_mm,hauteur:hauteur_mm};
  const isFacade=elx.type==="facade";
  const panneaux=panneauxCalcul(elx,sys);
  const surfP=p=>(p.largeur/1000)*(p.hauteur/1000);
  const plusGrand=list=>list.reduce((b,p)=>(!b||surfP(p)>surfP(b))?p:b,null);
  const ouvrants=panneaux.filter(p=>p.type==="ouvrant"||p.type==="porte");

  // ── Poids ──
  // Façade : plus grand panneau vs capacité d'appui du système.
  // Châssis : ouvrant/porte le plus lourd vs capacité de ferrure. Un FIXE ne pend
  // sur aucune ferrure → pas de contrôle ferrure (poids donné pour information).
  let refP,controle_ferrure;
  if(isFacade){refP=plusGrand(panneaux);controle_ferrure=true;}
  else if(ouvrants.length){refP=plusGrand(ouvrants);controle_ferrure=true;}
  else {refP=plusGrand(panneaux);controle_ferrure=false;}
  let surf=null,poids_unitaire=null,base_label="",poids_max_ref=null,poids_ok=null,poids_decoupage=null;
  if(refP){
    surf=+surfP(refP).toFixed(2);
    poids_unitaire=+(a.poids_m2*surf).toFixed(1);
    const nature=isFacade?"panneau":refP.type==="porte"?"porte":refP.type==="ouvrant"?"vantail":"fixe";
    base_label=`${nature} ${refP.largeur}×${refP.hauteur}mm${refP.label?" ("+refP.label+")":""}`;
    if(controle_ferrure){
      poids_max_ref=sys&&sys.poids_max?sys.poids_max:null;
      poids_ok=poids_max_ref?poids_unitaire<=poids_max_ref:null;
    }
  }
  const nb_vantaux=isFacade?null:ouvrants.reduce((n,p)=>n+(p.qte||1),0);

  // Découpages possibles si un châssis ouvrant simple est trop lourd
  const modePerso=elx.mode_trame==="personnalisee"&&Array.isArray(elx.panneaux)&&elx.panneaux.length>0;
  if(!isFacade&&!modePerso&&poids_ok===false&&poids_max_ref){
    const L_m=largeur_mm/1000,H_m=hauteur_mm/1000,options=[];
    for(let n=2;n<=4;n++){
      const lv=L_m/n,p=+(a.poids_m2*lv*H_m).toFixed(0);
      if(p<=poids_max_ref)options.push({label:`${n} vantaux égaux`,detail:`${(lv*1000).toFixed(0)}×${hauteur_mm}mm chacun`,poids:p});
    }
    for(const ratioFixe of [0.34,0.4,0.5]){
      const lo=(L_m*(1-ratioFixe))/2,p=+(a.poids_m2*lo*H_m).toFixed(0);
      if(p<=poids_max_ref){options.push({label:`Fixe central + 2 ouvrants`,detail:`fixe ${(L_m*ratioFixe*1000).toFixed(0)}mm + 2 ouvrants ${(lo*1000).toFixed(0)}×${hauteur_mm}mm`,poids:p});break;}
    }
    const lvRef=refP?refP.largeur/1000:L_m;
    for(const hImp of [0.4,0.6,0.8]){
      const ho=H_m-hImp; if(ho<=0)continue;
      const p=+(a.poids_m2*lvRef*ho).toFixed(0);
      if(p<=poids_max_ref){options.push({label:`Imposte fixe haute + ouvrant`,detail:`imposte ${(hImp*1000).toFixed(0)}mm + ouvrant ${Math.round(lvRef*1000)}×${(ho*1000).toFixed(0)}mm`,poids:p});break;}
    }
    poids_decoupage=options;
  }

  const feuillure_ok=sys?(a.epaisseur_totale>=sys.epaisseur_min&&a.epaisseur_totale<=sys.epaisseur_max):null;

  // ── Résistance & flèche — NF DTU 39 P4 Art.7-9, sur CHAQUE vitrage ──
  let resistance_ok=null,fleche_verre_ok=null,eR_reel=null,eF_reel=null,dtu_verre=null,fleche_obtenue=null,detail_panneaux=null,base_calcul=null;
  if(projet&&panneaux.length>0){
    const pression=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
    if(pression){
      const eps3=EPS3_TYPES[projet.type_verre]?EPS3_TYPES[projet.type_verre].eps3:1.0;
      const equiv=calcEquivalences(a.panes,eps3);
      if(equiv){
        eR_reel=equiv.eR; eF_reel=equiv.eF;
        const ev=evalPanneaux(panneaux,pression,equiv,projet);
        resistance_ok=ev.resistance_ok; fleche_verre_ok=ev.fleche_ok;
        // Synthèse : valeurs du pire cas de CHAQUE critère
        dtu_verre={...ev.pireR.dtu,eF_requis:ev.pireF.dtu.eF_requis,flecheMax:ev.pireF.dtu.flecheMax,alpha:ev.pireF.dtu.alpha};
        fleche_obtenue=ev.pireF.fleche_obtenue;
        detail_panneaux=ev.detail.map(({dtu,...r})=>r);
        const nomP=p=>`${p.largeur}×${p.hauteur}mm${p.label?" ("+p.label+")":""}`;
        base_calcul=ev.detail.length===1?nomP(ev.pireR)
          :(ev.pireR===ev.pireF?`pire cas ${nomP(ev.pireR)} — ${ev.detail.length} vitrages vérifiés`
            :`pire cas résistance ${nomP(ev.pireR)} · pire cas flèche ${nomP(ev.pireF)} — ${ev.detail.length} vitrages vérifiés`);
      }
    }
  }

  return {
    ...a,
    isFacade,
    surface:surf,
    base_label,base_calcul,
    poids_vantail:poids_unitaire,
    poids_max:poids_max_ref,
    poids_ok,controle_ferrure,
    poids_decoupage,
    resistance_ok, fleche_verre_ok, eR_reel, eF_reel, dtu_verre, fleche_obtenue, detail_panneaux,
    nb_vantaux,
    feuillure_min:sys?sys.epaisseur_min:null,
    feuillure_max:sys?sys.epaisseur_max:null,
    feuillure_ok,
  };
}

// Base : les systèmes du FICHIER (INITIAL_DB) font toujours foi — une correction faite
// dans le code est visible immédiatement. Seuls les systèmes AJOUTÉS par l'utilisateur
// sont stockés dans le navigateur (clé glassiq_v2_perso).
// CORRIGÉ v2.5 : avant, la base complète était figée dans le navigateur au 1er ajout.
function getPerso(){
  try{
    const r=localStorage.getItem("glassiq_v2_perso");
    if(r){const l=JSON.parse(r);return Array.isArray(l)?l:[];}
    // Migration depuis l'ancienne clé : on ne récupère que les systèmes ajoutés
    const old=localStorage.getItem("glassiq_v2_db");
    if(old){
      const ids=new Set(INITIAL_DB.systemes.map(s=>s.id));
      const perso=((JSON.parse(old)||{}).systemes||[]).filter(s=>s&&!ids.has(s.id)).map(s=>({...s,perso:true}));
      localStorage.setItem("glassiq_v2_perso",JSON.stringify(perso));
      return perso;
    }
  }catch(e){}
  return [];
}
function savePerso(list){try{localStorage.setItem("glassiq_v2_perso",JSON.stringify(list));return true;}catch(e){return false;}}
function getDB(){
  const ids=new Set(INITIAL_DB.systemes.map(s=>s.id));
  const perso=getPerso().filter(s=>s&&s.id&&!ids.has(s.id)).map(s=>({tests:[],aev:[],thermique:[],...s}));
  return {systemes:[...INITIAL_DB.systemes,...perso]};
}
function getControles(){try{const r=localStorage.getItem("glassiq_v2_ctrl");return r?JSON.parse(r):INITIAL_CONTROLES;}catch{return INITIAL_CONTROLES;}}

// ── GESTION DES PROJETS (sauvegarde / chargement) ──────────────────────────
function getProjets(){try{const r=localStorage.getItem("glassiq_v2_projets");return r?JSON.parse(r):[];}catch{return [];}}
function saveProjets(list){try{localStorage.setItem("glassiq_v2_projets",JSON.stringify(list));return true;}catch{return false;}}
function uid(){return "P"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function sauverProjet(projet){
  const list=getProjets();
  const now=new Date().toISOString();
  let p={...projet};
  if(!p._pid){p._pid=uid();p._cree=now;}
  p._maj=now;
  const idx=list.findIndex(x=>x._pid===p._pid);
  if(idx>=0)list[idx]=p; else list.push(p);
  saveProjets(list);
  return p;
}
function supprimerProjet(pid){
  const list=getProjets().filter(x=>x._pid!==pid);
  saveProjets(list);
  return list;
}
function dupliquerProjet(pid){
  const list=getProjets();
  const src=list.find(x=>x._pid===pid);
  if(!src)return list;
  const copie={...JSON.parse(JSON.stringify(src)),_pid:uid(),_cree:new Date().toISOString(),_maj:new Date().toISOString(),nom:(src.nom||"Projet")+" (copie)"};
  list.push(copie);
  saveProjets(list);
  return list;
}

// ── IMPORT DU REPÉRAGE — outil de chiffrage EME (onglet EXPORT GLASSIQ) ─────
// Un élément par repère : quantité (× nb de modules), L par module, H, type,
// allège, RA,tr ; le vitrage chiffré est gardé sur l'élément et vérifié au DTU 39.
const TRANCHES_HAUTEUR={"jusqu'à 8 m":"8","8 à 16 m":"16","16 à 25 m":"25","plus de 25 m":"50"};
function typeDepuisChiffrage(sysTxt,ouv){
  const s=String(sysTxt||""),o=String(ouv||"");
  if(/FWS|fa[cç]ade/i.test(s))return {type:"facade",soustype:/acier/i.test(s)?"Façade rideau CW":"Façade rideau FWS"};
  let st;
  if(/^fixe/i.test(o))st="Fenêtre fixe";
  else if(/oscillo|basculant|soufflet/i.test(o))st="Fenêtre OB";
  else if(/fran[cç]aise|anglaise/i.test(o))st="Fenêtre OF";
  else if(/coulissant/i.test(o))st="Coulissant";
  else if(/porte/i.test(o))st="Porte";
  else st=/ADS/i.test(s)?"Porte":"Fenêtre OB";
  return {type:"chassis",soustype:st};
}
function lireExportChiffrage(buf){
  if(typeof XLSX==="undefined")throw new Error("Lecteur Excel non chargé — vérifie la connexion internet puis recharge la page");
  const wb=XLSX.read(buf,{type:"array"});
  const sh=wb.Sheets["EXPORT GLASSIQ"];
  if(!sh)throw new Error("Onglet EXPORT GLASSIQ introuvable — utilise l'outil de chiffrage V10 ou plus récent");
  const rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:""});
  const hi=rows.findIndex(r=>String(r[0]).trim()==="Repère");
  if(hi<0)throw new Error("En-têtes de l'onglet EXPORT GLASSIQ introuvables");
  const H=rows[hi].map(h=>String(h).replace(/\s+/g," ").trim().toLowerCase());
  const col=n=>H.findIndex(h=>h.startsWith(n.toLowerCase()));
  const c={rep:col("Repère"),sys:col("Système"),etage:col("Étage"),L:col("L (mm)"),H:col("H (mm)"),qte:col("Quantité"),
    ouv:col("Type d'ouverture"),parent:col("Repère parent"),mod:col("Nb modules"),compo:col("Composition"),trempe:col("Trempé"),
    couche:col("Couche"),ep:col("Épaisseur"),poids:col("Poids"),allege:col("Allège"),ratr:col("RA,tr"),ctrl:col("Contrôles")};
  const v=(r,k)=>c[k]>=0&&r[c[k]]!=null?r[c[k]]:"";
  const s=(r,k)=>String(v(r,k)).trim();
  const num=x=>{const n=typeof x==="number"?x:parseFloat(String(x).replace(",","."));return isFinite(n)?n:0;};
  const lh=rows.slice(0,hi).find(r=>/^hauteur/i.test(String(r[0]).trim()));
  const hauteur=lh?(TRANCHES_HAUTEUR[String(lh[2]||lh[1]||"").trim().toLowerCase()]||""):"";
  const els=[];let ignores=0;const base=Date.now();
  rows.slice(hi+1).forEach((r,k)=>{
    const rep=s(r,"rep"),L=num(v(r,"L")),Hh=num(v(r,"H"));
    if(!rep&&!L&&!Hh)return;
    if(!rep||L<=0||Hh<=0){ignores++;return;}
    const mod=Math.max(1,Math.round(num(v(r,"mod")))||1);
    const qte=Math.max(1,Math.round(num(v(r,"qte")))||1)*mod;
    const t=typeDepuisChiffrage(v(r,"sys"),v(r,"ouv"));
    const etage=s(r,"etage"),ratr=num(v(r,"ratr")),allege=num(v(r,"allege"));
    const el={id:base+k,label:rep+(etage?" — "+etage:""),type:t.type,soustype:t.soustype,
      orientation:"Toutes orientations",usage:"Façade côté rue",ratr:ratr?String(Math.round(ratr)):"",
      largeur:String(Math.round(L/mod)),hauteur:String(Math.round(Hh)),quantite:String(qte),
      allege_h:allege?String(Math.round(allege)):"",allege_opaque:false,
      chiffrage:{repere:rep,systeme:s(r,"sys"),ouverture:s(r,"ouv"),parent:s(r,"parent"),modules:mod,
        composition:s(r,"compo"),trempe:s(r,"trempe"),couche:s(r,"couche"),epaisseur:num(v(r,"ep"))||null,
        poids:num(v(r,"poids"))||null,controles:s(r,"ctrl")}};
    if(t.type==="facade")Object.assign(el,{trame:"",nb_ouvrants:"",type_ouvrant:"Fenêtre OB",mode_trame:"reguliere"});
    els.push(el);
  });
  return {elements:els,ignores,hauteur};
}
function ImportChiffrage({projet,setProjet}){
  const [msg,setMsg]=useState(null);
  const onFile=e=>{
    const f=e.target.files[0];if(!f)return;e.target.value="";
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const res=lireExportChiffrage(new Uint8Array(ev.target.result));
        if(!res.elements.length){setMsg({t:"warn",m:"Aucun repère avec dimensions dans l'onglet EXPORT GLASSIQ — enregistre le fichier Excel après la saisie, puis réessaie."});return;}
        const n=projet.elements.length;
        const remplacer=n===0||window.confirm(`Remplacer les ${n} élément(s) actuel(s) par les ${res.elements.length} repère(s) du chiffrage ?\n\nOK = remplacer · Annuler = ajouter à la suite`);
        setProjet(p=>{
          const np={...p,elements:remplacer?res.elements:[...p.elements,...res.elements]};
          if(remplacer){np.prescriptions={};np.presc_overrides={};}
          if(!p.nom)np.nom=f.name.replace(/\.(xlsx|xlsm)$/i,"");
          if(!p.hauteur_bat&&res.hauteur)np.hauteur_bat=res.hauteur;
          return np;
        });
        const qte=res.elements.reduce((t,x)=>t+(+x.quantite||1),0);
        const nbF=res.elements.filter(x=>x.type==="facade").length;
        setMsg({t:"ok",m:`${res.elements.length} repère(s) importé(s) — ${qte} unité(s)`
          +(res.ignores?` · ${res.ignores} ligne(s) ignorée(s) (dimensions manquantes)`:"")
          +(!projet.hauteur_bat&&res.hauteur?` · hauteur du bâtiment ${res.hauteur} m reprise de la tranche Excel (à préciser)`:"")
          +(nbF?` · ${nbF} façade(s) : renseigner la trame`:"")
          +" · orientation et usage à compléter"});
      }catch(err){setMsg({t:"warn",m:err.message||"Fichier illisible"});}
    };
    rd.readAsArrayBuffer(f);
  };
  return <div style={{marginBottom:12,padding:"10px 12px",background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:8}}>
    <label style={{...S.btnSecondary,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,background:"#fff",borderColor:"#fdba74",color:"#9a3412",fontWeight:600}}>
      📊 Importer le repérage de l'outil de chiffrage (.xlsx)

    </label>

    {msg&&<div style={{marginTop:6,fontSize:12,padding:"6px 10px",borderRadius:6,background:msg.t==="ok"?"#d1fae5":"#fef3c7",color:msg.t==="ok"?"#065f46":"#92400e"}}>{msg.m}</div>}
  </div>;
}
function ChiffrageInfo({el,projet}){
  const ch=el.chiffrage||{};
  const compo=ch.composition;
  let dtu=null;
  if(compo){
    if(!analyseComposition(compo))dtu=<span style={{color:"#b45309"}}>verre spécial ou composition non lue : vérifier sur la fiche fournisseur</span>;
    else if(el.type!=="facade"&&!el.chassis_compose&&/Plus de 6 m/.test(ch.controles||""))dtu=<span style={{color:"#b45309"}}>DTU 39 non significatif : grand ensemble pris d'un seul vitrage — préciser le Nb de modules dans l'Excel ou cocher « Châssis composé »</span>;
    else{
      const r=verifVitrage(compo,+el.largeur||0,+el.hauteur||0,null,el,projet);
      if(!r||r.resistance_ok==null)dtu=<span style={{color:"#6b7280"}}>DTU 39 : renseigner zone, terrain et hauteur du bâtiment</span>;
      else{
        const ok=r.resistance_ok&&r.fleche_verre_ok!==false;
        dtu=<span style={{color:ok?"#065f46":"#991b1b",fontWeight:600}}>{ok?"✓":"✗"} DTU 39 — résistance {r.resistance_ok?"✓":"✗"} · flèche {r.fleche_verre_ok===false?"✗":r.fleche_verre_ok?"✓":"—"}{r.dtu_verre&&r.dtu_verre.eRequired?` (équiv. ${r.eR_reel} mm / requis ${r.dtu_verre.eRequired} mm)`:""}</span>;
      }
    }
  }
  return <div style={{flex:1,minWidth:260,fontSize:11,padding:"6px 10px",background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:6,color:"#7c2d12",lineHeight:1.6}}>
    📊 Chiffrage : <strong>{ch.repere}</strong>{ch.systeme?" · "+ch.systeme:""}{ch.ouverture?" · "+ch.ouverture:""}{ch.modules>1?` · ${ch.modules} modules (L par module)`:""}{ch.parent?" · inclus dans "+ch.parent:""}
    <br/>Vitrage : <span style={{fontFamily:"monospace",fontWeight:600}}>{compo||"non renseigné"}</span>{ch.couche&&ch.couche!=="Aucune"?" · "+ch.couche:""}{ch.trempe&&ch.trempe!=="Non"?" · trempé "+ch.trempe.toLowerCase():""}{dtu?<span> — {dtu}</span>:null}
    {ch.controles&&ch.controles!=="✓"&&<div style={{color:"#991b1b"}}>⚠ Contrôles Excel : {ch.controles}</div>}
  </div>;
}

                const delPanneau=(idx)=>updEl(i,"panneaux",panneaux.filter((_,pi)=>pi!==idx));
                // Génère une grille régulière de panneaux à partir des comptages TOTAUX
                // (montants et traverses, RIVES INCLUSES) : 4 montants → 3 travées ;
                // 9 traverses réparties sur 3 travées → 3 par travée → 2 rangées → 6 zones.
                const genererGrille=()=>{
                  const nm=+el.nb_montants||0, nt=+el.nb_traverses_total||0;
                  const L=+el.largeur||0, H=+el.hauteur||0;
                  if(nm<2||!L||!H)return;
                  const travees=nm-1;
                  const travPerTravee=travees>0?nt/travees:0;
                  const rangees=Math.max(1,Math.round(travPerTravee)-1);
                  const largP=Math.round(L/travees), hautP=Math.round(H/rangees);

                  {/* CONCEPTEUR DE TRAME — flux simple : nb de trames en largeur et en
                      hauteur, puis dimensions de chaque colonne/rangée, puis type de
                      chaque case en cliquant sur le dessin (fixe → ouvrant → porte). */}
                  {(()=>{
                    const L=+el.largeur||0, H=+el.hauteur||0;
                    if(!L||!H)return null;
                    const nCols=Math.max(0,Math.min(30,+el.grid_cols||0));
                    const nRows=Math.max(0,Math.min(20,+el.grid_rows||0));
                    const widths=(el.grid_widths&&el.grid_widths.length===nCols)?el.grid_widths:Array(nCols).fill(nCols>0?String(Math.round(L/nCols)):"");
                    const heights=(el.grid_heights&&el.grid_heights.length===nRows)?el.grid_heights:Array(nRows).fill(nRows>0?String(Math.round(H/nRows)):"");
                    const types=el.grid_types||{};
                    const subdiv=el.grid_subdiv||{};// {"ci-ri": {n:2, types:["fixe","porte"], widths:[750,750]}}
                    const setCols=(v)=>{const n=Math.max(0,Math.min(30,+v||0));updEl(i,"grid_cols",v);updEl(i,"grid_widths",Array(n).fill(n>0?String(Math.round(L/n)):""));};
                    const setRows=(v)=>{const n=Math.max(0,Math.min(20,+v||0));updEl(i,"grid_rows",v);updEl(i,"grid_heights",Array(n).fill(n>0?String(Math.round(H/n)):""));};
                    const setW=(ci,v)=>{const arr=widths.slice();arr[ci]=v;updEl(i,"grid_widths",arr);};
                    const setHt=(ri,v)=>{const arr=heights.slice();arr[ri]=v;updEl(i,"grid_heights",arr);};
                    const cycleType=(ci,ri)=>{const k=ci+"-"+ri;const cur=types[k]||"fixe";const next=cur==="fixe"?"ouvrant":cur==="ouvrant"?"porte":"fixe";updEl(i,"grid_types",{...types,[k]:next});};
                    // Subdiviser une case en N sous-parties verticales (côte à côte).
                    // Ex: une case 1500 large → 2 sous-parties de 750, l'une porte l'autre fixe.
                    const setSubdivN=(ci,ri,n)=>{
                      const k=ci+"-"+ri;
                      if(n<=1){const cp={...subdiv};delete cp[k];updEl(i,"grid_subdiv",cp);return;}
                      const wCol=+widths[ci]||0;
                      const cur=subdiv[k];
                      const wEach=String(Math.round(wCol/n));
                      updEl(i,"grid_subdiv",{...subdiv,[k]:{n,
                        types:Array.from({length:n},(_,x)=>cur&&cur.types&&cur.types[x]?cur.types[x]:"fixe"),
                        widths:Array.from({length:n},(_,x)=>cur&&cur.widths&&cur.widths[x]?cur.widths[x]:wEach)}});
                    };
                    const cycleSubType=(ci,ri,si)=>{
                      const k=ci+"-"+ri; const s=subdiv[k]; if(!s)return;
                      const cur=s.types[si]||"fixe"; const next=cur==="fixe"?"ouvrant":cur==="ouvrant"?"porte":"fixe";
                      const tps=s.types.slice(); tps[si]=next;
                      updEl(i,"grid_subdiv",{...subdiv,[k]:{...s,types:tps}});
                    };
                    const setSubW=(ci,ri,si,v)=>{
                      const k=ci+"-"+ri; const s=subdiv[k]; if(!s)return;
                      const ws=s.widths.slice(); ws[si]=v;
                      updEl(i,"grid_subdiv",{...subdiv,[k]:{...s,widths:ws}});
                    };
                    const sumW=widths.reduce((a,b)=>a+(+b||0),0);
                    const sumH2=heights.reduce((a,b)=>a+(+b||0),0);
                    const okW=nCols>0&&Math.abs(sumW-L)<=5;
                    const okH2=nRows>0&&Math.abs(sumH2-H)<=5;
                    const genOk=okW&&okH2;
                    const FILL={fixe:"#dbeafe",ouvrant:"#d1fae5",porte:"#fed7aa"};
                    const Wsvg=460, scale=Wsvg/Math.max(sumW||L,1), Hpx=Math.max(60,(sumH2||H)*scale)+4;
                    let xs=[0];widths.forEach(w=>xs.push(xs[xs.length-1]+(+w||0)));
                    let ys=[0];heights.forEach(h=>ys.push(ys[ys.length-1]+(+h||0)));
                    const generer=()=>{
                      const groupes={};
                      for(let ci=0;ci<nCols;ci++)for(let ri=0;ri<nRows;ri++){
                        const k=ci+"-"+ri; const s=subdiv[k];
                        const hRow=Math.round(+heights[ri]||0);
                        if(s&&s.n>1){
                          // case subdivisée : chaque sous-partie devient un panneau
                          for(let si=0;si<s.n;si++){
                            const w=Math.round(+s.widths[si]||0);
                            const t=s.types[si]||"fixe";
                            const key=w+"x"+hRow+"_"+t;
                            groupes[key]=(groupes[key]||0)+1;
                          }
                        } else {
                          const t=types[k]||"fixe";
                          const key=Math.round(+widths[ci]||0)+"x"+hRow+"_"+t;
                          groupes[key]=(groupes[key]||0)+1;
                        }
                      }
                      updEl(i,"nb_montants",String(nCols+1));
                      updEl(i,"nb_traverses_total",String(nCols*(nRows+1)));
                      updEl(i,"panneaux",Object.entries(groupes).map(([k,q])=>{
                        const kk=k.split("_");
                        const parts=kk[0].split("x");
                        return {largeur:parts[0],hauteur:parts[1],type:kk[1],qte:String(q),label:"grille"};
                      }));
                    };
                    return <div style={{marginBottom:8,padding:"10px 12px",background:"#fff",borderRadius:8,border:"1px solid #ddd6fe"}}>
                      <div style={{fontSize:10,fontWeight:700,color:"#5b21b6",marginBottom:8}}>📐 CONCEPTEUR DE TRAME</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}}>
                        <div><label style={{...S.label,fontSize:9}}>Trames en LARGEUR (colonnes)</label><input type="number" min="1" max="30" value={el.grid_cols||""} placeholder="ex : 3" onChange={e=>setCols(e.target.value)} style={S.input}/></div>
                        <div><label style={{...S.label,fontSize:9}}>Trames en HAUTEUR (rangées)</label><input type="number" min="1" max="20" value={el.grid_rows||""} placeholder="ex : 2" onChange={e=>setRows(e.target.value)} style={S.input}/></div>
                      </div>
                      {nCols>0&&<div style={{marginBottom:6}}>
                        <label style={{...S.label,fontSize:9}}>Largeur de chaque colonne (mm, gauche→droite)</label>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{widths.map((w,ci)=><input key={ci} type="number" value={w} onChange={e=>setW(ci,e.target.value)} style={{...S.input,width:78}}/>)}</div>
                      </div>}
                      {nRows>0&&<div style={{marginBottom:6}}>
                        <label style={{...S.label,fontSize:9}}>Hauteur de chaque rangée (mm, haut→bas)</label>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{heights.map((h,ri)=><input key={ri} type="number" value={h} onChange={e=>setHt(ri,e.target.value)} style={{...S.input,width:78}}/>)}</div>
                      </div>}
                      {(nCols>0||nRows>0)&&<div style={{fontSize:10,marginBottom:6}}>
                        <span style={{color:okW?"#059669":"#991b1b",fontWeight:600}}>Σ largeurs {Math.round(sumW)} / {L} mm {okW?"✓":"✗"}</span>
                        <span style={{margin:"0 10px",color:"#d1d5db"}}>|</span>
                        <span style={{color:okH2?"#059669":"#991b1b",fontWeight:600}}>Σ hauteurs {Math.round(sumH2)} / {H} mm {okH2?"✓":"✗"}</span>
                        <span style={{marginLeft:10,color:"#6b7280"}}>{nCols*nRows} zones</span>
                      </div>}
                      {nCols>0&&nRows>0&&<div>
                        <div style={{fontSize:10,color:"#6b7280",marginBottom:4}}>👆 Clic sur une case = change son type : <span style={{background:"#dbeafe",padding:"1px 8px",borderRadius:4,border:"1px solid #93c5fd"}}>fixe</span> → <span style={{background:"#d1fae5",padding:"1px 8px",borderRadius:4,border:"1px solid #6ee7b7"}}>ouvrant</span> → <span style={{background:"#fed7aa",padding:"1px 8px",borderRadius:4,border:"1px solid #fdba74"}}>porte</span> · Pour diviser une case (ex. porte + fixe côte à côte), utilise les boutons ✂ ci-dessous.</div>
                        <svg viewBox={"0 0 "+Wsvg+" "+Hpx} style={{width:"100%",maxWidth:Wsvg,display:"block",border:"1px solid #e5e7eb",borderRadius:6,background:"#f8fafc"}}>
                          {Array.from({length:nCols}).map((_,ci)=>Array.from({length:nRows}).map((_,ri)=>{
                            const k=ci+"-"+ri; const s=subdiv[k];
                            const w=(+widths[ci]||0)*scale, h=(+heights[ri]||0)*scale;
                            const x0=xs[ci]*scale, y0=ys[ri]*scale;
                            if(s&&s.n>1){
                              // dessiner les sous-parties côte à côte
                              const totalSub=s.widths.reduce((a,b)=>a+(+b||0),0)||1;
                              let subX=x0;
                              return <g key={k}>{s.widths.map((sw,si)=>{
                                const t=s.types[si]||"fixe";
                                const wSub=((+sw||0)/totalSub)*w;
                                const rectX=subX; subX+=wSub;
                                return <g key={si} onClick={()=>cycleSubType(ci,ri,si)} style={{cursor:"pointer"}}>
                                  <rect x={rectX+1.5} y={y0+1.5} width={Math.max(2,wSub-3)} height={Math.max(2,h-3)} fill={FILL[t]} stroke="#5b21b6" strokeWidth="1.4"/>
                                  {wSub>44&&h>26&&<text x={rectX+wSub/2} y={y0+h/2-5} textAnchor="middle" fontSize="9" fill="#1e3a8a" fontFamily="monospace">{Math.round(+sw||0)}×{Math.round(+heights[ri]||0)}</text>}
                                  {wSub>44&&h>26&&<text x={rectX+wSub/2} y={y0+h/2+8} textAnchor="middle" fontSize="8" fill="#374151">{t}</text>}
                                </g>;
                              })}</g>;
                            }
                            const t=types[k]||"fixe";
                            return <g key={k} onClick={()=>cycleType(ci,ri)} style={{cursor:"pointer"}}>
                              <rect x={x0+1.5} y={y0+1.5} width={Math.max(2,w-3)} height={Math.max(2,h-3)} fill={FILL[t]} stroke="#5b21b6" strokeWidth="1.4"/>
                              {w>56&&h>26&&<text x={x0+w/2} y={y0+h/2-5} textAnchor="middle" fontSize="10" fill="#1e3a8a" fontFamily="monospace">{Math.round(+widths[ci]||0)}×{Math.round(+heights[ri]||0)}</text>}
                              {w>56&&h>26&&<text x={x0+w/2} y={y0+h/2+8} textAnchor="middle" fontSize="9" fill="#374151">{t}</text>}
                            </g>;
                          }))}
                        </svg>
                        {/* Contrôles de subdivision par case */}
                        <div style={{marginTop:8,padding:"8px 10px",background:"#faf5ff",borderRadius:6,border:"1px solid #e9d5ff"}}>
                          <div style={{fontSize:10,fontWeight:700,color:"#6b21a8",marginBottom:6}}>✂ Diviser une case en plusieurs parties (porte tiercée, imposte...)</div>
                          <div style={{display:"flex",flexDirection:"column",gap:6}}>
                            {Array.from({length:nCols}).map((_,ci)=>Array.from({length:nRows}).map((_,ri)=>{
                              const k=ci+"-"+ri; const s=subdiv[k];
                              return <div key={k} style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",fontSize:10}}>
                                <span style={{color:"#6b7280",minWidth:120}}>Case col{ci+1}·rang{ri+1} ({Math.round(+widths[ci]||0)}×{Math.round(+heights[ri]||0)})</span>
                                <select value={s?s.n:1} onChange={e=>setSubdivN(ci,ri,+e.target.value)} style={{...S.input,width:110,fontSize:10,padding:"3px 6px"}}>
                                  <option value={1}>entière</option><option value={2}>÷ 2 parties</option><option value={3}>÷ 3 parties</option><option value={4}>÷ 4 parties</option>
                                </select>
                                {s&&s.n>1&&s.widths.map((sw,si)=>(
                                  <span key={si} style={{display:"flex",alignItems:"center",gap:2}}>
                                    <input type="number" value={sw} onChange={e=>setSubW(ci,ri,si,e.target.value)} style={{...S.input,width:60,fontSize:10,padding:"3px 4px"}} title="largeur sous-partie"/>
                                    <span style={{fontSize:9,color:"#9ca3af"}}>{s.types[si]}</span>
                                  </span>
                                ))}
                                {s&&s.n>1&&<span style={{fontSize:9,color:Math.abs(s.widths.reduce((a,b)=>a+(+b||0),0)-(+widths[ci]||0))<=5?"#059669":"#991b1b"}}>Σ {s.widths.reduce((a,b)=>a+(+b||0),0)}/{Math.round(+widths[ci]||0)}</span>}
                              </div>;
                            }))}
                          </div>
                          <div style={{fontSize:9,color:"#9ca3af",marginTop:4}}>Après avoir divisé, clique sur les sous-parties du dessin pour changer leur type (fixe/ouvrant/porte).</div>
                        </div>
                        <button onClick={generer} disabled={!genOk} style={{...S.btnSecondary,fontSize:11,padding:"6px 12px",marginTop:8,opacity:!genOk?0.5:1,cursor:!genOk?"not-allowed":"pointer"}}>✓ Valider → générer les panneaux</button>
                        {!genOk&&<div style={{fontSize:10,color:"#991b1b",marginTop:4}}>Ajuste les largeurs/hauteurs pour totaliser {L} × {H} mm.</div>}
                      </div>}
                    </div>;
                  })()}
                  {panneaux.length===0&&<div style={{padding:"8px 12px",background:"#fff1f2",border:"1px solid #fca5a5",borderRadius:8,fontSize:11,color:"#991b1b",marginBottom:8}}>
                    ⚠ Aucun panneau saisi — tant que la liste est vide, le récap ci-dessous est calculé en <strong>trame régulière par défaut (1350mm)</strong>, qui ne correspond PAS à ta saisie. Utilise le concepteur de trame ci-dessus (« ✓ Valider → générer les panneaux ») ou ajoute les panneaux manuellement.
                  </div>}
                  {panneaux.map((p,pi)=>(
                    <div key={pi} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr auto",gap:6,marginBottom:6,alignItems:"end"}}>
                      <div><label style={{...S.label,fontSize:9}}>Largeur (mm)</label><input type="number" value={p.largeur} onChange={e=>updPanneau(pi,"largeur",e.target.value)} style={S.input}/></div>
                      <div><label style={{...S.label,fontSize:9}}>Hauteur (mm)</label><input type="number" value={p.hauteur} onChange={e=>updPanneau(pi,"hauteur",e.target.value)} style={S.input}/></div>
                      <div><label style={{...S.label,fontSize:9}}>Type</label><select value={p.type} onChange={e=>updPanneau(pi,"type",e.target.value)} style={S.input}><option value="fixe">Fixe</option><option value="porte">Porte</option><option value="ouvrant">Ouvrant</option></select></div>
                      <div><label style={{...S.label,fontSize:9}}>Qté</label><input type="number" min="1" value={p.qte} onChange={e=>updPanneau(pi,"qte",e.target.value)} style={S.input}/></div>
                      <div><label style={{...S.label,fontSize:9}}>Repère</label><input type="text" value={p.label||""} placeholder="ex: porte" onChange={e=>updPanneau(pi,"label",e.target.value)} style={S.input}/></div>
                      <button onClick={()=>delPanneau(pi)} style={{padding:"7px 10px",borderRadius:6,border:"1px solid #fca5a5",background:"#fee2e2",color:"#991b1b",cursor:"pointer",fontSize:12}}>✕</button>
                    </div>
                  ))}
                  <button onClick={addPanneau} style={{...S.btnSecondary,fontSize:11,padding:"6px 12px",marginTop:4}}>＋ Ajouter un panneau</button>
                  {/* Sécurité allège — nécessaire aussi en mode personnalisé (sinon la
                      vérification chute tourne avec allège=0 sans contrôle possible) */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:8}}>
                    <div><label style={{...S.label,fontSize:10}}>Hauteur d'allège (mm)</label><input type="number" value={el.allege_h||""} placeholder="0 si vitré au sol" onChange={e=>updEl(i,"allege_h",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Bas du vitrage / sol fini — pilote la sécurité chute</div></div>
                    <div><label style={{...S.label,fontSize:10}}>Allège opaque ?</label><select value={el.allege_opaque?"oui":"non"} onChange={e=>updEl(i,"allege_opaque",e.target.value==="oui")} style={S.input}><option value="non">Non — vitré bas</option><option value="oui">Oui — panneau opaque</option></select></div>
                  </div>
                </div>;
              })():null}
              {el.mode_trame!=="personnalisee"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10}}>
                <div><label style={{...S.label,fontSize:10}}>Entraxe trame (mm)</label><input type="number" value={el.trame||""} placeholder="1350" onChange={e=>updEl(i,"trame",e.target.value)} style={S.input}/></div>
                <div><label style={{...S.label,fontSize:10}}>Nombre d'ouvrants</label><input type="number" value={el.nb_ouvrants||""} placeholder="6" onChange={e=>updEl(i,"nb_ouvrants",e.target.value)} style={S.input}/></div>
                <div><label style={{...S.label,fontSize:10}}>Type d'ouvrant</label><select value={el.type_ouvrant||"Fenêtre OB"} onChange={e=>updEl(i,"type_ouvrant",e.target.value)} style={S.input}><option>Fenêtre OB</option><option>Fenêtre OF</option><option>Fenêtre italienne</option><option>Porte</option><option>Aucun (tout fixe)</option></select></div>
                <div><label style={{...S.label,fontSize:10}}>Allège opaque ?</label><select value={el.allege_opaque?"oui":"non"} onChange={e=>updEl(i,"allege_opaque",e.target.value==="oui")} style={S.input}><option value="non">Non — vitré jusqu'au sol</option><option value="oui">Oui — panneau opaque</option></select></div>
              </div>}
              {el.mode_trame!=="personnalisee"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:8}}>
                <div><label style={{...S.label,fontSize:10}}>Hauteur d'allège (mm)</label><input type="number" value={el.allege_h||""} placeholder="1050" onChange={e=>updEl(i,"allege_h",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Bas du vitrage / sol fini</div></div>
                <div><label style={{...S.label,fontSize:10}}>Hauteur panneau vitré (mm)</label><input type="number" value={el.haut_panneau||""} placeholder="auto" onChange={e=>updEl(i,"haut_panneau",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Vide = estimation auto · sinon hauteur entre traverses</div></div>
              </div>}
              <label style={{display:"flex",alignItems:"center",gap:6,marginTop:8,fontSize:11,color:"#374151",cursor:"pointer"}}>
                <input type="checkbox" checked={!!el.sans_risque_chute} onChange={e=>updEl(i,"sans_risque_chute",e.target.checked)}/>
                Sans risque de chute (rez-de-chaussée sur terrain naturel, sans vide en contrebas)
              </label>
              <label style={{display:"flex",alignItems:"center",gap:6,marginTop:6,fontSize:11,color:"#374151",cursor:"pointer"}}>
                <input type="checkbox" checked={!!el.rc3_requis} onChange={e=>updEl(i,"rc3_requis",e.target.checked)}/>
                Exigence anti-effraction RC3 (RDC / rez-de-chaussée)
              </label>
              {el.rc3_requis&&<div style={{marginTop:6,padding:"8px 12px",background:"#fef3c7",borderRadius:8,border:"1px solid #fde68a",fontSize:11,color:"#92400e",lineHeight:1.5}}>
                ⚠ Le RC3 sur une façade rideau <strong>n'est pas couvert par le DTA standard</strong> du système — le profilé de base ne change pas, mais il faut des <strong>capots et un serrage renforcés</strong> (généralement vissés plutôt que clipsés) ainsi que des <strong>raidisseurs internes dans les montants et traverses</strong>. Demander au fabricant un <strong>PV d'essai EN 1627-1630 spécifique</strong> pour cette configuration — ce n'est pas une donnée que GlassIQ peut vérifier automatiquement.
              </div>}
              {af&&af.mode==="personnalisee"&&<div style={{marginTop:10,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                {[["Panneaux",af.nb_panneaux_total,`${af.panneaux.length} tailles diff.`],["Vitrage fixe",`${af.surf_vitree_fixe} m²`,`sur ${af.surf_totale} m²`],["Portes/Ouvrants",`${af.surf_ouvrants} m²`,`${af.nb_ouvrants} unités`],["Montants/Traverses",`${el.nb_montants||"?"}/${el.nb_traverses_total||"?"}`,"renseignés (info)"]].map(([l,v,sub])=>(
                  <div key={l} style={{background:"#fff",borderRadius:6,padding:"6px 8px",textAlign:"center",border:"1px solid #ede9fe"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>{v}</div>
                    <div style={{fontSize:9,color:"#6b7280"}}>{l}</div>
                    <div style={{fontSize:9,color:"#9ca3af"}}>{sub}</div>
                  </div>
                ))}
              </div>}
              {af&&af.mode!=="personnalisee"&&<div style={{marginTop:10,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                {[["Meneaux",af.nb_meneaux,`${af.nb_travees} travées`],["Vitrage fixe",`${af.surf_vitree_fixe} m²`,`sur ${af.surf_totale} m²`],["Ouvrants",`${af.surf_ouvrants} m²`,`${af.nb_ouvrants} unités`],["Allège opaque",`${af.surf_allege} m²`,el.allege_opaque?"panneau":"néant"]].map(([l,v,sub])=>(
                  <div key={l} style={{background:"#fff",borderRadius:6,padding:"6px 8px",textAlign:"center",border:"1px solid #ede9fe"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>{v}</div>
                    <div style={{fontSize:9,color:"#6b7280"}}>{l}</div>
                    <div style={{fontSize:9,color:"#9ca3af"}}>{sub}</div>
                  </div>
                ))}
              </div>}
            </div>;
          })()}
          {/* Composition du châssis + allège */}
          {!iF&&!el.chassis_compose&&<div style={{marginTop:8,padding:"10px 12px",background:"#ecfdf5",borderRadius:8,border:"1px solid #a7f3d0"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#065f46",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>🪟 Composition du châssis</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10}}>
              <div><label style={{...S.label,fontSize:10}}>Nombre de vantaux</label><select value={el.nb_vantaux||"auto"} onChange={e=>updEl(i,"nb_vantaux",e.target.value==="auto"?"":e.target.value)} style={S.input}><option value="auto">Auto (selon système)</option><option value="1">1 vantail</option><option value="2">2 vantaux</option><option value="3">3 vantaux</option><option value="4">4 vantaux</option></select><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Auto : 2 pour PF/coulissant, 1 sinon</div></div>
              <div><label style={{...S.label,fontSize:10}}>Largeur fixe (mm)</label><input type="number" value={el.larg_fixe||""} placeholder="0" onChange={e=>updEl(i,"larg_fixe",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Si fixe accolé · 0 = aucun</div></div>
              <div><label style={{...S.label,fontSize:10}}>Hauteur d'allège (mm)</label><input type="number" value={el.allege_h||""} placeholder="1000" onChange={e=>updEl(i,"allege_h",e.target.value)} style={S.input}/></div>
              <div><label style={{...S.label,fontSize:10}}>Allège opaque ?</label><select value={el.allege_opaque?"oui":"non"} onChange={e=>updEl(i,"allege_opaque",e.target.value==="oui")} style={S.input}><option value="non">Non — vitré bas</option><option value="oui">Oui — opaque</option></select></div>
            </div>
