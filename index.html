// ── CALCUL FLÈCHE FAÇADE RIDEAU (Eurocode / DTU) ───────────────────────────
// Meneau = poutre sur 2 appuis (planchers), charge vent répartie.
// E aluminium = 70000 N/mm². Flèche admissible : valeur usuelle L/200 (à confirmer
// par le DTA du système — NF EN 13830 ne fixe pas de valeur universelle pour les
// façades rideaux ; seule la flèche des châssis fenêtres/portes est fixée par le
// NF DTU 39 P1-1 : L/150, max 15mm sous 800 Pa — cf. onglet dédié le cas échéant).
const E_ALU = 70000;
function flecheMeneau(pression_Pa, entraxe_m, portee_m, Ix_cm4){
  const q = pression_Pa * entraxe_m / 1000; // N/mm
  const L = portee_m * 1000; // mm
  const I = Ix_cm4 * 1e4; // mm^4
  const f = (5 * q * Math.pow(L,4)) / (384 * E_ALU * I); // mm
  return {
    fleche: +f.toFixed(1),
    adm_200: +(L/200).toFixed(1),
    adm_175: +(L/175).toFixed(1),
    ok_200: f <= L/200,
    ok_175: f <= L/175,
    ratio: +(f/(L/200)).toFixed(2),
  };
}
// Trouve les profilés meneaux qui passent pour un système donné
function profilesCompatibles(systeme, pression_Pa, entraxe_m, portee_m){
  return PROFILES_FACADE
    .filter(p=>p.systeme===systeme && (p.type==="meneau"||p.type==="meneau_angle"))
    .map(p=>({...p, calc: flecheMeneau(pression_Pa, entraxe_m, portee_m, p.Ix)}))
    .sort((a,b)=>a.Ix-b.Ix);
}
// Calcul INVERSE : inertie minimale requise (cm⁴) pour respecter le critère de flèche.
// Inversion directe de la formule de flècheMeneau : f = 5qL⁴/(384·E·I) ≤ L/critère
// → I ≥ 5·q·L³·critère/(384·E). Universel : comparable à n'importe quel catalogue
// fabricant (Schüco, Reynaers, Technal...), même si le profil n'est pas en base.
function inertieRequise(pression_Pa, entraxe_m, portee_m, critere){
  const q = pression_Pa * entraxe_m / 1000; // N/mm
  const L = portee_m * 1000; // mm
  const fAdm = L / critere; // mm
  const I_mm4 = (5 * q * Math.pow(L,4)) / (384 * E_ALU * fAdm);
  return +(I_mm4 / 1e4).toFixed(1); // cm⁴
}

// ── ANALYSE TRAME FAÇADE — métré meneaux/traverses/ouvrants ────────────────
function analyseFacade(el){
  const L=(+el.largeur||0)/1000, H=(+el.hauteur||0)/1000; // m
  if(!L||!H)return null;

  if(el.mode_trame==="personnalisee"&&Array.isArray(el.panneaux)&&el.panneaux.length>0){
    // ── MODE PANNEAUX PERSONNALISÉS — trame irrégulière (tailles différentes) ──
    // Pour une façade où les panneaux n'ont pas tous la même dimension (porte,
    // fixes de tailles variées...), on ne peut pas déduire un entraxe unique.
    // L'utilisateur liste chaque panneau réel ; le métré et la vérification se
    // font à partir de cette liste, pas d'une trame régulière supposée.
    const panneaux=el.panneaux.map(p=>({...p,l:(+p.largeur||0)/1000,h:(+p.hauteur||0)/1000,qte:Math.max(1,+p.qte||1)}));
    let surf_totale=0,surf_ouvrants=0,surf_vitree_fixe=0,nb_ouvrants=0,nb_portes=0,nb_fixe=0;
    panneaux.forEach(p=>{
      const s=p.l*p.h*p.qte;
      surf_totale+=s;
      if(p.type==="ouvrant"){surf_ouvrants+=s;nb_ouvrants+=p.qte;}
      else if(p.type==="porte"){surf_ouvrants+=s;nb_portes+=p.qte;}
      else {surf_vitree_fixe+=s;nb_fixe+=p.qte;}
    });
    const nb_panneaux_total=panneaux.reduce((a,p)=>a+p.qte,0);
    return {
      L,H,mode:"personnalisee",panneaux,
      nb_meneaux:+el.nb_montants||null,nb_travees:null,
      ml_meneaux:null,ml_traverses:null,
      surf_totale:+surf_totale.toFixed(1),
      nb_ouvrants:nb_ouvrants+nb_portes,nb_portes,nb_fixe,
      surf_ouvrants:+surf_ouvrants.toFixed(1),
      surf_allege:0,
      surf_vitree_fixe:+surf_vitree_fixe.toFixed(1),
      entraxe_meneau:null,
      nb_panneaux_total,
    };
  }

  // ── MODE TRAME RÉGULIÈRE (par défaut) ──
  const trame=(+el.trame||1350)/1000; // m
  const nb_meneaux=Math.max(2,Math.round(L/trame)+1); // meneaux verticaux
  const nb_travees=nb_meneaux-1;
  const ml_meneaux=nb_meneaux*H; // ml verticaux
  const ml_traverses=L; // au moins 1 niveau haut+bas → approx 2×L mini, ici traverse par niveau
  const surf_totale=L*H;
  const nb_ouvrants=+el.nb_ouvrants||0;
  // Surface estimée d'un ouvrant standard (0.9 × hauteur de travée utile)
  const surf_ouvrant_unit=trame*0.9*(H>2.4?1.4:H*0.6);
  const surf_ouvrants=nb_ouvrants*surf_ouvrant_unit;
  const surf_allege=el.allege_opaque?L*((+el.allege_h||0)/1000):0;
  const surf_vitree_fixe=Math.max(0,surf_totale-surf_ouvrants-surf_allege);
  return {
    L,H,trame,nb_meneaux,nb_travees,
    ml_meneaux:+ml_meneaux.toFixed(1),
    ml_traverses:+(ml_traverses*Math.max(2,Math.ceil(H/2.5))).toFixed(1),
    surf_totale:+surf_totale.toFixed(1),
    nb_ouvrants,
    surf_ouvrants:+surf_ouvrants.toFixed(1),
    surf_allege:+surf_allege.toFixed(1),
    surf_vitree_fixe:+surf_vitree_fixe.toFixed(1),
    entraxe_meneau:+trame.toFixed(2),
  };
}

// ── MÉTRÉ GLOBAL PAR TYPOLOGIE ─────────────────────────────────────────────
// Regroupe les éléments identiques (même type, dimensions, trame, RA,tr) et
// calcule surfaces, linéaires profilés, comptages et poids estimé.
function metreGlobal(elements, prescriptions, hauteur_sol_m){
  prescriptions=prescriptions||{};
  // Clé de typologie : ce qui rend deux éléments "identiques"
  const keyOf=(el)=>[el.type,el.largeur,el.hauteur,el.soustype,el.ratr,el.trame||"",el.nb_ouvrants||"",el.allege_opaque?"op":"vi"].join("|");
  const groups={};
  elements.forEach(el=>{
    const k=keyOf(el);
    if(!groups[k])groups[k]={modele:el,count:0,labels:[]};
    groups[k].count++;
    groups[k].labels.push(el.label);
  });

  const typologies=Object.values(groups).map(g=>{
    const el=g.modele;
    const isFacade=el.type==="facade";
    const af=isFacade?analyseFacade(el):null;
    const presc=prescriptions[el.id];
    const poids_m2=presc&&presc.poids_m2?parseFloat(presc.poids_m2):null;
    let surf_unit, surf_vitree, surf_ouvrants, surf_allege, ml_meneaux, ml_traverses, nb_meneaux, nb_ouvrants, poids_unit;
    if(isFacade&&af){
      surf_unit=af.surf_totale;
      surf_vitree=af.surf_vitree_fixe;
      surf_ouvrants=af.surf_ouvrants;
      surf_allege=af.surf_allege;
      ml_meneaux=af.ml_meneaux;
      ml_traverses=af.ml_traverses;
      nb_meneaux=af.nb_meneaux;
      nb_ouvrants=af.nb_ouvrants;
      poids_unit=poids_m2?+(poids_m2*surf_unit).toFixed(0):null;
    } else {
      surf_unit=+((+el.largeur/1000)*(+el.hauteur/1000)).toFixed(2);
      surf_vitree=surf_unit; surf_ouvrants=surf_unit; surf_allege=0;
      ml_meneaux=0; ml_traverses=0; nb_meneaux=0; nb_ouvrants=1;
      poids_unit=poids_m2?+(poids_m2*surf_unit).toFixed(0):null;
    }
    return {
      ...g, isFacade, el,
      surf_unit, surf_total:+(surf_unit*g.count).toFixed(1),
      surf_vitree_total:+(surf_vitree*g.count).toFixed(1),
      surf_ouvrants_total:+(surf_ouvrants*g.count).toFixed(1),
      surf_allege_total:+(surf_allege*g.count).toFixed(1),
      ml_meneaux_total:+(ml_meneaux*g.count).toFixed(1),
      ml_traverses_total:+(ml_traverses*g.count).toFixed(1),
      nb_meneaux_total:nb_meneaux*g.count,
      nb_ouvrants_total:nb_ouvrants*g.count,
      poids_m2, poids_total:poids_unit?+(poids_unit*g.count).toFixed(0):null,
      ratr:el.ratr, gamme:presc?presc.gamme:null, vitrage:presc?presc.vitrage:null,
    };
  });

  // Totaux projet
  const T={
    nb_elements:elements.length,
    nb_typologies:typologies.length,
    surf_total:+typologies.reduce((s,t)=>s+t.surf_total,0).toFixed(1),
    surf_vitree:+typologies.reduce((s,t)=>s+t.surf_vitree_total,0).toFixed(1),
    surf_ouvrants:+typologies.reduce((s,t)=>s+t.surf_ouvrants_total,0).toFixed(1),
    surf_allege:+typologies.reduce((s,t)=>s+t.surf_allege_total,0).toFixed(1),
    ml_meneaux:+typologies.reduce((s,t)=>s+t.ml_meneaux_total,0).toFixed(1),
    ml_traverses:+typologies.reduce((s,t)=>s+t.ml_traverses_total,0).toFixed(1),
    nb_meneaux:typologies.reduce((s,t)=>s+t.nb_meneaux_total,0),
    nb_ouvrants:typologies.reduce((s,t)=>s+t.nb_ouvrants_total,0),
    nb_facades:typologies.filter(t=>t.isFacade).reduce((s,t)=>s+t.count,0),
    nb_chassis:typologies.filter(t=>!t.isFacade).reduce((s,t)=>s+t.count,0),
    poids_total:+typologies.reduce((s,t)=>s+(t.poids_total||0),0).toFixed(0),
  };
  return {typologies,totaux:T};
}

// ── SÉCURITÉ ALLÈGE — NF P08-302 / DTU 39 P5 ───────────────────────────────
// Règle : allège < 1.00m → protection contre chute requise, INDÉPENDAMMENT
// de la hauteur du bâtiment (contrairement au champ "hauteur vitrage/sol" qui
// lui sert uniquement à la correction de pression de vent DTU 39 — les deux
// notions sont physiquement différentes et ne doivent pas être confondues).
// Seule exception explicite : élément marqué "sans risque de chute" par
// l'utilisateur (ex. rez-de-chaussée sur terrain naturel, sans vide en contrebas).
function verifAllege(el){
  const allege_mm=+el.allege_h||0;
  const allege_m=allege_mm/1000;
  const sans_risque=!!el.sans_risque_chute;
  const protection_requise=allege_m<1.0 && !sans_risque;
  let exigence,classe_min,detail;
  if(sans_risque){
    exigence="Aucune exigence — sans risque de chute déclaré";
    classe_min=null;
    detail="Vérifier que ce cas (rez-de-chaussée sans vide en contrebas) est bien justifié";
  } else if(!protection_requise){
    exigence="Aucune exigence sécurité chute";
    classe_min=null;
    detail=`Allège ${allege_m.toFixed(2)}m ≥ 1m — pas de risque de chute`;
  } else if(el.allege_opaque){
    exigence="Allège opaque — garde-corps assuré par le remplissage";
    classe_min="1B1 (panneau)";
    detail="Vérifier résistance choc du panneau d'allège (NF P08-302)";
  } else {
    exigence="Vitrage faisant garde-corps — feuilleté obligatoire";
    classe_min="1B1 (EN 12600)";
    detail="Face intérieure feuilletée min 44.2 — résistance au choc corps mou 1B1";
  }
  return {allege_m:+allege_m.toFixed(2),protection_requise,exigence,classe_min,detail};
}

// Vérifie si une composition a une face feuilletée suffisante (pour allège)
function compoEstFeuillete(compo){
  if(!compo)return false;
  // Cherche un composant de type "XX.Y" (feuilleté) ex 44.2, 55.2, 66.2
  return /\d\d\.\d/.test(compo)||/\d+\.\d\s*(s|sil|silence)/i.test(compo);
}

const FACADE_TYPES = ['Façade rideau FWS','Façade rideau CW','Façade VEC','Façade VEP','Verrière'];

function getTranche(h){const z=parseFloat(h);if(z<=9)return"H9";if(z<=18)return"H18";if(z<=28)return"H28";if(z<=50)return"H50";return"H100";}
function calcPression(zone,terrain,h){if(!zone||!terrain||!h||parseFloat(h)<=0)return null;return PRESSIONS_DTU39[zone]?.[terrain]?.[getTranche(h)]||null;}

const A3T=[[0.3,0.686],[0.5,1.143],[0.667,1.514],[1.0,2.0],[1.5,2.286],[2.0,2.357],[5.0,2.386]];
const A4T=[[0.0,2.1143],[0.1,2.1143],[0.2,2.1000],[0.3,2.1000],[0.4,1.8714],[0.5,1.6429],[0.6,1.4143],[0.7,1.1857],[0.8,0.9714],[0.9,0.8000],[1.0,0.6571]];
function interp(t,x){if(x<=t[0][0])return t[0][1];if(x>=t[t.length-1][0])return t[t.length-1][1];for(let i=0;i<t.length-1;i++){if(x>=t[i][0]&&x<=t[i+1][0]){const f=(x-t[i][0])/(t[i+1][0]-t[i][0]);return t[i][1]+f*(t[i+1][1]-t[i][1]);}}return t[t.length-1][1];}
function calcDTU39(P,larg,haut,aL,aH,tv,hSol){
  const Lmm=Math.max(larg,haut),lmm=Math.min(larg,haut),L=Lmm/1000,l=lmm/1000,aT=aL+aH,c=parseFloat(hSol)<=6?0.9:1.0;
  let e1;
  if(aT>=4)e1=(L/l)<=2.5?Math.sqrt(L*l*10000*P/10)/100:l*Math.sqrt(P)/6.3;
  else if(aT===3)e1=(L/l)<=7.5?Math.sqrt(L*100*3*l*100*P/10)/100:3*l*Math.sqrt(P)/6.3;
  else e1=L*Math.sqrt(P)/6.3;
  const alpha=aT>=4?interp(A4T,l/L):aT===3?interp(A3T,L/l):2.1143;
  const bmm=aT>=4?lmm:Lmm,b=bmm/1000;
  // Critère de flèche (Art. 9.2) : vitrage appuyé sur tout son pourtour (aT>=4) → 1/60
  // du petit côté, plafonné à 30mm. Vitrage à bord libre (aT<4) → 1/100 (simple) ou
  // 1/150 (double/isolant) du bord libre, plafonné à 50mm.
  let fMax;
  if(aT>=4) fMax=Math.min(bmm/60,30);
  else fMax=Math.min(bmm/(tv==="simple_lamine"?100:150),50);
  // e_F requis (Art.9, formule 29 réarrangée) — SANS coefficient ε : c'est la valeur
  // physique pure demandée par la pression/déflection, à comparer à l'eF RÉEL de la
  // composition (calcEquivalences), et non multipliée par ε comme dans une version précédente.
  // BUG CORRIGÉ (présent depuis la 1ère version) : b est en mètres et fMax déjà en mm,
  // exactement comme pour e1 (coefficient 6.3 sans conversion supplémentaire) — le
  // coefficient 1,5 et les valeurs α (qui intègrent déjà E=70GPa, cf. Annexe D du DTU)
  // ne nécessitent AUCUNE conversion /1000 ou ×1000 additionnelle. L'ancienne version
  // donnait des résultats ~1000× trop grands (ex. 52 000 mm au lieu de 5,2 mm).
  const eF_requis=Math.pow((alpha*P*Math.pow(b,4))/(1.5*fMax),1/3);
  const eRequired=Math.max(e1*c,eF_requis);
  return{e1:+e1.toFixed(2),eF_requis:+eF_requis.toFixed(2),eRequired:+eRequired.toFixed(2),alpha:+alpha.toFixed(4),c,flecheMax:+fMax.toFixed(1),aT};
}

// ── COEFFICIENTS D'ÉQUIVALENCE OFFICIELS — NF DTU 39 P4, Quadros 7/8/9 ─────
// Validés à l'identique contre les 11 exemples chiffrés du document (Art. 8 et 9).
const EPS1_ISOLANT = {2:1.6, 3:2.0}; // Quadro 7 : double=1.6, triple=2.0 (nb panneaux)
const EPS2_LAMINE = {2:1.3, 3:1.5, 4:1.6}; // Quadro 8 : nb composants verre du feuilleté
const EPS3_TYPES = { // Quadro 9 (types les plus courants en menuiserie/façade)
  recuit:{label:"Recuit standard (float)",eps3:1.0},
  durci:{label:"Durci (heat-strengthened)",eps3:0.8},
  trempe:{label:"Trempé (sécurité)",eps3:0.61},
  arme:{label:"Armé (fil)",eps3:1.3},
};
function eps2Lamine(n){return EPS2_LAMINE[n]||EPS2_LAMINE[Math.min(n,4)];}

// ── ANALYSE COMPOSITION VITRAGE — épaisseur réelle + poids ─────────────────
// Densité verre = 2.5 kg/m²/mm. PVB ~ négligeable en poids mais ajoute épaisseur.
// Formats gérés : "44.2", "44.2s", "44.2 sil", "10/16/44.2", "86.2/24/44.2 sil",
//                 "4/20/4", "10/12/66.2", "55.2s/20/44.2s", "BR5-NS-57mm"
function parseGlassPart(part){
  // Retourne {epaisseur_mm, poids_kg_m2, components:[...ep monolithiques]} pour un composant (mono ou feuilleté)
  part=part.trim().toLowerCase().replace(/\s*(sil|silence|s)\s*$/,"").trim();
  // Feuilleté type "44.2" = 2 verres de 4mm + 2 films PVB (0.38mm chacun → .2 = 2 films)
  const lamMatch=part.match(/^(\d)(\d)\.(\d)$/); // ex 44.2 → 4,4,2
  if(lamMatch){
    const v1=parseInt(lamMatch[1]),v2=parseInt(lamMatch[2]),films=parseInt(lamMatch[3]);
    const ep=v1+v2+films*0.38;
    const poids=(v1+v2)*2.5; // PVB densité ~1.05 négligé
    return {ep:+ep.toFixed(2),poids:+poids.toFixed(1),components:[v1,v2]};
  }
  // Monolithique simple "4","6","8","10","12"
  const mono=part.match(/^(\d{1,2})$/);
  if(mono){
    const e=parseInt(mono[1]);
    return {ep:e,poids:+(e*2.5).toFixed(1),components:[e]};
  }
  // Triple feuilleté "664.2" ou compositions exotiques
  const multiLam=part.match(/^(\d+)\.(\d)$/);
  if(multiLam){
    const verres=multiLam[1].split('').map(Number);
    const films=parseInt(multiLam[2]);
    const epVerres=verres.reduce((a,b)=>a+b,0);
    const ep=epVerres+films*0.38;
    return {ep:+ep.toFixed(2),poids:+(epVerres*2.5).toFixed(1),components:verres};
  }
  return null;
}

function analyseComposition(compo){
  // Sépare les composants par "/" : verre / lame d'air / verre [/ lame / verre]
  // Lame d'air = nombre seul entre deux verres ET généralement 12,16,18,20,24
  if(!compo||typeof compo!=="string")return null;
  // Nettoyer mentions BR/NS (pare-balle) non parsables
  if(/br\d|ns|^\d+\s*mm/i.test(compo))return null;
  const parts=compo.split('/').map(p=>p.trim()).filter(Boolean);
  if(parts.length<1)return null;

  let epTotal=0,poidsTotal=0,nbVerres=0,lames=[],panes=[];
  parts.forEach((part,i)=>{
    // Une lame d'air = un nombre seul de 6 à 24 situé en position paire (entre verres)
    const isGap=/^\d{1,2}$/.test(part.replace(/\s/g,'')) && parseInt(part)>=6 && parseInt(part)<=24 && i%2===1 && parts.length>1;
    if(isGap){
      const g=parseInt(part);
      epTotal+=g;
      lames.push(g);
    } else {
      const r=parseGlassPart(part);
      if(r){epTotal+=r.ep;poidsTotal+=r.poids;nbVerres++;panes.push({components:r.components});}
    }
  });
  if(nbVerres===0)return null;
  return {
    epaisseur_totale:+epTotal.toFixed(1),
    poids_m2:+poidsTotal.toFixed(1),
    nb_verres:nbVerres,
    lames_air:lames,
    panes,
    type:lames.length>0?(nbVerres>=3?"Triple vitrage":"Double vitrage"):"Vitrage simple"
  };
}

// ── ÉQUIVALENCES RÉSISTANCE (Art.8) & FLÈCHE (Art.9) — NF DTU 39 P4 ────────
// Calculées à partir de la composition RÉELLE (panes), validées à l'identique
// contre les 11 exemples chiffrés officiels du document (écart nul).
// verre_type_eps3 : coefficient ε3 du type de verre (uniforme sur la composition —
// simplification si la composition mélange plusieurs types de verre différents).
function calcEquivalences(panes, eps3){
  eps3=eps3||1.0;
  const n=panes.length;
  if(n===0)return null;
  if(n===1){
    const p=panes[0];
    if(p.components.length===1){
      // Monolithique simple : eR = e/ε3 ; eF = e
      return {eR:+(p.components[0]/eps3).toFixed(2), eF:+p.components[0].toFixed(2)};
    }
    // Feuilleté simple : eR = Σe/(0.9×ε2×ε3) ; eF = Σe/ε2
    const somme=p.components.reduce((a,b)=>a+b,0);
    const eps2=eps2Lamine(p.components.length);
    return {eR:+(somme/(0.9*eps2*eps3)).toFixed(2), eF:+(somme/eps2).toFixed(2)};
  }
  // Vitrage isolant (double ou triple) : chaque panneau contribue sa propre
  // équivalence (directe si monolithique, /(0.9×ε2) ou /ε2 si feuilleté),
  // le tout divisé par ε1(nb panneaux)×0.9×ε3 (résistance) ou ε1 seul (flèche).
  const eps1=EPS1_ISOLANT[n]||EPS1_ISOLANT[3];
  let sumR=0,sumF=0;
  for(const p of panes){
    if(p.components.length===1){
      sumR+=p.components[0]; sumF+=p.components[0];
    } else {
      const somme=p.components.reduce((a,b)=>a+b,0);
      const eps2=eps2Lamine(p.components.length);
      sumR+=somme/(0.9*eps2); sumF+=somme/eps2;
    }
  }
  return {eR:+(sumR/(eps1*0.9*eps3)).toFixed(2), eF:+(sumF/eps1).toFixed(2)};
}

// Vérifie poids du vantail vs capacité ferrure + épaisseur vs feuillure
function verifVitrage(compo,largeur_mm,hauteur_mm,sys,el,projet){
  const a=analyseComposition(compo);
  if(!a)return null;
  const isFacade=el&&el.type==="facade";
  let surf, poids_unitaire, base_label, poids_max_ref, poids_ok, poids_decoupage=null, nb_vantaux=1;
  let panel_L_mm=largeur_mm, panel_H_mm=hauteur_mm; // dimensions du panneau réel (redéfinies pour façade ci-dessous)

  if(isFacade){
    if(el.mode_trame==="personnalisee"&&Array.isArray(el.panneaux)&&el.panneaux.length>0){
      // Mode panneaux personnalisés : on vérifie le poids sur le panneau le PLUS
      // GRAND (le plus défavorable), pas sur une trame régulière supposée.
      let pire=null,pireSurf=-1;
      el.panneaux.forEach(p=>{
        const l=(+p.largeur||0)/1000,h=(+p.hauteur||0)/1000,s=l*h;
        if(s>pireSurf){pireSurf=s;pire={l,h,label:p.label||""};}
      });
      if(pire){
        panel_L_mm=+(pire.l*1000).toFixed(0); panel_H_mm=+(pire.h*1000).toFixed(0);
        surf=+(pire.l*pire.h).toFixed(2);
        poids_unitaire=+(a.poids_m2*surf).toFixed(1);
        base_label=`panneau le plus grand ${panel_L_mm}×${panel_H_mm}mm${pire.label?" ("+pire.label+")":""}`;
        poids_max_ref=sys?sys.poids_max:null;
        poids_ok=poids_max_ref?poids_unitaire<=poids_max_ref:null;
      }
    } else {
    // Façade : on raisonne par PANNEAU de trame, pas sur la surface totale.
    // Largeur panneau = entraxe de trame ; hauteur panneau = hauteur d'étage / nb niveaux,
    // approximée par une hauteur de panneau courante (vitrage entre 2 traverses).
    const trame_m=(+el.trame||1350)/1000;
    const H_m=(hauteur_mm/1000);
    // Hauteur de panneau : explicite si renseignée, sinon estimée par nb de niveaux probable.
    let haut_panneau;
    if(+el.haut_panneau>0){
      haut_panneau=(+el.haut_panneau)/1000;
    } else {
      const nb_niveaux=Math.max(1,Math.ceil(H_m/2.2));
      haut_panneau=H_m/nb_niveaux;
    }
    panel_L_mm=+(trame_m*1000).toFixed(0); panel_H_mm=+(haut_panneau*1000).toFixed(0);
    surf=+(trame_m*haut_panneau).toFixed(2);
    poids_unitaire=+(a.poids_m2*surf).toFixed(1);
    base_label=`panneau ${trame_m.toFixed(2)}×${haut_panneau.toFixed(2)}m${+el.haut_panneau>0?"":" (est.)"}`;
    // Pour une façade, la limite n'est pas la ferrure d'ouvrant mais la reprise
    // par traverse/vérins. On retient une capacité de reprise par panneau (≈ poids_max système
    // qui pour une façade représente la charge admissible par appui vitrage).
    poids_max_ref=sys?sys.poids_max:null;
    poids_ok=poids_max_ref?poids_unitaire<=poids_max_ref:null;
    }
  } else {
    // Châssis / ouvrant : poids par VANTAIL RÉEL (ou par CARREAU si grille fixe).
    const L_m=largeur_mm/1000, H_m=hauteur_mm/1000;
    const nb_montants=Math.max(0,+el.nb_montants||0), nb_traverses=Math.max(0,+el.nb_traverses||0);

    if(el.soustype==="Fenêtre fixe"&&(nb_montants>0||nb_traverses>0)){
      // Châssis fixe divisé en grille de carreaux (montants/traverses) — comme une
      // mini-façade : on vérifie le poids/résistance/flèche sur le CARREAU le plus
      // grand, pas sur le châssis entier (aucun vantail ici, tout est fixe).
      const largCarreau=L_m/(nb_montants+1), hautCarreau=H_m/(nb_traverses+1);
      panel_L_mm=+(largCarreau*1000).toFixed(0); panel_H_mm=+(hautCarreau*1000).toFixed(0);
      surf=+(largCarreau*hautCarreau).toFixed(2);
      poids_unitaire=+(a.poids_m2*surf).toFixed(1);
      base_label=`carreau ${panel_L_mm}×${panel_H_mm}mm (grille ${nb_montants+1}×${nb_traverses+1})`;
      nb_vantaux=0; // tout est fixe, pas de vantail
      poids_max_ref=sys?sys.poids_max:null;
      poids_ok=poids_max_ref?poids_unitaire<=poids_max_ref:null;
    } else {
    // L'utilisateur peut préciser la composition (nb vantaux + largeur fixe éventuelle).
    // Sinon, calcul sur 1 vantail occupant toute la dimension.
    // Nombre de vantaux : valeur saisie par l'utilisateur en priorité ; sinon valeur
    // par défaut du système catalogue ; sinon selon le TYPE D'ÉLÉMENT réellement
    // configuré par l'utilisateur (el.soustype : "Porte-fenêtre"/"Coulissant" → 2 vantaux),
    // et seulement à défaut la famille catalogue du système (qui reste souvent générique,
    // ex. "Fenêtre" même pour un profil utilisable en porte-fenêtre — ne pas s'y fier seule).
    const soustype=(el&&el.soustype)||"";
    const famille=(sys&&sys.famille)||"";
    const defautSoustype=/coulissant|porte-?fen/i.test(soustype)?2:/fen[êe]tre|porte\b/i.test(soustype)?1:null;
    const defautFamille=/coulissant|porte-?fen/i.test(famille)?2:1;
    const nb_vantaux_calc=Math.max(1,+el.nb_vantaux||(sys&&sys.vantaux_defaut)||defautSoustype||defautFamille);
    nb_vantaux=nb_vantaux_calc;
    const larg_fixe_mm=+el.larg_fixe||0; // largeur de la partie fixe (mm)
    const larg_fixe_m=larg_fixe_mm/1000;
    // Largeur disponible pour les ouvrants = largeur totale - fixe
    const larg_ouvrants_m=Math.max(0,L_m-larg_fixe_m);
    const larg_vantail=larg_ouvrants_m/nb_vantaux;
    panel_L_mm=+(larg_vantail*1000).toFixed(0); panel_H_mm=hauteur_mm;
    surf=+(larg_vantail*H_m).toFixed(2);
    poids_unitaire=+(a.poids_m2*surf).toFixed(1);
    base_label=nb_vantaux>1||larg_fixe_mm>0
      ? `vantail ${(larg_vantail*1000).toFixed(0)}×${hauteur_mm}mm (${nb_vantaux} vtx${larg_fixe_mm>0?" + fixe "+larg_fixe_mm+"mm":""})`
      : `vantail ${largeur_mm}×${hauteur_mm}mm`;
    poids_max_ref=sys?sys.poids_max:null;
    poids_ok=poids_max_ref?poids_unitaire<=poids_max_ref:null;

    // Si ça ne passe pas, calculer les découpages possibles
    if(poids_ok===false&&poids_max_ref){
      const options=[];
      // Essayer 2, 3, 4 vantaux égaux
      for(let n=2;n<=4;n++){
        const lv=L_m/n;
        const p=+(a.poids_m2*lv*H_m).toFixed(0);
        if(p<=poids_max_ref)options.push({label:`${n} vantaux égaux`,detail:`${(lv*1000).toFixed(0)}×${hauteur_mm}mm chacun`,poids:p});
      }
      // Essayer fixe central + 2 ouvrants latéraux (fixe = 40% largeur)
      for(const ratioFixe of [0.4,0.5,0.34]){
        const lo=(L_m*(1-ratioFixe))/2;
        const p=+(a.poids_m2*lo*H_m).toFixed(0);
        if(p<=poids_max_ref){options.push({label:`Fixe central + 2 ouvrants`,detail:`fixe ${(L_m*ratioFixe*1000).toFixed(0)}mm + 2 ouvrants ${(lo*1000).toFixed(0)}×${hauteur_mm}mm`,poids:p});break;}
      }
      // Imposte fixe haute + ouvrant bas (réduit la hauteur)
      for(const hImp of [0.4,0.6,0.8]){
        const ho=H_m-hImp;
        if(ho<=0)continue;
        const p=+(a.poids_m2*L_m*ho).toFixed(0);
        if(p<=poids_max_ref){options.push({label:`Imposte fixe haute + ouvrant`,detail:`imposte ${(hImp*1000).toFixed(0)}mm + ouvrant ${largeur_mm}×${(ho*1000).toFixed(0)}mm`,poids:p});break;}
      }
      poids_decoupage=options;
    }
    }
  }

  const feuillure_ok=sys?(a.epaisseur_totale>=sys.epaisseur_min&&a.epaisseur_totale<=sys.epaisseur_max):null;

  // ── Vérification résistance & flèche du vitrage — NF DTU 39 P4 Art.7-9 ──
  // Comparaison de la composition RÉELLE (via calcEquivalences) aux exigences
  // physiques pures (e1×c pour la résistance, eF_requis pour la flèche).
  let resistance_ok=null, fleche_verre_ok=null, eR_reel=null, eF_reel=null, dtu_verre=null;
  if(projet){
    const pression=projet.pression_pa||calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
    if(pression&&a.panes&&a.panes.length>0){
      const eps3=EPS3_TYPES[projet.type_verre]?EPS3_TYPES[projet.type_verre].eps3:1.0;
      const equiv=calcEquivalences(a.panes,eps3);
      // aL/aH=2/2 : hypothèse châssis/façade appuyé sur tout le pourtour (cas standard
      // fenêtre/façade en feuillure) — cas par défaut de l'outil, cohérent avec le calcul
      // affiché en étape 2 (calcul vent).
      // Pour une façade, la résistance/flèche du verre se vérifie sur la dimension
      // RÉELLE du panneau (entraxe trame × hauteur panneau), pas sur la façade entière —
      // chaque case de trame est un vitrage indépendant posé sur les meneaux/traverses.
      // En mode "panneaux personnalisés", le panneau le plus lourd (poids) n'est pas
      // forcément celui qui exige le plus de résistance au vent (ça dépend du rapport
      // largeur/hauteur, pas seulement de la surface) — on teste donc TOUS les panneaux
      // et on retient le cas le plus défavorable pour la résistance/flèche.
      if(isFacade&&el.mode_trame==="personnalisee"&&Array.isArray(el.panneaux)&&el.panneaux.length>0){
        let pireDtu=null,pireReq=-1,pirePanneau=null;
        el.panneaux.forEach(p=>{
          const pl=+p.largeur||0, ph=+p.hauteur||0;
          if(!pl||!ph)return;
          const d=calcDTU39(pression,pl,ph,2,2,projet.type_vitrage,+projet.hauteur_sol||3);
          const req=d.e1*d.c;
          if(req>pireReq){pireReq=req;pireDtu=d;pirePanneau=p;}
        });
        dtu_verre=pireDtu;
        if(pirePanneau)base_label=`pire cas : panneau ${pirePanneau.largeur}×${pirePanneau.hauteur}mm${pirePanneau.label?" ("+pirePanneau.label+")":""}`;
      } else {
        dtu_verre=calcDTU39(pression,panel_L_mm,panel_H_mm,2,2,projet.type_vitrage,+projet.hauteur_sol||3);
      }
      eR_reel=equiv.eR; eF_reel=equiv.eF;
      resistance_ok=eR_reel>=(dtu_verre.e1*dtu_verre.c);
      fleche_verre_ok=eF_reel>=dtu_verre.eF_requis;
    }
  }

  return {
    ...a,
    isFacade,
    surface:surf,
    base_label,
    poids_vantail:poids_unitaire,
    poids_max:poids_max_ref,
    poids_ok,
    poids_decoupage,
    resistance_ok, fleche_verre_ok, eR_reel, eF_reel, dtu_verre,
    nb_vantaux:isFacade?null:nb_vantaux,
    feuillure_min:sys?sys.epaisseur_min:null,
    feuillure_max:sys?sys.epaisseur_max:null,
    feuillure_ok,
  };
}

// ── GESTION DES PROJETS (sauvegarde / chargement) ──────────────────────────
function getProjets(){try{const r=localStorage.getItem("glassiq_v2_projets");return r?JSON.parse(r):[];}catch{return [];}}
function saveProjets(list){try{localStorage.setItem("glassiq_v2_projets",JSON.stringify(list));return true;}catch{return false;}}
function uid(){return "P"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function sauverProjet(projet){
  const list=getProjets();
  const now=new Date().toISOString();
  let p={...projet};
  if(!p._pid){p._pid=uid();p._cree=now;}
  p._maj=now;
  const idx=list.findIndex(x=>x._pid===p._pid);
  if(idx>=0)list[idx]=p; else list.push(p);
  saveProjets(list);
  return p;
}
function supprimerProjet(pid){
  const list=getProjets().filter(x=>x._pid!==pid);
  saveProjets(list);
  return list;
}
function dupliquerProjet(pid){
  const list=getProjets();
  const src=list.find(x=>x._pid===pid);
  if(!src)return list;
  const copie={...JSON.parse(JSON.stringify(src)),_pid:uid(),_cree:new Date().toISOString(),_maj:new Date().toISOString(),nom:(src.nom||"Projet")+" (copie)"};
  list.push(copie);
  saveProjets(list);
  return list;
}

  const C={green:{bg:"#d1fae5",tx:"#065f46",bd:"#6ee7b7"},amber:{bg:"#fef3c7",tx:"#92400e",bd:"#fcd34d"},red:{bg:"#fee2e2",tx:"#991b1b",bd:"#fca5a5"},blue:{bg:"#dbeafe",tx:"#1e40af",bd:"#93c5fd"},purple:{bg:"#ede9fe",tx:"#5b21b6",bd:"#c4b5fd"},teal:{bg:"#ccfbf1",tx:"#0f766e",bd:"#5eead4"},gray:{bg:"#f3f4f6",tx:"#374151",bd:"#d1d5db"}};
  const c=C[color]||C.gray;

}

        <div><div style={{fontSize:14,fontWeight:700,color:"#1a1a2e"}}>Éléments de façade — châssis & façades rideau</div><div style={{fontSize:12,color:"#6b7280"}}>La vérification vent s'adapte automatiquement selon le type</div></div>

          <div style={{display:"grid",gridTemplateColumns:"1fr auto 80px 28px",gap:10,alignItems:"end",marginBottom:10}}>

              <button onClick={()=>setType(i,"chassis")} style={{padding:"7px 12px",borderRadius:7,fontSize:12,fontWeight:600,cursor:"pointer",border:"1.5px solid",background:!iF?"#ccfbf1":"#f9fafb",color:!iF?"#0f766e":"#6b7280",borderColor:!iF?"#5eead4":"#e5e7eb"}}>🪟 Châssis</button>
            </div>
            <div><label style={{...S.label,fontSize:10}}>RA,tr requis (dB)</label><input type="number" value={el.ratr} min="25" max="55" onChange={e=>updEl(i,"ratr",e.target.value)} style={{...S.input,fontWeight:700,textAlign:"center"}}/></div>

            <div><label style={{...S.label,fontSize:10}}>Usage</label><select value={el.usage} onChange={e=>updEl(i,"usage",e.target.value)} style={S.input}>{USAGES.map(u=><option key={u}>{u}</option>)}</select></div>
            <div><label style={{...S.label,fontSize:10}}>Type {iF?"façade":"châssis"}</label><select value={el.soustype} onChange={e=>updEl(i,"soustype",e.target.value)} style={S.input}>{sT.map(s=><option key={s}>{s}</option>)}</select></div>
            <div><label style={{...S.label,fontSize:10}}>L × H (mm)</label><div style={{display:"flex",gap:4}}><input type="number" value={el.largeur} placeholder="L" onChange={e=>updEl(i,"largeur",e.target.value)} style={{...S.input,width:"50%"}}/><input type="number" value={el.hauteur} placeholder="H" onChange={e=>updEl(i,"hauteur",e.target.value)} style={{...S.input,width:"50%"}}/></div></div>
          </div>
          {/* Trame façade — uniquement pour les façades rideau */}
          {iF&&(()=>{
            const af=analyseFacade(el);
            return <div style={{marginTop:8,padding:"10px 12px",background:"#f5f3ff",borderRadius:8,border:"1px solid #ddd6fe"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#5b21b6",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>🏢 Composition de la façade</div>
              <div style={{display:"flex",gap:8,marginBottom:10}}>
                <button onClick={()=>updEl(i,"mode_trame","reguliere")} style={{padding:"6px 14px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer",border:el.mode_trame!=="personnalisee"?"2px solid #7c3aed":"1px solid #d1d5db",background:el.mode_trame!=="personnalisee"?"#ede9fe":"#fff",color:el.mode_trame!=="personnalisee"?"#5b21b6":"#6b7280"}}>Trame régulière</button>
                <button onClick={()=>updEl(i,"mode_trame","personnalisee")} style={{padding:"6px 14px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer",border:el.mode_trame==="personnalisee"?"2px solid #7c3aed":"1px solid #d1d5db",background:el.mode_trame==="personnalisee"?"#ede9fe":"#fff",color:el.mode_trame==="personnalisee"?"#5b21b6":"#6b7280"}}>Panneaux personnalisés</button>
              </div>
              {el.mode_trame==="personnalisee"?(()=>{
                const panneaux=el.panneaux||[];
                const updPanneau=(idx,champ,val)=>{const arr=panneaux.map((p,pi)=>pi===idx?{...p,[champ]:val}:p);updEl(i,"panneaux",arr);};
                const addPanneau=()=>updEl(i,"panneaux",[...panneaux,{largeur:"",hauteur:"",type:"fixe",qte:"1",label:""}]);
                const delPanneau=(idx)=>updEl(i,"panneaux",panneaux.filter((_,pi)=>pi!==idx));
                // Génère une grille régulière de panneaux à partir des comptages TOTAUX
                // (montants et traverses, RIVES INCLUSES) : 4 montants → 3 travées ;
                // 9 traverses réparties sur 3 travées → 3 par travée → 2 rangées → 6 zones.
                const genererGrille=()=>{
                  const nm=+el.nb_montants||0, nt=+el.nb_traverses_total||0;
                  const L=+el.largeur||0, H=+el.hauteur||0;
                  if(nm<2||!L||!H)return;
                  const travees=nm-1;
                  const travPerTravee=travees>0?nt/travees:0;
                  const rangees=Math.max(1,Math.round(travPerTravee)-1);
                  const largP=Math.round(L/travees), hautP=Math.round(H/rangees);
                  updEl(i,"panneaux",[{largeur:String(largP),hauteur:String(hautP),type:"fixe",qte:String(travees*rangees),label:"grille auto"}]);
                };
                return <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:8}}>Liste chaque panneau réel (dimensions différentes possibles) — porte, fixes de tailles variées, etc. La résistance/flèche sera vérifiée sur le panneau le plus défavorable.</div>
                  {/* CONCEPTEUR DE TRAME — flux simple : nb de trames en largeur et en
                      hauteur, puis dimensions de chaque colonne/rangée, puis type de
                      chaque case en cliquant sur le dessin (fixe → ouvrant → porte). */}
                  {(()=>{
                    const L=+el.largeur||0, H=+el.hauteur||0;
                    if(!L||!H)return null;
                    const nCols=Math.max(0,Math.min(30,+el.grid_cols||0));
                    const nRows=Math.max(0,Math.min(20,+el.grid_rows||0));
                    const widths=(el.grid_widths&&el.grid_widths.length===nCols)?el.grid_widths:Array(nCols).fill(nCols>0?String(Math.round(L/nCols)):"");
                    const heights=(el.grid_heights&&el.grid_heights.length===nRows)?el.grid_heights:Array(nRows).fill(nRows>0?String(Math.round(H/nRows)):"");
                    const types=el.grid_types||{};
                    const setCols=(v)=>{const n=Math.max(0,Math.min(30,+v||0));updEl(i,"grid_cols",v);updEl(i,"grid_widths",Array(n).fill(n>0?String(Math.round(L/n)):""));};
                    const setRows=(v)=>{const n=Math.max(0,Math.min(20,+v||0));updEl(i,"grid_rows",v);updEl(i,"grid_heights",Array(n).fill(n>0?String(Math.round(H/n)):""));};
                    const setW=(ci,v)=>{const arr=widths.slice();arr[ci]=v;updEl(i,"grid_widths",arr);};
                    const setHt=(ri,v)=>{const arr=heights.slice();arr[ri]=v;updEl(i,"grid_heights",arr);};
                    const cycleType=(ci,ri)=>{const k=ci+"-"+ri;const cur=types[k]||"fixe";const next=cur==="fixe"?"ouvrant":cur==="ouvrant"?"porte":"fixe";updEl(i,"grid_types",{...types,[k]:next});};
                    const sumW=widths.reduce((a,b)=>a+(+b||0),0);
                    const sumH2=heights.reduce((a,b)=>a+(+b||0),0);
                    const okW=nCols>0&&Math.abs(sumW-L)<=5;
                    const okH2=nRows>0&&Math.abs(sumH2-H)<=5;
                    const genOk=okW&&okH2;
                    const FILL={fixe:"#dbeafe",ouvrant:"#d1fae5",porte:"#fed7aa"};
                    const Wsvg=460, scale=Wsvg/Math.max(sumW||L,1), Hpx=Math.max(60,(sumH2||H)*scale)+4;
                    let xs=[0];widths.forEach(w=>xs.push(xs[xs.length-1]+(+w||0)));
                    let ys=[0];heights.forEach(h=>ys.push(ys[ys.length-1]+(+h||0)));
                    const generer=()=>{
                      const groupes={};
                      for(let ci=0;ci<nCols;ci++)for(let ri=0;ri<nRows;ri++){
                        const t=types[ci+"-"+ri]||"fixe";
                        const key=Math.round(+widths[ci]||0)+"x"+Math.round(+heights[ri]||0)+"_"+t;
                        groupes[key]=(groupes[key]||0)+1;
                      }
                      updEl(i,"nb_montants",String(nCols+1));
                      updEl(i,"nb_traverses_total",String(nCols*(nRows+1)));
                      updEl(i,"panneaux",Object.entries(groupes).map(([k,q])=>{
                        const kk=k.split("_");
                        const parts=kk[0].split("x");
                        return {largeur:parts[0],hauteur:parts[1],type:kk[1],qte:String(q),label:"grille"};
                      }));
                    };
                    return <div style={{marginBottom:8,padding:"10px 12px",background:"#fff",borderRadius:8,border:"1px solid #ddd6fe"}}>
                      <div style={{fontSize:10,fontWeight:700,color:"#5b21b6",marginBottom:8}}>📐 CONCEPTEUR DE TRAME</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}}>
                        <div><label style={{...S.label,fontSize:9}}>Trames en LARGEUR (colonnes)</label><input type="number" min="1" max="30" value={el.grid_cols||""} placeholder="ex : 3" onChange={e=>setCols(e.target.value)} style={S.input}/></div>
                        <div><label style={{...S.label,fontSize:9}}>Trames en HAUTEUR (rangées)</label><input type="number" min="1" max="20" value={el.grid_rows||""} placeholder="ex : 2" onChange={e=>setRows(e.target.value)} style={S.input}/></div>
                      </div>
                      {nCols>0&&<div style={{marginBottom:6}}>
                        <label style={{...S.label,fontSize:9}}>Largeur de chaque colonne (mm, gauche→droite)</label>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{widths.map((w,ci)=><input key={ci} type="number" value={w} onChange={e=>setW(ci,e.target.value)} style={{...S.input,width:78}}/>)}</div>
                      </div>}
                      {nRows>0&&<div style={{marginBottom:6}}>
                        <label style={{...S.label,fontSize:9}}>Hauteur de chaque rangée (mm, haut→bas)</label>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{heights.map((h,ri)=><input key={ri} type="number" value={h} onChange={e=>setHt(ri,e.target.value)} style={{...S.input,width:78}}/>)}</div>
                      </div>}
                      {(nCols>0||nRows>0)&&<div style={{fontSize:10,marginBottom:6}}>
                        <span style={{color:okW?"#059669":"#991b1b",fontWeight:600}}>Σ largeurs {Math.round(sumW)} / {L} mm {okW?"✓":"✗"}</span>
                        <span style={{margin:"0 10px",color:"#d1d5db"}}>|</span>
                        <span style={{color:okH2?"#059669":"#991b1b",fontWeight:600}}>Σ hauteurs {Math.round(sumH2)} / {H} mm {okH2?"✓":"✗"}</span>
                        <span style={{marginLeft:10,color:"#6b7280"}}>{nCols*nRows} zones</span>
                      </div>}
                      {nCols>0&&nRows>0&&<div>
                        <div style={{fontSize:10,color:"#6b7280",marginBottom:4}}>👆 Clique sur une case du dessin pour changer son type : <span style={{background:"#dbeafe",padding:"1px 8px",borderRadius:4,border:"1px solid #93c5fd"}}>fixe</span> → <span style={{background:"#d1fae5",padding:"1px 8px",borderRadius:4,border:"1px solid #6ee7b7"}}>ouvrant</span> → <span style={{background:"#fed7aa",padding:"1px 8px",borderRadius:4,border:"1px solid #fdba74"}}>porte</span></div>
                        <svg viewBox={"0 0 "+Wsvg+" "+Hpx} style={{width:"100%",maxWidth:Wsvg,display:"block",border:"1px solid #e5e7eb",borderRadius:6,background:"#f8fafc"}}>
                          {Array.from({length:nCols}).map((_,ci)=>Array.from({length:nRows}).map((_,ri)=>{
                            const t=types[ci+"-"+ri]||"fixe";
                            const w=(+widths[ci]||0)*scale, h=(+heights[ri]||0)*scale;
                            return <g key={ci+"-"+ri} onClick={()=>cycleType(ci,ri)} style={{cursor:"pointer"}}>
                              <rect x={xs[ci]*scale+1.5} y={ys[ri]*scale+1.5} width={Math.max(2,w-3)} height={Math.max(2,h-3)} fill={FILL[t]} stroke="#5b21b6" strokeWidth="1.4"/>
                              {w>56&&h>26&&<text x={xs[ci]*scale+w/2} y={ys[ri]*scale+h/2-5} textAnchor="middle" fontSize="10" fill="#1e3a8a" fontFamily="monospace">{Math.round(+widths[ci]||0)}×{Math.round(+heights[ri]||0)}</text>}
                              {w>56&&h>26&&<text x={xs[ci]*scale+w/2} y={ys[ri]*scale+h/2+8} textAnchor="middle" fontSize="9" fill="#374151">{t}</text>}
                            </g>;
                          }))}
                        </svg>
                        <button onClick={generer} disabled={!genOk} style={{...S.btnSecondary,fontSize:11,padding:"6px 12px",marginTop:8,opacity:!genOk?0.5:1,cursor:!genOk?"not-allowed":"pointer"}}>✓ Valider → générer les panneaux</button>
                        {!genOk&&<div style={{fontSize:10,color:"#991b1b",marginTop:4}}>Ajuste les largeurs/hauteurs pour totaliser {L} × {H} mm.</div>}
                      </div>}
                    </div>;
                  })()}
                  {panneaux.length===0&&<div style={{padding:"8px 12px",background:"#fff1f2",border:"1px solid #fca5a5",borderRadius:8,fontSize:11,color:"#991b1b",marginBottom:8}}>
                    ⚠ Aucun panneau saisi — tant que la liste est vide, le récap ci-dessous est calculé en <strong>trame régulière par défaut (1350mm)</strong>, qui ne correspond PAS à ta saisie. Utilise "⚡ Générer la grille" ou ajoute les panneaux manuellement.
                  </div>}
                  {panneaux.map((p,pi)=>(
                    <div key={pi} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr auto",gap:6,marginBottom:6,alignItems:"end"}}>
                      <div><label style={{...S.label,fontSize:9}}>Largeur (mm)</label><input type="number" value={p.largeur} onChange={e=>updPanneau(pi,"largeur",e.target.value)} style={S.input}/></div>
                      <div><label style={{...S.label,fontSize:9}}>Hauteur (mm)</label><input type="number" value={p.hauteur} onChange={e=>updPanneau(pi,"hauteur",e.target.value)} style={S.input}/></div>
                      <div><label style={{...S.label,fontSize:9}}>Type</label><select value={p.type} onChange={e=>updPanneau(pi,"type",e.target.value)} style={S.input}><option value="fixe">Fixe</option><option value="porte">Porte</option><option value="ouvrant">Ouvrant</option></select></div>
                      <div><label style={{...S.label,fontSize:9}}>Qté</label><input type="number" min="1" value={p.qte} onChange={e=>updPanneau(pi,"qte",e.target.value)} style={S.input}/></div>
                      <div><label style={{...S.label,fontSize:9}}>Repère</label><input type="text" value={p.label||""} placeholder="ex: porte" onChange={e=>updPanneau(pi,"label",e.target.value)} style={S.input}/></div>
                      <button onClick={()=>delPanneau(pi)} style={{padding:"7px 10px",borderRadius:6,border:"1px solid #fca5a5",background:"#fee2e2",color:"#991b1b",cursor:"pointer",fontSize:12}}>✕</button>
                    </div>
                  ))}
                  <button onClick={addPanneau} style={{...S.btnSecondary,fontSize:11,padding:"6px 12px",marginTop:4}}>＋ Ajouter un panneau</button>
                  {/* Sécurité allège — nécessaire aussi en mode personnalisé (sinon la
                      vérification chute tourne avec allège=0 sans contrôle possible) */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:8}}>
                    <div><label style={{...S.label,fontSize:10}}>Hauteur d'allège (mm)</label><input type="number" value={el.allege_h||""} placeholder="0 si vitré au sol" onChange={e=>updEl(i,"allege_h",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Bas du vitrage / sol fini — pilote la sécurité chute</div></div>
                    <div><label style={{...S.label,fontSize:10}}>Allège opaque ?</label><select value={el.allege_opaque?"oui":"non"} onChange={e=>updEl(i,"allege_opaque",e.target.value==="oui")} style={S.input}><option value="non">Non — vitré bas</option><option value="oui">Oui — panneau opaque</option></select></div>
                  </div>
                </div>;
              })():null}
              {el.mode_trame!=="personnalisee"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10}}>
                <div><label style={{...S.label,fontSize:10}}>Entraxe trame (mm)</label><input type="number" value={el.trame||""} placeholder="1350" onChange={e=>updEl(i,"trame",e.target.value)} style={S.input}/></div>
                <div><label style={{...S.label,fontSize:10}}>Nombre d'ouvrants</label><input type="number" value={el.nb_ouvrants||""} placeholder="6" onChange={e=>updEl(i,"nb_ouvrants",e.target.value)} style={S.input}/></div>
                <div><label style={{...S.label,fontSize:10}}>Type d'ouvrant</label><select value={el.type_ouvrant||"Fenêtre OB"} onChange={e=>updEl(i,"type_ouvrant",e.target.value)} style={S.input}><option>Fenêtre OB</option><option>Fenêtre OF</option><option>Fenêtre italienne</option><option>Porte</option><option>Aucun (tout fixe)</option></select></div>
                <div><label style={{...S.label,fontSize:10}}>Allège opaque ?</label><select value={el.allege_opaque?"oui":"non"} onChange={e=>updEl(i,"allege_opaque",e.target.value==="oui")} style={S.input}><option value="non">Non — vitré jusqu'au sol</option><option value="oui">Oui — panneau opaque</option></select></div>
              </div>}
              {el.mode_trame!=="personnalisee"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:8}}>
                <div><label style={{...S.label,fontSize:10}}>Hauteur d'allège (mm)</label><input type="number" value={el.allege_h||""} placeholder="1050" onChange={e=>updEl(i,"allege_h",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Bas du vitrage / sol fini</div></div>
                <div><label style={{...S.label,fontSize:10}}>Hauteur panneau vitré (mm)</label><input type="number" value={el.haut_panneau||""} placeholder="auto" onChange={e=>updEl(i,"haut_panneau",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Vide = estimation auto · sinon hauteur entre traverses</div></div>
              </div>}
              <label style={{display:"flex",alignItems:"center",gap:6,marginTop:8,fontSize:11,color:"#374151",cursor:"pointer"}}>
                <input type="checkbox" checked={!!el.sans_risque_chute} onChange={e=>updEl(i,"sans_risque_chute",e.target.checked)}/>
                Sans risque de chute (rez-de-chaussée sur terrain naturel, sans vide en contrebas)
              </label>
              <label style={{display:"flex",alignItems:"center",gap:6,marginTop:6,fontSize:11,color:"#374151",cursor:"pointer"}}>
                <input type="checkbox" checked={!!el.rc3_requis} onChange={e=>updEl(i,"rc3_requis",e.target.checked)}/>
                Exigence anti-effraction RC3 (RDC / rez-de-chaussée)
              </label>
              {el.rc3_requis&&<div style={{marginTop:6,padding:"8px 12px",background:"#fef3c7",borderRadius:8,border:"1px solid #fde68a",fontSize:11,color:"#92400e",lineHeight:1.5}}>
                ⚠ Le RC3 sur une façade rideau <strong>n'est pas couvert par le DTA standard</strong> du système — le profilé de base ne change pas, mais il faut des <strong>capots et un serrage renforcés</strong> (généralement vissés plutôt que clipsés) ainsi que des <strong>raidisseurs internes dans les montants et traverses</strong>. Demander au fabricant un <strong>PV d'essai EN 1627-1630 spécifique</strong> pour cette configuration — ce n'est pas une donnée que GlassIQ peut vérifier automatiquement.
              </div>}
              {af&&af.mode==="personnalisee"&&<div style={{marginTop:10,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                {[["Panneaux",af.nb_panneaux_total,`${af.panneaux.length} tailles diff.`],["Vitrage fixe",`${af.surf_vitree_fixe} m²`,`sur ${af.surf_totale} m²`],["Portes/Ouvrants",`${af.surf_ouvrants} m²`,`${af.nb_ouvrants} unités`],["Montants/Traverses",`${el.nb_montants||"?"}/${el.nb_traverses_total||"?"}`,"renseignés (info)"]].map(([l,v,sub])=>(
                  <div key={l} style={{background:"#fff",borderRadius:6,padding:"6px 8px",textAlign:"center",border:"1px solid #ede9fe"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>{v}</div>
                    <div style={{fontSize:9,color:"#6b7280"}}>{l}</div>
                    <div style={{fontSize:9,color:"#9ca3af"}}>{sub}</div>
                  </div>
                ))}
              </div>}
              {af&&af.mode!=="personnalisee"&&<div style={{marginTop:10,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                {[["Meneaux",af.nb_meneaux,`${af.nb_travees} travées`],["Vitrage fixe",`${af.surf_vitree_fixe} m²`,`sur ${af.surf_totale} m²`],["Ouvrants",`${af.surf_ouvrants} m²`,`${af.nb_ouvrants} unités`],["Allège opaque",`${af.surf_allege} m²`,el.allege_opaque?"panneau":"néant"]].map(([l,v,sub])=>(
                  <div key={l} style={{background:"#fff",borderRadius:6,padding:"6px 8px",textAlign:"center",border:"1px solid #ede9fe"}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>{v}</div>
                    <div style={{fontSize:9,color:"#6b7280"}}>{l}</div>
                    <div style={{fontSize:9,color:"#9ca3af"}}>{sub}</div>
                  </div>
                ))}
              </div>}
            </div>;
          })()}
          {/* Composition du châssis + allège */}
          {!iF&&<div style={{marginTop:8,padding:"10px 12px",background:"#ecfdf5",borderRadius:8,border:"1px solid #a7f3d0"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#065f46",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>🪟 Composition du châssis</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10}}>
              <div><label style={{...S.label,fontSize:10}}>Nombre de vantaux</label><select value={el.nb_vantaux||"auto"} onChange={e=>updEl(i,"nb_vantaux",e.target.value==="auto"?"":e.target.value)} style={S.input}><option value="auto">Auto (selon système)</option><option value="1">1 vantail</option><option value="2">2 vantaux</option><option value="3">3 vantaux</option><option value="4">4 vantaux</option></select><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Auto : 2 pour PF/coulissant, 1 sinon</div></div>
              <div><label style={{...S.label,fontSize:10}}>Largeur fixe (mm)</label><input type="number" value={el.larg_fixe||""} placeholder="0" onChange={e=>updEl(i,"larg_fixe",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Si fixe accolé · 0 = aucun</div></div>
              <div><label style={{...S.label,fontSize:10}}>Hauteur d'allège (mm)</label><input type="number" value={el.allege_h||""} placeholder="1000" onChange={e=>updEl(i,"allege_h",e.target.value)} style={S.input}/></div>
              <div><label style={{...S.label,fontSize:10}}>Allège opaque ?</label><select value={el.allege_opaque?"oui":"non"} onChange={e=>updEl(i,"allege_opaque",e.target.value==="oui")} style={S.input}><option value="non">Non — vitré bas</option><option value="oui">Oui — opaque</option></select></div>
            </div>
            <label style={{display:"flex",alignItems:"center",gap:6,marginTop:8,fontSize:11,color:"#374151",cursor:"pointer"}}>
              <input type="checkbox" checked={!!el.sans_risque_chute} onChange={e=>updEl(i,"sans_risque_chute",e.target.checked)}/>
              Sans risque de chute (rez-de-chaussée sur terrain naturel, sans vide en contrebas)
            </label>
            {(+el.nb_vantaux>1||+el.larg_fixe>0)&&(()=>{
              const L_m=(+el.largeur||0)/1000, lf=(+el.larg_fixe||0)/1000, nv=Math.max(1,+el.nb_vantaux||1);
              const lv=Math.max(0,(L_m-lf))/nv*1000;
              return <div style={{marginTop:8,fontSize:11,color:"#065f46"}}>→ Chaque vantail : <strong>{lv.toFixed(0)} × {el.hauteur} mm</strong>{lf>0?` · fixe ${(+el.larg_fixe)} mm`:""}</div>;
            })()}
          </div>}
          {/* Grille de carreaux fixes — pour un châssis entièrement fixe divisé par montants/traverses */}
          {!iF&&el.soustype==="Fenêtre fixe"&&<div style={{marginTop:8,padding:"10px 12px",background:"#eef2ff",borderRadius:8,border:"1px solid #c7d2fe"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#3730a3",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>▦ Grille de carreaux (montants/traverses)</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><label style={{...S.label,fontSize:10}}>Nombre de montants intermédiaires</label><input type="number" min="0" value={el.nb_montants||""} placeholder="0" onChange={e=>updEl(i,"nb_montants",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Divisions verticales · 0 = aucune</div></div>
              <div><label style={{...S.label,fontSize:10}}>Nombre de traverses intermédiaires</label><input type="number" min="0" value={el.nb_traverses||""} placeholder="0" onChange={e=>updEl(i,"nb_traverses",e.target.value)} style={S.input}/><div style={{fontSize:10,color:"#9ca3af",marginTop:2}}>Divisions horizontales · 0 = aucune</div></div>
            </div>
            {(+el.nb_montants>0||+el.nb_traverses>0)&&(()=>{
              const L_m=(+el.largeur||0)/1000, H_m=(+el.hauteur||0)/1000;
              const nm=Math.max(0,+el.nb_montants||0), nt=Math.max(0,+el.nb_traverses||0);
              const largCarreau=L_m/(nm+1), hautCarreau=H_m/(nt+1);
              return <div style={{marginTop:8,fontSize:11,color:"#3730a3"}}>→ Grille {nm+1}×{nt+1} = <strong>{(nm+1)*(nt+1)}</strong> carreaux de <strong>{(largCarreau*1000).toFixed(0)} × {(hautCarreau*1000).toFixed(0)} mm</strong> chacun (le plus grand vérifié)</div>;
            })()}
          </div>}
          {/* Vérification sécurité allège */}
          {(()=>{
            const va=verifAllege(el);
            if(!va.protection_requise)return null;
            return <div style={{marginTop:8,padding:"8px 12px",background:va.classe_min?"#fef2f2":"#f0fdf4",borderRadius:8,border:`1px solid ${va.classe_min?"#fecaca":"#bbf7d0"}`}}>
              <div style={{fontSize:12,fontWeight:600,color:va.classe_min?"#991b1b":"#065f46"}}>🛡 Sécurité chute : {va.exigence}</div>
              <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>Allège {va.allege_m}m {"<"} 1m, chute {va.chute}m {">"} 1m → {va.classe_min?`classe ${va.classe_min} requise`:""}. {va.detail}</div>
            </div>;
          })()}
          {vInfo}
        </div>;
      })}
      <button onClick={addEl} style={{width:"100%",padding:"8px",borderRadius:8,border:"1.5px dashed #d1d5db",background:"none",cursor:"pointer",fontSize:13,color:"#6b7280"}}>+ Ajouter un élément</button>
    </div>
    {/* Données vent */}
    <div style={S.card}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:10,borderBottom:"1px solid #f3f4f6"}}>
        <div style={{width:30,height:30,borderRadius:8,background:"#bfdbfe",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>💨</div>
        <div><div style={{fontSize:14,fontWeight:700,color:"#1a1a2e"}}>Données vent — communes au projet</div><div style={{fontSize:12,color:"#6b7280"}}>DTU 39 P4</div></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:12}}>
        <div><label style={S.label}>Zone de vent</label><select value={projet.zone_vent} onChange={e=>upd("zone_vent",e.target.value)} style={S.input}><option value="">À déterminer</option>{Object.entries(ZONES_VENT).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
        <div><label style={S.label}>Catégorie terrain</label><select value={projet.cat_terrain} onChange={e=>upd("cat_terrain",e.target.value)} style={S.input}>{Object.entries(TERRAINS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
        <div><label style={S.label}>Hauteur bâtiment (m)</label><input type="number" value={projet.hauteur_bat} onChange={e=>upd("hauteur_bat",e.target.value)} placeholder="ex : 18" style={S.input}/></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
        <div><label style={S.label}>Classement AEV min (CCTP)</label><select value={projet.aev_min} onChange={e=>upd("aev_min",e.target.value)} style={S.input}><option value="">Non précisé</option><option>A3 E7B V1</option><option>A3 E7B V2</option><option>A4 E9A V2</option><option>A4 E9A V3</option><option>A4 E9A C3</option><option>A4 E9A C4</option></select></div>
        <div><label style={S.label}>Hauteur vitrage/sol — calcul vent (m)</label><input type="number" value={projet.hauteur_sol} onChange={e=>upd("hauteur_sol",e.target.value)} placeholder="3" step="0.5" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>≤ 6m → c = 0.9 (DTU 39)</div></div>
        <div><label style={S.label}>Type de vitrage</label><select value={projet.type_vitrage} onChange={e=>upd("type_vitrage",e.target.value)} style={S.input}><option value="isolant_2lam">Double — 2 feuilletés</option><option value="isolant_lamine">Double — 1 mono + 1 feuilleté</option><option value="isolant_mono">Double — 2 monolithiques</option><option value="simple_lamine">Simple feuilleté</option></select></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 3fr",gap:12,marginTop:12}}>
        <div><label style={S.label}>Type de verre (ε3, Art.8 DTU 39)</label><select value={projet.type_verre||"recuit"} onChange={e=>upd("type_verre",e.target.value)} style={S.input}>{Object.entries(EPS3_TYPES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></div>
        <div style={{fontSize:11,color:"#9ca3af",alignSelf:"center"}}>Détermine ε3 (coefficient de résistance). <strong style={{color:"#991b1b"}}>Composition MIXTE (ex. 44.2 recuit + monolithe trempé) : sélectionner le type le PLUS DÉFAVORABLE présent (ici recuit)</strong> — la méthode DTU 39 applique le ε3 du composant le moins résistant à toute la composition (cf. exemples officiels "ε3max"). Sélectionner "trempé" alors qu'une seule face l'est surestime la résistance.</div>
      </div>
      {pression&&<div style={{marginTop:12,padding:"10px 16px",background:"#1a1a2e",borderRadius:10,display:"flex",alignItems:"center",gap:16}}><div style={{fontSize:12,color:"rgba(255,255,255,0.55)"}}>Pression DTU 39</div><div style={{fontSize:24,fontWeight:800,color:"#fff"}}>{pression} Pa</div><div style={{fontSize:12,color:"rgba(255,255,255,0.4)"}}>Zone {projet.zone_vent} / {projet.cat_terrain} / H={projet.hauteur_bat}m</div></div>}
    </div>
    {/* Récapitulatif */}
    <div style={{...S.card,background:"#f0fdf4",border:"1.5px solid #6ee7b7"}}>
      <div style={{fontSize:14,fontWeight:700,color:"#065f46",marginBottom:12}}>✅ Récapitulatif — ce que GlassIQ va vérifier pour chaque élément</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:14}}>
        {[["Uw max",projet.uw_max?projet.uw_max+" W/m²K":"Non saisi"],["g max",projet.g_max||"Non saisi"],["TL min",projet.tl_min?projet.tl_min+"%":"Non saisi"],["AEV CCTP",projet.aev_min||"Non précisé"],["Éléments",projet.elements.length]].map(([l,v])=><div key={l} style={{background:"#fff",borderRadius:8,padding:"10px 12px",textAlign:"center",border:"1px solid #d1fae5"}}><div style={{fontSize:15,fontWeight:700,color:"#1a1a2e"}}>{v}</div><div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{l}</div></div>)}
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
        {projet.elements.map((el,i)=>{const r=parseInt(el.ratr)||0;const col=r>=42?"red":r>=38?"amber":r>=34?"green":"blue";return <Badge key={i} color={col}>{el.label} — {el.type==="facade"?"Façade":"Châssis"} — RA,tr ≥ {el.ratr} dB</Badge>;})}
      </div>
      <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
        <button onClick={()=>{setProjet(p=>({...p,pression_pa:pression}));setPage("vent");}} style={{...S.btnPrimary,background:"#059669"}}>💨 Étape 2 — Calcul vent →</button>
        <span style={{fontSize:12,color:"#065f46"}}>Les données saisies ici alimentent toutes les étapes suivantes</span>
      </div>
    </div>
  </div>;
}

// ── PAGE 2 : CALCUL VENT ──────────────────────────────────────────────────
function PageVent({projet,setProjet,setPage}){
  const upd=(k,v)=>setProjet(p=>({...p,[k]:v}));
  const [results,setResults]=useState(null);
  const pression=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const calculer=()=>{
    if(!pression||!projet.elements.length)return;
    const res=projet.elements.map(el=>{
      if(!el.largeur||!el.hauteur)return{el,dtu:null};
      const dtu=calcDTU39(pression,+el.largeur,+el.hauteur,2,2,projet.type_vitrage,+projet.hauteur_sol||3);
      return{el,dtu};
    });
    setResults(res);
    const maxE=Math.max(...res.filter(r=>r.dtu).map(r=>r.dtu.eRequired));
    setProjet(p=>({...p,pression_pa:pression,epaisseur_dtu:maxE+" mm"}));
  };
  return <div>
    <StepBar current={2} setPage={setPage}/>
    <div style={{...S.card,background:"#f0fdf4",border:"1px solid #6ee7b7",marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:600,color:"#065f46",marginBottom:4}}>💨 NF DTU 39 P4 — Calcul de pression et épaisseur de vitrage</div>
      <div style={{fontSize:12,color:"#065f46"}}>Paramètres repris depuis l'étape 1. Modifiables ici si besoin.</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:12}}>
      <div><label style={S.label}>Zone de vent</label><select value={projet.zone_vent} onChange={e=>upd("zone_vent",e.target.value)} style={S.input}><option value="">—</option>{Object.entries(ZONES_VENT).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
      <div><label style={S.label}>Catégorie terrain</label><select value={projet.cat_terrain} onChange={e=>upd("cat_terrain",e.target.value)} style={S.input}>{Object.entries(TERRAINS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
      <div><label style={S.label}>Hauteur bâtiment (m)</label><input type="number" value={projet.hauteur_bat} onChange={e=>upd("hauteur_bat",e.target.value)} placeholder="18" style={S.input}/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Hauteur vitrage/sol — calcul vent (m)</label><input type="number" value={projet.hauteur_sol} onChange={e=>upd("hauteur_sol",e.target.value)} placeholder="3" step="0.5" style={S.input}/></div>
      <div><label style={S.label}>Type de vitrage</label><select value={projet.type_vitrage} onChange={e=>upd("type_vitrage",e.target.value)} style={S.input}><option value="isolant_2lam">Double — 2 feuilletés</option><option value="isolant_lamine">Double — 1 mono + 1 feuilleté</option><option value="isolant_mono">Double — 2 monolithiques</option><option value="simple_lamine">Simple feuilleté</option></select></div>
    </div>
    {pression&&<div style={{padding:"10px 16px",background:"#1a1a2e",borderRadius:10,marginBottom:14,display:"flex",alignItems:"center",gap:16}}><div style={{fontSize:12,color:"rgba(255,255,255,0.5)"}}>Pression DTU 39</div><div style={{fontSize:24,fontWeight:800,color:"#fff"}}>{pression} Pa</div><div style={{fontSize:12,color:"rgba(255,255,255,0.4)"}}>Zone {projet.zone_vent} / {projet.cat_terrain} / H={projet.hauteur_bat}m / {projet.hauteur_bat?getTranche(projet.hauteur_bat):""}</div></div>}
    <button onClick={calculer} disabled={!pression} style={S.btnPrimary}>💨 Calculer l'épaisseur DTU 39 pour chaque élément</button>
    {results&&<div style={{marginTop:20}}>
      {/* Bandeau résultat principal : la pression en gros et clair */}
      <div style={{padding:"16px 20px",background:"linear-gradient(135deg,#1a1a2e,#2d2d52)",borderRadius:12,marginBottom:16}}>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.6)",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.08em"}}>Pression de vent sur la façade</div>
        <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
          <div style={{fontSize:38,fontWeight:800,color:"#fff",lineHeight:1}}>{pression} <span style={{fontSize:20,fontWeight:600,color:"rgba(255,255,255,0.7)"}}>Pa</span></div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.5)"}}>soit {(pression/100).toFixed(0)} daN/m² · {(pression/1000).toFixed(2)} kN/m²</div>
        </div>

          {dtu?<div style={{textAlign:"right"}}><div style={{fontSize:11,color:"#6b7280"}}>Épaisseur verre mini</div><div style={{fontSize:20,fontWeight:800,color:"#059669"}}>≥ {dtu.eRequired} mm</div></div>:<Badge color="gray">Dimensions non saisies</Badge>}

          <details style={{marginBottom:8}}>
            <summary style={{fontSize:11,color:"#9ca3af",cursor:"pointer",userSelect:"none"}}>Voir le détail du calcul DTU 39</summary>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginTop:8,padding:"10px 12px",background:"#f9fafb",borderRadius:8}}>
              <div><div style={{fontSize:10,color:"#6b7280"}}>Résistance (e1×c, Art.7-8)</div><div style={{fontSize:14,fontWeight:700,color:"#1a1a2e"}}>{(dtu.e1*dtu.c).toFixed(2)} mm</div></div>
              <div><div style={{fontSize:10,color:"#6b7280"}}>Flèche (déformation ≤ {dtu.flecheMax}mm, Art.9)</div><div style={{fontSize:14,fontWeight:700,color:"#1a1a2e"}}>{dtu.eF_requis} mm</div></div>
              <div><div style={{fontSize:10,color:"#6b7280"}}>Retenu (le plus grand)</div><div style={{fontSize:14,fontWeight:700,color:"#059669"}}>{dtu.eRequired} mm</div></div>
            </div>
            <div style={{fontSize:10,color:"#9ca3af",marginTop:6}}>Valeurs exprimées en épaisseur de verre monolithique équivalente — la composition réelle (feuilleté/isolant) est ensuite vérifiée par ses propres coefficients d'équivalence (ε1/ε2/ε3, NF DTU 39 P4 Art.8-9) dans le comparateur.</div>
          </details>
          {el.type==="facade"?<div style={{padding:"7px 12px",background:"#ede9fe",borderRadius:8,fontSize:12,color:"#5b21b6"}}>⚠ Façade rideau — l'essai AEV du système doit couvrir une pression ≥ <strong>{pression} Pa</strong></div>:<div style={{padding:"7px 12px",background:"#ccfbf1",borderRadius:8,fontSize:12,color:"#0f766e"}}>ℹ Châssis — vérifier que le classement V/C couvre <strong>{pression} Pa</strong> (V3 ≈ 1200 Pa, V4 ≈ 1600 Pa)</div>}
        </div>}
      </div>)}
      <div style={{display:"flex",gap:12,marginTop:14}}><button onClick={()=>setPage("comparateur")} style={{...S.btnPrimary,background:"#4f46e5"}}>⚖ Étape 3 — Choisir le système →</button></div>
    </div>}
