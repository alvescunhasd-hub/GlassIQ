}
// ── PAGE 2.5 : FENÊTRAGE CHÂSSIS AVEC TRAVERSES ──────────────────────────────────────────────────
function PageFenetrageChassis({projet,setProjet,setPage}){
  const upd=(k,v)=>setProjet(p=>({...p,[k]:v}));
  const [results,setResults]=useState(null);
  const [chassis_liste,setChassis]=useState(projet.chassis_calcul||[]);
  const pression=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  
  const addChassis=()=>{
    const cid=Date.now();
    const new_chassis={
      id:cid,
      label:`Châssis ${chassis_liste.length+1}`,
      largeur:+document.getElementById("chs_l")?.value||1200,
      hauteur:+document.getElementById("chs_h")?.value||1480,
      traverses:[]
    };
    setChassis([...chassis_liste,new_chassis]);
    setProjet(p=>({...p,chassis_calcul:[...chassis_liste,new_chassis]}));
  };
  
  const updChassis=(id,k,v)=>{
    const lst=chassis_liste.map(c=>c.id===id?{...c,[k]:v}:c);
    setChassis(lst);
    setProjet(p=>({...p,chassis_calcul:lst}));
  };
  
  const addTraverse=(id)=>{
    const y=+prompt("Hauteur de la traverse (mm):");
    if(isNaN(y)||y<=0)return;
    updChassis(id,"traverses",[...chassis_liste.find(c=>c.id===id)?.traverses||[],y].sort((a,b)=>a-b));
  };
  
  const delChassis=(id)=>{
    const lst=chassis_liste.filter(c=>c.id!==id);
    setChassis(lst);
    setProjet(p=>({...p,chassis_calcul:lst}));
  };
  
  const calculer=()=>{
    if(!pression||!chassis_liste.length)return;
    const res=chassis_liste.map(chs=>{
      if(!chs.largeur||!chs.hauteur)return{chs,sections:null};
      // Découper en sections si traverses
      const traverses=[0,...chs.traverses,chs.hauteur].sort((a,b)=>a-b);
      const sections=[];
      for(let j=0;j<traverses.length-1;j++){
        const h_sec=traverses[j+1]-traverses[j];
        const dtu=calcDTU39(pression,chs.largeur,h_sec,2,2,projet.type_vitrage,+projet.hauteur_sol||3);
        sections.push({id:j,y1:traverses[j],y2:traverses[j+1],hauteur:h_sec,dtu});
      }
      return{chs,sections};
    });
    setResults(res);
  };
  
  return <div>
    <StepBar current={2} setPage={setPage}/>
    <div style={{...S.card,background:"#f0f9ff",border:"1px solid #bae6fd",marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:600,color:"#0369a1",marginBottom:4}}>🪟 Fenêtrage Châssis — DTU 39 par section</div>
      <div style={{fontSize:12,color:"#0369a1"}}>Définissez vos châssis avec traverses horizontales — le calcul se fera sur chaque section séparément.</div>
    </div>
    
    {/* Paramètres vent */}
    <div style={{...S.card,marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e",marginBottom:12}}>💨 Paramètres DTU 39 (repris depuis étape 1)</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:12}}>
        <div><label style={S.label}>Zone de vent</label><select value={projet.zone_vent} onChange={e=>upd("zone_vent",e.target.value)} style={S.input}><option value="">—</option>{Object.entries(ZONES_VENT).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
        <div><label style={S.label}>Catégorie terrain</label><select value={projet.cat_terrain} onChange={e=>upd("cat_terrain",e.target.value)} style={S.input}>{Object.entries(TERRAINS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
        <div><label style={S.label}>Hauteur bâtiment (m)</label><input type="number" value={projet.hauteur_bat} onChange={e=>upd("hauteur_bat",e.target.value)} placeholder="18" style={S.input}/></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div><label style={S.label}>Type de vitrage</label><select value={projet.type_vitrage} onChange={e=>upd("type_vitrage",e.target.value)} style={S.input}><option value="isolant_2lam">Double — 2 feuilletés</option><option value="isolant_lamine">Double — 1 mono + 1 feuilleté</option><option value="isolant_mono">Double — 2 monolithiques</option><option value="simple_lamine">Simple feuilleté</option></select></div>
        <div><label style={S.label}>Hauteur vitrage/sol (m)</label><input type="number" value={projet.hauteur_sol} onChange={e=>upd("hauteur_sol",e.target.value)} placeholder="3" step="0.5" style={S.input}/></div>
      </div>
      {pression&&<div style={{padding:"10px 16px",background:"#1a1a2e",borderRadius:10,marginTop:12,display:"flex",alignItems:"center",gap:16}}><div style={{fontSize:12,color:"rgba(255,255,255,0.5)"}}>Pression DTU 39</div><div style={{fontSize:24,fontWeight:800,color:"#fff"}}>{pression} Pa</div><div style={{fontSize:12,color:"rgba(255,255,255,0.4)"}}>Zone {projet.zone_vent} / {projet.cat_terrain} / H={projet.hauteur_bat}m</div></div>}
    </div>
    
    {/* Ajouter châssis */}
    <div style={{...S.card,marginBottom:14,background:"#f0fdf4",border:"1px solid #6ee7b7"}}>
      <div style={{fontSize:13,fontWeight:700,color:"#065f46",marginBottom:12}}>➕ Ajouter un châssis</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div><label style={S.label}>Largeur (mm)</label><input id="chs_l" type="number" placeholder="4800" style={S.input}/></div>
        <div><label style={S.label}>Hauteur (mm)</label><input id="chs_h" type="number" placeholder="2650" style={S.input}/></div>
      </div>
      <button onClick={addChassis} style={{...S.btnPrimary,width:"100%"}}>✓ Ajouter ce châssis</button>
    </div>
    
    {/* Liste châssis */}
    {chassis_liste.length>0&&<div style={{...S.card,marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e",marginBottom:12}}>📋 Châssis saisis ({chassis_liste.length})</div>
      {chassis_liste.map(chs=><div key={chs.id} style={{borderRadius:10,border:"1px solid #e5e7eb",borderLeft:"3px solid #0d9488",padding:"12px 14px",marginBottom:10,background:"#fafafa"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div><div style={{fontWeight:700}}>{chs.label} — {chs.largeur}×{chs.hauteur}mm</div><div style={{fontSize:12,color:"#6b7280",marginTop:3}}>{chs.traverses.length>0?`Traverses @ ${chs.traverses.join(", ")}mm (${chs.traverses.length+1} section(s))`:"Pas de traverse (1 section)"}</div></div>
          <button onClick={()=>delChassis(chs.id)} style={{padding:"7px 10px",borderRadius:6,border:"1px solid #fca5a5",background:"#fee2e2",color:"#991b1b",cursor:"pointer",fontSize:12}}>✕</button>
        </div>
        <button onClick={()=>addTraverse(chs.id)} style={{...S.btnSecondary,fontSize:11,padding:"6px 12px",marginTop:6}}>➕ Ajouter une traverse</button>
      </div>)}
    </div>}
    
    {/* Calculer */}
    <button onClick={calculer} disabled={!pression||!chassis_liste.length} style={{...S.btnPrimary,width:"100%",marginBottom:14}}>🔧 Calculer l'épaisseur DTU 39 par section</button>
    
    {/* Résultats */}
    {results&&<div>
      <div style={{padding:"16px 20px",background:"linear-gradient(135deg,#1a1a2e,#2d2d52)",borderRadius:12,marginBottom:16}}>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.6)",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.08em"}}>Pression de vent</div>
        <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
          <div style={{fontSize:38,fontWeight:800,color:"#fff",lineHeight:1}}>{pression} <span style={{fontSize:20,fontWeight:600,color:"rgba(255,255,255,0.7)"}}>Pa</span></div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.5)"}}>soit {(pression/100).toFixed(0)} daN/m²</div>
        </div>
      </div>
      
      <div style={{fontSize:12,fontWeight:700,color:"#1a1a2e",marginBottom:12,textTransform:"uppercase",letterSpacing:"0.06em"}}>Épaisseur de vitrage minimale par châssis</div>
      {results.map(({chs,sections},i)=><div key={i} style={{...S.card,borderLeft:"3px solid #0d9488",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:700,color:"#0f766e",marginBottom:12}}>📐 {chs.label} ({chs.largeur}×{chs.hauteur}mm) — {sections.length} section(s)</div>
        {sections&&sections.map(sec=><div key={sec.id} style={{borderRadius:8,border:"1px solid #d1fae5",background:"#f0fdf4",padding:"12px",marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <div><strong>Section {sec.id+1}</strong> · Hauteur: {sec.hauteur}mm</div>
            <div style={{textAlign:"right",fontSize:16,fontWeight:800,color:"#059669"}}>≥ {sec.dtu.eRequired} mm</div>
          </div>
          <div style={{fontSize:11,color:"#0c4a6e",paddingTop:6,borderTop:"1px solid #bae6fd"}}>
            ✓ Résistance: {sec.dtu.e_resistance}mm · Flèche: {sec.dtu.e_fleche}mm · Retenu: <strong>{sec.dtu.eRequired}mm</strong>
          </div>
        </div>)}
        {sections&&<div style={{padding:10,background:"#ccfbf1",borderRadius:8,marginTop:8,border:"1px solid #5eead4",color:"#0f766e",fontSize:12}}>
          🎯 <strong>Épaisseur max pour ce châssis : {Math.max(...sections.map(s=>s.dtu.eRequired))} mm</strong>
        </div>}
      </div>)}
    </div>}
  </div>;
}

// ── PAGE 3 : COMPARATEUR MULTI-CRITÈRES ───────────────────────────────────
function PageComparateur({db,projet,setProjet,setPage}){
  const [results,setResults]=useState(null);
  const [loading,setLoading]=useState(false);
  const [selEl,setSelEl]=useState(0);
  const [confirmed,setConfirmed]=useState({});// {elId: {sys,best}}
  const el=projet.elements[selEl]||projet.elements[0];
  const pression=projet.pression_pa||calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);

  const chercher=async()=>{
    if(!el)return;
    setLoading(true);
    await new Promise(r=>setTimeout(r,300));
    const ratr=parseInt(el.ratr)||36,uw_max=parseFloat(projet.uw_max)||99,surf=(el.largeur&&el.hauteur)?(+el.largeur/1000)*(+el.hauteur/1000):null;
    const solutions=[];
    for(const sys of db.systemes){
      if(el.type==="facade"&&sys.famille!=="Façade")continue;
      if(el.type==="chassis"&&sys.famille==="Façade")continue;
      // Un système Coulissant (rails, quincaillerie glissante) n'est pas fabricable en
      // ouvrant battant (OB/OF) et inversement — mécanismes physiquement incompatibles.
      if(el.type==="chassis"){
        const estCoulissant=/coulissant/i.test(el.soustype||"");
        const sysEstCoulissant=sys.famille==="Coulissant";
        if(estCoulissant&&!sysEstCoulissant)continue;
        if(!estCoulissant&&sysEstCoulissant)continue;
      }
      const bpc={};
      for(const test of sys.tests){
        const st=(test.dim_L/1000)*(test.dim_H/1000);let corr=0;
        if(surf&&surf>st){const r=surf/st;if(r<=1.5)corr=-1;else if(r<=2.0)corr=-2;else corr=-3;}
        for(const v of test.vitrages){const rc=v.rwctr+corr;if(rc>=ratr){const k=v.composition;if(!bpc[k]||rc<bpc[k].rc)bpc[k]={...v,rc,corr,test};}}
      }
      const matches=Object.values(bpc).sort((a,b)=>a.rc-b.rc);
      if(!matches.length)continue;
      const best=matches[0];
      const uw_ok=sys.thermique&&sys.thermique.length>0?sys.thermique.some(t=>t.uw<=uw_max):null;
      let aev_ok=null;
      if(pression&&sys.aev&&sys.aev.length>0){
        if(el.type==="facade"){const pp=sys.aev.map(a=>{const m=(a.V||"").match(/(\d+)\s*Pa/);return m?parseInt(m[1]):null;}).filter(Boolean);if(pp.length)aev_ok=Math.max(...pp)>=pression;}
        else{const mc=pression<=600?1:pression<=1200?2:pression<=2000?3:4;aev_ok=sys.aev.some(a=>{const m=(a.V||"").match(/[VC](\d)/);return m&&parseInt(m[1])>=mc;});}
      }
      // Épaisseur réelle du vitrage retenu vs feuillure (plus fiable que l'épaisseur DTU mini)
      const vBest=verifVitrage(best.composition,+el.largeur||1230,+el.hauteur||1480,sys,el,projet);
      const ep_ok=vBest?vBest.feuillure_ok:(projet.epaisseur_dtu?(sys.epaisseur_min<=parseFloat(projet.epaisseur_dtu)&&parseFloat(projet.epaisseur_dtu)<=sys.epaisseur_max):null);
      const poids_ok=vBest?vBest.poids_ok:null;
      const resistance_ok=vBest?vBest.resistance_ok:null;
      const fleche_verre_ok=vBest?vBest.fleche_verre_ok:null;
      const ko=[uw_ok,aev_ok,ep_ok,poids_ok,resistance_ok,fleche_verre_ok].filter(c=>c===false).length;
      solutions.push({sys,best,allMatches:matches,uw_ok,aev_ok,ep_ok,poids_ok,resistance_ok,fleche_verre_ok,ko});
    }
    solutions.sort((a,b)=>a.ko!==b.ko?a.ko-b.ko:a.best.rc-b.best.rc);
    setResults(solutions);setLoading(false);
  };

  // Injecte le système retenu dans projet.prescriptions[elId]
  const utiliser=(sys,best,allMatches)=>{
    const elId=el.id;
    // Trouver le meilleur Uw dispo
    const bestUw=sys.thermique&&sys.thermique.length>0?Math.min(...sys.thermique.map(t=>t.uw)):null;
    // Analyse physique du vitrage retenu
    const v=verifVitrage(best.composition,+el.largeur||1230,+el.hauteur||1480,sys,el,projet);
    const prescription={
      elId,
      gamme:`${sys.marque} ${sys.nom}`,
      vitrage:best.composition,
      rw:`${best.rw} dB`,
      rwctr:`${best.rc} dB`,
      rapport:best.test.rapport,
      correction:best.corr!==0?`${best.corr} dB`:"0 dB",
      uw:bestUw?`${bestUw} W/m²K`:"",
      aev:sys.aev&&sys.aev.length>0?sys.aev.map(a=>`A${a.A}/E${a.E}/V${a.V}`).join(" | "):"",
      epaisseur_dtu:projet.epaisseur_dtu||"",
      epaisseur_reelle:v?`${v.epaisseur_totale} mm`:"",
      poids_m2:v?`${v.poids_m2} kg/m²`:"",
      poids_vantail:v?`${v.poids_vantail} kg`:"",
      allMatches,
    };
    setProjet(p=>({...p,prescriptions:{...(p.prescriptions||{}), [elId]:prescription}}));
    setConfirmed(c=>({...c,[elId]:{sys,best}}));
  };

  // Résumé des éléments déjà confirmés
  const nbConfirmed=Object.keys(confirmed).length;
  const allConfirmed=projet.elements.length>0&&nbConfirmed>=projet.elements.length;

  return <div>
    <StepBar current={3} setPage={setPage}/>
    <div style={{...S.card,background:"#eef2ff",border:"1px solid #c7d2fe",marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:600,color:"#3730a3",marginBottom:4}}>⚖ Comparateur multi-critères — acoustique + AEV vent + thermique + feuillure</div>
      <div style={{fontSize:12,color:"#3730a3"}}>Sélectionne l'élément, analyse, puis clique <strong>"✓ Retenir ce système"</strong> — la prescription se remplit automatiquement.</div>
    </div>

    {/* Sélection élément + statut */}
    <div style={{marginBottom:14}}>
      <label style={S.label}>Élément à analyser</label>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {projet.elements.map((e,i)=>{
          const done=confirmed[e.id];
          return <button key={i} onClick={()=>{setSelEl(i);setResults(null);}} style={{padding:"7px 14px",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",border:"1.5px solid",background:selEl===i?"#1a1a2e":done?"#f0fdf4":"#f9fafb",color:selEl===i?"#fff":done?"#065f46":"#374151",borderColor:selEl===i?"#1a1a2e":done?"#6ee7b7":"#e5e7eb"}}>
            {done?"✓ ":""}{e.label} <span style={{fontSize:11,opacity:0.7}}>RA,tr {e.ratr} dB</span>
          </button>;
        })}
      </div>
      {nbConfirmed>0&&<div style={{marginTop:8,fontSize:12,color:"#065f46"}}>{nbConfirmed}/{projet.elements.length} élément{nbConfirmed>1?"s":""} confirmé{nbConfirmed>1?"s":""}</div>}
    </div>

    {el&&<div style={{...S.card,background:"#f9fafb",marginBottom:14}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12}}>
        <Stat label="RA,tr requis" value={`≥ ${el.ratr} dB`} hi/><Stat label="Uw max" value={projet.uw_max?`≤ ${projet.uw_max}`:"Non précisé"}/><Stat label="g max" value={projet.g_max?`≤ ${projet.g_max}`:"Non précisé"}/><Stat label="Pression vent" value={pression?`${pression} Pa`:"Non calculée"}/><Stat label="Épaisseur DTU 39" value={projet.epaisseur_dtu||"Non calculée"}/>
      </div>
      {confirmed[el.id]&&<div style={{marginTop:10,padding:"8px 12px",background:"#d1fae5",borderRadius:8,fontSize:12,color:"#065f46",fontWeight:600}}>
        ✓ Système retenu : <strong>{confirmed[el.id].sys.marque} {confirmed[el.id].sys.nom}</strong> — {confirmed[el.id].best.composition} — RA,tr {confirmed[el.id].best.rc} dB
      </div>}
    </div>}

    <button onClick={chercher} disabled={loading||!el} style={S.btnPrimary}>{loading?"Analyse…":"⚖ Analyser les systèmes compatibles"}</button>

    {results&&<div style={{marginTop:20}}>
      <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}><strong>{results.length}</strong> système{results.length>1?"s":""} conforme{results.length>1?"s":""} acoustiquement — triés par conformité globale</div>
      {results.map(({sys,best:bestAlgo,allMatches,uw_ok,aev_ok,ep_ok,ko},i)=>{
        const allOk=ko===0;const bc=allOk?"#6ee7b7":ko>=2?"#fca5a5":"#fde68a";const bg=allOk?"#f0fdf4":ko>=2?"#fff1f2":"#fffbeb";
        const isRetenu=confirmed[el.id]?.sys.id===sys.id;
        // Si ce système est retenu, on affiche la composition RÉELLEMENT choisie par
        // l'utilisateur (qui peut être une "autre composition compatible"), pas celle
        // proposée par défaut par l'algorithme — sinon la sélection ne se reflète jamais.
        const best=isRetenu?confirmed[el.id].best:bestAlgo;
        return <div key={sys.id} style={{...S.card,border:isRetenu?"2px solid #059669":(`1.5px solid ${bc}`),background:isRetenu?"#f0fdf4":bg,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{width:26,height:26,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,background:isRetenu?"#059669":allOk?"#d1fae5":ko>=2?"#fee2e2":"#fef3c7",color:isRetenu?"#fff":undefined}}>{isRetenu?"★":allOk?"✓":ko>=2?"✗":"⚠"}</span>
              <div><div style={{fontWeight:800,fontSize:15,color:"#1a1a2e"}}>{sys.marque} {sys.nom}</div><div style={{fontSize:12,color:"#6b7280"}}>{sys.famille} · DTA: {sys.dta||"—"} · Validité: {sys.validite||"—"} · Feuillure: {sys.epaisseur_min}–{sys.epaisseur_max}mm</div></div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <div style={{textAlign:"right"}}><div style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:"#374151"}}>{best.composition}</div><div style={{fontSize:12,color:"#059669"}}>RA,tr {best.rc} dB{best.corr!==0?` (corrigé ${best.corr} dB)`:""}</div><div style={{fontSize:11,color:"#6b7280"}}>Rapport {best.test.rapport}</div></div>
              <button onClick={()=>utiliser(sys,best,allMatches)} style={{padding:"8px 14px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:"none",background:isRetenu?"#059669":"#1a1a2e",color:"#fff",whiteSpace:"nowrap"}}>
                {isRetenu?"★ Retenu":"✓ Retenir ce système"}
              </button>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8}}>
            <CheckRow label="Acoustique RA,tr" ok={true} note={`${best.rc} dB ≥ ${el.ratr} dB`}/>
            <CheckRow label="Thermique Uw" ok={uw_ok} note={uw_ok===null?"Données manquantes":uw_ok?"Conforme":"Non conforme"}/>
            <CheckRow label={el.type==="facade"?"Pression AEV essai":"Classement V/C AEV"} ok={aev_ok} note={aev_ok===null?"Pas d'essai AEV":aev_ok?"Couvert":"Insuffisant"}/>
            <CheckRow label="Épaisseur feuillure" ok={ep_ok} note={ep_ok===null?"Non vérifié":`${sys.epaisseur_min}–${sys.epaisseur_max}mm`}/>
          </div>
          {/* Vérification physique : poids vantail + épaisseur réelle vs feuillure */}
          {(()=>{
            const v=verifVitrage(best.composition,+el.largeur||1230,+el.hauteur||1480,sys,el,projet);
            if(!v)return null;
            return <div style={{marginTop:8,padding:"8px 12px",background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb"}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,alignItems:"center"}}>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>ÉPAISSEUR RÉELLE</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.feuillure_ok===false?"#991b1b":"#1a1a2e"}}>{v.epaisseur_totale} mm {v.feuillure_ok===false?"✗":v.feuillure_ok?"✓":""}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{v.type} · feuillure {v.feuillure_min}–{v.feuillure_max}mm</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>POIDS VITRAGE</div>
                  <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>{v.poids_m2} kg/m²</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{v.nb_verres} verre{v.nb_verres>1?"s":""}{v.lames_air.length?" · lame "+v.lames_air.join("+")+"mm":""}</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>{v.isFacade?"POIDS / PANNEAU":(v.nb_vantaux===0?"POIDS / CARREAU":"POIDS VANTAIL")} ({v.surface} m²)</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.poids_ok===false?"#991b1b":v.poids_ok?"#059669":"#1a1a2e"}}>{v.poids_vantail} kg {v.poids_ok===false?"✗":v.poids_ok?"✓":""}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{v.base_label} · max {v.isFacade?"appui":"ferrure"} : {v.poids_max?v.poids_max+" kg":"non renseigné"}</div>
                </div>
                <div>
                  {v.poids_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ {v.isFacade?"Panneau trop lourd pour l'appui vitrage":"Vantail trop lourd pour la quincaillerie"}</div>}
                  {v.feuillure_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ Épaisseur incompatible feuillure</div>}
                  {v.resistance_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ Résistance au vent insuffisante (Art.8)</div>}
                  {v.fleche_verre_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ Flèche du vitrage excessive (Art.9)</div>}
                  {v.poids_ok!==false&&v.feuillure_ok!==false&&v.resistance_ok!==false&&v.fleche_verre_ok!==false&&<div style={{fontSize:11,color:"#059669",fontWeight:600,lineHeight:1.4}}>✓ Faisabilité mécanique OK</div>}
                </div>
              </div>
              {/* Résistance & flèche du vitrage — NF DTU 39 P4 Art.8-9 */}
              {v.dtu_verre&&<div style={{marginTop:8,paddingTop:8,borderTop:"1px solid #e5e7eb",display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>RÉSISTANCE AU VENT (Art.8)</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.resistance_ok===false?"#991b1b":"#059669"}}>eR = {v.eR_reel} mm {v.resistance_ok===false?"✗":"✓"}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>requis ≥ {(v.dtu_verre.e1*v.dtu_verre.c).toFixed(2)} mm (e1×c)</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>FLÈCHE DU VITRAGE (Art.9)</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.fleche_verre_ok===false?"#991b1b":"#059669"}}>eF = {v.eF_reel} mm {v.fleche_verre_ok===false?"✗":"✓"}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>requis ≥ {v.dtu_verre.eF_requis} mm (déformation ≤ {v.dtu_verre.flecheMax}mm)</div>
                </div>
              </div>}
              {/* Suggestions de découpage si vantail trop lourd */}
              {v.poids_decoupage&&v.poids_decoupage.length>0&&<div style={{marginTop:8,padding:"8px 12px",background:"#eff6ff",borderRadius:8,border:"1px solid #bfdbfe"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#1e40af",marginBottom:6}}>💡 Solutions de découpage pour passer sous {v.poids_max} kg/vantail :</div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {v.poids_decoupage.map((opt,oi)=>(
                    <div key={oi} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#1e3a8a"}}>
                      <span style={{background:"#dbeafe",borderRadius:6,padding:"2px 8px",fontWeight:600,fontSize:11}}>{opt.poids} kg/vtl ✓</span>
                      <strong>{opt.label}</strong>
                      <span style={{color:"#6b7280",fontSize:11}}>— {opt.detail}</span>
                    </div>
                  ))}
                </div>
                <div style={{fontSize:10,color:"#6b7280",marginTop:6}}>Renseigne le nombre de vantaux (ou une largeur de fixe) dans la composition du châssis en étape 1 pour valider automatiquement.</div>
              </div>}
            </div>;
          })()}
          {/* Sécurité allège — feuilleté obligatoire si vitrage fait garde-corps */}
          {(()=>{
            const va=verifAllege(el);
            if(!va.protection_requise||el.allege_opaque)return null;
            const feuillete=compoEstFeuillete(best.composition);
            return <div style={{marginTop:8,padding:"7px 12px",borderRadius:8,background:feuillete?"#f0fdf4":"#fef2f2",border:`1px solid ${feuillete?"#bbf7d0":"#fecaca"}`,fontSize:12,color:feuillete?"#065f46":"#991b1b",fontWeight:600}}>
              {feuillete?`✓ Sécurité allège OK — ${best.composition} comporte une face feuilletée (classe 1B1 EN 12600)`:`⚠ Sécurité allège : vitrage faisant garde-corps mais ${best.composition} sans face feuilletée — feuilleté 44.2 min obligatoire (NF P08-302 / EN 12600 classe 1B1)`}
            </div>;
          })()}
          {/* Autres compositions compatibles */}
          {allMatches.length>1&&<div style={{marginTop:8}}>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>Autres compositions compatibles :</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {allMatches.filter(m=>m.composition!==best.composition).map((m,mi)=><button key={mi} onClick={()=>utiliser(sys,m,allMatches)} style={{padding:"3px 10px",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer",border:"1px solid #d1d5db",background:"#fff",color:"#374151",fontFamily:"monospace"}}>{m.composition} — {m.rc} dB</button>)}
            </div>
          </div>}
          {best.corr!==0&&<div style={{marginTop:8,padding:"6px 10px",background:"#fef3c7",borderRadius:6,fontSize:12,color:"#92400e"}}>⚠ Correction dimensionnelle {best.corr} dB (surface projet &gt; surface essai)</div>}
        </div>;
      })}
      <div style={{display:"flex",gap:10,marginTop:10,flexWrap:"wrap",alignItems:"center"}}>
        {allConfirmed&&<div style={{fontSize:13,color:"#059669",fontWeight:600}}>✓ Tous les éléments ont un système retenu</div>}
        <button onClick={()=>setPage("prescription")} style={{...S.btnPrimary,background:"#059669"}}>📄 Étape 5 — Voir la prescription →</button>
      </div>
    </div>}
  </div>;
}

// ── PAGE 4 : CONTRÔLE SOLAIRE ─────────────────────────────────────────────
function PageControleSolaire({projet,setProjet}){
  const [controles]=useState(()=>getControles());
  const [tlMin,setTlMin]=useState(projet.tl_min||"");
  const [fsMax,setFsMax]=useState(projet.g_max||"");
  const [ugMax,setUgMax]=useState("");
  const [mf,setMf]=useState("");
  const [results,setResults]=useState(null);
  const marques=[...new Set(controles.map(c=>c.marque))];
  const chercher=()=>{let f=controles.filter(c=>(!tlMin||c.tl>=+tlMin)&&(!fsMax||c.fs<=+fsMax)&&(!ugMax||c.ug<=+ugMax));if(mf)f=f.filter(c=>c.marque===mf);setResults(f.sort((a,b)=>b.tl-a.tl));};
  return <div>
    {projet.g_max&&<div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",marginBottom:14}}><div style={{fontSize:12,color:"#92400e"}}>☀ Facteur solaire g max du projet : <strong>{projet.g_max}</strong> — pré-rempli depuis l'étape 1</div></div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Marque</label><select value={mf} onChange={e=>setMf(e.target.value)} style={S.input}><option value="">Toutes</option>{marques.map(m=><option key={m}>{m}</option>)}</select></div>
      <div><label style={S.label}>TL min (%)</label><input type="number" value={tlMin} onChange={e=>setTlMin(e.target.value)} placeholder={projet.tl_min||"ex : 60"} style={S.input}/></div>
      <div><label style={S.label}>FS max</label><input type="number" step="0.01" value={fsMax} onChange={e=>setFsMax(e.target.value)} placeholder={projet.g_max||"ex : 0.35"} style={S.input}/></div>
      <div><label style={S.label}>Ug max (W/m².K)</label><input type="number" step="0.1" value={ugMax} onChange={e=>setUgMax(e.target.value)} placeholder="ex : 1.1" style={S.input}/></div>
    </div>
    <button onClick={chercher} style={S.btnPrimary}>☀ Trouver le contrôle solaire</button>
    {results&&<div style={{marginTop:18}}>
      <div style={{fontSize:13,color:"#6b7280",marginBottom:10}}>{results.length} référence{results.length>1?"s":""}</div>
      {results.length===0&&<div style={{padding:14,background:"#fff1f2",borderRadius:10,color:"#991b1b",fontSize:13}}>Aucune référence — assouplissez les critères</div>}
      {results.map((c,i)=><div key={c.id} style={{...S.card,border:i===0?"1.5px solid #6ee7b7":"1px solid #e5e7eb",background:i===0?"#f0fdf4":"#fff",marginBottom:8}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr 1fr",gap:10,alignItems:"center"}}>
          <div><div style={{fontWeight:700,fontSize:14}}>{c.ref}</div><div style={{fontSize:12,color:"#6b7280"}}>{c.marque} · {c.gamme}</div></div>
          <Stat label="TL" value={`${c.tl}%`} hi={i===0}/><Stat label="FS" value={c.fs}/><Stat label="Ug" value={`${c.ug} W/m²K`}/>
          <div style={{fontSize:12,color:"#6b7280",fontStyle:"italic"}}>{c.note}</div>
          <button onClick={()=>{setProjet(p=>({...p,controle_ref:c.ref,controle_tl:c.tl+"%",controle_fs:c.fs,controle_ug:c.ug+" W/m²K"}));alert(`✓ ${c.ref} ajouté`);}} style={{...S.btnSecondary,fontSize:12}}>➕ Utiliser</button>
        </div>
      </div>)}
    </div>}
  </div>;
}

// ── PAGE 5 : PRESCRIPTION ─────────────────────────────────────────────────
function PagePrescription({projet,setProjet,setPage}){
  const prescs=projet.prescriptions||{};
  // Sync typos quand prescriptions change (retour du comparateur)
  const [typos,setTypos]=useState(()=>projet.elements.map((el,i)=>{
    const p=prescs[el.id]||{};
    return {
      id:el.id||i,label:el.label,dims:el.largeur&&el.hauteur?`${el.largeur}\u00d7${el.hauteur}mm`:"",
      orientation:el.orientation||"",usage:el.usage||"",rw_requis:el.ratr?"RA,tr \u2265 "+el.ratr+" dB":"",
      type_element:el.type==="facade"?"Fa\u00e7ade rideau":"Ch\u00e2ssis",
      gamme:p.gamme||"",vitrage:p.vitrage||"",rw:p.rw||"",rwctr:p.rwctr||"",rapport:p.rapport||"",correction:p.correction||"0 dB",
      controle:projet.controle_ref||"",tl:projet.controle_tl||"",fs:projet.controle_fs?String(projet.controle_fs):"",ug:projet.controle_ug||"",
      epaisseur_dtu:p.epaisseur_dtu||projet.epaisseur_dtu||"",aev:p.aev||"",uw:p.uw||"",
      epaisseur_reelle:p.epaisseur_reelle||"",poids_m2:p.poids_m2||"",poids_vantail:p.poids_vantail||"",
      _facade:el.type==="facade"?analyseFacade(el):null,
      _allege:verifAllege(el),
      _rc3:!!el.rc3_requis,
      _allege_opaque:!!el.allege_opaque,
    };
  }));
  const upd=(id,k,v)=>setTypos(t=>t.map(x=>x.id===id?{...x,[k]:v}:x));
  // Resynchronise les champs issus du comparateur (vitrage, gamme, RA,tr...) si la
  // prescription change après un retour à l'étape 3 — sans écraser les champs propres
  // à cette page (dims/orientation/usage/contrôle) que l'utilisateur peut avoir modifiés.
  useEffect(()=>{
    setTypos(t=>t.map(ty=>{
      const p=prescs[ty.id];
      if(!p)return ty;
      return {...ty,
        gamme:p.gamme||ty.gamme, vitrage:p.vitrage||ty.vitrage, rw:p.rw||ty.rw, rwctr:p.rwctr||ty.rwctr,
        rapport:p.rapport||ty.rapport, correction:p.correction||ty.correction,
        epaisseur_dtu:p.epaisseur_dtu||ty.epaisseur_dtu, aev:p.aev||ty.aev, uw:p.uw||ty.uw,
        epaisseur_reelle:p.epaisseur_reelle||ty.epaisseur_reelle, poids_m2:p.poids_m2||ty.poids_m2, poids_vantail:p.poids_vantail||ty.poids_vantail,
      };
    }));
  },[projet.prescriptions]);
  const addT=()=>setTypos(t=>[...t,{id:Date.now(),label:`Élément ${t.length+1}`,dims:"",orientation:"",usage:"",rw_requis:"",type_element:"Châssis",gamme:"",vitrage:"",rw:"",rwctr:"",rapport:"",correction:"0 dB",controle:"",tl:"",fs:"",ug:"",epaisseur_dtu:"",aev:""}]);
  return <div>
    <StepBar current={5} setPage={setPage}/>
    <div className="no-print" style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      <button onClick={()=>window.print()} style={{...S.btnPrimary,background:"#059669"}}>📄 Exporter PDF</button>
      <button onClick={addT} style={S.btnSecondary}>+ Ajouter ligne</button>
      <button onClick={()=>setPage("comparateur")} style={{...S.btnSecondary,background:"#eef2ff",borderColor:"#c7d2fe",color:"#3730a3"}}>⚖ Retour comparateur</button>
    </div>
    <div style={{background:"#fff",borderRadius:14,padding:"24px 32px",boxShadow:"0 4px 24px rgba(0,0,0,0.08)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,paddingBottom:12,borderBottom:"3px solid #1a1a2e"}}>
        <div><div style={{fontSize:18,fontWeight:800,color:"#1a1a2e"}}>🪟 GlassIQ v2</div><div style={{fontSize:11,color:"#6b7280"}}>Note de choix vitrage</div></div>
        <div style={{textAlign:"right",fontSize:12}}><div style={{fontWeight:700,fontSize:14,color:"#1a1a2e"}}>PRESCRIPTION VITRAGE</div><div style={{color:"#6b7280",marginTop:2}}>{new Date().toLocaleDateString("fr-FR")}</div></div>
      </div>
      {/* Infos projet */}
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:10,marginBottom:12,padding:"10px 14px",background:"#f8f9fb",borderRadius:10,border:"1px solid #e5e7eb"}}>
        <div><div style={{fontSize:10,color:"#9ca3af",marginBottom:1}}>PROJET</div><div style={{fontSize:14,fontWeight:700,color:"#1a1a2e"}}>{projet.nom||"—"}</div></div>
        <div><div style={{fontSize:10,color:"#9ca3af",marginBottom:1}}>MOA</div><div style={{fontSize:12,color:"#374151"}}>{projet.moa||"—"}</div></div>
        <div><div style={{fontSize:10,color:"#9ca3af",marginBottom:1}}>MOE</div><div style={{fontSize:12,color:"#374151"}}>{projet.moe||"—"}</div></div>
        <div><div style={{fontSize:10,color:"#9ca3af",marginBottom:1}}>RÉDACTEUR</div><div style={{fontSize:12,color:"#374151"}}>{projet.redacteur||"—"}</div></div>
      </div>
      {/* Données vent */}
      {projet.pression_pa&&<div style={{marginBottom:12,padding:"10px 14px",background:"#f0f9ff",borderRadius:10,border:"1px solid #bae6fd"}}>
        <div style={{fontSize:10,fontWeight:700,color:"#0369a1",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>💨 Données vent</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
          {[["Zone",ZONES_VENT[projet.zone_vent]?.split("—")[0]||"—"],["Terrain",TERRAINS[projet.cat_terrain]?.split("—")[0]||"—"],["Hauteur",projet.hauteur_bat?projet.hauteur_bat+" m":"—"],["Pression DTU 39",projet.pression_pa+" Pa"],["Épaisseur min.",projet.epaisseur_dtu||"—"]].map(([l,v])=><div key={l}><div style={{fontSize:10,color:"#0369a1"}}>{l}</div><div style={{fontSize:12,fontWeight:700,color:"#1e40af"}}>{v}</div></div>)}
        </div>
      </div>}
      {/* Exigences */}
      <div style={{marginBottom:12,padding:"10px 14px",background:"#fffbeb",borderRadius:10,border:"1px solid #fde68a"}}>
        <div style={{fontSize:10,fontWeight:700,color:"#92400e",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>📋 Exigences CCTP</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
          {[["AEV minimum",projet.aev_min||"—"],["Uw max",projet.uw_max?projet.uw_max+" W/m²K":"—"],["g max",projet.g_max||"—"],["TL min",projet.tl_min?projet.tl_min+"%":"—"]].map(([l,v])=><div key={l}><div style={{fontSize:10,color:"#92400e"}}>{l}</div><div style={{fontSize:12,fontWeight:700,color:"#92400e"}}>{v}</div></div>)}
        </div>
      </div>
      {/* Lignes */}
      <div style={{fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Prescriptions par élément</div>

// ── PAGE MÉTRÉ GLOBAL ──────────────────────────────────────────────────────
function PageProjets({projet,setProjet,setPage,onToast}){
  const [list,setList]=useState(()=>getProjets());
  const [confirmDel,setConfirmDel]=useState(null);
  const refresh=()=>setList(getProjets());

  const sauver=()=>{
    if(!projet.nom){onToast&&onToast("Donne d'abord un nom au projet (étape 1)","warn");setPage("projet");return;}
    const saved=sauverProjet(projet);
    setProjet(p=>({...p,_pid:saved._pid,_cree:saved._cree,_maj:saved._maj}));
    refresh();
    onToast&&onToast("Projet \""+saved.nom+"\" sauvegardé ✓","ok");
  };
  const charger=(p)=>{
    setProjet({...p});
    onToast&&onToast("Projet \""+p.nom+"\" chargé","ok");
    setPage("projet");
  };
  const dupliquer=(pid)=>{setList(dupliquerProjet(pid));onToast&&onToast("Projet dupliqué","ok");};
  const supprimer=(pid)=>{setList(supprimerProjet(pid));setConfirmDel(null);onToast&&onToast("Projet supprimé","warn");};
  const nouveau=()=>{
    setProjet({...defaultProjet,elements:[],_pid:null});
    onToast&&onToast("Nouveau projet vierge","ok");
    setPage("projet");
  };

  // Export / Import fichier
  const exporter=(p)=>{
    const blob=new Blob([JSON.stringify(p,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`GlassIQ_${(p.nom||"projet").replace(/[^a-z0-9]/gi,"_")}.json`;
    a.click();URL.revokeObjectURL(url);
  };
  const exporterTout=()=>{
    const blob=new Blob([JSON.stringify(getProjets(),null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="GlassIQ_tous_projets.json";a.click();URL.revokeObjectURL(url);
  };
  const importer=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        const arr=Array.isArray(data)?data:[data];
        const cur=getProjets();
        arr.forEach(p=>{
          if(!p._pid)p._pid=uid();
          if(cur.find(x=>x._pid===p._pid))p._pid=uid();
          p._importe=new Date().toISOString();
          cur.push(p);
        });
        saveProjets(cur);refresh();
        onToast&&onToast(arr.length+" projet(s) importé(s) ✓","ok");
      }catch(err){onToast&&onToast("Fichier invalide","warn");}
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const fmtDate=(iso)=>{if(!iso)return"—";const d=new Date(iso);return d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});};

  return <div>
    <div style={{...S.card,background:"#eff6ff",border:"1px solid #bfdbfe",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#1e40af",marginBottom:4}}>💾 Mes projets — sauvegarde & chargement</div>
      <div style={{fontSize:12,color:"#1e40af"}}>Sauvegarde tes affaires, retrouve-les, duplique-les. Exporte en fichier pour sauvegarder ailleurs ou partager avec un collègue.</div>
    </div>

    {/* Actions projet courant */}
    <div style={{...S.card,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:12,color:"#6b7280"}}>Projet en cours</div>
          <div style={{fontSize:16,fontWeight:700,color:"#1a1a2e"}}>{projet.nom||"Sans nom"}</div>
          {projet._pid&&<div style={{fontSize:11,color:"#9ca3af"}}>Dernière sauvegarde : {fmtDate(projet._maj)}</div>}
          {!projet._pid&&<div style={{fontSize:11,color:"#d97706"}}>Non sauvegardé</div>}
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={sauver} style={{...S.btnPrimary,background:"#059669"}}>💾 Sauvegarder</button>
          <button onClick={()=>exporter(projet)} style={S.btnSecondary}>⬇ Exporter ce projet</button>
          <button onClick={nouveau} style={S.btnSecondary}>＋ Nouveau projet</button>
        </div>
      </div>
    </div>

    {/* Import / export global */}
    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
      <label style={{...S.btnSecondary,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6}}>
        ⬆ Importer un fichier
        <input type="file" accept=".json,application/json" onChange={importer} style={{display:"none"}}/>
      </label>
      <button onClick={exporterTout} style={S.btnSecondary}>⬇ Exporter tous les projets</button>
    </div>

    {/* Liste des projets */}
    <div style={{fontSize:12,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>{list.length} projet{list.length>1?"s":""} enregistré{list.length>1?"s":""}</div>
    {list.length===0&&<div style={{...S.card,textAlign:"center",color:"#9ca3af",fontSize:13}}>Aucun projet enregistré. Sauvegarde ton projet en cours pour le retrouver ici.</div>}
    {list.slice().sort((a,b)=>(b._maj||"").localeCompare(a._maj||"")).map(p=>{
      const nbEl=p.elements?p.elements.length:0;
      const nbPresc=p.prescriptions?Object.keys(p.prescriptions).length:0;
      const isCurrent=p._pid===projet._pid;
      return <div key={p._pid} style={{...S.card,marginBottom:8,border:isCurrent?"2px solid #059669":"1px solid #e5e7eb"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div style={{flex:1,minWidth:200}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{fontSize:15,fontWeight:700,color:"#1a1a2e"}}>{p.nom||"Sans nom"}</div>
              {isCurrent&&<Badge color="green">en cours</Badge>}
            </div>
            <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{p.moa?p.moa+" · ":""}{nbEl} élément{nbEl>1?"s":""}{nbPresc>0?" · "+nbPresc+" prescrit"+(nbPresc>1?"s":""):""}</div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>Modifié {fmtDate(p._maj)}</div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <button onClick={()=>charger(p)} style={{...S.btnPrimary,padding:"7px 14px",fontSize:12}}>Charger</button>
            <button onClick={()=>dupliquer(p._pid)} style={{...S.btnSecondary,fontSize:12}}>Dupliquer</button>
            <button onClick={()=>exporter(p)} style={{...S.btnSecondary,fontSize:12}}>⬇</button>
            {confirmDel===p._pid
              ? <button onClick={()=>supprimer(p._pid)} style={{...S.btnSecondary,fontSize:12,background:"#fee2e2",borderColor:"#fca5a5",color:"#991b1b"}}>Confirmer ?</button>
              : <button onClick={()=>setConfirmDel(p._pid)} style={{...S.btnSecondary,fontSize:12,color:"#991b1b"}}>Supprimer</button>}
          </div>
        </div>
      </div>;
    })}

    <div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",marginTop:14,fontSize:12,color:"#92400e",lineHeight:1.5}}>
      💡 <strong>Important :</strong> les projets sont stockés dans ce navigateur. Pour ne rien perdre en cas de changement d'ordinateur ou de nettoyage du navigateur, exporte régulièrement tes projets en fichier (bouton ⬇). Tu pourras les réimporter n'importe où.
    </div>
  </div>;
}

            <td style={{padding:"7px 10px",fontWeight:600}}>{t.ratr} dB</td>
            <td style={{padding:"7px 10px"}}>{t.surf_unit} m²</td>
            <td style={{padding:"7px 10px",fontWeight:700}}>{t.surf_total} m²</td>

            <td style={{padding:"7px 10px"}}>{t.poids_total?`${t.poids_total} kg`:"—"}</td>

        <tfoot><tr style={{background:"#f0fdf4",fontWeight:700,borderTop:"2px solid #6ee7b7"}}>
          <td style={{padding:"8px 10px"}} colSpan={4}>TOTAL PROJET</td>
          <td style={{padding:"8px 10px"}}></td>
          <td style={{padding:"8px 10px",fontWeight:800}}>{T.surf_total} m²</td>
          <td style={{padding:"8px 10px"}}></td>

      <div style={{marginTop:18,paddingTop:10,borderTop:"1px solid #e5e7eb",fontSize:10,color:"#9ca3af",lineHeight:1.5}}>
        GlassIQ v2 — Métré récapitulatif par typologie · Surfaces et linéaires calculés depuis la trame déclarée · Poids estimé à partir du vitrage prescrit (densité verre 2,5 kg/m²/mm) · Valeurs indicatives à valider en phase EXE.
      </div>
    </div>
  </div>;
}

// ── PAGE FLÈCHE FAÇADE RIDEAU ──────────────────────────────────────────────
function PageFleche({projet}){
  const pression=projet.pression_pa||calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const facades=projet.elements.filter(e=>e.type==="facade");
  const [systeme,setSysteme]=useState("FW60");
  const [entraxe,setEntraxe]=useState("1.35");
  const [portee,setPortee]=useState("3.5");
  const [critere,setCritere]=useState("200");
  const [results,setResults]=useState(null);

  const chargerFacade=(el)=>{
    const af=analyseFacade(el);
    if(af){
      setEntraxe(String(af.entraxe_meneau));
      // Portée = hauteur d'étage : on prend la hauteur de la façade si < 5m, sinon on divise par niveaux probables
      const h=af.H;
      setPortee(String(h>5?+(h/Math.ceil(h/3.5)).toFixed(2):h));
    }
    if(el.soustype&&el.soustype.includes("50"))setSysteme("FW50");
    else setSysteme("FW60");
  };

  const calculer=()=>{
    if(!pression||!entraxe||!portee)return;
    const profs=profilesCompatibles(systeme,pression,+entraxe,+portee);
    setResults(profs);
  };

  return <div>
    <div style={{...S.card,background:"#eef2ff",border:"1px solid #c7d2fe",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#3730a3",marginBottom:4}}>📐 Flèche meneau façade rideau — vérification structurelle</div>
      <div style={{fontSize:12,color:"#3730a3"}}>Le meneau travaille comme une poutre sur 2 appuis (planchers) sous charge de vent. Flèche admissible : valeur usuelle L/200 — <strong>à confirmer par le DTA du système retenu</strong>, NF EN 13830 ne fixant pas de valeur universelle pour les façades rideaux (seule la flèche des châssis fenêtres/portes est fixée par le NF DTU 39 : L/150, max 15mm sous 800 Pa). Données profilés : catalogue Schüco Façades 2026.</div>
    </div>

    {!pression&&<div style={{...S.card,background:"#fff1f2",border:"1px solid #fca5a5",marginBottom:14,color:"#991b1b",fontSize:13}}>⚠ Pression de vent non calculée — renseigne d'abord la zone, le terrain et la hauteur en étape 1 ou 2.</div>}

    {facades.length>0&&<div style={{marginBottom:14}}>
      <label style={S.label}>Charger une façade du projet</label>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {facades.map((el,i)=>{
          const af=analyseFacade(el);
          return <button key={i} onClick={()=>chargerFacade(el)} style={{padding:"7px 14px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",border:"1.5px solid #c4b5fd",background:"#f5f3ff",color:"#5b21b6"}}>
            {el.label} <span style={{opacity:0.7}}>· trame {af?af.entraxe_meneau:"?"}m · {af?af.nb_meneaux:"?"} meneaux</span>
          </button>;
        })}
      </div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Système façade</label><select value={systeme} onChange={e=>setSysteme(e.target.value)} style={S.input}><option value="FW50">Schüco FWS 50</option><option value="FW60">Schüco FWS 60</option></select></div>
      <div><label style={S.label}>Entraxe meneaux (m)</label><input type="number" value={entraxe} onChange={e=>setEntraxe(e.target.value)} step="0.05" placeholder="1.35" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Largeur de trame</div></div>
      <div><label style={S.label}>Portée meneau (m)</label><input type="number" value={portee} onChange={e=>setPortee(e.target.value)} step="0.1" placeholder="3.5" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Hauteur d'étage (entre planchers)</div></div>
      <div><label style={S.label}>Critère de flèche</label><select value={critere} onChange={e=>setCritere(e.target.value)} style={S.input}><option value="200">L/200 (courant EN 13830)</option><option value="175">L/175 (admissible max)</option></select></div>
    </div>

    {pression&&<div style={{padding:"10px 16px",background:"#1a1a2e",borderRadius:10,marginBottom:14,display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Pression vent</div><div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{pression} Pa</div></div>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Charge linéique meneau</div><div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{(pression*(+entraxe||1.35)/1000).toFixed(2)} N/mm</div></div>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Flèche admissible L/{critere}</div><div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{((+portee||3.5)*1000/+critere).toFixed(1)} mm</div></div>
      <div style={{marginLeft:"auto",padding:"6px 14px",background:"rgba(240,192,64,0.15)",border:"1px solid rgba(240,192,64,0.4)",borderRadius:8}}>
        <div style={{fontSize:11,color:"rgba(240,192,64,0.8)"}}>Inertie Ix minimale requise</div>
        <div style={{fontSize:22,fontWeight:800,color:"#f0c040"}}>{inertieRequise(pression,+entraxe||1.35,+portee||3.5,+critere)} cm⁴</div>
        <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>universel — comparable à tout catalogue fabricant</div>
      </div>
    </div>}

    <button onClick={calculer} disabled={!pression} style={S.btnPrimary}>📐 Vérifier les meneaux {systeme==="FW50"?"FWS 50":"FWS 60"}</button>

    {results&&<div style={{marginTop:20}}>
      <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>{results.length} profilé{results.length>1?"s":""} meneau analysé{results.length>1?"s":""} — le plus léger qui passe est mis en avant</div>
      {(()=>{
        const okList=results.filter(p=>critere==="175"?p.calc.ok_175:p.calc.ok_200);
        const recommended=okList.length>0?okList[0]:null;
        return <>
          {recommended&&<div style={{...S.card,background:"#f0fdf4",border:"2px solid #059669",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <span style={{width:28,height:28,borderRadius:8,background:"#059669",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>★</span>
              <div><div style={{fontSize:15,fontWeight:800,color:"#1a1a2e"}}>Profilé minimum recommandé : {recommended.nom}</div><div style={{fontSize:12,color:"#6b7280"}}>Réf. Schüco {recommended.ref} · le plus léger qui satisfait L/{critere}</div></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
              <Stat label="Inertie Ix" value={`${recommended.Ix} cm⁴`} hi/>
              <Stat label="Flèche calculée" value={`${recommended.calc.fleche} mm`} hi/>
              <Stat label={`Admissible L/${critere}`} value={`${critere==="175"?recommended.calc.adm_175:recommended.calc.adm_200} mm`}/>
              <Stat label="Taux d'utilisation" value={`${Math.round(recommended.calc.ratio*100)}%`}/>
            </div>
          </div>}
          {!recommended&&<div style={{...S.card,background:"#fff1f2",border:"1.5px solid #fca5a5",marginBottom:14,color:"#991b1b",fontSize:13,fontWeight:600}}>⚠ Aucun meneau {systeme==="FW50"?"FWS 50":"FWS 60"} ne satisfait L/{critere} dans cette configuration. Il faut réduire l'entraxe, réduire la portée, ou passer à un meneau renforcé acier / un système plus profond.</div>}

          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#1a1a2e",color:"#fff"}}>{["Profilé","Réf.","Ix (cm⁴)","Flèche (mm)",`Adm. L/${critere}`,"Taux","Verdict"].map(h=><th key={h} style={{padding:"7px 10px",textAlign:"left",fontWeight:600,fontSize:12}}>{h}</th>)}</tr></thead>
            <tbody>{results.map((p,i)=>{
              const ok=critere==="175"?p.calc.ok_175:p.calc.ok_200;
              const adm=critere==="175"?p.calc.adm_175:p.calc.adm_200;
              return <tr key={i} style={{background:ok?(recommended&&p.ref===recommended.ref?"#d1fae5":"#fff"):"#fff1f2"}}>
                <td style={{padding:"7px 10px",fontWeight:600}}>{p.nom}</td>
                <td style={{padding:"7px 10px",fontFamily:"monospace",fontSize:12,color:"#6b7280"}}>{p.ref}</td>
                <td style={{padding:"7px 10px",fontWeight:700}}>{p.Ix}</td>
                <td style={{padding:"7px 10px",color:ok?"#065f46":"#991b1b",fontWeight:600}}>{p.calc.fleche}</td>
                <td style={{padding:"7px 10px",color:"#6b7280"}}>{adm}</td>
                <td style={{padding:"7px 10px"}}>{Math.round(p.calc.ratio*100)}%</td>
                <td style={{padding:"7px 10px"}}>{ok?<Badge color="green">✓ OK</Badge>:<Badge color="red">✗ Flèche</Badge>}</td>
              </tr>;
            })}</tbody>
          </table>
        </>;
      })()}
      <div style={{...S.card,background:"#f9fafb",marginTop:16,fontSize:12,color:"#6b7280",lineHeight:1.6}}>
        <strong>Méthode :</strong> meneau modélisé en poutre simplement appuyée, charge vent uniformément répartie q = pression × entraxe. Flèche f = 5qL⁴/(384·E·I) avec E<sub>alu</sub> = 70 000 N/mm². Inertie Ix = flexion sous vent (perpendiculaire à la façade). Les valeurs d'inertie sont issues du catalogue de fabrication Schüco Façades. Pour un dimensionnement définitif, valider avec une note de calcul SchüCal et tenir compte des reprises de charge réelles, du poids propre et des combinaisons ELU/ELS.
      </div>
    </div>}
  </div>;
}

// ── PAGE PARE-BALLE / COUPE-FEU ────────────────────────────────────────────
function PageSecurite({db}){
  const secSystems=db.systemes.filter(s=>s.certifications&&s.certifications.length>0);
  const [typeFilter,setTypeFilter]=useState("");
  const [classeFilter,setClasseFilter]=useState("");
  const [search,setSearch]=useState("");

  // Toutes les certifications à plat, avec référence au système
  const allCerts=[];
  secSystems.forEach(sys=>{
    sys.certifications.forEach(c=>allCerts.push({...c,sysId:sys.id,sysNom:sys.nom,sysFamille:sys.famille}));
  });

  const types=[...new Set(allCerts.map(c=>c.type))];
  const classes=[...new Set(allCerts.map(c=>c.classe))].sort();

  const filtered=allCerts.filter(c=>{
    if(typeFilter&&c.type!==typeFilter)return false;
    if(classeFilter&&c.classe!==classeFilter)return false;
    if(search){
      const s=search.toLowerCase();
      if(!c.config.toLowerCase().includes(s)&&!c.sysNom.toLowerCase().includes(s)&&!c.classe.toLowerCase().includes(s))return false;
    }
    return true;
  });

  const typeColors={"pare-balle":"purple","effraction":"red","coupe-feu":"amber","DAS":"blue"};
  const typeLabels={"pare-balle":"🛡 Pare-balle","effraction":"🔒 Anti-effraction","coupe-feu":"🔥 Coupe-feu / Pare-flammes","DAS":"🚨 DAS (Dispositif Actionné de Sécurité)"};

  // Regrouper par système pour la vue détaillée
  const bySystem={};
  filtered.forEach(c=>{
    if(!bySystem[c.sysId])bySystem[c.sysId]={nom:c.sysNom,famille:c.sysFamille,certs:[]};
    bySystem[c.sysId].certs.push(c);
  });

  return <div>
    <div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#92400e",marginBottom:4}}>🛡 Pare-balle / 🔥 Coupe-feu — recherche directe par exigence sécurité</div>
      <div style={{fontSize:12,color:"#92400e"}}>Sélectionne le type d'exigence (CCTP sécurité incendie ou résistance balistique) puis la classe demandée — les systèmes Schüco compatibles s'affichent avec leur rapport d'essai.</div>
    </div>

    {/* Filtres rapides par type */}
    <div style={{marginBottom:12}}>
      <label style={S.label}>Type d'exigence</label>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button onClick={()=>{setTypeFilter("");setClasseFilter("");}} style={{padding:"8px 16px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:"1.5px solid",background:!typeFilter?"#1a1a2e":"#f9fafb",color:!typeFilter?"#fff":"#374151",borderColor:!typeFilter?"#1a1a2e":"#e5e7eb"}}>Tous ({allCerts.length})</button>
        {types.map(t=>{
          const count=allCerts.filter(c=>c.type===t).length;
          const active=typeFilter===t;
          return <button key={t} onClick={()=>{setTypeFilter(t);setClasseFilter("");}} style={{padding:"8px 16px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:"1.5px solid",background:active?"#1a1a2e":"#f9fafb",color:active?"#fff":"#374151",borderColor:active?"#1a1a2e":"#e5e7eb"}}>{typeLabels[t]||t} ({count})</button>;
        })}
      </div>
    </div>

    {/* Filtre par classe — dépend du type sélectionné */}
    <div style={{marginBottom:14}}>
      <label style={S.label}>Classe demandée (CCTP)</label>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {[...new Set(allCerts.filter(c=>!typeFilter||c.type===typeFilter).map(c=>c.classe))].sort().map(cl=>{
          const active=classeFilter===cl;
          return <button key={cl} onClick={()=>setClasseFilter(active?"":cl)} style={{padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:600,cursor:"pointer",border:"1px solid",background:active?"#059669":"#fff",color:active?"#fff":"#374151",borderColor:active?"#059669":"#d1d5db",fontFamily:"monospace"}}>{cl}</button>;
        })}
      </div>
    </div>

    {/* Recherche libre */}
    <div style={{marginBottom:16}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher : ex. 'porte', 'façade', 'Pyrostop', 'BR4'..." style={S.input}/>
    </div>

    {/* Résultats groupés par système */}
    <div style={{fontSize:13,color:"#6b7280",marginBottom:12}}><strong>{filtered.length}</strong> certification{filtered.length>1?"s":""} trouvée{filtered.length>1?"s":""} sur <strong>{Object.keys(bySystem).length}</strong> système{Object.keys(bySystem).length>1?"s":""}</div>

    {Object.entries(bySystem).map(([sysId,data])=>(
      <div key={sysId} style={{...S.card,marginBottom:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,paddingBottom:8,borderBottom:"1px solid #f3f4f6"}}>
          <span style={{width:28,height:28,borderRadius:8,background:"#1a1a2e",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>🛡</span>
          <div><div style={{fontWeight:800,fontSize:15,color:"#1a1a2e"}}>Schüco {data.nom}</div><div style={{fontSize:12,color:"#6b7280"}}>{data.famille} · {data.certs.length} certification{data.certs.length>1?"s":""}</div></div>
        </div>
        {data.certs.map((c,i)=>(
          <div key={i} style={{display:"grid",gridTemplateColumns:"110px 1fr 150px 90px",gap:10,alignItems:"center",padding:"7px 0",borderBottom:i<data.certs.length-1?"1px solid #f3f4f6":"none"}}>
            <Badge color={typeColors[c.type]||"gray"}>{c.classe}</Badge>
            <div style={{fontSize:12,color:"#374151"}}>{c.config}{c.dims&&c.dims!=="—"?<span style={{color:"#9ca3af"}}> — {c.dims}mm</span>:""}</div>
            <div style={{fontSize:11,color:"#6b7280",fontFamily:"monospace"}}>{c.rapport}</div>
            <div style={{fontSize:11,color:"#9ca3af",textAlign:"right"}}>{c.labo}{c.date?" · "+c.date:""}</div>
          </div>
        ))}
      </div>
    ))}

    {filtered.length===0&&<div style={{padding:14,background:"#fff1f2",borderRadius:10,color:"#991b1b",fontSize:13}}>Aucune certification trouvée pour ces critères</div>}

    {/* Message explicite : cas fréquent façade + anti-effraction, aucune donnée en base */}
    {typeFilter==="effraction"&&!allCerts.some(c=>c.type==="effraction"&&c.sysFamille==="Façade")&&<div style={{marginTop:10,padding:"12px 16px",background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:10,fontSize:12,color:"#1e40af",lineHeight:1.5}}>
      ℹ️ <strong>Aucun système Façade n'a de certification anti-effraction (RC/WK) dans la base actuellement</strong> — seuls des systèmes Porte/Fenêtre (Royal PB, AWS 90 BR) en ont. Ce n'est pas un problème d'affichage : ce sont des données manquantes. Si tu as un DTA ou PV d'essai anti-effraction pour un système façade (ex. une déclinaison RC de FWS 50/60), transmets-le pour intégration.
    </div>}

    {/* Légende classes */}
    <div style={{...S.card,background:"#f9fafb",marginTop:16}}>
      <div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>Repères classes</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,fontSize:12,color:"#6b7280",lineHeight:1.7}}>
        <div>
          <strong>🛡 Pare-balle (FB / FSG)</strong><br/>
          FB4 → arme de poing calibre .357 Mag<br/>
          FB5 → fusil semi-auto calibre 7.62×51<br/>
          FB6 → fusil d'assaut calibre 7.62×51 AP<br/>
          (S) = avec éclats / (NS) = sans éclats
        </div>
        <div>
          <strong>🔥 Coupe-feu / Pare-flammes (E / EI / EW)</strong><br/>
          E → étanchéité aux flammes seule<br/>
          EW → étanchéité + rayonnement limité<br/>
          EI → étanchéité + isolation thermique<br/>
          30/60/120 → durée en minutes
        </div>
      </div>
    </div>
  </div>;
}

// ── PAGE BASE ─────────────────────────────────────────────────────────────
function PageBase({db,onUpdate}){
  const normalSystems=db.systemes.filter(s=>!s.certifications);
  const marques=[...new Set(normalSystems.map(s=>s.marque))];
  const [ma,setMa]=useState(marques[0]||"");
  const [sel,setSel]=useState(normalSystems[0]?.id);
  const sys=normalSystems.find(s=>s.id===sel);
  return <div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
      {marques.map(m=><button key={m} onClick={()=>{setMa(m);const f=normalSystems.find(s=>s.marque===m);if(f)setSel(f.id);}} style={{padding:"6px 14px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",background:ma===m?"#1a1a2e":"#f3f4f6",color:ma===m?"#fff":"#374151",border:ma===m?"2px solid #1a1a2e":"2px solid #e5e7eb"}}>{m}</button>)}
    </div>
    <div style={{marginBottom:16}}><select value={sel} onChange={e=>setSel(e.target.value)} style={{...S.input,fontWeight:600,color:"#4f46e5",borderColor:"#c7d2fe",background:"#f1f0ff"}}>{normalSystems.filter(s=>s.marque===ma).map(s=><option key={s.id} value={s.id}>{s.nom} — {s.famille}</option>)}</select></div>
    {sys&&<div>
      <div style={{...S.card,background:"#f9fafb"}}><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}><Stat label="Marque" value={sys.marque}/><Stat label="Famille" value={sys.famille}/><Stat label="DTA" value={sys.dta||"—"} mono/><Stat label="Validité" value={sys.validite||"—"}/></div></div>
      {sys.tests.map((test,ti)=><div key={ti} style={{marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <div><div style={{fontWeight:700,color:"#1a1a2e",fontSize:14}}>{test.type_chassis}</div><div style={{fontSize:12,color:"#6b7280"}}>Rapport {test.rapport} · {test.labo} {test.date} · {test.dim_L}×{test.dim_H}mm</div></div>
          <Badge color="blue">PV certifié</Badge>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#1a1a2e",color:"#fff"}}>{["Composition","Rw","Rw+C","Rw+Ctr"].map(h=><th key={h} style={{padding:"7px 12px",textAlign:"left",fontWeight:600}}>{h}</th>)}</tr></thead>
          <tbody>{test.vitrages.map((v,vi)=><tr key={vi} style={{background:vi%2===0?"#fff":"#f9fafb"}}><td style={{padding:"8px 12px",fontFamily:"monospace",fontWeight:600}}>{v.composition}</td><td style={{padding:"8px 12px",fontWeight:700}}>{v.rw} dB</td><td style={{padding:"8px 12px"}}>{v.rwc} dB</td><td style={{padding:"8px 12px"}}>{v.rwctr} dB</td></tr>)}</tbody>
        </table>
      </div>)}
      {sys.aev&&sys.aev.length>0&&<div style={{marginTop:18}}>
        <div style={{fontSize:12,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>Classements AEV certifiés</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#0f3460",color:"#fff"}}>{["Châssis","Dimensions","Air","Eau","Vent","Rapport","Date"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",fontWeight:600}}>{h}</th>)}</tr></thead>
          <tbody>{sys.aev.map((a,ai)=><tr key={ai} style={{background:ai%2===0?"#fff":"#f0f4ff"}}><td style={{padding:"7px 10px"}}>{a.chassis}</td><td style={{padding:"7px 10px",fontFamily:"monospace"}}>{a.dims}</td><td style={{padding:"7px 10px",fontWeight:700,color:"#1e40af"}}>{a.A}</td><td style={{padding:"7px 10px",fontWeight:700,color:"#1e40af"}}>{a.E}</td><td style={{padding:"7px 10px",fontWeight:700,color:"#1e40af"}}>{a.V}</td><td style={{padding:"7px 10px",fontSize:11,color:"#6b7280",fontFamily:"monospace"}}>{a.rapport}</td><td style={{padding:"7px 10px",fontSize:11,color:"#6b7280"}}>{a.date}</td></tr>)}</tbody>
        </table>
      </div>}
    </div>}
  </div>;
}

// ── PAGE AJOUTER ──────────────────────────────────────────────────────────
function PageAjouter({db,onUpdate}){
  const [prompt,setPrompt]=useState("");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState(null);
  const analyser=async()=>{
    setLoading(true);setError(null);setResult(null);
    if(!prompt.trim()){setLoading(false);return;}
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`Expert vitrages alu. Extrait données acoustiques, retourne UNIQUEMENT JSON valide (sans markdown):
{"id":"id","nom":"nom","marque":"fab","famille":"Fenêtre|Porte|Façade","dta":"","validite":"","epaisseur_min":24,"epaisseur_max":48,"poids_max":130,"tests":[{"rapport":"","type_chassis":"","dim_L":1230,"dim_H":1480,"labo":"","date":"","vitrages":[{"composition":"","rw":0,"rwc":0,"rwctr":0}]}],"thermique":[]}
Texte: ${prompt}`}]})});
      const d=await r.json();
      const txt=d.content?.map(i=>i.text||"").join("")||"";
      setResult(JSON.parse(txt.replace(/```json|```/g,"").trim()));
    }catch(err){setError("Impossible d'analyser. Vérifiez que le texte contient des données acoustiques.");}
    setLoading(false);
  };
  const confirmer=()=>{
    if(!result)return;
    const ex=db.systemes.find(s=>s.id===result.id);
    onUpdate({...db,systemes:ex?db.systemes.map(s=>s.id===result.id?result:s):[...db.systemes,result]});
    setResult(null);setPrompt("");
  };
  return <div>
    <div style={{...S.card,background:"#f9fafb",marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:600,color:"#374151"}}>🤖 Ajout par IA — collez les données d'un DTA ou rapport acoustique</div>
      <div style={{fontSize:12,color:"#6b7280",marginTop:4}}>L'IA extrait automatiquement compositions, Rw, Rw+C, Rw+Ctr.</div>
    </div>
    <textarea value={prompt} onChange={e=>setPrompt(e.target.value)} placeholder={"Ex: Schüco AWS 60, rapport BEB2.C.6053-3, OB 1250x2500mm, CEBTP 2015\n4/16/4 → Rw 34, Rw+C 33, Rw+Ctr 30\n44.2S/16/4 → Rw 38, Rw+C 37, Rw+Ctr 33"} rows={7} style={{...S.input,fontFamily:"monospace",fontSize:13,marginBottom:12}}/>
    <button onClick={analyser} disabled={loading||!prompt.trim()} style={S.btnPrimary}>{loading?"Analyse IA…":"🤖 Analyser avec l'IA"}</button>
    {error&&<div style={{marginTop:12,padding:"12px 16px",background:"#fff1f2",border:"1px solid #fca5a5",borderRadius:10,color:"#991b1b",fontSize:13}}>{error}</div>}
    {result&&<div style={{marginTop:14,...S.card,background:"#f0fdf4",border:"1.5px solid #6ee7b7"}}>
      <div style={{fontWeight:700,color:"#065f46",marginBottom:8}}>✓ {result.nom} ({result.marque}) — {result.tests?.length||0} rapport(s), {result.tests?.reduce((a,t)=>a+t.vitrages.length,0)||0} composition(s)</div>
      {result.tests?.map((t,i)=><div key={i} style={{fontSize:12,color:"#374151",marginBottom:3}}><strong>{t.type_chassis}</strong> — {t.vitrages.map(v=>`${v.composition} (Rw ${v.rw})`).join(", ")}</div>)}
      <div style={{display:"flex",gap:10,marginTop:10}}><button onClick={confirmer} style={S.btnPrimary}>✓ Ajouter à la base</button><button onClick={()=>setResult(null)} style={S.btnSecondary}>Annuler</button></div>
    </div>}
  </div>;
}

// ── APP PRINCIPALE ────────────────────────────────────────────────────────
function App(){
  const [db,setDB]=useState(()=>getDB());
  const [page,setPage]=useState("projet");
  const [projet,setProjet]=useState(defaultProjet);
  const [toast,setToast]=useState(null);
  const handleUpdate=(newDB)=>{setDB(newDB);saveDB(newDB);};
  const showToast=(msg,type)=>{setToast({msg,type});setTimeout(()=>setToast(null),2800);};
  // Auto-sauvegarde silencieuse du projet courant s'il a déjà été sauvegardé une fois
  useEffect(()=>{
    if(projet._pid&&projet.nom){
      const t=setTimeout(()=>{sauverProjet(projet);},1500);
      return ()=>clearTimeout(t);
    }
  },[projet]);
  const pages=[
    {id:"projet",label:"Projet & CCTP",icon:"📋"},
    {id:"vent",label:"Calcul vent",icon:"💨"},
    {id:"comparateur",label:"Comparateur",icon:"⚖"},
    {id:"controle",label:"Contrôle solaire",icon:"☀"},
    {id:"prescription",label:"Prescription",icon:"📄"},
    {id:"metre",label:"Métré",icon:"📐"},
    {id:"fleche",label:"Flèche façade",icon:"📏"},
    {id:"securite",label:"Pare-balle / Coupe-feu",icon:"🛡"},
    {id:"projets",label:"Mes projets",icon:"💾"},
    {id:"base",label:"Ma base",icon:"📚"},
    {id:"ajouter",label:"Ajouter système",icon:"＋"},
  ];
  return <div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",minHeight:"100vh",background:"#f8f9fb"}}>
    <div style={{background:"#1a1a2e",color:"#fff",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid rgba(255,255,255,0.08)",flexWrap:"wrap",gap:4}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 0"}}>
        <div style={{width:30,height:30,borderRadius:8,background:"linear-gradient(135deg,#4ade80,#22c55e)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>🪟</div>
        <div><div style={{fontWeight:800,fontSize:15}}>GlassIQ v2</div><div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>Workflow complet — 5 étapes</div></div>
        {projet.nom&&<div style={{marginLeft:12,fontSize:12,color:"rgba(255,255,255,0.5)",fontStyle:"italic"}}>{projet.nom}</div>}
      </div>
      <nav style={{display:"flex",gap:2,flexWrap:"wrap"}}>
        {pages.map(p=><button key={p.id} onClick={()=>setPage(p.id)} style={{padding:"7px 11px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",border:"none",background:page===p.id?"rgba(255,255,255,0.12)":"transparent",color:page===p.id?"#fff":"rgba(255,255,255,0.5)"}}>
          {p.icon} {p.label}{p.id==="projet"&&projet.elements.length>0?<span style={{marginLeft:4,background:"#22c55e",color:"#fff",borderRadius:10,padding:"1px 5px",fontSize:10}}>{projet.elements.length}</span>:""}
        </button>)}
      </nav>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 0"}}>
        <a href="priceiq/index.html" style={{padding:"6px 12px",borderRadius:8,fontSize:12,fontWeight:700,textDecoration:"none",background:"rgba(240,192,64,0.15)",color:"#f0c040",border:"1px solid rgba(240,192,64,0.3)",display:"flex",alignItems:"center",gap:5}}>💰 PriceIQ</a>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{db.systemes.length} systèmes</div>
      </div>
    </div>
    <div style={{maxWidth:960,margin:"0 auto",padding:"22px 16px"}}>
      {page==="projet"&&<PageProjet projet={projet} setProjet={setProjet} setPage={setPage}/>}
      {page==="vent"&&<PageVent projet={projet} setProjet={setProjet} setPage={setPage}/>}
      {page==="fenetrage_chassis"&&<PageFenetrageChassis projet={projet} setProjet={setProjet} setPage={setPage}/>}
      {page==="comparateur"&&<PageComparateur db={db} projet={projet} setProjet={setProjet} setPage={setPage}/>}
      {page==="controle"&&<PageControleSolaire projet={projet} setProjet={setProjet}/>}
      {page==="prescription"&&<PagePrescription projet={projet} setProjet={setProjet} setPage={setPage}/>}
      {page==="metre"&&<PageMetre projet={projet}/>}
      {page==="fleche"&&<PageFleche projet={projet}/>}
      {page==="securite"&&<PageSecurite db={db}/>}
      {page==="projets"&&<PageProjets projet={projet} setProjet={setProjet} setPage={setPage} onToast={showToast}/>}
      {page==="base"&&<PageBase db={db} onUpdate={handleUpdate}/>}
      {page==="ajouter"&&<PageAjouter db={db} onUpdate={handleUpdate}/>}
    </div>
    {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:toast.type==="warn"?"#92400e":"#065f46",color:"#fff",padding:"12px 24px",borderRadius:10,fontSize:13,fontWeight:600,boxShadow:"0 8px 24px rgba(0,0,0,0.2)",zIndex:1000}}>{toast.msg}</div>}
  </div>;
}

const container=document.getElementById('root');
const root=ReactDOM.createRoot(container);
root.render(React.createElement(App));
</script>
</body>
</html>
