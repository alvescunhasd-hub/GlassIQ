  return {id:s.id||"",nom:str(s.nom),marque:str(s.marque),famille:FAMILLES_SAISIE.includes(s.famille)?s.famille:"Fenêtre",dta:str(s.dta),validite:str(s.validite),
    epaisseur_min:str(s.epaisseur_min),epaisseur_max:str(s.epaisseur_max),poids_max:str(s.poids_max),vantaux_defaut:str(s.vantaux_defaut),note:str(s.note),
    tests:(s.tests||[]).map(t=>({rapport:str(t.rapport),type_chassis:str(t.type_chassis),dim_L:str(t.dim_L),dim_H:str(t.dim_H),labo:str(t.labo),date:str(t.date),
      vitrages:(t.vitrages||[]).map(v=>({composition:str(v.composition),rw:str(v.rw),rwc:str(v.rwc),rwctr:str(v.rwctr)}))})),
    aev:(s.aev||[]).map(a=>({chassis:str(a.chassis),dims:str(a.dims),A:str(a.A),E:str(a.E),V:str(a.V),rapport:str(a.rapport),date:str(a.date)})),
    thermique:(s.thermique||[]).map(t=>({ug:str(t.ug),config:str(t.config),uw:str(t.uw)})),
    dimensions_max:(s.dimensions_max||[]).map(d=>({type:str(d.type),l_max:str(d.l_max!=null?d.l_max:d.L),h_max:str(d.h_max!=null?d.h_max:d.H)}))};
}
function nombreSaisi(v){const x=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(x)?x:null;}
function formVersSysteme(f){
  const n=nombreSaisi, t=v=>String(v||"").trim();
  const sys={id:f.id||("perso_"+Date.now().toString(36)),perso:true,nom:t(f.nom),marque:t(f.marque),famille:f.famille,dta:t(f.dta),validite:t(f.validite),
    epaisseur_min:n(f.epaisseur_min),epaisseur_max:n(f.epaisseur_max),poids_max:n(f.poids_max),note:t(f.note),
    tests:f.tests.map(x=>({rapport:t(x.rapport),type_chassis:t(x.type_chassis),dim_L:n(x.dim_L)||1230,dim_H:n(x.dim_H)||1480,labo:t(x.labo),date:t(x.date),
      vitrages:x.vitrages.filter(v=>t(v.composition)&&n(v.rwctr)!=null).map(v=>({composition:t(v.composition),rw:n(v.rw),rwc:n(v.rwc),rwctr:n(v.rwctr)}))}))
      .filter(x=>x.vitrages.length>0),
    aev:f.aev.filter(a=>t(a.chassis)||t(a.V)).map(a=>({chassis:t(a.chassis),dims:t(a.dims),A:t(a.A),E:t(a.E),V:t(a.V),rapport:t(a.rapport),date:t(a.date)})),
    thermique:f.thermique.filter(x=>n(x.uw)!=null).map(x=>({ug:n(x.ug),config:t(x.config),uw:n(x.uw)})),
    dimensions_max:f.dimensions_max.filter(d=>n(d.l_max)&&n(d.h_max)).map(d=>({type:t(d.type),l_max:n(d.l_max),h_max:n(d.h_max)}))};
  if(n(f.vantaux_defaut))sys.vantaux_defaut=n(f.vantaux_defaut);
  return sys;
}
function erreursForm(f){
  const e=[], n=nombreSaisi;
  if(!String(f.nom).trim())e.push("Nom du système obligatoire");
  if(!String(f.marque).trim())e.push("Marque obligatoire");
  const mi=n(f.epaisseur_min),ma=n(f.epaisseur_max);
  if(!(mi>0)||!(ma>0)||mi>ma)e.push("Feuillure : épaisseurs min / max invalides");
  if(!(n(f.poids_max)>0))e.push("Poids max (ferrure ou appui vitrage) obligatoire");
  if(String(f.validite).trim()&&!/^\d{2}\/\d{2}\/\d{4}$/.test(String(f.validite).trim()))e.push("Validité DTA : format JJ/MM/AAAA (ou laisser vide)");
  return e;
}
function avertissementsForm(f){
  const w=[];
  const vit=f.tests.flatMap(t=>t.vitrages).filter(v=>String(v.composition).trim());
  if(!vit.length)w.push("Aucun PV acoustique : le système n'apparaîtra pas dans le comparateur (seulement dans « Ma base » et le vérificateur de vitrage libre).");
  vit.forEach(v=>{
    if(!analyseComposition(String(v.composition).trim()))w.push(`« ${v.composition} » non reconnue : poids, feuillure et résistance ne pourront pas être calculés (format ex. 10/16/44.2s).`);
    if(nombreSaisi(v.rwctr)==null)w.push(`« ${v.composition} » : Rw+Ctr manquant — ligne ignorée.`);
  });
  if(!String(f.dta).trim())w.push("Sans DTA : le comparateur affichera « validité non renseignée » (non bloquant).");
  return w;
}

function PageAjouter({db,onChange}){
  const [form,setForm]=useEtatModule("ajouter.brouillon",formVide);
  const [perso,setPerso]=useState(()=>getPerso());
  const [msg,setMsg]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);
  const [srcId,setSrcId]=useEtatModule("ajouter.source","");
  const refresh=()=>{setPerso(getPerso());onChange&&onChange();};
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const setRow=(list,i,k,v)=>setForm(f=>({...f,[list]:f[list].map((r,j)=>j===i?{...r,[k]:v}:r)}));
  const addRow=(list,row)=>setForm(f=>({...f,[list]:[...f[list],row]}));
  const delRow=(list,i)=>setForm(f=>({...f,[list]:f[list].filter((_,j)=>j!==i)}));
  const setTest=(ti,k,v)=>setForm(f=>({...f,tests:f.tests.map((t,j)=>j===ti?{...t,[k]:v}:t)}));
  const setVit=(ti,vi,k,v)=>setForm(f=>({...f,tests:f.tests.map((t,j)=>j===ti?{...t,vitrages:t.vitrages.map((x,m)=>m===vi?{...x,[k]:v}:x)}:t)}));
  const addVit=(ti)=>setForm(f=>({...f,tests:f.tests.map((t,j)=>j===ti?{...t,vitrages:[...t.vitrages,{composition:"",rw:"",rwc:"",rwctr:""}]}:t)}));
  const delVit=(ti,vi)=>setForm(f=>({...f,tests:f.tests.map((t,j)=>j===ti?{...t,vitrages:t.vitrages.filter((_,m)=>m!==vi)}:t)}));
  const erreurs=erreursForm(form), avert=avertissementsForm(form);

  const enregistrer=()=>{
    if(erreurs.length)return;
    const sys=formVersSysteme(form);
    const list=getPerso();
    const idx=list.findIndex(s=>s.id===sys.id);
    if(idx>=0)list[idx]=sys; else list.push(sys);
    if(!savePerso(list)){setMsg({t:"warn",m:"Échec de l'enregistrement (stockage du navigateur plein ou bloqué)."});return;}
    refresh(); setForm(formVide());
    setMsg({t:"ok",m:`« ${sys.marque} ${sys.nom} » enregistré ✓ — disponible dans le comparateur et dans Ma base.`});
  };
  const editer=(s)=>{setForm(systemeVersForm(s));setMsg({t:"ok",m:`Modification de « ${s.marque} ${s.nom} » — enregistre pour valider.`});try{window.scrollTo(0,0);}catch(e){}};
  const partirDe=()=>{
    const s=db.systemes.find(x=>x.id===srcId);if(!s)return;
    const f=systemeVersForm(s);
    setForm({...f,id:"",nom:f.nom+" (variante)"});setSrcId("");
    setMsg({t:"ok",m:`Données copiées depuis ${s.marque} ${s.nom} — modifie puis enregistre. L'original n'est pas touché.`});
  };
  const supprimer=(id)=>{savePerso(getPerso().filter(s=>s.id!==id));setConfirmDel(null);if(form.id===id)setForm(formVide());refresh();};
  const exporter=()=>{
    const blob=new Blob([JSON.stringify(getPerso(),null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download="EME_Facade_mes_systemes.json";a.click();URL.revokeObjectURL(url);
  };
  const importer=(e)=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        const arr=(Array.isArray(data)?data:[data]).filter(s=>s&&typeof s==="object"&&s.nom&&s.famille);
        if(!arr.length)throw new Error("vide");
        const ids=new Set(INITIAL_DB.systemes.map(s=>s.id));
        const list=getPerso();
        arr.forEach(s=>{
          const sys={tests:[],aev:[],thermique:[],...s,perso:true};
          if(!sys.id||ids.has(sys.id))sys.id="perso_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
          const idx=list.findIndex(x=>x.id===sys.id);
          if(idx>=0)list[idx]=sys; else list.push(sys);
        });
        savePerso(list);refresh();
        setMsg({t:"ok",m:`${arr.length} système(s) importé(s) ✓`});
      }catch(err){setMsg({t:"warn",m:"Fichier invalide — attendu : export « Mes systèmes » d'EME Façade (ou de GlassIQ)."});}
    };
    reader.readAsText(file);
    e.target.value="";
  };

  // Aides de saisie (fonctions — pas des composants — pour garder le focus pendant la frappe)
  const inp=(value,onCh,ph,extra)=><input value={value} placeholder={ph||""} onChange={e=>onCh(e.target.value)} style={{...S.input,padding:"6px 8px",fontSize:12,...(extra||{})}}/>;
  const lab=(t)=><label style={{...S.label,fontSize:9,marginBottom:3}}>{t}</label>;
  const titre=(t,sous)=><div style={{marginBottom:8}}><div style={{fontSize:12,fontWeight:700,color:"#1a1a2e",textTransform:"uppercase",letterSpacing:"0.05em"}}>{t}</div>{sous&&<div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{sous}</div>}</div>;
  const btnX=(onClick)=><button onClick={onClick} style={{padding:"6px 9px",borderRadius:6,border:"1px solid #fca5a5",background:"#fee2e2",color:"#991b1b",cursor:"pointer",fontSize:11}}>✕</button>;
  const btnAdd=(t,onClick)=><button onClick={onClick} style={{...S.btnSecondary,fontSize:11,padding:"5px 10px"}}>{t}</button>;

  return <div>
    <div style={{...S.card,background:"#f9fafb",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#1a1a2e",marginBottom:4}}>＋ Ajouter / gérer mes systèmes</div>
      <div style={{fontSize:12,color:"#6b7280",lineHeight:1.5}}>Saisie manuelle, <strong>même sans DTA</strong>. Les systèmes livrés avec EME Façade (Schüco…) ne sont jamais modifiés : tes ajouts sont stockés dans ce navigateur — pense à les <strong>exporter</strong> pour les sauvegarder ou les transmettre.</div>
    </div>
    {msg&&<div style={{...S.card,padding:"10px 14px",background:msg.t==="ok"?"#f0fdf4":"#fff7ed",border:`1px solid ${msg.t==="ok"?"#bbf7d0":"#fed7aa"}`,color:msg.t==="ok"?"#065f46":"#9a3412",fontSize:12,fontWeight:600}}>{msg.m}</div>}

    <div style={{...S.card,display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap"}}>
      <div style={{flex:1,minWidth:240}}>{lab("Partir d'un système existant (copie modifiable)")}<select value={srcId} onChange={e=>setSrcId(e.target.value)} style={{...S.input,padding:"6px 8px",fontSize:12}}><option value="">— choisir —</option>{db.systemes.filter(s=>!s.certifications).map(s=><option key={s.id} value={s.id}>{s.marque} {s.nom} — {s.famille}</option>)}</select></div>
      <button onClick={partirDe} disabled={!srcId} style={{...S.btnSecondary,opacity:srcId?1:0.5}}>Copier</button>
      {(form.id||form.nom)&&<button onClick={()=>{setForm(formVide());setMsg(null);}} style={S.btnSecondary}>Vider le formulaire</button>}
    </div>

    <div style={S.card}>
      {titre(form.id?"Modifier le système":"Identification")}
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>
        <div>{lab("Nom du système *")}{inp(form.nom,v=>setF("nom",v),"ex : AWS 75.SI+")}</div>
        <div>{lab("Marque *")}{inp(form.marque,v=>setF("marque",v),"Schüco")}</div>
        <div>{lab("Famille *")}<select value={form.famille} onChange={e=>setF("famille",e.target.value)} style={{...S.input,padding:"6px 8px",fontSize:12}}>{FAMILLES_SAISIE.map(f=><option key={f}>{f}</option>)}</select></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        <div>{lab("N° DTA / Avis technique")}{inp(form.dta,v=>setF("dta",v),"vide si pas de DTA")}</div>
        <div>{lab("Validité DTA (JJ/MM/AAAA)")}{inp(form.validite,v=>setF("validite",v),"ex : 31/01/2029")}</div>
        <div>{lab("Vantaux par défaut")}{inp(form.vantaux_defaut,v=>setF("vantaux_defaut",v),"auto")}</div>
      </div>
    </div>

    <div style={S.card}>
      {titre("Mécanique","Feuillure = plage d'épaisseur de vitrage admise · poids max = ferrure (ouvrant) ou appui vitrage (façade)")}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        <div>{lab("Épaisseur vitrage min (mm) *")}{inp(form.epaisseur_min,v=>setF("epaisseur_min",v),"24")}</div>
        <div>{lab("Épaisseur vitrage max (mm) *")}{inp(form.epaisseur_max,v=>setF("epaisseur_max",v),"48")}</div>
        <div>{lab("Poids max (kg) *")}{inp(form.poids_max,v=>setF("poids_max",v),"130")}</div>
      </div>
    </div>

    <div style={S.card}>
      {titre("PV acoustiques","Une ligne par composition testée — Rw+Ctr (= RA,tr) obligatoire pour le comparateur. Composition notée extérieur → intérieur.")}
      {form.tests.map((t,ti)=><div key={ti} style={{border:"1px solid #e5e7eb",borderRadius:8,padding:"10px 12px",marginBottom:10,background:"#fafafa"}}>
        <div style={{display:"grid",gridTemplateColumns:"1.3fr 1.6fr 0.8fr 0.8fr 1fr 0.7fr auto",gap:6,alignItems:"end",marginBottom:8}}>
          <div>{lab("Rapport")}{inp(t.rapport,v=>setTest(ti,"rapport",v),"BEB2…")}</div>
          <div>{lab("Châssis testé")}{inp(t.type_chassis,v=>setTest(ti,"type_chassis",v),"Fenêtre 1 vantail OB")}</div>
          <div>{lab("L essai (mm)")}{inp(t.dim_L,v=>setTest(ti,"dim_L",v),"1230")}</div>
          <div>{lab("H essai (mm)")}{inp(t.dim_H,v=>setTest(ti,"dim_H",v),"1480")}</div>
          <div>{lab("Labo")}{inp(t.labo,v=>setTest(ti,"labo",v),"CEBTP")}</div>
          <div>{lab("Année")}{inp(t.date,v=>setTest(ti,"date",v),"2024")}</div>
          {btnX(()=>delRow("tests",ti))}
        </div>
        {t.vitrages.map((v,vi)=>{
          const ok=!String(v.composition).trim()||!!analyseComposition(String(v.composition).trim());
          return <div key={vi} style={{display:"grid",gridTemplateColumns:"2fr 0.7fr 0.7fr 0.7fr auto",gap:6,alignItems:"end",marginBottom:4}}>
            <div>{vi===0&&lab("Composition")}{inp(v.composition,x=>setVit(ti,vi,"composition",x),"10/16/44.2s",ok?null:{borderColor:"#fca5a5",background:"#fff1f2"})}</div>
            <div>{vi===0&&lab("Rw")}{inp(v.rw,x=>setVit(ti,vi,"rw",x),"dB")}</div>
            <div>{vi===0&&lab("Rw+C")}{inp(v.rwc,x=>setVit(ti,vi,"rwc",x),"dB")}</div>
            <div>{vi===0&&lab("Rw+Ctr *")}{inp(v.rwctr,x=>setVit(ti,vi,"rwctr",x),"dB")}</div>
            {btnX(()=>delVit(ti,vi))}
          </div>;
        })}
        <div style={{marginTop:6}}>{btnAdd("+ composition",()=>addVit(ti))}</div>
      </div>)}
      {btnAdd("+ PV acoustique",()=>addRow("tests",{rapport:"",type_chassis:"",dim_L:"1230",dim_H:"1480",labo:"",date:"",vitrages:[{composition:"",rw:"",rwc:"",rwctr:""}]}))}
    </div>

    <div style={S.card}>
      {titre("Essais AEV","Vent (V) : classe EN 12210 (C3, B2…) ou pression d'essai en Pa pour une façade (ex. 1200/1800)")}
      {form.aev.map((a,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 0.6fr 0.6fr 0.8fr 1.2fr 0.6fr auto",gap:6,alignItems:"end",marginBottom:4}}>
        <div>{i===0&&lab("Châssis testé")}{inp(a.chassis,v=>setRow("aev",i,"chassis",v),"PF 2 vantaux")}</div>
        <div>{i===0&&lab("Dimensions")}{inp(a.dims,v=>setRow("aev",i,"dims",v),"1600x2250")}</div>
        <div>{i===0&&lab("A")}{inp(a.A,v=>setRow("aev",i,"A",v),"4")}</div>
        <div>{i===0&&lab("E")}{inp(a.E,v=>setRow("aev",i,"E",v),"9A")}</div>
        <div>{i===0&&lab("V")}{inp(a.V,v=>setRow("aev",i,"V",v),"C3")}</div>
        <div>{i===0&&lab("Rapport")}{inp(a.rapport,v=>setRow("aev",i,"rapport",v),"")}</div>
        <div>{i===0&&lab("Année")}{inp(a.date,v=>setRow("aev",i,"date",v),"")}</div>
        {btnX(()=>delRow("aev",i))}
      </div>)}
      {btnAdd("+ essai AEV",()=>addRow("aev",{chassis:"",dims:"",A:"",E:"",V:"",rapport:"",date:""}))}
    </div>

    <div style={S.card}>
      {titre("Thermique (Uw)","Configuration : commence par « Fenêtre » ou « Porte-fenêtre » et précise « 1 vtl » / « 2 vtx » — le comparateur choisit ainsi la bonne ligne")}
      {form.thermique.map((t,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"3fr 0.7fr 0.7fr auto",gap:6,alignItems:"end",marginBottom:4}}>
        <div>{i===0&&lab("Configuration")}{inp(t.config,v=>setRow("thermique",i,"config",v),"Fenêtre 1 vtl 1.25x1.48 (Swisspacer)")}</div>
        <div>{i===0&&lab("Ug")}{inp(t.ug,v=>setRow("thermique",i,"ug",v),"1.1")}</div>
        <div>{i===0&&lab("Uw")}{inp(t.uw,v=>setRow("thermique",i,"uw",v),"1.4")}</div>
        {btnX(()=>delRow("thermique",i))}
      </div>)}
      {btnAdd("+ ligne thermique",()=>addRow("thermique",{ug:"",config:"",uw:""}))}
    </div>

    <div style={S.card}>
      {titre("Domaine d'emploi (dimensions max)","Type : ex. « 1 vantail OB », « 2 vantaux OF », « 2 vantaux + fixe latéral »")}
      {form.dimensions_max.map((d,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr auto",gap:6,alignItems:"end",marginBottom:4}}>
        <div>{i===0&&lab("Type")}{inp(d.type,v=>setRow("dimensions_max",i,"type",v),"1 vantail OB")}</div>
        <div>{i===0&&lab("L max (mm)")}{inp(d.l_max,v=>setRow("dimensions_max",i,"l_max",v),"1150")}</div>
        <div>{i===0&&lab("H max (mm)")}{inp(d.h_max,v=>setRow("dimensions_max",i,"h_max",v),"1775")}</div>
        {btnX(()=>delRow("dimensions_max",i))}
      </div>)}
      {btnAdd("+ ligne",()=>addRow("dimensions_max",{type:"",l_max:"",h_max:""}))}
    </div>

    <div style={S.card}>
      {titre("Note")}
      <textarea value={form.note} onChange={e=>setF("note",e.target.value)} rows={3} placeholder="Source des données, réserves, contact fabricant…" style={{...S.input,fontSize:12}}/>
    </div>

    {erreurs.length>0&&<div style={{...S.card,background:"#fef2f2",border:"1px solid #fecaca",fontSize:12,color:"#991b1b"}}>{erreurs.map((e,i)=><div key={i}>✗ {e}</div>)}</div>}
    {avert.length>0&&<div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",fontSize:12,color:"#92400e"}}>{avert.map((w,i)=><div key={i}>⚠ {w}</div>)}</div>}
    <div style={{display:"flex",gap:10,marginBottom:20}}>
      <button onClick={enregistrer} disabled={erreurs.length>0} style={{...S.btnPrimary,background:"#059669",opacity:erreurs.length?0.5:1,cursor:erreurs.length?"not-allowed":"pointer"}}>{form.id?"✓ Enregistrer les modifications":"✓ Ajouter à ma base"}</button>
    </div>

    <div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:10}}>
        <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>Mes systèmes ajoutés ({perso.length})</div>
        <div style={{display:"flex",gap:8}}>
          <label style={{...S.btnSecondary,cursor:"pointer",display:"inline-flex",alignItems:"center"}}>⬆ Importer<input type="file" accept=".json,application/json" onChange={importer} style={{display:"none"}}/></label>
          <button onClick={exporter} disabled={!perso.length} style={{...S.btnSecondary,opacity:perso.length?1:0.5}}>⬇ Exporter</button>
        </div>
      </div>
      {perso.length===0&&<div style={{fontSize:12,color:"#9ca3af"}}>Aucun système ajouté pour l'instant.</div>}
      {perso.map(s=><div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderTop:"1px solid #f3f4f6",flexWrap:"wrap",gap:8}}>
        <div><div style={{fontWeight:700,fontSize:13}}>{s.marque} {s.nom} <span style={{fontWeight:400,color:"#6b7280",fontSize:12}}>· {s.famille}</span></div>
          <div style={{fontSize:11,color:"#9ca3af"}}>{s.dta?"DTA "+s.dta:"sans DTA"} · {(s.tests||[]).reduce((n,t)=>n+(t.vitrages||[]).length,0)} composition(s) · {(s.aev||[]).length} essai(s) AEV</div></div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>editer(s)} style={{...S.btnSecondary,fontSize:12}}>Modifier</button>
          {confirmDel===s.id
            ?<button onClick={()=>supprimer(s.id)} style={{...S.btnSecondary,fontSize:12,background:"#fee2e2",borderColor:"#fca5a5",color:"#991b1b"}}>Confirmer ?</button>
            :<button onClick={()=>setConfirmDel(s.id)} style={{...S.btnSecondary,fontSize:12,color:"#991b1b"}}>Supprimer</button>}
        </div>
      </div>)}

      <div><div style={{fontSize:16,fontWeight:800,color:tout?"#065f46":"#991b1b"}}>{tout?"✓":"✗"} {nbOk} / {res.length} contrôles OK</div>

        <div><div style={{fontSize:13,color:"#1a1a2e"}}>{r.nom}</div>{r.detail&&<div style={{fontSize:11,color:"#6b7280",fontFamily:"monospace"}}>{r.detail}</div>}</div>
      </div>)}
    </div>
    <div style={{...S.card,background:"#f9fafb",fontSize:12,color:"#6b7280"}}>💡 Les 11 exemples chiffrés du NF DTU 39 P4 et ta feuille Excel de référence peuvent être ajoutés ici comme cas de contrôle.</div>
  </div>;
}

// ── États d'affichage ─────────────────────────────────────────────────────
// conforme / non_conforme / non_verifiable / a_recalculer / a_confirmer
// (+ info, a_jour : informations neutres, jamais comptées comme conformité)
const LIB_ETAT={conforme:"Conforme",non_conforme:"Non conforme",non_verifiable:"Non vérifiable",a_recalculer:"À recalculer",a_confirmer:"À confirmer",info:"Information",a_jour:"Données inchangées",absente:"Aucun système retenu"};
const CLS_ETAT={conforme:"st-ok",non_conforme:"st-ko",non_verifiable:"st-nv",a_recalculer:"st-rc",a_confirmer:"st-rc",info:"st-in",a_jour:"st-in",absente:"st-nv"};
const etatDe=ok=>ok===true?"conforme":ok===false?"non_conforme":"non_verifiable";
const RANG_ETAT={non_conforme:4,a_recalculer:3,a_confirmer:2,non_verifiable:1,conforme:0};
// État global : « conforme » uniquement si TOUS les contrôles comptés sont conformes.
function combinerEtats(etats){
  const l=etats.filter(e=>e in RANG_ETAT);
  if(!l.length)return "non_verifiable";
  return l.reduce((a,b)=>RANG_ETAT[b]>RANG_ETAT[a]?b:a,"conforme");
}
function Etat({etat,children,titre}){
  return <span className={"gq-chip "+(CLS_ETAT[etat]||"st-nv")} title={titre||LIB_ETAT[etat]}><span className={"gq-dot "+(CLS_ETAT[etat]||"st-nv")}></span>{children||LIB_ETAT[etat]||etat}</span>;
}
function Pastille({etat,titre}){return <span className={"gq-dot "+(CLS_ETAT[etat]||"st-nv")} title={titre||LIB_ETAT[etat]} aria-label={LIB_ETAT[etat]}></span>;}

// ── Empreinte des données déterminantes (v2.7) ────────────────────────────
// Représentation canonique et déterministe : clés triées, valeurs vides/false
// ignorées, nombres et textes ramenés à leur texte (« 1200 » = 1200). Une empreinte
// identique signifie seulement « données pertinentes inchangées », jamais « conforme ».
// Exclus : ce qui n'entre dans aucune vérification (identification, quantité, champs
// d'affichage). controle_ug est CONSERVÉ : verifThermique l'utilise comme Ug du vitrage.
const CHAMPS_ELEMENT_HORS_EMPREINTE=["id","label","quantite"];
const CHAMPS_PROJET_HORS_EMPREINTE=["nom","moa","moe","phase","date","redacteur","elements","prescriptions","presc_overrides","presc_lignes_sup","pression_pa","epaisseur_dtu","controle_ref","controle_tl","controle_fs"];
function canoniser(v){
  if(v===undefined||v===null||v===false)return undefined;
  if(typeof v==="number")return isFinite(v)?String(v):undefined;
  if(typeof v==="string"){const t=v.trim();return t===""?undefined:t;}
  if(typeof v!=="object")return v;
  if(Array.isArray(v))return v.map(x=>{const c=canoniser(x);return c===undefined?null:c;});
  const o={};
  Object.keys(v).sort().forEach(k=>{const c=canoniser(v[k]);if(c!==undefined)o[k]=c;});
  return Object.keys(o).length?o:undefined;
}
function hachage(txt){
  let h1=0x811c9dc5, h2=0x9747b28c;
  for(let i=0;i<txt.length;i++){
    const c=txt.charCodeAt(i);
    h1=Math.imul(h1^c,0x01000193)>>>0;
    h2=Math.imul(h2^c,0x5bd1e995)>>>0; h2=(h2^(h2>>>13))>>>0;
  }
  return h1.toString(16).padStart(8,"0")+h2.toString(16).padStart(8,"0");
}
function donneesDeterminantes(el,projet){
  const e={},p={};
  Object.keys(el||{}).forEach(k=>{if(k[0]!=="_"&&!CHAMPS_ELEMENT_HORS_EMPREINTE.includes(k))e[k]=el[k];});
  Object.keys(projet||{}).forEach(k=>{if(k[0]!=="_"&&!CHAMPS_PROJET_HORS_EMPREINTE.includes(k))p[k]=projet[k];});
  return {element:e,projet:p};
}
// Empreinte enregistrée avec un système retenu : élément + exigences CCTP + vent +
// paramètres vitrage + données complètes du système fabricant + choix (système, vitrage).
function empreintePrescription(el,projet,sys,choix){
  return "v27:"+hachage(JSON.stringify(canoniser({version:1,...donneesDeterminantes(el,projet),systeme:sys||null,choix:choix||null})||{}));
}
// Empreinte d'une analyse du comparateur (résultats affichés) : élément + projet + base.
function empreinteBase(db){return hachage(JSON.stringify(canoniser((db&&db.systemes)||[])||[]));}
function empreinteAnalyse(el,projet,empDB){
  return "v27a:"+hachage(JSON.stringify(canoniser({version:1,...donneesDeterminantes(el,projet),base:empDB})||{}));
}
function systemeRetenu(pr,db){
  if(!pr)return null;
  return (db.systemes||[]).find(s=>pr.sysId&&s.id===pr.sysId)||(db.systemes||[]).find(s=>`${s.marque} ${s.nom}`===pr.gamme)||null;
}
// Statut de la prescription d'un élément (absente / à confirmer / à recalculer / à jour)
function etatPrescription(el,projet,db){
  const pr=(projet.prescriptions||{})[el.id];
  if(!pr)return {etat:"absente",pr:null,sys:null,note:"aucun système retenu"};
  const sys=systemeRetenu(pr,db);
  const ov=(projet.presc_overrides||{})[el.id]||{};
  const modifs=CHAMPS_COMPARATEUR.filter(k=>ov[k]!=null&&String(ov[k]).trim()!==""&&String(ov[k])!==String(pr[k]==null?"":pr[k]));
  if(!sys)return {etat:"a_recalculer",pr,sys:null,note:`système retenu « ${pr.gamme||pr.sysId} » introuvable dans la base`};
  if(!pr._empreinte)return {etat:"a_confirmer",pr,sys,note:"prescription sans empreinte (version antérieure à la v2.7) — relancer le comparateur et retenir à nouveau pour la confirmer"};
  const now=empreintePrescription(el,projet,sys,{sysId:sys.id,vitrage:pr.vitrage});
  if(now!==pr._empreinte)return {etat:"a_recalculer",pr,sys,note:"données de l'élément, du CCTP, du vent ou du système modifiées depuis le choix"};
  if(modifs.length)return {etat:"a_confirmer",pr,sys,note:`valeurs modifiées à la main en Prescription (${modifs.join(", ")})`};
  return {etat:"a_jour",pr,sys,note:"données déterminantes inchangées depuis le choix (n'implique pas la conformité)"};
}

// ── Synthèse technique d'un élément (lecture seule des fonctions existantes) ──
function syntheseElement(el,projet,db){
  const L=[];
  const ajoute=(id,label,etat,valeur,note,compte=true)=>L.push({id,label,etat,valeur:valeur||"",note:note||"",compte});
  const geo=controleGeometrie(el);
  const dp=diagPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const iF=el.type==="facade";
  if(!geo.ok)ajoute("geo","Géométrie","non_conforme","incohérente",geo.message);
  else if(!geo.complet)ajoute("geo","Géométrie","non_verifiable","dimensions non saisies","renseigner L × H");
  else ajoute("geo","Géométrie","conforme","cohérente",`${el.largeur} × ${el.hauteur} mm`);
  if(dp.ok){
    const ve=calcVentElement(el,projet);
    ajoute("vent","Pression du vent","info",`${dp.pression} Pa`,ve?`épaisseur de verre équivalente requise ≥ ${ve.dtu.eRequired} mm (vitrage le plus défavorable)`:"",false);
  }else ajoute("vent","Pression du vent","non_verifiable",dp.court,dp.message);
  const ep=etatPrescription(el,projet,db);
  const sys=ep.sys, pr=ep.pr;
  const sansSys=(id,label)=>ajoute(id,label,"non_verifiable","—",ep.etat==="absente"?"aucun système retenu":ep.note);
  if(!pr||!sys){
    sansSys("meca","Vitrage — résistance / flèche");sansSys("poids","Vitrage — poids / feuillure");sansSys("aev","AEV / vent du système");
    sansSys("dim","Domaine d'emploi");sansSys("th","Thermique Uw");sansSys("acou","Acoustique RA,tr");
    if(pr&&!sys)ajoute("presc","Prescription","a_recalculer","système introuvable",ep.note);
    return {lignes:L,etat:combinerEtats(L.filter(l=>l.compte).map(l=>l.etat)),prescription:ep};
  }
  // Mécanique du vitrage retenu (mêmes appels que le comparateur, sur les dimensions saisies)
  let v=null;
  if(!dp.ok)ajoute("meca","Vitrage — résistance / flèche","non_verifiable","—",dp.message);
  else if(!geo.ok||!geo.complet)ajoute("meca","Vitrage — résistance / flèche","non_verifiable","—",!geo.ok?"géométrie incohérente":"dimensions non saisies");
  else{
    v=verifVitrage(pr.vitrage,+el.largeur,+el.hauteur,sys,el,projet);
    if(!v)ajoute("meca","Vitrage — résistance / flèche","non_verifiable",pr.vitrage,"composition non analysable automatiquement");
    else{
      const e=combinerEtats([etatDe(v.resistance_ok),etatDe(v.fleche_verre_ok)]);
      const req=v.dtu_verre?` — requis eR ≥ ${(v.dtu_verre.e1*v.dtu_verre.c).toFixed(2)} mm, eF ≥ ${v.dtu_verre.eF_requis} mm`:"";
      ajoute("meca","Vitrage — résistance / flèche",e,pr.vitrage,`eR ${v.eR_reel!=null?v.eR_reel:"—"} mm · eF ${v.eF_reel!=null?v.eF_reel:"—"} mm${req}`);
    }
  }
  if(v||(geo.ok&&geo.complet)){
    const vv=v||verifVitrage(pr.vitrage,+el.largeur,+el.hauteur,sys,el,projet);
    if(vv)ajoute("poids","Vitrage — poids / feuillure",combinerEtats([etatDe(vv.poids_ok),etatDe(vv.feuillure_ok)]),`${vv.epaisseur_totale} mm · ${vv.poids_vantail} kg`,`feuillure ${vv.feuillure_min}–${vv.feuillure_max} mm · ${vv.controle_ferrure===false?"fixe : pas de limite ferrure":`max ${vv.isFacade?"appui":"ferrure"} ${vv.poids_max?vv.poids_max+" kg":"non renseigné"}`}`);
    else ajoute("poids","Vitrage — poids / feuillure","non_verifiable",pr.vitrage,"composition non analysable automatiquement");
  }else ajoute("poids","Vitrage — poids / feuillure","non_verifiable","—",!geo.ok?"géométrie incohérente":"dimensions non saisies");
  const aev=verifAEV(sys,dp.pression,iF,projet.aev_min,el);
  ajoute("aev","AEV / vent du système",etatDe(aev.ok),"",aev.note);
  const vd=verifDimensions(sys,+el.largeur,+el.hauteur,el);
  ajoute("dim","Domaine d'emploi",vd.statut==="ok"?"conforme":vd.statut==="hors"?"non_conforme":"non_verifiable","",vd.texte||"pas de domaine d'emploi exploitable pour cet élément");
  if(!String(projet.uw_max==null?"":projet.uw_max).trim())ajoute("th","Thermique Uw","non_verifiable","","Uw max non précisé au CCTP");
  else{const th=verifThermique(sys,el,projet);ajoute("th","Thermique Uw",etatDe(th.ok),th.cfg?`Uw ${th.cfg.uw}`:"",th.court||th.note);}
  // Acoustique : valeur enregistrée au moment du choix (PV d'essai) — dépend de l'empreinte
  const rc=parseInt(pr.rwctr), ratr=parseInt(el.ratr);
  if(ep.etat==="a_recalculer"||ep.etat==="a_confirmer")ajoute("acou","Acoustique RA,tr",ep.etat,pr.rwctr||"—",`valeur du choix (PV ${pr.rapport||"—"}) — ${ep.note}`);
  else if(pr.serie_depuis)ajoute("acou","Acoustique RA,tr","a_confirmer",pr.rwctr||"—",`repris de « ${pr.serie_depuis} » (série) : correction de surface non recalculée pour cet élément`);
  else if(!isFinite(rc)||!isFinite(ratr))ajoute("acou","Acoustique RA,tr","non_verifiable",pr.rwctr||"—","valeur ou exigence illisible");
  else ajoute("acou","Acoustique RA,tr",rc>=ratr?"conforme":"non_conforme",`${rc} dB`,`exigence ≥ ${ratr} dB · PV ${pr.rapport||"—"}${pr.correction&&pr.correction!=="0 dB"?` · correction ${pr.correction}`:""}`);
  const va=verifAllege(el);
  if(va.inconnue)ajoute("allege","Sécurité allège","non_verifiable","",va.detail);
  else if(va.protection_requise&&!el.allege_opaque){const fa=verifFeuilleteAllege(pr.vitrage);ajoute("allege","Sécurité allège",etatDe(fa.ok),"",fa.texte);}
  const dta=statutDTA(sys.validite);
  ajoute("dta","Validité DTA",dta.statut==="expire"?"non_conforme":dta.statut==="inconnu"?"non_verifiable":"conforme","",dta.texte);
  ajoute("presc","Prescription",ep.etat,`${pr.gamme}`,ep.note,ep.etat!=="a_jour");
  return {lignes:L,etat:combinerEtats(L.filter(l=>l.compte).map(l=>l.etat)),prescription:ep};
}

// ── État des modules conservé pendant la navigation ───────────────────────
// Les données du projet restent dans l'état unique du projet ; seules les saisies
// propres à un outil (vérificateur libre, flèche façade, brouillon de système…) sont
// gardées ici, pour ne pas les perdre en changeant de module.
const ContexteModules=React.createContext(null);
function useEtatModule(cle,init){
  const ctx=React.useContext(ContexteModules);
  const [local,setLocal]=useState(init);
  if(!ctx)return [local,setLocal];
  const a=Object.prototype.hasOwnProperty.call(ctx.etat,cle);
  const val=a?ctx.etat[cle]:(typeof init==="function"?init():init);
  const set=x=>ctx.setEtat(e=>{const prev=Object.prototype.hasOwnProperty.call(e,cle)?e[cle]:(typeof init==="function"?init():init);return {...e,[cle]:typeof x==="function"?x(prev):x};});
  return [val,set];
}

// ── Liste compacte des éléments ───────────────────────────────────────────
function libTypeEl(el){return el.type==="facade"?(el.soustype||"Façade"):(el.chassis_compose?`${el.soustype||"Châssis"} · composé`:(el.soustype||"Châssis"));}
function ListeElements({elements,syntheses,actif,onSelect,onAjouter,prescs}){

function SelecteurElement({elements,actif,onSelect,syntheses}){

// ── Bandeau de synthèse de l'élément actif ────────────────────────────────
function BarreSynthese({el,sy,ouvert,setOuvert}){
  if(!el||!sy)return null;
  const court={geo:"Géométrie",vent:"Vent",meca:"Vitrage DTU 39",poids:"Poids / feuillure",aev:"AEV",dim:"Domaine",th:"Uw",acou:"RA,tr",allege:"Allège",dta:"DTA",presc:"Prescription"};
  return <section className="gq-synth no-print" aria-label="Synthèse technique de l'élément actif">
    <div className="gq-synth-h">
      <span style={{fontSize:11,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase",color:"var(--txt3)"}}>Synthèse</span>
      <strong style={{fontSize:13}}>{el.label}</strong>
      <span style={{fontSize:12,color:"var(--txt3)"}}>{libTypeEl(el)} · {el.largeur||"?"} × {el.hauteur||"?"} mm</span>
      <span style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:11.5,color:"var(--txt2)"}}>État de l'élément</span><Etat etat={sy.etat}/>
        <button className="gq-link" onClick={()=>setOuvert(!ouvert)}>{ouvert?"Masquer le détail":"Détail"}</button>
      </span>

    </div>}

// ── Prochaine action pertinente ───────────────────────────────────────────
function prochaineAction(projet,syntheses){
  const dp=diagPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const els=projet.elements||[];
  if(!String(projet.nom||"").trim())return {label:"Compléter le projet & CCTP",page:"projet",raison:"Le projet n'a pas encore de nom."};
  if(!els.length)return {label:"Ajouter des éléments",page:"elements",raison:"Aucune menuiserie ni façade n'est encore décrite."};
  const geoKo=els.find(e=>!controleGeometrie(e).ok);
  if(geoKo)return {label:`Corriger la géométrie de « ${geoKo.label} »`,page:"elements",elId:geoKo.id,raison:controleGeometrie(geoKo).message};
  if(!dp.ok)return {label:"Compléter les données vent",page:"projet",raison:dp.message};
  const sansDim=els.find(e=>!controleGeometrie(e).complet);
  if(sansDim)return {label:`Saisir les dimensions de « ${sansDim.label} »`,page:"elements",elId:sansDim.id,raison:"Largeur ou hauteur non renseignée."};
  const aRecalc=els.find(e=>syntheses[e.id]&&["a_recalculer","a_confirmer"].includes(syntheses[e.id].prescription.etat));
  if(aRecalc)return {label:`Recalculer « ${aRecalc.label} »`,page:"comparateur",elId:aRecalc.id,raison:syntheses[aRecalc.id].prescription.note};
  const sansPresc=els.find(e=>!(projet.prescriptions||{})[e.id]);
  if(sansPresc)return {label:`Comparer les systèmes pour « ${sansPresc.label} »`,page:"comparateur",elId:sansPresc.id,raison:"Aucun système retenu pour cet élément."};
  const ko=els.find(e=>syntheses[e.id]&&syntheses[e.id].etat==="non_conforme");
  if(ko)return {label:"Voir les éléments à vérifier",page:"dashboard",ancre:"alertes",raison:`« ${ko.label} » présente au moins une non-conformité.`};
  return {label:"Générer la prescription",page:"prescription",raison:"Tous les éléments ont un système retenu."};
}

  const [elActifId,setElActifId]=useState(null);
  const [etatModules,setEtatModules]=useState({});
  const [analyses,setAnalyses]=useState({});// résultats du comparateur par élément (mémoire de session)
  const [synthOuverte,setSynthOuverte]=useState(false);
  const [sbMin,setSbMinBrut]=useState(()=>{try{return localStorage.getItem("glassiq_v27_ui_sidebar")==="min";}catch(e){return false;}});
  const setSbMin=v=>{setSbMinBrut(v);try{localStorage.setItem("glassiq_v27_ui_sidebar",v?"min":"");}catch(e){}};
  const refreshDB=()=>setDB(getDB());
  const showToast=(msg,type)=>{setToast({msg,type});setTimeout(()=>setToast(null),type==="err"?6000:2800);};
  const elActif=(projet.elements||[]).find(e=>e.id===elActifId)||(projet.elements||[])[0]||null;
  const aller=(id,elId,ancre)=>{
    if(elId!=null)setElActifId(elId);
    setPageBrut(id);
    try{if(ancre){setTimeout(()=>{const n=document.getElementById(ancre);if(n&&n.scrollIntoView)n.scrollIntoView({block:"start"});},30);}else window.scrollTo(0,0);}catch(e){}
  };
  // ── État de la sauvegarde : « Enregistré » seulement après une écriture confirmée (ok:true)
  const [sauvegarde,setSauvegarde]=useState({etat:"jamais",sig:null,quand:null,erreur:null});
  const marquerEnregistre=(p,quand)=>setSauvegarde({etat:"enregistre",sig:signatureProjet(p),quand:quand||new Date().toISOString(),erreur:null});
  const onSauvegarde=r=>{if(r&&r.ok)marquerEnregistre(r.projet,r.projet._maj);else if(r)setSauvegarde(s=>({...s,etat:"echec",erreur:r.erreur}));};
  const onCharge=(p,lectureOk)=>{if(lectureOk&&p._pid)marquerEnregistre(p,p._maj);else setSauvegarde({etat:"jamais",sig:null,quand:null,erreur:null});};
  // Auto-sauvegarde du projet courant s'il a déjà été sauvegardé une fois (logique v2.6.5).
  const [erreurAuto,setErreurAuto]=useState(null);
  useEffect(()=>{
    if(projet._pid&&projet.nom){
      const t=setTimeout(()=>{const r=sauverProjet(projet);setErreurAuto(r.ok?null:r.erreur);onSauvegarde(r.ok?{ok:true,projet:{...projet,_maj:r.projet._maj}}:r);},1500);
      return ()=>clearTimeout(t);
    }
  },[projet]);
  const sigCourante=signatureProjet(projet);
  const etatSauv=sauvegarde.etat==="echec"?"echec":!projet._pid?"jamais":(sauvegarde.etat==="enregistre"&&sauvegarde.sig===sigCourante)?"enregistre":(projet.nom?"cours":"modifie");
  const sauv={...sauvegarde,etat:etatSauv};
  // ── Synthèses (recalculées à chaque modification : jamais d'ancien verdict)
  const empDB=React.useMemo(()=>empreinteBase(db),[db]);
  const syntheses=React.useMemo(()=>{const m={};(projet.elements||[]).forEach(e=>{try{m[e.id]=syntheseElement(e,projet,db);}catch(err){m[e.id]={lignes:[{id:"err",label:"Synthèse",etat:"non_verifiable",valeur:"",note:String(err&&err.message||err),compte:true}],etat:"non_verifiable",prescription:{etat:"absente",note:""}};}});return m;},[projet,db]);
  const chargerDemo=()=>{
    setProjet({
      nom:"Démo — Façade hall Sud",moa:"Promoteur Exemple",moe:"Architecte Exemple",phase:"DCE / Appel d'offres",date:new Date().toISOString().split("T")[0],redacteur:"Daniel",
      uw_max:"1.6",g_max:"0.36",tl_min:"50",
      zone_vent:"2",cat_terrain:"II",hauteur_bat:"12",hauteur_sol:"0.5",type_vitrage:"isolant_2lam",type_verre:"recuit",aev_min:"A4 E9A V3",
      pression_pa:null,epaisseur_dtu:"",
      elements:[
        {id:1,label:"Façade hall Sud",type:"facade",orientation:"Sud",usage:"Façade côté rue",ratr:"38",soustype:"Façade rideau FWS",largeur:"8100",hauteur:"3500",trame:"1350",nb_ouvrants:"3",type_ouvrant:"Fenêtre OB",allege_h:"0",allege_opaque:false},
      ],
      controle_ref:"",controle_tl:"",controle_fs:"",controle_ug:"",prescriptions:{},
    });
  };
  const ajouterElement=()=>{const id=Date.now();setProjet(p=>({...p,elements:[...p.elements,{id,label:`Élément ${p.elements.length+1}`,type:"chassis",orientation:"Est",usage:"Façade côté rue",ratr:"36",soustype:"Fenêtre OB",largeur:"1200",hauteur:"1480"}]}));setElActifId(id);aller("elements");};
  // ── Action contextuelle (une seule par page)
  const prescs=projet.prescriptions||{};
  const tousPrescrits=(projet.elements||[]).length>0&&projet.elements.every(e=>prescs[e.id]);
  const ACTIONS={
    projet:{label:"Configurer les éléments",onClick:()=>{const pr=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);setProjet(p=>({...p,pression_pa:pr}));aller("elements");}},
    elements:{label:"Continuer vers le calcul du vent",onClick:()=>aller("vent")},
    vent:{label:"Comparer les systèmes",onClick:()=>aller("comparateur")},
    comparateur:{label:"Générer la prescription",onClick:()=>aller("prescription")},
    prescription:{label:"Consulter le métré",onClick:()=>aller("metre")},
  };
  const dp=diagPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const els=projet.elements||[];
  const etapesFaites={1:!!String(projet.nom||"").trim()&&dp.ok,2:els.length>0&&els.every(e=>{const g=controleGeometrie(e);return g.ok&&g.complet;}),3:dp.ok&&els.length>0&&els.every(e=>controleGeometrie(e).ok),4:tousPrescrits,5:false};
  const [kicker,titre,desc]=TITRES[page]||["","",""];
  const avecListe=PAGES_ELEMENT.includes(page);
  const setAnalyse=(elId,val)=>setAnalyses(a=>({...a,[elId]:val}));
  return <ContexteModules.Provider value={{etat:etatModules,setEtat:setEtatModules}}>
  <div className="gq-app">
    <BarreLaterale page={page} aller={aller} min={sbMin} setMin={setSbMin} nbEl={els.length} nbSys={db.systemes.length}/>
    <div className="gq-main">
      <BarreHaute projet={projet} page={page} aller={aller} sauvegarde={sauv} action={ACTIONS[page]||null} etapesFaites={etapesFaites}/>
      <div className="gq-ws">
        {avecListe&&<ListeElements elements={els} syntheses={syntheses} actif={elActif} onSelect={id=>setElActifId(id)} onAjouter={ajouterElement} prescs={prescs}/>}
        <main className="gq-content">
          <div className="gq-ph no-print"><div><div className="gq-kicker">{kicker}</div><h1>{titre}</h1><p>{desc}</p></div></div>
          {erreurAuto&&<div role="alert" className="no-print" style={{marginBottom:14,padding:"10px 14px",borderRadius:10,background:"#fef2f2",border:"1.5px solid #fca5a5",color:"#991b1b",fontSize:13,fontWeight:600}}>⛔ Sauvegarde automatique impossible — {erreurAuto}. Les dernières modifications de « {projet.nom} » ne sont PAS enregistrées dans le navigateur ; le projet reste ouvert. Exporte-le en fichier depuis « Mes projets ».</div>}
          {avecListe&&<SelecteurElement elements={els} actif={elActif} onSelect={id=>setElActifId(id)} syntheses={syntheses}/>}
          {avecListe&&elActif&&<BarreSynthese el={elActif} sy={syntheses[elActif.id]} ouvert={synthOuverte} setOuvert={setSynthOuverte}/>}
          <div key={page} className="fade">
          {page==="dashboard"&&<PageTableauDeBord projet={projet} setProjet={setProjet} syntheses={syntheses} aller={aller} sauvegarde={sauv} chargerDemo={chargerDemo} onCharge={onCharge} onToast={showToast}/>}
          {page==="projet"&&<PageProjet projet={projet} setProjet={setProjet} setPage={aller} section="cctp" elActif={elActif} setElActif={setElActifId}/>}
          {page==="elements"&&<PageProjet projet={projet} setProjet={setProjet} setPage={aller} section="elements" elActif={elActif} setElActif={setElActifId}/>}
          {page==="vent"&&<PageVent projet={projet} setProjet={setProjet} setPage={aller} elActif={elActif} setElActif={setElActifId}/>}
          {page==="comparateur"&&<PageComparateur db={db} projet={projet} setProjet={setProjet} setPage={aller} elActif={elActif} setElActif={setElActifId} analyses={analyses} setAnalyse={setAnalyse} empDB={empDB}/>}
          {page==="controle"&&<PageControleSolaire projet={projet} setProjet={setProjet}/>}
          {page==="prescription"&&<PagePrescription projet={projet} setProjet={setProjet} setPage={aller} syntheses={syntheses}/>}
          {page==="metre"&&<PageMetre projet={projet}/>}
          {page==="fleche"&&<PageFleche projet={projet}/>}
          {page==="securite"&&<PageSecurite db={db}/>}
          {page==="projets"&&<PageProjets projet={projet} setProjet={setProjet} setPage={aller} onToast={showToast} onSauvegarde={onSauvegarde} onCharge={onCharge}/>}
          {page==="base"&&<PageBase db={db}/>}
          {page==="ajouter"&&<PageAjouter db={db} onChange={refreshDB}/>}
          {page==="autotest"&&<PageAutotest/>}
          </div>
        </main>
      </div>
    </div>
    {toast&&<div className="gq-toast" style={{background:toast.type==="err"?"#b42318":toast.type==="warn"?"#93370d":"#05603a"}}>{toast.msg}</div>}
  </div>
  </ContexteModules.Provider>;
}

const container=document.getElementById('root');
const root=ReactDOM.createRoot(container);
root.render(React.createElement(App));
</script>
</body>
</html>
