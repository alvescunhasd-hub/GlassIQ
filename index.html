        <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1fr",gap:10,marginBottom:10}}>
          <div><label style={{...S.label,fontSize:10}}>Composition (ex: 55.2/16/44.2s)</label><input type="text" value={vlibre.compo} placeholder="55.2/16/44.2s" onChange={e=>setVlibre(v=>({...v,compo:e.target.value}))} style={S.input}/></div>
          <div><label style={{...S.label,fontSize:10}}>Système (feuillure)</label><select value={vlibre.sysId} onChange={e=>setVlibre(v=>({...v,sysId:e.target.value}))} style={S.input}><option value="">— choisir —</option>{sysList.map(s=><option key={s.id} value={s.id}>{s.marque} {s.nom}</option>)}</select></div>
          <div><label style={{...S.label,fontSize:10}}>Type de verre</label><select value={vlibre.verre} onChange={e=>setVlibre(v=>({...v,verre:e.target.value}))} style={S.input}>{Object.entries(EPS3_TYPES).map(([k,val])=><option key={k} value={k}>{val.label}</option>)}</select></div>
        </div>
        {res&&<div style={{padding:"12px 14px",background:"#fff",borderRadius:8,border:"1px solid #e5e7eb"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:8}}>
            <div><div style={{fontSize:10,color:"#6b7280"}}>Épaisseur totale</div><div style={{fontSize:15,fontWeight:700,color:res.feuillure_ok===false?"#991b1b":"#1a1a2e"}}>{res.epaisseur_totale} mm {sysV?(res.feuillure_ok===false?"✗":"✓"):""}</div>{sysV&&<div style={{fontSize:9,color:"#9ca3af"}}>feuillure {sysV.epaisseur_min}–{sysV.epaisseur_max}mm</div>}</div>
            <div><div style={{fontSize:10,color:"#6b7280"}}>Poids {res.isFacade?"/panneau":res.nb_vantaux===0?"/fixe":"/vantail"}</div><div style={{fontSize:15,fontWeight:700,color:res.poids_ok===false?"#991b1b":"#1a1a2e"}}>{res.poids_vantail} kg {sysV?(res.poids_ok===false?"✗":"✓"):""}</div>{res.poids_max&&<div style={{fontSize:9,color:"#9ca3af"}}>max {res.poids_max} kg</div>}</div>
            <div><div style={{fontSize:10,color:"#6b7280"}}>Résistance (Art.8)</div><div style={{fontSize:15,fontWeight:700,color:res.resistance_ok===false?"#991b1b":"#059669"}}>{res.eR_reel!=null?"eR "+res.eR_reel+" mm":"—"} {res.resistance_ok===false?"✗":res.resistance_ok?"✓":""}</div>{res.dtu_verre&&<div style={{fontSize:9,color:"#9ca3af"}}>requis ≥ {(res.dtu_verre.e1*res.dtu_verre.c).toFixed(2)} mm</div>}</div>
            <div><div style={{fontSize:10,color:"#6b7280"}}>Flèche (Art.9)</div><div style={{fontSize:15,fontWeight:700,color:res.fleche_verre_ok===false?"#991b1b":"#059669"}}>{res.eF_reel!=null?"eF "+res.eF_reel+" mm":"—"} {res.fleche_verre_ok===false?"✗":res.fleche_verre_ok?"✓":""}</div>{res.dtu_verre&&<div style={{fontSize:9,color:"#9ca3af"}}>requis ≥ {res.dtu_verre.eF_requis} mm</div>}{res.fleche_obtenue!=null&&<div style={{fontSize:9,color:res.fleche_obtenue>res.dtu_verre.flecheMax?"#991b1b":"#059669",fontWeight:600}}>flèche {res.fleche_obtenue} / {res.dtu_verre.flecheMax} mm {res.fleche_obtenue>res.dtu_verre.flecheMax?"✗":"✓"}</div>}</div>
          </div>
          {res.base_label&&<div style={{fontSize:10,color:"#6b7280",marginBottom:2}}>Poids calculé sur : {res.base_label}{res.controle_ferrure===false?" — fixe, pas de limite ferrure":""}</div>}
          {res.base_calcul&&<div style={{fontSize:10,color:"#6b7280",marginBottom:6}}>Résistance / flèche : {res.base_calcul}</div>}
          {(()=>{
            const checks=[res.feuillure_ok,res.poids_ok,res.resistance_ok,res.fleche_verre_ok];
            const anyFail=checks.some(c=>c===false);
            const allEval=res.dtu_verre&&sysV;
            return <div style={{padding:"8px 12px",borderRadius:6,fontWeight:700,fontSize:13,background:anyFail?"#fef2f2":allEval?"#f0fdf4":"#f9fafb",color:anyFail?"#991b1b":allEval?"#065f46":"#6b7280"}}>
              {!sysV?"⚠ Choisis un système pour vérifier la feuillure et le poids":anyFail?"✗ Cette composition NE convient PAS (voir critères en rouge)":allEval?"✓ Composition compatible (résistance, flèche, poids, feuillure)":pDiag.ok?"Renseigne la pression de vent (étape vent) pour la vérif résistance/flèche":`Pression non vérifiable — ${pDiag.message} : résistance / flèche non vérifiées`}
            </div>;
          })()}
        </div>}
        {vlibre.compo.trim()&&geoEl&&!geoEl.ok&&<BandeauGeometrie geo={geoEl}/>}
        {vlibre.compo.trim()&&!res&&geoEl&&geoEl.ok&&<div style={{fontSize:12,color:"#991b1b"}}>Composition non reconnue — format attendu verre/lame/verre, ex. 44.2 · 6/16/44.2s · 10/12/44.2 Ac · 1010.4/16/8</div>}
      </div>;
    })()}

    {resultatsObsoletes&&<div role="status" style={{marginTop:16,padding:"10px 14px",borderRadius:10,background:"#fffaeb",border:"1px solid #fedf89",color:"#93370d",fontSize:13,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
      <span style={{flex:1,minWidth:220}}><strong>À recalculer</strong> — les données de « {el.label} », du CCTP, du vent ou de la base ont changé depuis la dernière analyse. Les anciens résultats sont masqués pour ne pas être lus comme actuels.</span>
      <button onClick={chercher} disabled={loading||(geoEl&&!geoEl.ok)} style={S.btnPrimary}>Relancer l'analyse</button>
    </div>}
    {results&&geoEl&&geoEl.ok&&<div style={{marginTop:20}}>
      <BandeauPression diag={pDiag} style={{marginBottom:10}}/>
      <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}><strong>{results.length}</strong> système{results.length>1?"s":""} conforme{results.length>1?"s":""} acoustiquement — triés par conformité globale</div>
      {(()=>{const estRet=sy=>{const pr=prescs[el.id];return pr&&(pr.sysId?pr.sysId===sy.id:pr.gamme===`${sy.marque} ${sy.nom}`)?1:0;};return results.slice().sort((a,b)=>estRet(b.sys)-estRet(a.sys));})().map(({sys,best:bestAlgo,allMatches,uw_ok,th,aev_ok,aev_note,dta_ok,dim_ok,dim_statut,allege_ok,ko},i)=>{
        const allOk=ko===0&&pDiag.ok;const bc=allOk?"#6ee7b7":ko>=2?"#fca5a5":"#fde68a";const bg=allOk?"#f0fdf4":ko>=2?"#fff1f2":"#fffbeb";
        const pr=prescs[el.id];
        const isRetenu=!!pr&&(pr.sysId?pr.sysId===sys.id:pr.gamme===`${sys.marque} ${sys.nom}`);
        // Si ce système est retenu, on affiche la composition RÉELLEMENT choisie par
        // l'utilisateur (qui peut être une "autre composition compatible"), pas celle
        // proposée par défaut par l'algorithme — sinon la sélection ne se reflète jamais.
        const best=isRetenu?(allMatches.find(m=>m.composition===pr.vitrage)||bestAlgo):bestAlgo;
        const vCard=verifVitrage(best.composition,+el.largeur||1230,+el.hauteur||1480,sys,el,projet);
        return <div key={sys.id} style={{...S.card,border:isRetenu?"2px solid #059669":(`1.5px solid ${bc}`),background:isRetenu?"#f0fdf4":bg,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{width:26,height:26,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,background:isRetenu?"#059669":allOk?"#d1fae5":ko>=2?"#fee2e2":"#fef3c7",color:isRetenu?"#fff":undefined}}>{isRetenu?"★":allOk?"✓":ko>=2?"✗":"⚠"}</span>
              <div><div style={{fontWeight:800,fontSize:15,color:"#1a1a2e"}}>{sys.marque} {sys.nom}</div><div style={{fontSize:12,color:"#6b7280"}}>{sys.famille} · DTA: {sys.dta||"—"} · Feuillure: {sys.epaisseur_min}–{sys.epaisseur_max}mm</div>
              {(()=>{const st=statutDTA(sys.validite);return <div style={{display:"inline-block",marginTop:4,padding:"2px 8px",borderRadius:5,fontSize:11,fontWeight:700,color:st.couleur,background:st.bg,border:`1px solid ${st.couleur}33`}}>{st.statut==="expire"?"⛔ ":st.statut==="bientot"?"⚠ ":st.statut==="inconnu"?"? ":"✓ "}{st.texte}</div>;})()}
              {sys.essais_ce_seuls&&<div style={{display:"inline-block",marginTop:4,marginLeft:6,padding:"2px 8px",borderRadius:5,fontSize:11,fontWeight:700,color:"#9a3412",background:"#fff7ed",border:"1px solid #9a341233"}}>🇫🇷 Sans DTA France — essais CE uniquement, à valider pour un chantier en France</div>}
              {(()=>{const vd=verifDimensions(sys,+el.largeur,+el.hauteur,el);if(vd.statut==="aucune")return null;return <div style={{display:"inline-block",marginTop:4,marginLeft:6,padding:"2px 8px",borderRadius:5,fontSize:11,fontWeight:700,color:vd.couleur,background:vd.bg,border:`1px solid ${vd.couleur}33`}}>{vd.statut==="hors"?"📐 ⚠ ":vd.statut==="non_verifiable"?"📐 ? ":"📐 ✓ "}{vd.texte}</div>;})()}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <div style={{textAlign:"right"}}><div style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:"#374151"}}>{best.composition}</div><div style={{fontSize:12,color:"#059669"}}>RA,tr {best.rc} dB{best.corr!==0?` (corrigé ${best.corr} dB)`:""}</div><div style={{fontSize:11,color:"#6b7280"}}>Rapport {best.test.rapport}</div></div>
              <button onClick={()=>utiliser(sys,best,allMatches)} style={{padding:"8px 14px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:"none",background:isRetenu?"#059669":"#1a1a2e",color:"#fff",whiteSpace:"nowrap"}}>
                {isRetenu?"★ Retenu":"✓ Retenir ce système"}
              </button>
              {serie.length>0&&<button onClick={()=>utiliserSerie(sys,best)} title={"Éléments concernés : "+serie.map(e=>e.label).join(", ")} style={{padding:"8px 12px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",border:"1.5px solid #1a1a2e",background:"#fff",color:"#1a1a2e",whiteSpace:"nowrap"}}>
                ⧉ + {serie.length} autre{serie.length>1?"s":""} {groupeDe(el)}
              </button>}
            </div>
          </div>
          {/* v2.7 : lecture rapide — un état par critère (démontré / non conforme / sans preuve) */}
          {(()=>{
            const crit=[["Acoustique",true],["Thermique Uw",uw_ok],[el.type==="facade"?"Vent (essai façade)":"Vent (classe V)",aev_ok],["Feuillure",vCard?vCard.feuillure_ok:null],["Poids",vCard?vCard.poids_ok:null],["Résistance DTU 39",vCard?vCard.resistance_ok:null],["Flèche DTU 39",vCard?vCard.fleche_verre_ok:null],["Domaine d'emploi",dim_ok],["DTA",dta_ok]];
            if(allege_ok!=null)crit.push(["Allège",allege_ok]);
            const nKo=crit.filter(c=>c[1]===false).length, nNv=crit.filter(c=>c[1]==null).length;
            const ko=[];
            if(uw_ok===false&&th)ko.push(`Thermique : ${th.court||th.note}`);
            if(aev_ok===false)ko.push(`Vent / AEV : ${aev_note}`);
            if(dim_ok===false)ko.push(`Domaine d'emploi : ${verifDimensions(sys,+el.largeur,+el.hauteur,el).texte}`);
            if(dta_ok===false)ko.push(`DTA : ${statutDTA(sys.validite).texte}`);
            return <div style={{marginBottom:8}}>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,alignItems:"center"}}>
                {crit.map(([l,v])=><Etat key={l} etat={etatDe(v)}>{l}</Etat>)}
              </div>
              <div style={{fontSize:11.5,marginTop:6,color:nKo?"#b42318":nNv?"#475467":"#067647",fontWeight:600}}>{nKo?`${nKo} critère${nKo>1?"s":""} non conforme${nKo>1?"s":""}`:""}{nKo&&nNv?" · ":""}{nNv?`${nNv} critère${nNv>1?"s":""} sans preuve (non vérifiable)`:""}{!nKo&&!nNv?"Conformité démontrée sur tous les critères évalués":""}</div>
              {ko.map((t,k)=><div key={k} style={{fontSize:11.5,color:"#b42318",marginTop:3}}>✗ {t}</div>)}
            </div>;
          })()}
          <details>
          <summary style={{fontSize:12,fontWeight:600,color:"#1f5fbf",padding:"4px 0"}}>▸ Détail des contrôles et justificatifs (notes AEV, domaine, thermique, DTA)</summary>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:8,columnGap:16}}>
            <CheckRow label="Acoustique RA,tr" ok={true} note={`${best.rc} dB ≥ ${el.ratr} dB`}/>
            <CheckRow label="Thermique Uw" ok={uw_ok} note={!String(projet.uw_max==null?"":projet.uw_max).trim()?"Uw max non précisé":th?th.court:"Données manquantes"}/>
            <CheckRow label={el.type==="facade"?"Vent — essai façade":"Vent — classe V"} ok={aev_ok} note={aev_note}/>
            <CheckRow label="Épaisseur feuillure" ok={vCard?vCard.feuillure_ok:null} note={vCard?`${vCard.epaisseur_totale} mm (${sys.epaisseur_min}–${sys.epaisseur_max})`:"Non vérifiable"}/>
            <CheckRow label="Validité DTA" ok={dta_ok} note={dta_ok===null?"Non renseignée":dta_ok?"Valide":"Expiré"}/>
            <CheckRow label="Domaine d'emploi" ok={dim_ok} note={dim_ok===null?(dim_statut==="non_verifiable"?"Non vérifiable":"Non vérifié"):dim_ok?"Dans le domaine":"Hors domaine"}/>
          </div>
          {th&&th.note&&String(projet.uw_max==null?"":projet.uw_max).trim()&&<div style={{fontSize:10,color:"#9ca3af",marginTop:4}}>Thermique — {th.ok===true?"valeur catalogue (non calculée pour l'élément)":th.ok===false?"non conforme":"non vérifiable, indicatif"} : {th.note}</div>}
          <BlocPerfAnnoncees sys={sys} compact/>
          </details>
          {/* Vérification physique : poids vantail + épaisseur réelle vs feuillure */}
          {(()=>{
            const v=verifVitrage(best.composition,+el.largeur||1230,+el.hauteur||1480,sys,el,projet);
            if(!v)return <div style={{marginTop:8,padding:"8px 12px",background:"#fff7ed",borderRadius:8,border:"1px solid #fed7aa",fontSize:12,color:"#9a3412",fontWeight:600}}>⚠ Composition « {best.composition} » non analysable automatiquement — poids, feuillure, résistance et flèche NON vérifiés.</div>;
            return <div style={{marginTop:8,padding:"8px 12px",background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb"}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,alignItems:"center"}}>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>ÉPAISSEUR RÉELLE</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.feuillure_ok===false?"#991b1b":"#1a1a2e"}}>{v.epaisseur_totale} mm {v.feuillure_ok===false?"✗":v.feuillure_ok?"✓":""}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{v.type} · feuillure {v.feuillure_min}–{v.feuillure_max}mm</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>POIDS VITRAGE</div>
                  <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>{v.poids_m2} kg/m²</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{v.nb_verres} verre{v.nb_verres>1?"s":""}{v.lames_air.length?" · lame "+v.lames_air.join("+")+"mm":""}</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>{v.isFacade?"POIDS / PANNEAU":(v.nb_vantaux===0?"POIDS / FIXE":"POIDS VANTAIL")} ({v.surface} m²)</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.poids_ok===false?"#991b1b":v.poids_ok?"#059669":"#1a1a2e"}}>{v.poids_vantail} kg {v.poids_ok===false?"✗":v.poids_ok?"✓":""}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{v.base_label} · {v.controle_ferrure===false?"fixe : pas de limite ferrure":`max ${v.isFacade?"appui":"ferrure"} : ${v.poids_max?v.poids_max+" kg":"non renseigné"}`}</div>
                </div>
                <div>
                  {v.poids_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ {v.isFacade?"Panneau trop lourd pour l'appui vitrage":"Vantail trop lourd pour la quincaillerie"}</div>}
                  {v.feuillure_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ Épaisseur incompatible feuillure</div>}
                  {v.resistance_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ Résistance au vent insuffisante (Art.8)</div>}
                  {v.fleche_verre_ok===false&&<div style={{fontSize:11,color:"#991b1b",fontWeight:600,lineHeight:1.4}}>⚠ Flèche du vitrage excessive (Art.9)</div>}
                  {v.poids_ok!==false&&v.feuillure_ok!==false&&(v.resistance_ok==null||v.fleche_verre_ok==null)&&<div style={{fontSize:11,color:"#6b7280",fontWeight:600,lineHeight:1.4}}>? Résistance / flèche non vérifiées{pDiag.ok?"":` — ${pDiag.court}`}</div>}
                  {v.poids_ok!==false&&v.feuillure_ok!==false&&v.resistance_ok!=null&&v.fleche_verre_ok!=null&&v.resistance_ok!==false&&v.fleche_verre_ok!==false&&<div style={{fontSize:11,color:"#059669",fontWeight:600,lineHeight:1.4}}>✓ Faisabilité mécanique OK</div>}
                </div>
              </div>
              {/* Résistance & flèche du vitrage — NF DTU 39 P4 Art.8-9 */}
              {v.dtu_verre&&<div style={{marginTop:8,paddingTop:8,borderTop:"1px solid #e5e7eb",display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>RÉSISTANCE AU VENT (Art.8)</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.resistance_ok===false?"#991b1b":"#059669"}}>eR = {v.eR_reel} mm {v.resistance_ok===false?"✗":"✓"}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>requis ≥ {(v.dtu_verre.e1*v.dtu_verre.c).toFixed(2)} mm (e1×c)</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:1}}>FLÈCHE DU VITRAGE (Art.9)</div>
                  <div style={{fontSize:13,fontWeight:700,color:v.fleche_verre_ok===false?"#991b1b":"#059669"}}>eF = {v.eF_reel} mm {v.fleche_verre_ok===false?"✗":"✓"}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>requis ≥ {v.dtu_verre.eF_requis} mm (déformation ≤ {v.dtu_verre.flecheMax}mm)</div>
                  {v.fleche_obtenue!=null&&<div style={{fontSize:10,color:v.fleche_obtenue>v.dtu_verre.flecheMax?"#991b1b":"#059669",fontWeight:600,marginTop:2}}>↳ flèche obtenue : {v.fleche_obtenue} mm / {v.dtu_verre.flecheMax} mm {v.fleche_obtenue>v.dtu_verre.flecheMax?"✗":"✓"}</div>}
                </div>
              </div>}
              {v.base_calcul&&<div style={{fontSize:10,color:"#6b7280",marginTop:6}}>Résistance / flèche calculées sur : {v.base_calcul}</div>}
              {/* Détail partie par partie — châssis/façade composé */}
              {v.detail_panneaux&&v.detail_panneaux.length>1&&<div style={{marginTop:8,padding:"8px 12px",background:"#faf5ff",borderRadius:8,border:"1px solid #e9d5ff"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#6b21a8",marginBottom:6}}>📋 Détail par partie ({v.detail_panneaux.length} types de panneaux)</div>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead><tr style={{color:"#6b7280",textAlign:"left"}}>
                      <th style={{padding:"3px 6px"}}>Partie</th><th style={{padding:"3px 6px"}}>Dim.</th><th style={{padding:"3px 6px"}}>Qté</th>
                      <th style={{padding:"3px 6px"}}>Requis</th><th style={{padding:"3px 6px"}}>eR={v.eR_reel}</th>
                      <th style={{padding:"3px 6px"}}>Flèche</th><th style={{padding:"3px 6px"}}>/adm.</th>
                    </tr></thead>
                    <tbody>
                      {v.detail_panneaux.map((d,di)=>(
                        <tr key={di} style={{borderTop:"1px solid #f3e8ff"}}>
                          <td style={{padding:"3px 6px"}}>{d.type==="ouvrant"?"🔓 ouvrant":d.type==="porte"?"🚪 porte":"▢ fixe"}{d.label?` ${d.label}`:""}</td>
                          <td style={{padding:"3px 6px",fontFamily:"monospace"}}>{d.largeur}×{d.hauteur}</td>
                          <td style={{padding:"3px 6px"}}>{d.qte}</td>
                          <td style={{padding:"3px 6px"}}>≥{d.requis} mm</td>
                          <td style={{padding:"3px 6px",fontWeight:700,color:d.res_ok?"#059669":"#991b1b"}}>{d.res_ok?"✓":"✗"}</td>
                          <td style={{padding:"3px 6px"}}>{d.fleche_obtenue!=null?d.fleche_obtenue+" mm":"—"}</td>
                          <td style={{padding:"3px 6px",fontWeight:700,color:d.fleche_ok===false?"#991b1b":d.fleche_ok?"#059669":"#9ca3af"}}>{d.fleche_ok===false?"✗":d.fleche_ok?"✓":"—"}/{d.fleche_max}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{fontSize:10,color:"#9ca3af",marginTop:4}}>Le verdict global n'est ✓ que si TOUTES les parties sont conformes. eR / eF sont des propriétés du vitrage ; seuls le « requis » et la flèche changent selon la taille de chaque partie.</div>
              </div>}
              {/* Suggestions de découpage si vantail trop lourd */}
              {v.poids_decoupage&&v.poids_decoupage.length>0&&<div style={{marginTop:8,padding:"8px 12px",background:"#eff6ff",borderRadius:8,border:"1px solid #bfdbfe"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#1e40af",marginBottom:6}}>💡 Solutions de découpage pour passer sous {v.poids_max} kg/vantail :</div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {v.poids_decoupage.map((opt,oi)=>(
                    <div key={oi} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#1e3a8a"}}>
                      <span style={{background:"#dbeafe",borderRadius:6,padding:"2px 8px",fontWeight:600,fontSize:11}}>{opt.poids} kg/vtl ✓</span>
                      <strong>{opt.label}</strong>
                      <span style={{color:"#6b7280",fontSize:11}}>— {opt.detail}</span>
                    </div>
                  ))}
                </div>
                <div style={{fontSize:10,color:"#6b7280",marginTop:6}}>Renseigne le nombre de vantaux (ou une largeur de fixe) dans la composition du châssis en étape 1 pour valider automatiquement.</div>
              </div>}
            </div>;
          })()}
          {/* Sécurité allège — feuilleté obligatoire si vitrage fait garde-corps */}
          {(()=>{
            const va=verifAllege(el);
            if(!va.protection_requise||el.allege_opaque)return null;
            const fa=verifFeuilleteAllege(best.composition);
            const okc=fa.ok===true;
            return <div style={{marginTop:8,padding:"7px 12px",borderRadius:8,background:okc?"#f0fdf4":"#fef2f2",border:`1px solid ${okc?"#bbf7d0":"#fecaca"}`,fontSize:12,color:okc?"#065f46":"#991b1b",fontWeight:600}}>
              {okc?`✓ Sécurité allège — ${best.composition} : ${fa.texte} (classe 1B1 EN 12600, NF DTU 39 P5)`:`⚠ Sécurité allège — ${best.composition} : ${fa.texte} (vitrage faisant garde-corps, NF DTU 39 P5 / EN 12600 classe 1B1)`}
              <div style={{fontSize:10,fontWeight:400,color:"#6b7280",marginTop:2}}>Composition lue de l'extérieur vers l'intérieur.</div>
            </div>;
          })()}
          {/* Autres compositions compatibles */}
          {allMatches.length>1&&<div style={{marginTop:8}}>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>Autres compositions compatibles :</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {allMatches.filter(m=>m.composition!==best.composition).map((m,mi)=><button key={mi} onClick={()=>utiliser(sys,m,allMatches)} style={{padding:"3px 10px",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer",border:"1px solid #d1d5db",background:"#fff",color:"#374151",fontFamily:"monospace"}}>{m.composition} — {m.rc} dB</button>)}
            </div>
          </div>}
          {best.corr!==0&&<div style={{marginTop:8,padding:"6px 10px",background:"#fef3c7",borderRadius:6,fontSize:12,color:"#92400e"}}>⚠ Correction dimensionnelle {best.corr} dB (surface projet &gt; surface essai)</div>}
        </div>;
      })}
      <div style={{display:"flex",gap:10,marginTop:10,flexWrap:"wrap",alignItems:"center"}}>
        {allConfirmed&&<div style={{fontSize:13,color:"#059669",fontWeight:600}}>✓ Tous les éléments ont un système retenu</div>}
      </div>
    </div>}
  </div>;
}

// ── PAGE 4 : CONTRÔLE SOLAIRE ─────────────────────────────────────────────
function PageControleSolaire({projet,setProjet}){
  const [controles]=useState(()=>getControles());
  const [tlMin,setTlMin]=useState(projet.tl_min||"");
  const [fsMax,setFsMax]=useState(projet.g_max||"");
  const [ugMax,setUgMax]=useState("");
  const [mf,setMf]=useState("");
  const [results,setResults]=useState(null);
  const marques=[...new Set(controles.map(c=>c.marque))];
  const chercher=()=>{let f=controles.filter(c=>(!tlMin||c.tl>=+tlMin)&&(!fsMax||c.fs<=+fsMax)&&(!ugMax||c.ug<=+ugMax));if(mf)f=f.filter(c=>c.marque===mf);setResults(f.sort((a,b)=>b.tl-a.tl));};
  return <div>
    {projet.g_max&&<div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",marginBottom:14}}><div style={{fontSize:12,color:"#92400e"}}>☀ Facteur solaire g max du projet : <strong>{projet.g_max}</strong> — pré-rempli depuis l'étape 1</div></div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Marque</label><select value={mf} onChange={e=>setMf(e.target.value)} style={S.input}><option value="">Toutes</option>{marques.map(m=><option key={m}>{m}</option>)}</select></div>
      <div><label style={S.label}>TL min (%)</label><input type="number" value={tlMin} onChange={e=>setTlMin(e.target.value)} placeholder={projet.tl_min||"ex : 60"} style={S.input}/></div>
      <div><label style={S.label}>FS max</label><input type="number" step="0.01" value={fsMax} onChange={e=>setFsMax(e.target.value)} placeholder={projet.g_max||"ex : 0.35"} style={S.input}/></div>
      <div><label style={S.label}>Ug max (W/m².K)</label><input type="number" step="0.1" value={ugMax} onChange={e=>setUgMax(e.target.value)} placeholder="ex : 1.1" style={S.input}/></div>
    </div>
    <button onClick={chercher} style={S.btnPrimary}>☀ Trouver le contrôle solaire</button>
    {results&&<div style={{marginTop:18}}>
      <div style={{fontSize:13,color:"#6b7280",marginBottom:10}}>{results.length} référence{results.length>1?"s":""}</div>
      {results.length===0&&<div style={{padding:14,background:"#fff1f2",borderRadius:10,color:"#991b1b",fontSize:13}}>Aucune référence — assouplissez les critères</div>}
      {results.map((c,i)=><div key={c.id} style={{...S.card,border:i===0?"1.5px solid #6ee7b7":"1px solid #e5e7eb",background:i===0?"#f0fdf4":"#fff",marginBottom:8}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr 1fr",gap:10,alignItems:"center"}}>
          <div><div style={{fontWeight:700,fontSize:14}}>{c.ref}</div><div style={{fontSize:12,color:"#6b7280"}}>{c.marque} · {c.gamme}</div></div>
          <Stat label="TL" value={`${c.tl}%`} hi={i===0}/><Stat label="FS" value={c.fs}/><Stat label="Ug" value={`${c.ug} W/m²K`}/>
          <div style={{fontSize:12,color:"#6b7280",fontStyle:"italic"}}>{c.note}</div>
          <button onClick={()=>{setProjet(p=>({...p,controle_ref:c.ref,controle_tl:c.tl+"%",controle_fs:c.fs,controle_ug:c.ug+" W/m²K"}));alert(`✓ ${c.ref} ajouté`);}} style={{...S.btnSecondary,fontSize:12}}>➕ Utiliser</button>
        </div>
      </div>)}
    </div>}
  </div>;
}

// ── PAGE 5 : PRESCRIPTION ─────────────────────────────────────────────────
// Valeurs TOUJOURS recalculées depuis le projet (comparateur, contrôle solaire,
// calcul vent). CORRIGÉ v2.5 : les modifications manuelles faites ici sont
// enregistrées dans le projet (presc_overrides / presc_lignes_sup) — elles ne sont
// plus perdues en changeant de page et partent avec la sauvegarde / l'export.
function PagePrescription({projet,setProjet,setPage,syntheses}){
  const prescs=projet.prescriptions||{};
  const ov=projet.presc_overrides||{};
  const sup=projet.presc_lignes_sup||[];
  const pression=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const epProjet=epaisseurDTUProjet(projet);
  const pDiag=diagPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const typos=[
    ...projet.elements.map(el=>{
      const p=prescs[el.id]||{};
      const ve=calcVentElement(el,projet);
      const base={
        id:el.id,label:el.label,dims:el.largeur&&el.hauteur?`${el.largeur}×${el.hauteur}mm`:"",
        orientation:el.orientation||"",usage:el.usage||"",rw_requis:el.ratr?"RA,tr ≥ "+el.ratr+" dB":"",
        type_element:el.type==="facade"?"Façade rideau":"Châssis",
        gamme:p.gamme||(el.chiffrage&&el.chiffrage.systeme?el.chiffrage.systeme+" (chiffrage)":""),vitrage:p.vitrage||(el.chiffrage&&el.chiffrage.composition)||"",rw:p.rw||"",rwctr:p.rwctr||"",rapport:p.rapport||"",correction:p.correction||"0 dB",
        controle:projet.controle_ref||"",tl:projet.controle_tl||"",fs:projet.controle_fs!=null&&projet.controle_fs!==""?String(projet.controle_fs):"",ug:projet.controle_ug||"",
        epaisseur_dtu:ve?`${ve.dtu.eRequired} mm`:(p.epaisseur_dtu||""),aev:p.aev||"",uw:p.uw||"",
        epaisseur_reelle:p.epaisseur_reelle||"",poids_m2:p.poids_m2||"",poids_vantail:p.poids_vantail||"",
      };
      const o=ov[el.id]||{};
      return {...base,...o,_sup:false,_modifie:Object.keys(o).length>0,
        _facade:el.type==="facade"?analyseFacade(el):null,_allege:verifAllege(el),_rc3:!!el.rc3_requis,_allege_opaque:!!el.allege_opaque};
    }),
    ...sup.map(l=>({...l,_sup:true,_modifie:false,_facade:null,_allege:{protection_requise:false},_rc3:false,_allege_opaque:false})),
  ];
  const upd=(ty,k,v)=>setProjet(p=>{
    if(ty._sup)return {...p,presc_lignes_sup:(p.presc_lignes_sup||[]).map(l=>l.id===ty.id?{...l,[k]:v}:l)};
    const o=p.presc_overrides||{};
    return {...p,presc_overrides:{...o,[ty.id]:{...(o[ty.id]||{}),[k]:v}}};
  });
  const reinit=(id)=>setProjet(p=>{const o={...(p.presc_overrides||{})};delete o[id];return {...p,presc_overrides:o};});
  const addT=()=>setProjet(p=>{
    const l=p.presc_lignes_sup||[];
    return {...p,presc_lignes_sup:[...l,{id:"L"+Date.now(),label:`Élément ${p.elements.length+l.length+1}`,dims:"",orientation:"",usage:"",rw_requis:"",type_element:"Châssis",gamme:"",vitrage:"",rw:"",rwctr:"",rapport:"",correction:"0 dB",controle:"",tl:"",fs:"",ug:"",epaisseur_dtu:"",aev:"",uw:"",epaisseur_reelle:"",poids_m2:"",poids_vantail:""}]};
  });
  const delSup=(id)=>setProjet(p=>({...p,presc_lignes_sup:(p.presc_lignes_sup||[]).filter(l=>l.id!==id)}));
  const champ=(ty,l,k,ph)=><div key={k} style={{marginBottom:4}}><div style={{fontSize:9,color:"#6b7280",marginBottom:1}}>{l}</div><input value={ty[k]||""} onChange={e=>upd(ty,k,e.target.value)} placeholder={ph} style={{...S.input,fontSize:11,padding:"3px 7px",background:"#fff"}}/></div>;
  const lignesPV=typos.filter(t=>t.gamme);

            🛡 {ty._allege_opaque?"Allège opaque — garde-corps assuré par le panneau":"Face intérieure feuilletée ≥ 44.2 (1B1) obligatoire — allège "+ty._allege.allege_m+" m"}

      {(()=>{

// ── PAGE MÉTRÉ GLOBAL ──────────────────────────────────────────────────────
function PageProjets({projet,setProjet,setPage,onToast,onSauvegarde,onCharge}){
  // v2.6.5 : la liste affichée est toujours relue depuis le stockage après chaque
  // opération ; un message de succès n'est affiché que si l'écriture a réussi.
  const [lecture,setLecture]=useState(()=>lireProjets());
  const list=lecture.projets;
  const [confirmDel,setConfirmDel]=useState(null);
  const [confirmRep,setConfirmRep]=useState(false);
  const [erreur,setErreur]=useState(null);
  const refresh=()=>setLecture(lireProjets());
  const echec=(quoi,r)=>{const m=`${quoi} : échec — ${r.erreur}.`;setErreur(m);refresh();onToast&&onToast("⚠ "+m,"err");};

  const sauver=()=>{
    if(!projet.nom){onToast&&onToast("Donne d'abord un nom au projet (étape 1)","warn");setPage("projet");return;}
    const r=sauverProjet(projet);
    onSauvegarde&&onSauvegarde(r);
    if(!r.ok){echec(`Projet « ${projet.nom} » NON enregistré`,r);return;}
    const saved=r.projet;
    setProjet(p=>({...p,_pid:saved._pid,_cree:saved._cree,_maj:saved._maj}));
    setErreur(null);refresh();
    onToast&&onToast("Projet \""+saved.nom+"\" sauvegardé ✓","ok");
  };
  const charger=(p)=>{
    setProjet({...p});
    onCharge&&onCharge(p,lecture.ok);
    onToast&&onToast("Projet \""+p.nom+"\" chargé","ok");
    setPage("projet");
  };
  const dupliquer=(pid)=>{
    const r=dupliquerProjet(pid);
    if(!r.ok){echec("Duplication NON enregistrée (aucune copie créée)",r);return;}
    setErreur(null);refresh();onToast&&onToast("Projet dupliqué","ok");
  };
  const supprimer=(pid)=>{
    setConfirmDel(null);
    const r=supprimerProjet(pid);
    if(!r.ok){echec("Suppression NON effectuée (le projet est conservé)",r);return;}
    setErreur(null);refresh();onToast&&onToast("Projet supprimé","warn");
  };
  const reparer=()=>{
    setConfirmRep(false);
    const r=archiverEtReparerProjets();
    if(!r.ok){echec("Remise en service du stockage NON effectuée",r);return;}
    setErreur(null);refresh();onToast&&onToast(`Données d'origine archivées (${r.cle}) — ${r.liste.length} projet(s) lisible(s) remis en service`,"ok");
  };
  const telechargerBrut=()=>{
    const blob=new Blob([lecture.brut==null?"":lecture.brut],{type:"text/plain"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="EME_Facade_projets_donnees_brutes.txt";a.click();URL.revokeObjectURL(url);
  };
  const nouveau=()=>{
    setProjet({...defaultProjet,elements:defaultProjet.elements.map(e=>({...e,id:Date.now()})),_pid:null});
    onCharge&&onCharge({},false);
    onToast&&onToast("Nouveau projet vierge","ok");
    setPage("projet");
  };

  // Export / Import fichier
  const exporter=(p)=>{
    const blob=new Blob([JSON.stringify(p,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`EME_Facade_${(p.nom||"projet").replace(/[^a-z0-9]/gi,"_")}.json`;
    a.click();URL.revokeObjectURL(url);
  };
  const exporterTout=()=>{
    const blob=new Blob([JSON.stringify(lireProjets().projets,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="EME_Facade_tous_projets.json";a.click();URL.revokeObjectURL(url);
  };
  const importer=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        const arr=(Array.isArray(data)?data:[data]).filter(p=>p&&typeof p==="object"&&!Array.isArray(p));
        if(!arr.length){onToast&&onToast("Fichier invalide : aucun projet lisible","warn");return;}
        const r=importerProjets(arr);
        if(!r.ok){echec("Import NON enregistré",r);return;}
        setErreur(null);refresh();
        onToast&&onToast(r.nb+" projet(s) importé(s) ✓","ok");
      }catch(err){onToast&&onToast("Fichier invalide","warn");}
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const fmtDate=(iso)=>{if(!iso)return"—";const d=new Date(iso);return d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});};

  return <div>
    <div style={{...S.card,background:"#eff6ff",border:"1px solid #bfdbfe",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#1e40af",marginBottom:4}}>💾 Mes projets — sauvegarde & chargement</div>

    {list.length===0&&lecture.ok&&<div style={{...S.card,textAlign:"center",color:"#9ca3af",fontSize:13}}>Aucun projet enregistré. Sauvegarde ton projet en cours pour le retrouver ici.</div>}
    {list.slice().sort((a,b)=>String(b._maj||"").localeCompare(String(a._maj||""))).map((p,ip)=>{
      const nbEl=p.elements?p.elements.length:0;

      const isCurrent=p._pid===projet._pid;

            <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{p.moa?p.moa+" · ":""}{nbEl} élément{nbEl>1?"s":""}{nbPresc>0?" · "+nbPresc+" prescrit"+(nbPresc>1?"s":""):""}</div>

            <button onClick={()=>charger(p)} style={{...S.btnPrimary,padding:"7px 14px",fontSize:12}}>Charger</button>

            <button onClick={()=>exporter(p)} style={{...S.btnSecondary,fontSize:12}}>⬇</button>
            {confirmDel===p._pid

          </div>
        </div>

    })}

    <div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",marginTop:14,fontSize:12,color:"#92400e",lineHeight:1.5}}>
      💡 <strong>Important :</strong> les projets sont stockés dans ce navigateur. Pour ne rien perdre en cas de changement d'ordinateur ou de nettoyage du navigateur, exporte régulièrement tes projets en fichier (bouton ⬇). Tu pourras les réimporter n'importe où.
    </div>
  </div>;
}

// ── Bloc « Traverse de façade » de la page Flèche (ajout 25/11/2026) ─────────
function BlocTraverse({pELS,pNote,pression,critere,setCritere,entraxe,setEntraxe}){
  const [sysT,setSysT]=useEtatModule("fleche.trav_systeme","FW50");
  const [hDes,setHDes]=useEtatModule("fleche.trav_h_dessus","1.75");
  const [hSous,setHSous]=useEtatModule("fleche.trav_h_dessous","1.75");
  const [compo,setCompo]=useEtatModule("fleche.trav_compo","");
  const [aCale,setACale]=useEtatModule("fleche.trav_cale","100");
  const [ixT,setIxT]=useEtatModule("fleche.trav_ix","");
  const [iyT,setIyT]=useEtatModule("fleche.trav_iy","");
  const [matT,setMatT]=useEtatModule("fleche.trav_mat","alu");
  const [showT,setShowT]=useEtatModule("fleche.trav_afficher",false);
  const L=lireNombreSaisi(entraxe), h1=lireNombreSaisi(hDes), h2=lireNombreSaisi(hSous), a=lireNombreSaisi(aCale);
  const comp=String(compo||"").trim()?analyseComposition(String(compo).trim()):null;
  const compoErr=!!String(compo||"").trim()&&!comp;
  const aErr=!!(a&&L&&a>=L*1000/2);
  const ixA=lireNombreSaisi(ixT), iyA=lireNombreSaisi(iyT);
  const E=sysT==="AUTRE"&&matT==="acier"?E_ACIER:E_ALU;
  const libCrit=critere==="en13116"?"NF EN 13116":critere==="200_15"?"L/200 ≤ 15 mm":"L/"+critere;
  const pret=!!pELS&&!!L&&!!h1&&!!h2&&!!comp&&!!a&&!aErr&&(sysT!=="AUTRE"||(!!ixA&&!!iyA));
  const larg=L&&h1&&h2?(Math.min(h1,L)+Math.min(h2,L))/2:null;
  const res=showT&&pret?(sysT==="AUTRE"
    ?[{ref:"—",nom:`Traverse saisie (${matT==="acier"?"acier":"aluminium"})`,Ix:ixA,Iy:iyA,calc:verifTraverse(pELS,L,h1,h2,comp.poids_m2,a,ixA,iyA,critere,E)}]
    :traversesCompatibles(sysT,pELS,L,h1,h2,comp.poids_m2,a,critere)):null;
  const rec=res?res.find(x=>x.calc.ok)||null:null;
  const marque=/^REY/.test(sysT)?"Reynaers":"Schüco";
  const err=t=><div style={{fontSize:11,color:"#b91c1c",marginTop:3}}>{t}</div>;
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:12}}>
      <div><label style={S.label}>Système façade</label><select value={sysT} onChange={ev=>setSysT(ev.target.value)} style={S.input}>{Object.keys(SYSTEMES_TRAVERSE).map(k=><option key={k} value={k}>{SYSTEMES_TRAVERSE[k]}</option>)}</select>
        {sysT==="AUTRE"&&<div style={{marginTop:6}}><select value={matT} onChange={ev=>setMatT(ev.target.value)} style={{...S.input,marginBottom:6}}><option value="alu">Aluminium (E = 70 000 N/mm²)</option><option value="acier">Acier (E = 210 000 N/mm²)</option></select>
          <input value={ixT} onChange={ev=>setIxT(ev.target.value)} placeholder="Ix traverse — vent (cm⁴)" style={{...S.input,marginBottom:6}}/>{String(ixT).trim()&&!ixA&&err("Ix illisible (ex. 89,45)")}
          <input value={iyT} onChange={ev=>setIyT(ev.target.value)} placeholder="Iy traverse — poids vitrage (cm⁴)" style={S.input}/>{String(iyT).trim()&&!iyA&&err("Iy illisible (ex. 25,59)")}</div>}</div>
      <div><label style={S.label}>Portée traverse (m)</label><input value={entraxe} onChange={ev=>setEntraxe(ev.target.value)} placeholder="1.35" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Entraxe des meneaux (trame)</div>{String(entraxe).trim()&&!L&&err("Valeur illisible")}</div>
      <div><label style={S.label}>Vitrage au-dessus (m)</label><input value={hDes} onChange={ev=>setHDes(ev.target.value)} placeholder="1.75" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Hauteur du vitrage posé sur la traverse</div>{String(hDes).trim()&&!h1&&err("Valeur illisible")}</div>
      <div><label style={S.label}>Vitrage en dessous (m)</label><input value={hSous} onChange={ev=>setHSous(ev.target.value)} placeholder="1.75" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Hauteur du vitrage sous la traverse</div>{String(hSous).trim()&&!h2&&err("Valeur illisible")}</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Composition du vitrage posé</label><input value={compo} onChange={ev=>setCompo(ev.target.value)} placeholder="ex. 44.2/16/10" style={S.input}/>{comp?<div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{comp.type} · {comp.poids_m2} kg/m²</div>:compoErr?err("Composition illisible (ex. 44.2/16/10)"):<div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Sert au calcul du poids</div>}</div>
      <div><label style={S.label}>Distance cale – extrémité (mm)</label><input value={aCale} onChange={ev=>setACale(ev.target.value)} placeholder="100" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Position des 2 cales d'assise</div>{String(aCale).trim()&&!a&&err("Valeur illisible")}{aErr&&err("Les cales doivent être à moins de la moitié de la portée")}</div>
      <div><label style={S.label}>Critère de flèche au vent</label><select value={critere} onChange={ev=>setCritere(ev.target.value)} style={S.input}><option value="en13116">NF EN 13116 (L/200 ; 5 + L/300 ; L/250)</option><option value="200">L/200</option><option value="200_15">L/200 plafonné à 15 mm</option><option value="175">L/175</option></select></div>
      <div><label style={S.label}>Critère sous le poids du vitrage</label><div style={{...S.input,background:"#f9fafb"}}>min (L/500 ; 3 mm)</div><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Critère usuel, à confirmer par le CCTP</div></div>
    </div>

    {pret&&<div style={{padding:"10px 16px",background:"#1a1a2e",borderRadius:10,marginBottom:14,display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{pNote?"Pression ELS — note de calcul":"Pression de service (ELS) = tableau ÷ 1,5"}</div><div style={{fontSize:18,fontWeight:800,color:"#fff"}}>{Math.round(pELS)} Pa</div></div>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Largeur de vent reprise</div><div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{larg.toFixed(2)} m</div></div>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Poids du vitrage posé</div><div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{Math.round(comp.poids_m2*L*h1)} kg</div></div>
      <div style={{marginLeft:"auto",padding:"6px 14px",background:"rgba(240,192,64,0.15)",border:"1px solid rgba(240,192,64,0.4)",borderRadius:8}}>
        <div style={{fontSize:11,color:"rgba(240,192,64,0.8)"}}>Inerties minimales requises</div>
        <div style={{fontSize:18,fontWeight:800,color:"#f0c040"}}>Ix {inertieRequise(pELS,larg,L,critere,E)} · Iy {iyRequiseTraverse(L,h1,comp.poids_m2,a,E)} cm⁴</div>
        <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>Ix : vent ({libCrit}) · Iy : poids du vitrage (min L/500 ; 3 mm)</div>
      </div>
    </div>}

    <button onClick={()=>setShowT(true)} disabled={!pret} style={S.btnPrimary}>📐 {sysT==="AUTRE"?"Vérifier la traverse saisie":`Vérifier les traverses ${SYSTEMES_TRAVERSE[sysT]}`}</button>
    {!pret&&<div style={{fontSize:12,color:"#6b7280",marginTop:8}}>Renseigne la pression, la portée, les deux hauteurs de vitrage, la composition et la position des cales{sysT==="AUTRE"?", ainsi que Ix et Iy":""}.</div>}

    {res&&<div style={{marginTop:20}}>
      {rec?<div style={{...S.card,background:"#f0fdf4",border:"2px solid #059669",marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:800,color:"#1a1a2e",marginBottom:4}}>★ Traverse minimum recommandée : {rec.nom}</div>
        <div style={{fontSize:12,color:"#6b7280",marginBottom:10}}>{sysT==="AUTRE"?"Valeurs saisies":`Réf. ${marque} ${rec.ref}`} · vent {rec.calc.vent.fleche} / {rec.calc.vent.adm} mm · poids du vitrage {rec.calc.poids.fleche} / {rec.calc.poids.adm} mm{rec.relire?" · ⚠ valeur Schüco à recontrôler au catalogue":""}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
          <Stat label="Ix (vent)" value={`${rec.Ix} cm⁴`} hi/><Stat label="Taux vent" value={`${Math.round(rec.calc.vent.ratio*100)}%`}/>
          <Stat label="Iy (poids)" value={`${rec.Iy} cm⁴`} hi/><Stat label="Taux poids" value={`${Math.round(rec.calc.poids.ratio*100)}%`}/>
        </div>
      </div>:<div style={{...S.card,background:"#fff1f2",border:"1.5px solid #fca5a5",marginBottom:14,color:"#991b1b",fontSize:13,fontWeight:600}}>⚠ {sysT==="AUTRE"?"La traverse saisie":"Aucune traverse de la liste"} ne passe à la fois au vent et au poids du vitrage. Réduire la trame, alléger le vitrage, rapprocher les cales des meneaux ou prévoir une traverse renforcée.</div>}
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr style={{background:"#1a1a2e",color:"#fff"}}>{["Traverse","Réf.","Ix","Vent f / adm (mm)","Iy","Poids f / adm (mm)","Verdict"].map(h=><th key={h} style={{padding:"7px 10px",textAlign:"left",fontWeight:600,fontSize:12}}>{h}</th>)}</tr></thead>
        <tbody>{res.map((x,i)=><tr key={i} style={{background:x.calc.ok?(rec&&x.ref===rec.ref?"#d1fae5":"#fff"):"#fff1f2"}}>
          <td style={{padding:"7px 10px",fontWeight:600}}>{x.nom}{x.relire?<span title="Valeur Schüco à recontrôler au catalogue" style={{color:"#b45309"}}> ⚠</span>:null}</td>
          <td style={{padding:"7px 10px",fontFamily:"monospace",fontSize:12,color:"#6b7280"}}>{x.ref}</td>
          <td style={{padding:"7px 10px"}}>{x.Ix}</td>
          <td style={{padding:"7px 10px",color:x.calc.vent.ok?"#065f46":"#991b1b",fontWeight:600}}>{x.calc.vent.fleche} / {x.calc.vent.adm}</td>
          <td style={{padding:"7px 10px"}}>{x.Iy}</td>
          <td style={{padding:"7px 10px",color:x.calc.poids.ok?"#065f46":"#991b1b",fontWeight:600}}>{x.calc.poids.fleche} / {x.calc.poids.adm}</td>
          <td style={{padding:"7px 10px"}}>{x.calc.ok?<Badge color="green">✓ OK</Badge>:<Badge color="red">✗ {!x.calc.vent.ok&&!x.calc.poids.ok?"Vent + poids":!x.calc.vent.ok?"Vent":"Poids"}</Badge>}</td>
        </tr>)}</tbody>
      </table>
      <div style={{...S.card,background:"#f9fafb",marginTop:16,fontSize:12,color:"#6b7280",lineHeight:1.6}}>
        <strong>Méthode :</strong> traverse sur 2 appuis (les meneaux), portée = trame. <strong>Vent</strong> : charge uniforme q = pression ELS × largeur reprise, avec largeur = [min(h dessus ; L) + min(h dessous ; L)] / 2 — majorant de la répartition trapézoïdale réelle ; flèche 5qL⁴/(384·E·Ix), critère {libCrit}. <strong>Poids du vitrage</strong> : vitrage situé au-dessus de la traverse, P = poids surfacique × L × h dessus × 9,81, repris par 2 cales à la distance a des extrémités ; flèche (P/2)·a·(3L² − 4a²)/(24·E·Iy) ≤ min(L/500 ; 3 mm), critère usuel à confirmer par le CCTP ou le fabricant. Non vérifiés : torsion de la traverse due à l'excentrement du vitrage, contrainte, fixation traverse-meneau. Inerties : Schüco Catalogue général 2-1 « Façade FWS » (FDA23260, 11/2025 — ⚠ = lecture à recontrôler) ; Reynaers Docu Portal (11/2026).
      </div>
    </div>}
  </div>;
}

// ── Bloc « Profilé de châssis » de la page Flèche (ajout 25/11/2026) ─────────
function BlocChassis({projet,pression}){
  const exigee=classeVExigeeCCTP(projet.aev_min);
  const estim=pression?classeVRequise(pression):null;
  const defaut=exigee||(estim&&estim.classe!=="E"?estim.classe:"");
  const [cl,setCl]=useEtatModule("fleche.ch_classe","");
  const [ixC,setIxC]=useEtatModule("fleche.ch_ix","");
  const [LC,setLC]=useEtatModule("fleche.ch_portee","2.2");
  const [lC,setlC]=useEtatModule("fleche.ch_largeur","0.6");
  const [matC,setMatC]=useEtatModule("fleche.ch_mat","alu");
  const classe=+(cl||defaut)||null;
  const P1=classe?CLASSES_V[classe]:null;
  const ix=lireNombreSaisi(ixC), L=lireNombreSaisi(LC), lg=lireNombreSaisi(lC);
  const E=matC==="acier"?E_ACIER:E_ALU;
  const pret=!!P1&&!!L&&!!lg;
  const iReq=pret?inertieRequise(P1,lg,L,"150_15",E):null;
  const calc=pret&&ix?flecheMeneau(P1,lg,L,ix,"150_15",E):null;
  const err=t=><div style={{fontSize:11,color:"#b91c1c",marginTop:3}}>{t}</div>;
  return <div>
    <div style={{...S.card,background:"#f5f3ff",border:"1px solid #ddd6fe",marginBottom:14,fontSize:12,color:"#5b21b6",lineHeight:1.5}}>Vérifie un profilé de fenêtre ou de porte (montant de battement, meneau ou traverse de châssis) sous la pression <strong>P1</strong> de la classe de vent. Critère des DTA fenêtres : flèche de l'élément le plus sollicité <strong>≤ L/150, sans dépasser 15 mm</strong>. Saisis l'inertie Ix du profilé (catalogue du fabricant, axe perpendiculaire à la fenêtre) ; pour un ensemble ouvrant + dormant, utilise l'inertie donnée par le fabricant pour l'ensemble.</div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Classe de vent (P1)</label><select value={cl||String(defaut)} onChange={ev=>setCl(ev.target.value)} style={S.input}><option value="">— choisir —</option>{[1,2,3,4,5].map(k=><option key={k} value={k}>C{k} — P1 = {CLASSES_V[k]} Pa</option>)}</select>
        <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{exigee?`Classe du CCTP : V${exigee}`:estim?(estim.classe==="E"?"Pression au-delà de la classe 5 : choisir avec le fabricant":`Estimée d'après la pression : ${estim.label}`):"Aucune classe CCTP ni pression : choisir"}</div></div>
      <div><label style={S.label}>Ix du profilé (cm⁴)</label><input value={ixC} onChange={ev=>setIxC(ev.target.value)} placeholder="ex. 25,4" style={S.input}/>{String(ixC).trim()&&!ix&&err("Valeur illisible (ex. 25,4)")}
        <select value={matC} onChange={ev=>setMatC(ev.target.value)} style={{...S.input,marginTop:6}}><option value="alu">Aluminium (E = 70 000 N/mm²)</option><option value="acier">Acier (E = 210 000 N/mm²)</option></select></div>
      <div><label style={S.label}>Portée du profilé (m)</label><input value={LC} onChange={ev=>setLC(ev.target.value)} placeholder="2.2" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Longueur entre fixations / appuis</div>{String(LC).trim()&&!L&&err("Valeur illisible")}</div>
      <div><label style={S.label}>Largeur reprise (m)</label><input value={lC} onChange={ev=>setlC(ev.target.value)} placeholder="0.6" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Montant central de 2 vantaux : moitié de la largeur totale de la fenêtre</div>{String(lC).trim()&&!lg&&err("Valeur illisible")}</div>
    </div>
    {pret&&<div style={{padding:"10px 16px",background:"#1a1a2e",borderRadius:10,marginBottom:14,display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Pression P1 (classe C{classe})</div><div style={{fontSize:18,fontWeight:800,color:"#fff"}}>{P1} Pa</div></div>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Flèche admissible L/150 ≤ 15 mm</div><div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{flecheAdmissible(L*1000,"150_15").toFixed(1)} mm</div></div>
      <div style={{marginLeft:"auto",padding:"6px 14px",background:"rgba(240,192,64,0.15)",border:"1px solid rgba(240,192,64,0.4)",borderRadius:8}}>
        <div style={{fontSize:11,color:"rgba(240,192,64,0.8)"}}>Inertie Ix minimale requise</div>
        <div style={{fontSize:22,fontWeight:800,color:"#f0c040"}}>{iReq} cm⁴</div>
      </div>
    </div>}
    {calc&&<div style={{...S.card,background:calc.ok?"#f0fdf4":"#fff1f2",border:`2px solid ${calc.ok?"#059669":"#fca5a5"}`}}>
      <div style={{fontSize:15,fontWeight:800,color:calc.ok?"#065f46":"#991b1b",marginBottom:8}}>{calc.ok?"✓ Profilé suffisant":"✗ Profilé insuffisant"} — flèche {calc.fleche} mm pour {calc.adm} mm admissibles ({Math.round(calc.ratio*100)} %)</div>
      <div style={{fontSize:12,color:"#6b7280"}}>Méthode : profilé sur 2 appuis, charge uniforme q = P1 × largeur reprise (majorant), f = 5qL⁴/(384·E·I). {calc.ok?"":"Prendre un profilé plus rigide, un renfort, ou réduire la portée / la largeur reprise."} Contrôle indicatif : le DTA et le fabricant du système restent la référence.</div>
    </div>}
    {pret&&!ix&&<div style={{fontSize:12,color:"#6b7280"}}>Saisis l'Ix du profilé pour obtenir le verdict.</div>}
  </div>;
}

function PageFleche({projet}){
  const pression=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const facades=projet.elements.filter(e=>e.type==="facade");
  const [systeme,setSysteme]=useEtatModule("fleche.systeme","FW60");
  const [entraxe,setEntraxe]=useEtatModule("fleche.entraxe","1.35");
  const [portee,setPortee]=useEtatModule("fleche.portee","3.5");
  const [critere,setCritere]=useEtatModule("fleche.critere","en13116");
  const [show,setShow]=useEtatModule("fleche.afficher",false);
  const [ixAutre,setIxAutre]=useEtatModule("fleche.ix_autre","");
  const [info,setInfo]=useEtatModule("fleche.info","");
  const [mat,setMat]=useEtatModule("fleche.materiau","alu");
  const [mode,setMode]=useEtatModule("fleche.mode","meneau");
  const [pNoteTxt,setPNoteTxt]=useEtatModule("fleche.p_note","");
  // Pression ELS de la note de calcul (facultative) : remplace le tableau DTU 39 si elle est lisible
  const pNote=lireNombreSaisi(pNoteTxt), pNoteErr=!!String(pNoteTxt||"").trim()&&!pNote;
  // Module d'élasticité : aluminium pour les listes fabricants ; acier possible seulement en saisie libre
  const E=systeme==="AUTRE"&&mat==="acier"?E_ACIER:E_ALU;
  const libCrit=critere==="en13116"?"NF EN 13116":critere==="200_15"?"L/200 ≤ 15 mm":"L/"+critere;
  const e=+entraxe||0, Lp=+portee||0;
  // Flèche = critère de service : pression du tableau DTU 39 (ELU) ÷ 1,5
  const pELS=pNoteErr?null:(pNote||(pression?pressionServiceELS(pression):null));
  const valide=!!pELS&&e>0&&Lp>0;
  const nomSys=SYSTEMES_FLECHE[systeme]||systeme;
  const ixTxt=String(ixAutre||"").trim().replace(",",".");
  const ixA=/^\d+(\.\d+)?$/.test(ixTxt)&&+ixTxt>0?+ixTxt:null;
  const pret=valide&&(systeme!=="AUTRE"||!!ixA);
  const pDiag=diagPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  // Résultats recalculés en direct (changement de critère / entraxe pris en compte)
  const results=show&&pret?(systeme==="AUTRE"
    ?[{ref:"—",nom:`Meneau saisi (${mat==="acier"?"acier":"aluminium"})`,Ix:ixA,calc:flecheMeneau(pELS,e,Lp,ixA,critere,E)}]
    :profilesCompatibles(systeme,pELS,e,Lp,critere)):null;

  const chargerFacade=(el)=>{
    const af=analyseFacade(el);
    if(af){
      let ent=af.entraxe_meneau;
      if(!ent){const pan=panneauxCalcul(el);ent=pan.length?+(Math.max(...pan.map(p=>p.largeur))/1000).toFixed(2):1.35;}
      setEntraxe(String(ent));
      const h=af.H;
      setPortee(String(h>5?+(h/Math.ceil(h/3.5)).toFixed(2):h));
    }
    const pr=(projet.prescriptions||{})[el.id];
    const gam=((pr&&pr.gamme)||"").trim();
    const g=gam+" "+(el.soustype||"");
    // Plus de bascule silencieuse sur un système Schüco quand la façade est d'une autre marque
    const sid=(pr&&pr.sysId)||"";
    const sys=FLECHE_PAR_SYSID[sid]||(/FWS?\s*35/i.test(g)?"FW35PD":/FWS?\s*50/i.test(g)?"FW50":/FWS?\s*60/i.test(g)?"FW60":/Cortizo/i.test(g)&&/\b(TPH?|TPV|SG|SST?)\s*52\b/i.test(g)?"COR52":/Cortizo/i.test(g)&&/\b(TPH?|TPV|SG)\s*62\b/i.test(g)?"COR62":/Reynaers/i.test(g)&&/\bCW\s*50\b(?!-?FV)/i.test(g)?"REY_CW50":/Reynaers/i.test(g)&&/\bCW\s*60\b/i.test(g)?"REY_CW60":null);
    if(sys){setSysteme(sys);setInfo("");}
    else if(/^jan_viss/.test(sid)||/VISS/i.test(g)){setSysteme("AUTRE");setMat("acier");setInfo(`Façade « ${el.label} » en ${gam||"Jansen VISS"} : VISS ne fournit que les profilés de recouvrement — le meneau porteur est un profil acier dimensionné au projet. Saisis son inertie Ix (cm⁴) ; module acier E = 210 000 N/mm² appliqué.`);}
    else if(gam){setSysteme("AUTRE");setInfo(`Façade « ${el.label} » prescrite en ${gam} : saisis l'inertie Ix du meneau donnée par le fabricant (catalogue, axe vent).`);}
    else setInfo(`Façade « ${el.label} » : aucune gamme prescrite — choisis le système ou saisis l'Ix du meneau.`);
  };

  return <div>
    <div style={{...S.card,background:"#eef2ff",border:"1px solid #c7d2fe",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#3730a3",marginBottom:4}}>📐 Flèche — meneaux et traverses de façade, profilés de châssis</div>
      <div style={{fontSize:12,color:"#3730a3"}}>Le meneau travaille comme une poutre sur 2 appuis (planchers) sous charge de vent. La flèche se vérifie sous vent de <strong>service (ELS) = pression du tableau NF DTU 39 ÷ 1,5</strong>. Flèche admissible par défaut <strong>NF EN 13116:2024</strong> : L/200 si L ≤ 3 m ; 5 mm + L/300 entre 3 et 7,5 m ; L/250 au-delà (à confirmer par le CCTP / DTA du système retenu). Traverses : même critère au vent, et min(L/500 ; 3 mm) sous le poids du vitrage. Profilés de châssis (fenêtres, portes) : flèche ≤ L/150, plafonnée à 15 mm, sous la pression P1 de la classe de vent (critère des DTA fenêtres). Inerties : catalogue Schüco 2-1 Façade FWS (11/2025).</div>
    </div>

    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
      {[["meneau","Meneau de façade"],["traverse","Traverse de façade"],["chassis","Profilé de châssis"]].map(([k,l])=><button key={k} onClick={()=>setMode(k)} style={{padding:"8px 16px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:mode===k?"2px solid #3730a3":"1.5px solid #c7d2fe",background:mode===k?"#3730a3":"#fff",color:mode===k?"#fff":"#3730a3"}}>{l}</button>)}
    </div>

    {mode!=="chassis"&&<div style={{...S.card,marginBottom:14,display:"grid",gridTemplateColumns:"1fr 2fr",gap:12,alignItems:"start"}}>
      <div><label style={S.label}>Pression ELS de la note de calcul (Pa)</label><input value={pNoteTxt} onChange={ev=>setPNoteTxt(ev.target.value)} placeholder="facultatif — ex. 1450" style={S.input}/>{pNoteErr&&<div style={{fontSize:11,color:"#b91c1c",marginTop:3}}>Valeur illisible — saisis un nombre en Pa (ex. 1450) ou vide le champ</div>}</div>
      <div style={{fontSize:12,color:"#6b7280",lineHeight:1.5}}>{pNote?<><strong style={{color:"#3730a3"}}>Pression de la note de calcul utilisée : {pNote} Pa (ELS).</strong> Le tableau NF DTU 39 n'est plus utilisé. Saisis la pression <strong>de service, non majorée</strong>, de la zone étudiée (courante ou de rive).</>:<>Laisse vide pour utiliser le tableau NF DTU 39 ÷ 1,5. Si le bureau d'études a calculé le vent selon l'Eurocode (Cpe / Cpi), saisis ici la pression <strong>de service (ELS, sans le coefficient 1,5)</strong> de la zone étudiée : en zone de rive (angles), elle est nettement plus forte qu'en partie courante.</>}</div>
    </div>}

    {mode!=="chassis"&&!pELS&&!pNoteErr&&<div style={{...S.card,background:"#fff1f2",border:"1px solid #fca5a5",marginBottom:14,color:"#991b1b",fontSize:13}}>⚠ Pression de vent non calculée — renseigne d'abord la zone, le terrain et la hauteur en étape 1 ou 2, ou saisis la pression de la note de calcul.</div>}

    {mode==="traverse"&&<BlocTraverse pELS={pELS} pNote={pNote} pression={pression} critere={critere} setCritere={setCritere} entraxe={entraxe} setEntraxe={setEntraxe}/>}
    {mode==="chassis"&&<BlocChassis projet={projet} pression={pression}/>}
    {mode==="meneau"&&<>

    {facades.length>0&&<div style={{marginBottom:14}}>
      <label style={S.label}>Charger une façade du projet</label>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {facades.map((el,i)=>{
          const af=analyseFacade(el);
          return <button key={i} onClick={()=>chargerFacade(el)} style={{padding:"7px 14px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",border:"1.5px solid #c4b5fd",background:"#f5f3ff",color:"#5b21b6"}}>
            {el.label} <span style={{opacity:0.7}}>· {af&&af.mode!=="personnalisee"?`trame ${af.entraxe_meneau} m · ${af.nb_meneaux} meneaux`:"panneaux personnalisés"}</span>
          </button>;
        })}
      </div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Système façade</label><select value={systeme} onChange={ev=>{setSysteme(ev.target.value);setInfo("");}} style={S.input}>{Object.keys(SYSTEMES_FLECHE).map(k=><option key={k} value={k}>{SYSTEMES_FLECHE[k]}</option>)}</select>
        {systeme==="AUTRE"&&<div style={{marginTop:6}}><select value={mat} onChange={ev=>setMat(ev.target.value)} style={{...S.input,marginBottom:6}}><option value="alu">Aluminium (E = 70 000 N/mm²)</option><option value="acier">Acier (E = 210 000 N/mm²)</option></select><input value={ixAutre} onChange={ev=>setIxAutre(ev.target.value)} placeholder="Ix meneau (cm⁴)" style={S.input}/>{ixTxt&&!ixA&&<div style={{fontSize:11,color:"#b91c1c",marginTop:3}}>Valeur illisible — saisis un nombre en cm⁴ (ex. 278,8)</div>}</div>}</div>
      <div><label style={S.label}>Entraxe meneaux (m)</label><input type="number" value={entraxe} onChange={ev=>setEntraxe(ev.target.value)} step="0.05" placeholder="1.35" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Largeur de trame</div></div>
      <div><label style={S.label}>Portée meneau (m)</label><input type="number" value={portee} onChange={ev=>setPortee(ev.target.value)} step="0.1" placeholder="3.5" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Hauteur d'étage (entre planchers)</div></div>
      <div><label style={S.label}>Critère de flèche</label><select value={critere} onChange={ev=>setCritere(ev.target.value)} style={S.input}><option value="en13116">NF EN 13116 (L/200 ; 5 + L/300 ; L/250)</option><option value="200">L/200</option><option value="200_15">L/200 plafonné à 15 mm</option><option value="175">L/175</option></select></div>
    </div>

    {!pression&&!pNote&&<BandeauPression diag={pDiag} style={{marginBottom:14}}/>}
    {valide&&<div style={{padding:"10px 16px",background:"#1a1a2e",borderRadius:10,marginBottom:14,display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      {pNote?<div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Pression ELS — note de calcul</div><div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{Math.round(pELS)} Pa</div></div>:<>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Pression tableau DTU 39 (ELU)</div><div style={{fontSize:16,fontWeight:700,color:"rgba(255,255,255,0.75)"}}>{pression} Pa</div></div>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Pression de service (ELS) = ÷ 1,5</div><div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{Math.round(pELS)} Pa</div></div></>}
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Charge linéique meneau (ELS)</div><div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{(pELS*e/1000).toFixed(2)} N/mm</div></div>

function PageSecurite({db}){
  const secSystems=db.systemes.filter(s=>s.certifications&&s.certifications.length>0);

  const [classeFilter,setClasseFilter]=useEtatModule("securite.classe","");
  const [search,setSearch]=useEtatModule("securite.recherche","");

  // Toutes les certifications à plat, avec référence au système
  const allCerts=[];
  secSystems.forEach(sys=>{
    sys.certifications.forEach(c=>allCerts.push({...c,sysId:sys.id,sysNom:sys.nom,sysFamille:sys.famille}));
  });

  const types=[...new Set(allCerts.map(c=>c.type))];
  const classes=[...new Set(allCerts.map(c=>c.classe))].sort();

  const filtered=allCerts.filter(c=>{
    if(typeFilter&&c.type!==typeFilter)return false;
    if(classeFilter&&c.classe!==classeFilter)return false;
    if(search){
      const s=search.toLowerCase();
      if(!c.config.toLowerCase().includes(s)&&!c.sysNom.toLowerCase().includes(s)&&!c.classe.toLowerCase().includes(s))return false;
    }
    return true;
  });

  const typeColors={"pare-balle":"purple","effraction":"red","coupe-feu":"amber","DAS":"blue"};
  const typeLabels={"pare-balle":"🛡 Pare-balle","effraction":"🔒 Anti-effraction","coupe-feu":"🔥 Coupe-feu / Pare-flammes","DAS":"🚨 DAS (Dispositif Actionné de Sécurité)"};

  // Regrouper par système pour la vue détaillée
  const bySystem={};
  filtered.forEach(c=>{
    if(!bySystem[c.sysId])bySystem[c.sysId]={nom:c.sysNom,famille:c.sysFamille,certs:[]};
    bySystem[c.sysId].certs.push(c);

  return <div>
    <div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",marginBottom:14}}>

    </div>

    {/* Filtres rapides par type */}
    <div style={{marginBottom:12}}>
      <label style={S.label}>Type d'exigence</label>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button onClick={()=>{setTypeFilter("");setClasseFilter("");}} style={{padding:"8px 16px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:"1.5px solid",background:!typeFilter?"#1a1a2e":"#f9fafb",color:!typeFilter?"#fff":"#374151",borderColor:!typeFilter?"#1a1a2e":"#e5e7eb"}}>Tous ({allCerts.length})</button>
        {types.map(t=>{
          const count=allCerts.filter(c=>c.type===t).length;
          const active=typeFilter===t;
          return <button key={t} onClick={()=>{setTypeFilter(t);setClasseFilter("");}} style={{padding:"8px 16px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:"1.5px solid",background:active?"#1a1a2e":"#f9fafb",color:active?"#fff":"#374151",borderColor:active?"#1a1a2e":"#e5e7eb"}}>{typeLabels[t]||t} ({count})</button>;
        })}
      </div>
    </div>

    {/* Filtre par classe — dépend du type sélectionné */}
    <div style={{marginBottom:14}}>
      <label style={S.label}>Classe demandée (CCTP)</label>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {[...new Set(allCerts.filter(c=>!typeFilter||c.type===typeFilter).map(c=>c.classe))].sort().map(cl=>{
          const active=classeFilter===cl;
          return <button key={cl} onClick={()=>setClasseFilter(active?"":cl)} style={{padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:600,cursor:"pointer",border:"1px solid",background:active?"#059669":"#fff",color:active?"#fff":"#374151",borderColor:active?"#059669":"#d1d5db",fontFamily:"monospace"}}>{cl}</button>;
        })}
      </div>
    </div>

    {/* Recherche libre */}
    <div style={{marginBottom:16}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher : ex. 'porte', 'façade', 'Pyrostop', 'BR4'..." style={S.input}/>
    </div>

    {/* Résultats groupés par système */}
    <div style={{fontSize:13,color:"#6b7280",marginBottom:12}}><strong>{filtered.length}</strong> certification{filtered.length>1?"s":""} trouvée{filtered.length>1?"s":""} sur <strong>{Object.keys(bySystem).length}</strong> système{Object.keys(bySystem).length>1?"s":""}</div>

    {Object.entries(bySystem).map(([sysId,data])=>(
      <div key={sysId} style={{...S.card,marginBottom:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,paddingBottom:8,borderBottom:"1px solid #f3f4f6"}}>
          <span style={{width:28,height:28,borderRadius:8,background:"#1a1a2e",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>🛡</span>
          <div><div style={{fontWeight:800,fontSize:15,color:"#1a1a2e"}}>Schüco {data.nom}</div><div style={{fontSize:12,color:"#6b7280"}}>{data.famille} · {data.certs.length} certification{data.certs.length>1?"s":""}</div></div>
        </div>
        {data.certs.map((c,i)=>(
          <div key={i} style={{display:"grid",gridTemplateColumns:"110px 1fr 150px 120px",gap:10,alignItems:"center",padding:"7px 0",borderBottom:i<data.certs.length-1?"1px solid #f3f4f6":"none"}}>
            <Badge color={typeColors[c.type]||"gray"}>{c.classe}</Badge>
            <div style={{fontSize:12,color:"#374151"}}>{c.config}{c.dims&&c.dims!=="—"?<span style={{color:"#9ca3af"}}> — {c.dims}mm</span>:""}</div>
            <div style={{fontSize:11,color:"#6b7280",fontFamily:"monospace"}}>{c.rapport}</div>
            <div style={{fontSize:11,color:"#9ca3af",textAlign:"right"}}>{c.labo}{c.date?" · "+c.date:""}{(()=>{if(!/^\d{2}\/\d{2}\/\d{4}$/.test(c.date||""))return null;const st=statutDTA(c.date);if(st.statut==="ok")return null;return <div style={{color:st.couleur,fontWeight:700}}>{st.statut==="expire"?"⛔ PV expiré":"⚠ expire dans "+st.jours+" j"}</div>;})()}</div>
          </div>
        ))}
      </div>
    ))}

    {filtered.length===0&&<div style={{padding:14,background:"#fff1f2",borderRadius:10,color:"#991b1b",fontSize:13}}>Aucune certification trouvée pour ces critères</div>}

    {/* Message explicite : cas fréquent façade + anti-effraction, aucune donnée en base */}
    {typeFilter==="effraction"&&!allCerts.some(c=>c.type==="effraction"&&c.sysFamille==="Façade")&&<div style={{marginTop:10,padding:"12px 16px",background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:10,fontSize:12,color:"#1e40af",lineHeight:1.5}}>
      ℹ️ <strong>Aucun système Façade n'a de certification anti-effraction (RC/WK) dans la base actuellement</strong> — seuls des systèmes Porte/Fenêtre (Royal PB, AWS 90 BR) en ont. Ce n'est pas un problème d'affichage : ce sont des données manquantes. Si tu as un DTA ou PV d'essai anti-effraction pour un système façade (ex. une déclinaison RC de FWS 50/60), transmets-le pour intégration.
    </div>}

    {/* Légende classes */}
    <div style={{...S.card,background:"#f9fafb",marginTop:16}}>
      <div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>Repères classes</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,fontSize:12,color:"#6b7280",lineHeight:1.7}}>

          FB5 → fusil semi-auto calibre 7.62×51<br/>

          <strong>🔥 Coupe-feu / Pare-flammes (E / EI / EW)</strong><br/>
          E → étanchéité aux flammes seule<br/>
          EW → étanchéité + rayonnement limité<br/>
          EI → étanchéité + isolation thermique<br/>
          30/60/120 → durée en minutes
        </div>
      </div>
    </div>
  </div>;
}
