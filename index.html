        ))}</tbody>
        <tfoot><tr style={{background:"#f0fdf4",fontWeight:700,borderTop:"2px solid #6ee7b7"}}>
          <td style={{padding:"8px 10px"}} colSpan={4}>TOTAL PROJET</td>
          <td style={{padding:"8px 10px"}}></td>
          <td style={{padding:"8px 10px",fontWeight:800}}>{T.surf_total} m²</td>
          <td style={{padding:"8px 10px"}}></td>
          <td style={{padding:"8px 10px"}}>{T.poids_total>0?`${T.poids_total} kg`:"—"}</td>
        </tr></tfoot>
      </table>

      {T.poids_total===0&&<div style={{marginTop:14,padding:"10px 14px",background:"#fffbeb",borderRadius:8,border:"1px solid #fde68a",fontSize:12,color:"#92400e"}}>💡 Les poids s'afficheront une fois les systèmes retenus dans le comparateur (étape 3) — le métré reprend alors le poids du vitrage prescrit.</div>}

      <div style={{marginTop:18,paddingTop:10,borderTop:"1px solid #e5e7eb",fontSize:10,color:"#9ca3af",lineHeight:1.5}}>
        GlassIQ v2 — Métré récapitulatif par typologie · Surfaces et linéaires calculés depuis la trame déclarée · Poids estimé à partir du vitrage prescrit (densité verre 2,5 kg/m²/mm) · Valeurs indicatives à valider en phase EXE.
      </div>
    </div>
  </div>;
}

// ── PAGE FLÈCHE FAÇADE RIDEAU ──────────────────────────────────────────────
function PageFleche({projet}){
  const pression=calcPression(projet.zone_vent,projet.cat_terrain,projet.hauteur_bat);
  const facades=projet.elements.filter(e=>e.type==="facade");
  const [systeme,setSysteme]=useState("FW60");
  const [entraxe,setEntraxe]=useState("1.35");
  const [portee,setPortee]=useState("3.5");
  const [critere,setCritere]=useState("200");
  const [show,setShow]=useState(false);
  const libCrit=critere==="200_15"?"L/200 ≤ 15 mm":"L/"+critere;
  const e=+entraxe||0, Lp=+portee||0;
  const valide=!!pression&&e>0&&Lp>0;
  // Résultats recalculés en direct (changement de critère / entraxe pris en compte)
  const results=show&&valide?profilesCompatibles(systeme,pression,e,Lp,critere):null;

  const chargerFacade=(el)=>{
    const af=analyseFacade(el);
    if(af){
      let ent=af.entraxe_meneau;
      if(!ent){const pan=panneauxCalcul(el);ent=pan.length?+(Math.max(...pan.map(p=>p.largeur))/1000).toFixed(2):1.35;}
      setEntraxe(String(ent));
      const h=af.H;
      setPortee(String(h>5?+(h/Math.ceil(h/3.5)).toFixed(2):h));
    }
    const pr=(projet.prescriptions||{})[el.id];
    const g=((pr&&pr.gamme)||"")+" "+(el.soustype||"");
    setSysteme(/FWS?\s*50/i.test(g)?"FW50":"FW60");
  };

  return <div>
    <div style={{...S.card,background:"#eef2ff",border:"1px solid #c7d2fe",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#3730a3",marginBottom:4}}>📐 Flèche meneau façade rideau — vérification structurelle</div>
      <div style={{fontSize:12,color:"#3730a3"}}>Le meneau travaille comme une poutre sur 2 appuis (planchers) sous charge de vent. Flèche admissible : valeur usuelle L/200, souvent plafonnée à 15 mm — <strong>à confirmer par le DTA du système retenu / NF DTU 33.1</strong>. (La flèche des châssis fenêtres/portes relève du NF DTU 39 : L/150, max 15 mm sous 800 Pa.) Données profilés : catalogue Schüco Façades 2026.</div>
    </div>

    {!pression&&<div style={{...S.card,background:"#fff1f2",border:"1px solid #fca5a5",marginBottom:14,color:"#991b1b",fontSize:13}}>⚠ Pression de vent non calculée — renseigne d'abord la zone, le terrain et la hauteur en étape 1 ou 2.</div>}

    {facades.length>0&&<div style={{marginBottom:14}}>
      <label style={S.label}>Charger une façade du projet</label>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {facades.map((el,i)=>{
          const af=analyseFacade(el);
          return <button key={i} onClick={()=>chargerFacade(el)} style={{padding:"7px 14px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",border:"1.5px solid #c4b5fd",background:"#f5f3ff",color:"#5b21b6"}}>
            {el.label} <span style={{opacity:0.7}}>· {af&&af.mode!=="personnalisee"?`trame ${af.entraxe_meneau} m · ${af.nb_meneaux} meneaux`:"panneaux personnalisés"}</span>
          </button>;
        })}
      </div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Système façade</label><select value={systeme} onChange={ev=>setSysteme(ev.target.value)} style={S.input}><option value="FW50">Schüco FWS 50</option><option value="FW60">Schüco FWS 60</option></select></div>
      <div><label style={S.label}>Entraxe meneaux (m)</label><input type="number" value={entraxe} onChange={ev=>setEntraxe(ev.target.value)} step="0.05" placeholder="1.35" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Largeur de trame</div></div>
      <div><label style={S.label}>Portée meneau (m)</label><input type="number" value={portee} onChange={ev=>setPortee(ev.target.value)} step="0.1" placeholder="3.5" style={S.input}/><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Hauteur d'étage (entre planchers)</div></div>
      <div><label style={S.label}>Critère de flèche</label><select value={critere} onChange={ev=>setCritere(ev.target.value)} style={S.input}><option value="200">L/200 (usuel)</option><option value="200_15">L/200 plafonné à 15 mm</option><option value="175">L/175</option></select></div>
    </div>

    {valide&&<div style={{padding:"10px 16px",background:"#1a1a2e",borderRadius:10,marginBottom:14,display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Pression vent</div><div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{pression} Pa</div></div>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Charge linéique meneau</div><div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{(pression*e/1000).toFixed(2)} N/mm</div></div>
      <div><div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>Flèche admissible {libCrit}</div><div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{flecheAdmissible(Lp*1000,critere).toFixed(1)} mm</div></div>
      <div style={{marginLeft:"auto",padding:"6px 14px",background:"rgba(240,192,64,0.15)",border:"1px solid rgba(240,192,64,0.4)",borderRadius:8}}>
        <div style={{fontSize:11,color:"rgba(240,192,64,0.8)"}}>Inertie Ix minimale requise</div>
        <div style={{fontSize:22,fontWeight:800,color:"#f0c040"}}>{inertieRequise(pression,e,Lp,critere)} cm⁴</div>
        <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>universel — comparable à tout catalogue fabricant</div>
      </div>
    </div>}

    <button onClick={()=>setShow(true)} disabled={!valide} style={S.btnPrimary}>📐 Vérifier les meneaux {systeme==="FW50"?"FWS 50":"FWS 60"}</button>

    {results&&<div style={{marginTop:20}}>
      <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>{results.length} profilé{results.length>1?"s":""} meneau analysé{results.length>1?"s":""} — le plus léger qui passe est mis en avant</div>
      {(()=>{
        const recommended=results.find(p=>p.calc.ok)||null;
        return <>
          {recommended&&<div style={{...S.card,background:"#f0fdf4",border:"2px solid #059669",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <span style={{width:28,height:28,borderRadius:8,background:"#059669",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>★</span>
              <div><div style={{fontSize:15,fontWeight:800,color:"#1a1a2e"}}>Profilé minimum recommandé : {recommended.nom}</div><div style={{fontSize:12,color:"#6b7280"}}>Réf. Schüco {recommended.ref} · le plus léger qui satisfait {libCrit}</div></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
              <Stat label="Inertie Ix" value={`${recommended.Ix} cm⁴`} hi/>
              <Stat label="Flèche calculée" value={`${recommended.calc.fleche} mm`} hi/>
              <Stat label={`Admissible ${libCrit}`} value={`${recommended.calc.adm} mm`}/>
              <Stat label="Taux d'utilisation" value={`${Math.round(recommended.calc.ratio*100)}%`}/>
            </div>
          </div>}
          {!recommended&&<div style={{...S.card,background:"#fff1f2",border:"1.5px solid #fca5a5",marginBottom:14,color:"#991b1b",fontSize:13,fontWeight:600}}>⚠ Aucun meneau {systeme==="FW50"?"FWS 50":"FWS 60"} ne satisfait {libCrit} dans cette configuration. Il faut réduire l'entraxe, réduire la portée, ou passer à un meneau renforcé acier / un système plus profond.</div>}

          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#1a1a2e",color:"#fff"}}>{["Profilé","Réf.","Ix (cm⁴)","Flèche (mm)",`Adm. ${libCrit}`,"Taux","Verdict"].map(h=><th key={h} style={{padding:"7px 10px",textAlign:"left",fontWeight:600,fontSize:12}}>{h}</th>)}</tr></thead>
            <tbody>{results.map((p,i)=>{
              const ok=p.calc.ok;
              return <tr key={i} style={{background:ok?(recommended&&p.ref===recommended.ref?"#d1fae5":"#fff"):"#fff1f2"}}>
                <td style={{padding:"7px 10px",fontWeight:600}}>{p.nom}</td>
                <td style={{padding:"7px 10px",fontFamily:"monospace",fontSize:12,color:"#6b7280"}}>{p.ref}</td>
                <td style={{padding:"7px 10px",fontWeight:700}}>{p.Ix}</td>
                <td style={{padding:"7px 10px",color:ok?"#065f46":"#991b1b",fontWeight:600}}>{p.calc.fleche}</td>
                <td style={{padding:"7px 10px",color:"#6b7280"}}>{p.calc.adm}</td>
                <td style={{padding:"7px 10px"}}>{Math.round(p.calc.ratio*100)}%</td>
                <td style={{padding:"7px 10px"}}>{ok?<Badge color="green">✓ OK</Badge>:<Badge color="red">✗ Flèche</Badge>}</td>
              </tr>;
            })}</tbody>
          </table>
        </>;
      })()}
      <div style={{...S.card,background:"#f9fafb",marginTop:16,fontSize:12,color:"#6b7280",lineHeight:1.6}}>
        <strong>Méthode :</strong> meneau modélisé en poutre simplement appuyée, charge vent uniformément répartie q = pression × entraxe. Flèche f = 5qL⁴/(384·E·I) avec E<sub>alu</sub> = 70 000 N/mm². Inertie Ix = flexion sous vent (perpendiculaire à la façade). Les valeurs d'inertie sont issues du catalogue de fabrication Schüco Façades. Contrainte, poids propre et combinaisons ELU/ELS non vérifiés ici : pour un dimensionnement définitif, valider avec une note de calcul SchüCal.
      </div>
    </div>}
  </div>;
}

// ── PAGE PARE-BALLE / COUPE-FEU ────────────────────────────────────────────
function PageSecurite({db}){
  const secSystems=db.systemes.filter(s=>s.certifications&&s.certifications.length>0);
  const [typeFilter,setTypeFilter]=useState("");
  const [classeFilter,setClasseFilter]=useState("");
  const [search,setSearch]=useState("");

  // Toutes les certifications à plat, avec référence au système
  const allCerts=[];
  secSystems.forEach(sys=>{
    sys.certifications.forEach(c=>allCerts.push({...c,sysId:sys.id,sysNom:sys.nom,sysFamille:sys.famille}));
  });

  const types=[...new Set(allCerts.map(c=>c.type))];
  const classes=[...new Set(allCerts.map(c=>c.classe))].sort();

  const filtered=allCerts.filter(c=>{
    if(typeFilter&&c.type!==typeFilter)return false;
    if(classeFilter&&c.classe!==classeFilter)return false;
    if(search){
      const s=search.toLowerCase();
      if(!c.config.toLowerCase().includes(s)&&!c.sysNom.toLowerCase().includes(s)&&!c.classe.toLowerCase().includes(s))return false;
    }
    return true;
  });

  const typeColors={"pare-balle":"purple","effraction":"red","coupe-feu":"amber","DAS":"blue"};
  const typeLabels={"pare-balle":"🛡 Pare-balle","effraction":"🔒 Anti-effraction","coupe-feu":"🔥 Coupe-feu / Pare-flammes","DAS":"🚨 DAS (Dispositif Actionné de Sécurité)"};

  // Regrouper par système pour la vue détaillée
  const bySystem={};
  filtered.forEach(c=>{
    if(!bySystem[c.sysId])bySystem[c.sysId]={nom:c.sysNom,famille:c.sysFamille,certs:[]};
    bySystem[c.sysId].certs.push(c);
  });

  return <div>
    <div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#92400e",marginBottom:4}}>🛡 Pare-balle / 🔥 Coupe-feu — recherche directe par exigence sécurité</div>
      <div style={{fontSize:12,color:"#92400e"}}>Sélectionne le type d'exigence (CCTP sécurité incendie ou résistance balistique) puis la classe demandée — les systèmes Schüco compatibles s'affichent avec leur rapport d'essai.</div>
    </div>

    {/* Filtres rapides par type */}
    <div style={{marginBottom:12}}>
      <label style={S.label}>Type d'exigence</label>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button onClick={()=>{setTypeFilter("");setClasseFilter("");}} style={{padding:"8px 16px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:"1.5px solid",background:!typeFilter?"#1a1a2e":"#f9fafb",color:!typeFilter?"#fff":"#374151",borderColor:!typeFilter?"#1a1a2e":"#e5e7eb"}}>Tous ({allCerts.length})</button>
        {types.map(t=>{
          const count=allCerts.filter(c=>c.type===t).length;
          const active=typeFilter===t;
          return <button key={t} onClick={()=>{setTypeFilter(t);setClasseFilter("");}} style={{padding:"8px 16px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",border:"1.5px solid",background:active?"#1a1a2e":"#f9fafb",color:active?"#fff":"#374151",borderColor:active?"#1a1a2e":"#e5e7eb"}}>{typeLabels[t]||t} ({count})</button>;
        })}
      </div>
    </div>

    {/* Filtre par classe — dépend du type sélectionné */}
    <div style={{marginBottom:14}}>
      <label style={S.label}>Classe demandée (CCTP)</label>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {[...new Set(allCerts.filter(c=>!typeFilter||c.type===typeFilter).map(c=>c.classe))].sort().map(cl=>{
          const active=classeFilter===cl;
          return <button key={cl} onClick={()=>setClasseFilter(active?"":cl)} style={{padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:600,cursor:"pointer",border:"1px solid",background:active?"#059669":"#fff",color:active?"#fff":"#374151",borderColor:active?"#059669":"#d1d5db",fontFamily:"monospace"}}>{cl}</button>;
        })}
      </div>
    </div>

    {/* Recherche libre */}
    <div style={{marginBottom:16}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher : ex. 'porte', 'façade', 'Pyrostop', 'BR4'..." style={S.input}/>
    </div>

    {/* Résultats groupés par système */}
    <div style={{fontSize:13,color:"#6b7280",marginBottom:12}}><strong>{filtered.length}</strong> certification{filtered.length>1?"s":""} trouvée{filtered.length>1?"s":""} sur <strong>{Object.keys(bySystem).length}</strong> système{Object.keys(bySystem).length>1?"s":""}</div>

    {Object.entries(bySystem).map(([sysId,data])=>(
      <div key={sysId} style={{...S.card,marginBottom:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,paddingBottom:8,borderBottom:"1px solid #f3f4f6"}}>
          <span style={{width:28,height:28,borderRadius:8,background:"#1a1a2e",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>🛡</span>
          <div><div style={{fontWeight:800,fontSize:15,color:"#1a1a2e"}}>Schüco {data.nom}</div><div style={{fontSize:12,color:"#6b7280"}}>{data.famille} · {data.certs.length} certification{data.certs.length>1?"s":""}</div></div>
        </div>
        {data.certs.map((c,i)=>(
          <div key={i} style={{display:"grid",gridTemplateColumns:"110px 1fr 150px 120px",gap:10,alignItems:"center",padding:"7px 0",borderBottom:i<data.certs.length-1?"1px solid #f3f4f6":"none"}}>
            <Badge color={typeColors[c.type]||"gray"}>{c.classe}</Badge>
            <div style={{fontSize:12,color:"#374151"}}>{c.config}{c.dims&&c.dims!=="—"?<span style={{color:"#9ca3af"}}> — {c.dims}mm</span>:""}</div>
            <div style={{fontSize:11,color:"#6b7280",fontFamily:"monospace"}}>{c.rapport}</div>
            <div style={{fontSize:11,color:"#9ca3af",textAlign:"right"}}>{c.labo}{c.date?" · "+c.date:""}{(()=>{if(!/^\d{2}\/\d{2}\/\d{4}$/.test(c.date||""))return null;const st=statutDTA(c.date);if(st.statut==="ok")return null;return <div style={{color:st.couleur,fontWeight:700}}>{st.statut==="expire"?"⛔ PV expiré":"⚠ expire dans "+st.jours+" j"}</div>;})()}</div>
          </div>
        ))}
      </div>
    ))}

    {filtered.length===0&&<div style={{padding:14,background:"#fff1f2",borderRadius:10,color:"#991b1b",fontSize:13}}>Aucune certification trouvée pour ces critères</div>}

    {/* Message explicite : cas fréquent façade + anti-effraction, aucune donnée en base */}
    {typeFilter==="effraction"&&!allCerts.some(c=>c.type==="effraction"&&c.sysFamille==="Façade")&&<div style={{marginTop:10,padding:"12px 16px",background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:10,fontSize:12,color:"#1e40af",lineHeight:1.5}}>
      ℹ️ <strong>Aucun système Façade n'a de certification anti-effraction (RC/WK) dans la base actuellement</strong> — seuls des systèmes Porte/Fenêtre (Royal PB, AWS 90 BR) en ont. Ce n'est pas un problème d'affichage : ce sont des données manquantes. Si tu as un DTA ou PV d'essai anti-effraction pour un système façade (ex. une déclinaison RC de FWS 50/60), transmets-le pour intégration.
    </div>}

    {/* Légende classes */}
    <div style={{...S.card,background:"#f9fafb",marginTop:16}}>
      <div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>Repères classes</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,fontSize:12,color:"#6b7280",lineHeight:1.7}}>
        <div>
          <strong>🛡 Pare-balle (FB / FSG)</strong><br/>
          FB4 → arme de poing calibre .357 Mag<br/>
          FB5 → fusil semi-auto calibre 7.62×51<br/>
          FB6 → fusil d'assaut calibre 7.62×51 AP<br/>
          (S) = avec éclats / (NS) = sans éclats
        </div>
        <div>
          <strong>🔥 Coupe-feu / Pare-flammes (E / EI / EW)</strong><br/>
          E → étanchéité aux flammes seule<br/>
          EW → étanchéité + rayonnement limité<br/>
          EI → étanchéité + isolation thermique<br/>
          30/60/120 → durée en minutes
        </div>
      </div>
    </div>
  </div>;
}

// ── PAGE BASE ─────────────────────────────────────────────────────────────
function PageBase({db}){
  const normalSystems=db.systemes.filter(s=>!s.certifications);
  const marques=[...new Set(normalSystems.map(s=>s.marque))];
  const [ma,setMa]=useState(marques[0]||"");
  const [sel,setSel]=useState(normalSystems[0]?.id);
  const sys=normalSystems.find(s=>s.id===sel);
  return <div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
      {marques.map(m=><button key={m} onClick={()=>{setMa(m);const f=normalSystems.find(s=>s.marque===m);if(f)setSel(f.id);}} style={{padding:"6px 14px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",background:ma===m?"#1a1a2e":"#f3f4f6",color:ma===m?"#fff":"#374151",border:ma===m?"2px solid #1a1a2e":"2px solid #e5e7eb"}}>{m}</button>)}
    </div>
    <div style={{marginBottom:16}}><select value={sel} onChange={e=>setSel(e.target.value)} style={{...S.input,fontWeight:600,color:"#4f46e5",borderColor:"#c7d2fe",background:"#f1f0ff"}}>{normalSystems.filter(s=>s.marque===ma).map(s=><option key={s.id} value={s.id}>{s.nom} — {s.famille}</option>)}</select></div>
    {sys&&<div>
      <div style={{...S.card,background:"#f9fafb"}}><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}><Stat label="Marque" value={sys.marque}/><Stat label="Famille" value={sys.famille}/><Stat label="DTA" value={sys.dta||"—"} mono/><Stat label="Validité" value={sys.validite||"—"}/></div>
        {(()=>{const st=statutDTA(sys.validite);if(st.statut==="ok")return null;return <div style={{marginTop:10,padding:"10px 14px",borderRadius:8,fontSize:12,fontWeight:600,color:st.couleur,background:st.bg,border:`1px solid ${st.couleur}44`}}>{st.statut==="expire"?"⛔ ":st.statut==="bientot"?"⚠ ":"? "}{st.texte}{st.statut==="expire"?" — ne pas prescrire sans vérifier le renouvellement du DTA auprès du fabricant.":st.statut==="bientot"?" — vérifier la date de pose ; le DTA doit être valide à la signature du marché.":" — impossible de vérifier la validité, à confirmer auprès du fabricant."}</div>;})()}
      </div>
      {sys.tests.map((test,ti)=><div key={ti} style={{marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <div><div style={{fontWeight:700,color:"#1a1a2e",fontSize:14}}>{test.type_chassis}</div><div style={{fontSize:12,color:"#6b7280"}}>Rapport {test.rapport} · {test.labo} {test.date} · {test.dim_L}×{test.dim_H}mm</div></div>
          <Badge color="blue">PV certifié</Badge>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#1a1a2e",color:"#fff"}}>{["Composition","Rw","Rw+C","Rw+Ctr"].map(h=><th key={h} style={{padding:"7px 12px",textAlign:"left",fontWeight:600}}>{h}</th>)}</tr></thead>
          <tbody>{test.vitrages.map((v,vi)=><tr key={vi} style={{background:vi%2===0?"#fff":"#f9fafb"}}><td style={{padding:"8px 12px",fontFamily:"monospace",fontWeight:600}}>{v.composition}</td><td style={{padding:"8px 12px",fontWeight:700}}>{v.rw} dB</td><td style={{padding:"8px 12px"}}>{v.rwc} dB</td><td style={{padding:"8px 12px"}}>{v.rwctr} dB</td></tr>)}</tbody>
        </table>
      </div>)}
      {sys.aev&&sys.aev.length>0&&<div style={{marginTop:18}}>
        <div style={{fontSize:12,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>Classements AEV certifiés</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#0f3460",color:"#fff"}}>{["Châssis","Dimensions","Air","Eau","Vent","Rapport","Date"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",fontWeight:600}}>{h}</th>)}</tr></thead>
          <tbody>{sys.aev.map((a,ai)=><tr key={ai} style={{background:ai%2===0?"#fff":"#f0f4ff"}}><td style={{padding:"7px 10px"}}>{a.chassis}</td><td style={{padding:"7px 10px",fontFamily:"monospace"}}>{a.dims}</td><td style={{padding:"7px 10px",fontWeight:700,color:"#1e40af"}}>{a.A}</td><td style={{padding:"7px 10px",fontWeight:700,color:"#1e40af"}}>{a.E}</td><td style={{padding:"7px 10px",fontWeight:700,color:"#1e40af"}}>{a.V}</td><td style={{padding:"7px 10px",fontSize:11,color:"#6b7280",fontFamily:"monospace"}}>{a.rapport}</td><td style={{padding:"7px 10px",fontSize:11,color:"#6b7280"}}>{a.date}</td></tr>)}</tbody>
        </table>
      </div>}
    </div>}
  </div>;
}

// ── PAGE AJOUTER / GÉRER MES SYSTÈMES ─────────────────────────────────────
// CORRIGÉ v2.5 : l'ancien ajout "par IA" ne pouvait pas fonctionner hors de Claude
// (appel API sans clé, bloqué par le navigateur). Remplacé par un formulaire de
// saisie manuelle — utilisable même sans DTA — avec modification, export et import.
const FAMILLES_SAISIE=["Fenêtre","Porte-fenêtre","Porte","Coulissant","Façade"];
function formVide(){
  return {id:"",nom:"",marque:"Schüco",famille:"Fenêtre",dta:"",validite:"",epaisseur_min:"24",epaisseur_max:"48",poids_max:"130",vantaux_defaut:"",note:"",
    tests:[{rapport:"",type_chassis:"",dim_L:"1230",dim_H:"1480",labo:"",date:"",vitrages:[{composition:"",rw:"",rwc:"",rwctr:""}]}],
    aev:[],thermique:[],dimensions_max:[]};
}
function systemeVersForm(s){
  const str=v=>v==null?"":String(v);
  return {id:s.id||"",nom:str(s.nom),marque:str(s.marque),famille:FAMILLES_SAISIE.includes(s.famille)?s.famille:"Fenêtre",dta:str(s.dta),validite:str(s.validite),
    epaisseur_min:str(s.epaisseur_min),epaisseur_max:str(s.epaisseur_max),poids_max:str(s.poids_max),vantaux_defaut:str(s.vantaux_defaut),note:str(s.note),
    tests:(s.tests||[]).map(t=>({rapport:str(t.rapport),type_chassis:str(t.type_chassis),dim_L:str(t.dim_L),dim_H:str(t.dim_H),labo:str(t.labo),date:str(t.date),
      vitrages:(t.vitrages||[]).map(v=>({composition:str(v.composition),rw:str(v.rw),rwc:str(v.rwc),rwctr:str(v.rwctr)}))})),
    aev:(s.aev||[]).map(a=>({chassis:str(a.chassis),dims:str(a.dims),A:str(a.A),E:str(a.E),V:str(a.V),rapport:str(a.rapport),date:str(a.date)})),
    thermique:(s.thermique||[]).map(t=>({ug:str(t.ug),config:str(t.config),uw:str(t.uw)})),
    dimensions_max:(s.dimensions_max||[]).map(d=>({type:str(d.type),l_max:str(d.l_max!=null?d.l_max:d.L),h_max:str(d.h_max!=null?d.h_max:d.H)}))};
}
function nombreSaisi(v){const x=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(x)?x:null;}
function formVersSysteme(f){
  const n=nombreSaisi, t=v=>String(v||"").trim();
  const sys={id:f.id||("perso_"+Date.now().toString(36)),perso:true,nom:t(f.nom),marque:t(f.marque),famille:f.famille,dta:t(f.dta),validite:t(f.validite),
    epaisseur_min:n(f.epaisseur_min),epaisseur_max:n(f.epaisseur_max),poids_max:n(f.poids_max),note:t(f.note),
    tests:f.tests.map(x=>({rapport:t(x.rapport),type_chassis:t(x.type_chassis),dim_L:n(x.dim_L)||1230,dim_H:n(x.dim_H)||1480,labo:t(x.labo),date:t(x.date),
      vitrages:x.vitrages.filter(v=>t(v.composition)&&n(v.rwctr)!=null).map(v=>({composition:t(v.composition),rw:n(v.rw),rwc:n(v.rwc),rwctr:n(v.rwctr)}))}))
      .filter(x=>x.vitrages.length>0),
    aev:f.aev.filter(a=>t(a.chassis)||t(a.V)).map(a=>({chassis:t(a.chassis),dims:t(a.dims),A:t(a.A),E:t(a.E),V:t(a.V),rapport:t(a.rapport),date:t(a.date)})),
    thermique:f.thermique.filter(x=>n(x.uw)!=null).map(x=>({ug:n(x.ug),config:t(x.config),uw:n(x.uw)})),
    dimensions_max:f.dimensions_max.filter(d=>n(d.l_max)&&n(d.h_max)).map(d=>({type:t(d.type),l_max:n(d.l_max),h_max:n(d.h_max)}))};
  if(n(f.vantaux_defaut))sys.vantaux_defaut=n(f.vantaux_defaut);
  return sys;
}
function erreursForm(f){
  const e=[], n=nombreSaisi;
  if(!String(f.nom).trim())e.push("Nom du système obligatoire");
  if(!String(f.marque).trim())e.push("Marque obligatoire");
  const mi=n(f.epaisseur_min),ma=n(f.epaisseur_max);
  if(!(mi>0)||!(ma>0)||mi>ma)e.push("Feuillure : épaisseurs min / max invalides");
  if(!(n(f.poids_max)>0))e.push("Poids max (ferrure ou appui vitrage) obligatoire");
  if(String(f.validite).trim()&&!/^\d{2}\/\d{2}\/\d{4}$/.test(String(f.validite).trim()))e.push("Validité DTA : format JJ/MM/AAAA (ou laisser vide)");
  return e;
}
function avertissementsForm(f){
  const w=[];
  const vit=f.tests.flatMap(t=>t.vitrages).filter(v=>String(v.composition).trim());
  if(!vit.length)w.push("Aucun PV acoustique : le système n'apparaîtra pas dans le comparateur (seulement dans « Ma base » et le vérificateur de vitrage libre).");
  vit.forEach(v=>{
    if(!analyseComposition(String(v.composition).trim()))w.push(`« ${v.composition} » non reconnue : poids, feuillure et résistance ne pourront pas être calculés (format ex. 10/16/44.2s).`);
    if(nombreSaisi(v.rwctr)==null)w.push(`« ${v.composition} » : Rw+Ctr manquant — ligne ignorée.`);
  });
  if(!String(f.dta).trim())w.push("Sans DTA : le comparateur affichera « validité non renseignée » (non bloquant).");
  return w;
}

function PageAjouter({db,onChange}){
  const [form,setForm]=useState(formVide);
  const [perso,setPerso]=useState(()=>getPerso());
  const [msg,setMsg]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);
  const [srcId,setSrcId]=useState("");
  const refresh=()=>{setPerso(getPerso());onChange&&onChange();};
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const setRow=(list,i,k,v)=>setForm(f=>({...f,[list]:f[list].map((r,j)=>j===i?{...r,[k]:v}:r)}));
  const addRow=(list,row)=>setForm(f=>({...f,[list]:[...f[list],row]}));
  const delRow=(list,i)=>setForm(f=>({...f,[list]:f[list].filter((_,j)=>j!==i)}));
  const setTest=(ti,k,v)=>setForm(f=>({...f,tests:f.tests.map((t,j)=>j===ti?{...t,[k]:v}:t)}));
  const setVit=(ti,vi,k,v)=>setForm(f=>({...f,tests:f.tests.map((t,j)=>j===ti?{...t,vitrages:t.vitrages.map((x,m)=>m===vi?{...x,[k]:v}:x)}:t)}));
  const addVit=(ti)=>setForm(f=>({...f,tests:f.tests.map((t,j)=>j===ti?{...t,vitrages:[...t.vitrages,{composition:"",rw:"",rwc:"",rwctr:""}]}:t)}));
  const delVit=(ti,vi)=>setForm(f=>({...f,tests:f.tests.map((t,j)=>j===ti?{...t,vitrages:t.vitrages.filter((_,m)=>m!==vi)}:t)}));
  const erreurs=erreursForm(form), avert=avertissementsForm(form);

  const enregistrer=()=>{
    if(erreurs.length)return;
    const sys=formVersSysteme(form);
    const list=getPerso();
    const idx=list.findIndex(s=>s.id===sys.id);
    if(idx>=0)list[idx]=sys; else list.push(sys);
    if(!savePerso(list)){setMsg({t:"warn",m:"Échec de l'enregistrement (stockage du navigateur plein ou bloqué)."});return;}
    refresh(); setForm(formVide());
    setMsg({t:"ok",m:`« ${sys.marque} ${sys.nom} » enregistré ✓ — disponible dans le comparateur et dans Ma base.`});
  };
  const editer=(s)=>{setForm(systemeVersForm(s));setMsg({t:"ok",m:`Modification de « ${s.marque} ${s.nom} » — enregistre pour valider.`});try{window.scrollTo(0,0);}catch(e){}};
  const partirDe=()=>{
    const s=db.systemes.find(x=>x.id===srcId);if(!s)return;
    const f=systemeVersForm(s);
    setForm({...f,id:"",nom:f.nom+" (variante)"});setSrcId("");
    setMsg({t:"ok",m:`Données copiées depuis ${s.marque} ${s.nom} — modifie puis enregistre. L'original n'est pas touché.`});
  };
  const supprimer=(id)=>{savePerso(getPerso().filter(s=>s.id!==id));setConfirmDel(null);if(form.id===id)setForm(formVide());refresh();};
  const exporter=()=>{
    const blob=new Blob([JSON.stringify(getPerso(),null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download="GlassIQ_mes_systemes.json";a.click();URL.revokeObjectURL(url);
  };
  const importer=(e)=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        const arr=(Array.isArray(data)?data:[data]).filter(s=>s&&typeof s==="object"&&s.nom&&s.famille);
        if(!arr.length)throw new Error("vide");
        const ids=new Set(INITIAL_DB.systemes.map(s=>s.id));
        const list=getPerso();
        arr.forEach(s=>{
          const sys={tests:[],aev:[],thermique:[],...s,perso:true};
          if(!sys.id||ids.has(sys.id))sys.id="perso_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
          const idx=list.findIndex(x=>x.id===sys.id);
          if(idx>=0)list[idx]=sys; else list.push(sys);
        });
        savePerso(list);refresh();
        setMsg({t:"ok",m:`${arr.length} système(s) importé(s) ✓`});
      }catch(err){setMsg({t:"warn",m:"Fichier invalide — attendu : export « Mes systèmes » de GlassIQ."});}
    };
    reader.readAsText(file);
    e.target.value="";
  };

  // Aides de saisie (fonctions — pas des composants — pour garder le focus pendant la frappe)
  const inp=(value,onCh,ph,extra)=><input value={value} placeholder={ph||""} onChange={e=>onCh(e.target.value)} style={{...S.input,padding:"6px 8px",fontSize:12,...(extra||{})}}/>;
  const lab=(t)=><label style={{...S.label,fontSize:9,marginBottom:3}}>{t}</label>;
  const titre=(t,sous)=><div style={{marginBottom:8}}><div style={{fontSize:12,fontWeight:700,color:"#1a1a2e",textTransform:"uppercase",letterSpacing:"0.05em"}}>{t}</div>{sous&&<div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{sous}</div>}</div>;
  const btnX=(onClick)=><button onClick={onClick} style={{padding:"6px 9px",borderRadius:6,border:"1px solid #fca5a5",background:"#fee2e2",color:"#991b1b",cursor:"pointer",fontSize:11}}>✕</button>;
  const btnAdd=(t,onClick)=><button onClick={onClick} style={{...S.btnSecondary,fontSize:11,padding:"5px 10px"}}>{t}</button>;

  return <div>
    <div style={{...S.card,background:"#f9fafb",marginBottom:14}}>
      <div style={{fontSize:14,fontWeight:700,color:"#1a1a2e",marginBottom:4}}>＋ Ajouter / gérer mes systèmes</div>
      <div style={{fontSize:12,color:"#6b7280",lineHeight:1.5}}>Saisie manuelle, <strong>même sans DTA</strong>. Les systèmes livrés avec GlassIQ (Schüco…) ne sont jamais modifiés : tes ajouts sont stockés dans ce navigateur — pense à les <strong>exporter</strong> pour les sauvegarder ou les transmettre.</div>
    </div>
    {msg&&<div style={{...S.card,padding:"10px 14px",background:msg.t==="ok"?"#f0fdf4":"#fff7ed",border:`1px solid ${msg.t==="ok"?"#bbf7d0":"#fed7aa"}`,color:msg.t==="ok"?"#065f46":"#9a3412",fontSize:12,fontWeight:600}}>{msg.m}</div>}

    <div style={{...S.card,display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap"}}>
      <div style={{flex:1,minWidth:240}}>{lab("Partir d'un système existant (copie modifiable)")}<select value={srcId} onChange={e=>setSrcId(e.target.value)} style={{...S.input,padding:"6px 8px",fontSize:12}}><option value="">— choisir —</option>{db.systemes.filter(s=>!s.certifications).map(s=><option key={s.id} value={s.id}>{s.marque} {s.nom} — {s.famille}</option>)}</select></div>
      <button onClick={partirDe} disabled={!srcId} style={{...S.btnSecondary,opacity:srcId?1:0.5}}>Copier</button>
      {(form.id||form.nom)&&<button onClick={()=>{setForm(formVide());setMsg(null);}} style={S.btnSecondary}>Vider le formulaire</button>}
    </div>

    <div style={S.card}>
      {titre(form.id?"Modifier le système":"Identification")}
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>
        <div>{lab("Nom du système *")}{inp(form.nom,v=>setF("nom",v),"ex : AWS 75.SI+")}</div>
        <div>{lab("Marque *")}{inp(form.marque,v=>setF("marque",v),"Schüco")}</div>
        <div>{lab("Famille *")}<select value={form.famille} onChange={e=>setF("famille",e.target.value)} style={{...S.input,padding:"6px 8px",fontSize:12}}>{FAMILLES_SAISIE.map(f=><option key={f}>{f}</option>)}</select></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        <div>{lab("N° DTA / Avis technique")}{inp(form.dta,v=>setF("dta",v),"vide si pas de DTA")}</div>
        <div>{lab("Validité DTA (JJ/MM/AAAA)")}{inp(form.validite,v=>setF("validite",v),"ex : 31/01/2029")}</div>
        <div>{lab("Vantaux par défaut")}{inp(form.vantaux_defaut,v=>setF("vantaux_defaut",v),"auto")}</div>
      </div>
    </div>

    <div style={S.card}>
      {titre("Mécanique","Feuillure = plage d'épaisseur de vitrage admise · poids max = ferrure (ouvrant) ou appui vitrage (façade)")}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        <div>{lab("Épaisseur vitrage min (mm) *")}{inp(form.epaisseur_min,v=>setF("epaisseur_min",v),"24")}</div>
        <div>{lab("Épaisseur vitrage max (mm) *")}{inp(form.epaisseur_max,v=>setF("epaisseur_max",v),"48")}</div>
        <div>{lab("Poids max (kg) *")}{inp(form.poids_max,v=>setF("poids_max",v),"130")}</div>
      </div>
    </div>

    <div style={S.card}>
      {titre("PV acoustiques","Une ligne par composition testée — Rw+Ctr (= RA,tr) obligatoire pour le comparateur. Composition notée extérieur → intérieur.")}
      {form.tests.map((t,ti)=><div key={ti} style={{border:"1px solid #e5e7eb",borderRadius:8,padding:"10px 12px",marginBottom:10,background:"#fafafa"}}>
        <div style={{display:"grid",gridTemplateColumns:"1.3fr 1.6fr 0.8fr 0.8fr 1fr 0.7fr auto",gap:6,alignItems:"end",marginBottom:8}}>
          <div>{lab("Rapport")}{inp(t.rapport,v=>setTest(ti,"rapport",v),"BEB2…")}</div>
          <div>{lab("Châssis testé")}{inp(t.type_chassis,v=>setTest(ti,"type_chassis",v),"Fenêtre 1 vantail OB")}</div>
          <div>{lab("L essai (mm)")}{inp(t.dim_L,v=>setTest(ti,"dim_L",v),"1230")}</div>
          <div>{lab("H essai (mm)")}{inp(t.dim_H,v=>setTest(ti,"dim_H",v),"1480")}</div>
          <div>{lab("Labo")}{inp(t.labo,v=>setTest(ti,"labo",v),"CEBTP")}</div>
          <div>{lab("Année")}{inp(t.date,v=>setTest(ti,"date",v),"2024")}</div>
          {btnX(()=>delRow("tests",ti))}
        </div>
        {t.vitrages.map((v,vi)=>{
          const ok=!String(v.composition).trim()||!!analyseComposition(String(v.composition).trim());
          return <div key={vi} style={{display:"grid",gridTemplateColumns:"2fr 0.7fr 0.7fr 0.7fr auto",gap:6,alignItems:"end",marginBottom:4}}>
            <div>{vi===0&&lab("Composition")}{inp(v.composition,x=>setVit(ti,vi,"composition",x),"10/16/44.2s",ok?null:{borderColor:"#fca5a5",background:"#fff1f2"})}</div>
            <div>{vi===0&&lab("Rw")}{inp(v.rw,x=>setVit(ti,vi,"rw",x),"dB")}</div>
            <div>{vi===0&&lab("Rw+C")}{inp(v.rwc,x=>setVit(ti,vi,"rwc",x),"dB")}</div>
            <div>{vi===0&&lab("Rw+Ctr *")}{inp(v.rwctr,x=>setVit(ti,vi,"rwctr",x),"dB")}</div>
            {btnX(()=>delVit(ti,vi))}
          </div>;
        })}
        <div style={{marginTop:6}}>{btnAdd("+ composition",()=>addVit(ti))}</div>
      </div>)}
      {btnAdd("+ PV acoustique",()=>addRow("tests",{rapport:"",type_chassis:"",dim_L:"1230",dim_H:"1480",labo:"",date:"",vitrages:[{composition:"",rw:"",rwc:"",rwctr:""}]}))}
    </div>

    <div style={S.card}>
      {titre("Essais AEV","Vent (V) : classe EN 12210 (C3, B2…) ou pression d'essai en Pa pour une façade (ex. 1200/1800)")}
      {form.aev.map((a,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 0.6fr 0.6fr 0.8fr 1.2fr 0.6fr auto",gap:6,alignItems:"end",marginBottom:4}}>
        <div>{i===0&&lab("Châssis testé")}{inp(a.chassis,v=>setRow("aev",i,"chassis",v),"PF 2 vantaux")}</div>
        <div>{i===0&&lab("Dimensions")}{inp(a.dims,v=>setRow("aev",i,"dims",v),"1600x2250")}</div>

        <div>{i===0&&lab("E")}{inp(a.E,v=>setRow("aev",i,"E",v),"9A")}</div>
        <div>{i===0&&lab("V")}{inp(a.V,v=>setRow("aev",i,"V",v),"C3")}</div>
        <div>{i===0&&lab("Rapport")}{inp(a.rapport,v=>setRow("aev",i,"rapport",v),"")}</div>
        <div>{i===0&&lab("Année")}{inp(a.date,v=>setRow("aev",i,"date",v),"")}</div>
        {btnX(()=>delRow("aev",i))}
      </div>)}
      {btnAdd("+ essai AEV",()=>addRow("aev",{chassis:"",dims:"",A:"",E:"",V:"",rapport:"",date:""}))}
    </div>

    <div style={S.card}>
      {titre("Thermique (Uw)","Configuration : commence par « Fenêtre » ou « Porte-fenêtre » et précise « 1 vtl » / « 2 vtx » — le comparateur choisit ainsi la bonne ligne")}

        <div>{i===0&&lab("Configuration")}{inp(t.config,v=>setRow("thermique",i,"config",v),"Fenêtre 1 vtl 1.25x1.48 (Swisspacer)")}</div>
        <div>{i===0&&lab("Ug")}{inp(t.ug,v=>setRow("thermique",i,"ug",v),"1.1")}</div>

      </div>)}
      {btnAdd("+ ligne thermique",()=>addRow("thermique",{ug:"",config:"",uw:""}))}
    </div>

    <div style={S.card}>
      {titre("Domaine d'emploi (dimensions max)","Type : ex. « 1 vantail OB », « 2 vantaux OF », « 2 vantaux + fixe latéral »")}
      {form.dimensions_max.map((d,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr auto",gap:6,alignItems:"end",marginBottom:4}}>
        <div>{i===0&&lab("Type")}{inp(d.type,v=>setRow("dimensions_max",i,"type",v),"1 vantail OB")}</div>
        <div>{i===0&&lab("L max (mm)")}{inp(d.l_max,v=>setRow("dimensions_max",i,"l_max",v),"1150")}</div>
        <div>{i===0&&lab("H max (mm)")}{inp(d.h_max,v=>setRow("dimensions_max",i,"h_max",v),"1775")}</div>
        {btnX(()=>delRow("dimensions_max",i))}
      </div>)}
      {btnAdd("+ ligne",()=>addRow("dimensions_max",{type:"",l_max:"",h_max:""}))}
    </div>

    <div style={S.card}>
      {titre("Note")}
      <textarea value={form.note} onChange={e=>setF("note",e.target.value)} rows={3} placeholder="Source des données, réserves, contact fabricant…" style={{...S.input,fontSize:12}}/>
    </div>

    {erreurs.length>0&&<div style={{...S.card,background:"#fef2f2",border:"1px solid #fecaca",fontSize:12,color:"#991b1b"}}>{erreurs.map((e,i)=><div key={i}>✗ {e}</div>)}</div>}
    {avert.length>0&&<div style={{...S.card,background:"#fffbeb",border:"1px solid #fde68a",fontSize:12,color:"#92400e"}}>{avert.map((w,i)=><div key={i}>⚠ {w}</div>)}</div>}
    <div style={{display:"flex",gap:10,marginBottom:20}}>
      <button onClick={enregistrer} disabled={erreurs.length>0} style={{...S.btnPrimary,background:"#059669",opacity:erreurs.length?0.5:1,cursor:erreurs.length?"not-allowed":"pointer"}}>{form.id?"✓ Enregistrer les modifications":"✓ Ajouter à ma base"}</button>
    </div>

    <div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:10}}>
        <div style={{fontSize:13,fontWeight:700,color:"#1a1a2e"}}>Mes systèmes ajoutés ({perso.length})</div>
        <div style={{display:"flex",gap:8}}>
          <label style={{...S.btnSecondary,cursor:"pointer",display:"inline-flex",alignItems:"center"}}>⬆ Importer<input type="file" accept=".json,application/json" onChange={importer} style={{display:"none"}}/></label>
          <button onClick={exporter} disabled={!perso.length} style={{...S.btnSecondary,opacity:perso.length?1:0.5}}>⬇ Exporter</button>
        </div>
      </div>
      {perso.length===0&&<div style={{fontSize:12,color:"#9ca3af"}}>Aucun système ajouté pour l'instant.</div>}
      {perso.map(s=><div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderTop:"1px solid #f3f4f6",flexWrap:"wrap",gap:8}}>
        <div><div style={{fontWeight:700,fontSize:13}}>{s.marque} {s.nom} <span style={{fontWeight:400,color:"#6b7280",fontSize:12}}>· {s.famille}</span></div>
          <div style={{fontSize:11,color:"#9ca3af"}}>{s.dta?"DTA "+s.dta:"sans DTA"} · {(s.tests||[]).reduce((n,t)=>n+(t.vitrages||[]).length,0)} composition(s) · {(s.aev||[]).length} essai(s) AEV</div></div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>editer(s)} style={{...S.btnSecondary,fontSize:12}}>Modifier</button>
          {confirmDel===s.id
            ?<button onClick={()=>supprimer(s.id)} style={{...S.btnSecondary,fontSize:12,background:"#fee2e2",borderColor:"#fca5a5",color:"#991b1b"}}>Confirmer ?</button>
            :<button onClick={()=>setConfirmDel(s.id)} style={{...S.btnSecondary,fontSize:12,color:"#991b1b"}}>Supprimer</button>}
        </div>
      </div>)}
    </div>
  </div>;
}

// ── AUTOTEST — contrôles automatiques des calculs ─────────────────────────
// À relancer après chaque modification du fichier : protège contre les régressions.
function runAutotests(){
  const T=[];
  const ok=(nom,cond,detail)=>T.push({nom,ok:!!cond,detail:detail||""});
  const proche=(a,b,tol)=>Math.abs(a-b)<=(tol==null?0.01:tol);
  // Terrain
  const p0=calcPression("2","0","12"), pIV=calcPression("2","IV","12");
  ok("Terrain : cat. 0 (mer) plus exposée que cat. IV (urbain dense)", p0>pIV, `cat. 0 → ${p0} Pa · cat. IV → ${pIV} Pa`);
  ok("Terrain : libellé cat. 0 = mer, cat. IV ≠ mer", /mer/i.test(TERRAINS["0"])&&!/mer/i.test(TERRAINS["IV"]), TERRAINS["0"]);
  // Continuité des formules e1
  const a4=calcDTU39(1000,2499,1000,2,2,"isolant_2lam",10).e1, b4=calcDTU39(1000,2501,1000,2,2,"isolant_2lam",10).e1;
  ok("e1 4 appuis : raccord des 2 formules à L/l = 2,5 (écart < 1 %)", proche(a4,b4,0.01*b4), `${a4} / ${b4} mm`);
  const a3=calcDTU39(1000,7499,1000,2,1,"isolant_2lam",10).e1, b3=calcDTU39(1000,7501,1000,2,1,"isolant_2lam",10).e1;
  ok("e1 3 appuis : raccord des 2 formules à L/l = 7,5 (écart < 1 %)", proche(a3,b3,0.01*b3), `${a3} / ${b3} mm`);
  // Équivalences
  const e442=calcEquivalences(analyseComposition("44.2").panes,1);
  ok("Feuilleté 44.2 : eR = 8/(0,9×1,3) = 6,84 · eF = 8/1,3 = 6,15", proche(e442.eR,6.84)&&proche(e442.eF,6.15), `eR ${e442.eR} · eF ${e442.eF}`);
  const e4=calcEquivalences(analyseComposition("4/16/4").panes,1);
  ok("Double 4/16/4 : eR = 8/(1,6×0,9) = 5,56 · eF = 8/1,6 = 5", proche(e4.eR,5.56)&&proche(e4.eF,5), `eR ${e4.eR} · eF ${e4.eF}`);
  // Compositions
  const ac=analyseComposition("10/12/44.2 Ac");
  ok("« 10/12/44.2 Ac » lu en double vitrage complet (45 kg/m²)", ac&&ac.panes.length===2&&proche(ac.poids_m2,45,0.1), ac?`${ac.type} · ${ac.poids_m2} kg/m² · ${ac.epaisseur_totale} mm`:"non lu");
  const l10=analyseComposition("1010.4");
  ok("Feuilleté « 1010.4 » = 10 + 10 mm", l10&&l10.panes[0].components.join("+")==="10+10", l10?l10.panes[0].components.join("+"):"non lu");
  ok("Composition inconnue rejetée (plus de lecture tronquée)", analyseComposition("8 LSG/18/10")===null&&analyseComposition("10/12/xx")===null, "");
  const compos=[];INITIAL_DB.systemes.filter(s=>s.marque==="Schüco").forEach(s=>(s.tests||[]).forEach(t=>(t.vitrages||[]).forEach(v=>compos.push(v.composition))));
  const uniques=[...new Set(compos)], nonLues=uniques.filter(c=>!analyseComposition(c));
  ok(`Toutes les compositions Schüco de la base sont lues (${uniques.length})`, nonLues.length===0, nonLues.join(", ")||"OK");
  // Classes vent
  ok("Classe vent requise : 1100 Pa → V3 · 800 Pa → V2 · 2100 Pa → au-delà de V5", classeVRequise(1100).classe===3&&classeVRequise(800).classe===2&&classeVRequise(2100).classe==="E", classeVRequise(1100).label);
  ok("Lecture essais AEV : C3→1200 · B2→800 · « 3 »→1200 · 1200/1800→1200 · « — »→rien",
    pressionCouverteAEV("C3")===1200&&pressionCouverteAEV("B2")===800&&pressionCouverteAEV("3")===1200&&pressionCouverteAEV("1200/1800")===1200&&pressionCouverteAEV("—")===null, "");
  const fws=INITIAL_DB.systemes.find(s=>s.id==="fws50");
  ok("AEV façade FWS 50 exploité (essais saisis « 1200/1800 »)", fws&&verifAEV(fws,1100,true).ok===true, fws?verifAEV(fws,1100,true).note:"");
  const a75=INITIAL_DB.systemes.find(s=>s.id==="aws75ii");
  ok("AEV châssis AWS 75.II : CCTP V3 couvert (essais C3), CCTP C4 non couvert", verifAEV(a75,2150,false,"A4 E9A V3").ok===true&&verifAEV(a75,2150,false,"A4 E9A C4").ok===false, verifAEV(a75,2150,false,"A4 E9A V3").note);
  // Châssis composé
  const pj={...defaultProjet,zone_vent:"2",cat_terrain:"II",hauteur_bat:"12",hauteur_sol:"3"};
  const elc={id:"t",type:"chassis",soustype:"Fenêtre OB",largeur:"3000",hauteur:"2200",mode_trame:"personnalisee",chassis_compose:true,
    panneaux:[{largeur:"900",hauteur:"1500",type:"ouvrant",qte:"2"},{largeur:"1200",hauteur:"2200",type:"fixe",qte:"1"}]};
  const aws=INITIAL_DB.systemes.find(s=>s.id==="aws75ii");
  const vc=verifVitrage("10/16/44.2",3000,2200,aws,elc,pj);
  ok("Châssis composé : tableau par partie calculé (flèche et eR connus)", vc&&vc.detail_panneaux&&vc.detail_panneaux.length===2&&vc.detail_panneaux.every(d=>d.fleche_obtenue!=null),
    vc&&vc.detail_panneaux?vc.detail_panneaux.map(d=>`${d.largeur}×${d.hauteur} : rés. ${d.res_ok?"✓":"✗"} / flèche ${d.fleche_ok?"✓":"✗"}`).join(" · "):"");
  ok("Châssis composé : verdict global = toutes les parties conformes", vc&&vc.resistance_ok===vc.detail_panneaux.every(d=>d.res_ok)&&vc.fleche_verre_ok===vc.detail_panneaux.every(d=>d.fleche_ok), "");
  ok("Flèche affichée cohérente avec le verdict", vc&&vc.detail_panneaux.every(d=>d.fleche_ok===(d.fleche_obtenue<=d.fleche_max)), "");
  // Façade
  const vf=calcVentElement({id:"f",type:"facade",largeur:"12000",hauteur:"3200",trame:"1350"},pj);
  ok("Vent façade calculé sur le panneau de trame, pas sur la façade entière", vf&&vf.panneau.largeur===1350, vf?`${vf.panneau.largeur}×${vf.panneau.hauteur} mm → ≥ ${vf.dtu.eRequired} mm`:"");
  // Allège
  ok("Allège : 6/16/44.2 accepté · 44.2/16/6 refusé (feuilleté côté extérieur)", verifFeuilleteAllege("6/16/44.2").ok===true&&verifFeuilleteAllege("44.2/16/6").ok===false, "");
  // Métré
  const {totaux:M}=metreGlobal([{id:1,type:"chassis",soustype:"Porte-fenêtre",largeur:"2400",hauteur:"2200",larg_fixe:"800"},{id:2,type:"chassis",soustype:"Fenêtre fixe",largeur:"1000",hauteur:"1000"}],{});
  ok("Métré châssis : vitré fixe + ouvrants = surface totale", proche(M.surf_vitree+M.surf_ouvrants+M.surf_allege,M.surf_total,0.11), `${M.surf_vitree} + ${M.surf_ouvrants} + ${M.surf_allege} = ${M.surf_total} m²`);
  // Domaine d'emploi
  const vd=verifDimensions(aws,1300,1600,{type:"chassis",soustype:"Fenêtre OB",largeur:"1300",hauteur:"1600"});
  ok("Domaine d'emploi AWS 75.II : OB 1 vantail 1300 mm → hors domaine (max 1150)", vd.statut==="hors", vd.texte||"");
  // Thermique
  const th=verifThermique(aws,{type:"chassis",soustype:"Fenêtre OB"},{uw_max:"1.4"});
  ok("Thermique : ligne « Fenêtre 1 vtl » retenue pour une fenêtre 1 vantail", th.cfg&&/^Fen[êe]tre 1 vtl/.test(th.cfg.config), th.note);
  return T;
}
function PageAutotest(){
  const [res,setRes]=useState(()=>{try{return runAutotests();}catch(e){return [{nom:"Erreur pendant l'autotest",ok:false,detail:String((e&&e.message)||e)}];}});
  const relancer=()=>{try{setRes(runAutotests());}catch(e){setRes([{nom:"Erreur pendant l'autotest",ok:false,detail:String((e&&e.message)||e)}]);}};
  const nbOk=res.filter(r=>r.ok).length, tout=nbOk===res.length;
  return <div>
    <div style={{...S.card,background:tout?"#f0fdf4":"#fef2f2",border:`1.5px solid ${tout?"#6ee7b7":"#fca5a5"}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div><div style={{fontSize:16,fontWeight:800,color:tout?"#065f46":"#991b1b"}}>{tout?"✓":"✗"} {nbOk} / {res.length} contrôles OK</div>
        <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>Vérifie les formules et la lecture des données. À relancer après chaque modification du fichier.</div></div>
      <button onClick={relancer} style={S.btnSecondary}>↻ Relancer</button>
    </div>
    <div style={S.card}>
      {res.map((r,i)=><div key={i} style={{display:"flex",gap:10,padding:"7px 0",borderTop:i?"1px solid #f3f4f6":"none"}}>
        <span style={{width:20,height:20,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,background:r.ok?"#d1fae5":"#fee2e2",color:r.ok?"#065f46":"#991b1b"}}>{r.ok?"✓":"✗"}</span>
        <div><div style={{fontSize:13,color:"#1a1a2e"}}>{r.nom}</div>{r.detail&&<div style={{fontSize:11,color:"#6b7280",fontFamily:"monospace"}}>{r.detail}</div>}</div>
      </div>)}
    </div>
    <div style={{...S.card,background:"#f9fafb",fontSize:12,color:"#6b7280"}}>💡 Les 11 exemples chiffrés du NF DTU 39 P4 et ta feuille Excel de référence peuvent être ajoutés ici comme cas de contrôle.</div>
  </div>;
}

// ── APP PRINCIPALE ────────────────────────────────────────────────────────
function App(){

  const [page,setPage]=useState("projet");
  const [projet,setProjet]=useState(defaultProjet);
  const [toast,setToast]=useState(null);

  // Auto-sauvegarde silencieuse du projet courant s'il a déjà été sauvegardé une fois
  useEffect(()=>{
    if(projet._pid&&projet.nom){
      const t=setTimeout(()=>{sauverProjet(projet);},1500);
      return ()=>clearTimeout(t);
    }
  },[projet]);
  const pages=[
    {id:"projet",label:"Projet & CCTP",icon:"📋"},
    {id:"vent",label:"Calcul vent",icon:"💨"},
    {id:"comparateur",label:"Comparateur",icon:"⚖"},
    {id:"controle",label:"Contrôle solaire",icon:"☀"},
    {id:"prescription",label:"Prescription",icon:"📄"},
    {id:"metre",label:"Métré",icon:"📐"},
    {id:"fleche",label:"Flèche façade",icon:"📏"},
    {id:"securite",label:"Pare-balle / Coupe-feu",icon:"🛡"},
    {id:"projets",label:"Mes projets",icon:"💾"},
    {id:"base",label:"Ma base",icon:"📚"},
    {id:"ajouter",label:"Ajouter système",icon:"＋"},
    {id:"autotest",label:"Autotest",icon:"🧪"},
  ];
  return <div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",minHeight:"100vh",background:"#f8f9fb"}}>
    <div className="no-print" style={{background:"#1a1a2e",color:"#fff",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid rgba(255,255,255,0.08)",flexWrap:"wrap",gap:4}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 0"}}>
        <div style={{width:30,height:30,borderRadius:8,background:"linear-gradient(135deg,#4ade80,#22c55e)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>🪟</div>
        <div><div style={{fontWeight:800,fontSize:15}}>GlassIQ v2.6</div><div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>Workflow complet — 5 étapes</div></div>
        {projet.nom&&<div style={{marginLeft:12,fontSize:12,color:"rgba(255,255,255,0.5)",fontStyle:"italic"}}>{projet.nom}</div>}
      </div>
      <nav style={{display:"flex",gap:2,flexWrap:"wrap"}}>
        {pages.map(p=><button key={p.id} onClick={()=>setPage(p.id)} style={{padding:"7px 11px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",border:"none",background:page===p.id?"rgba(255,255,255,0.12)":"transparent",color:page===p.id?"#fff":"rgba(255,255,255,0.5)"}}>
          {p.icon} {p.label}{p.id==="projet"&&projet.elements.length>0?<span style={{marginLeft:4,background:"#22c55e",color:"#fff",borderRadius:10,padding:"1px 5px",fontSize:10}}>{projet.elements.length}</span>:""}
        </button>)}
      </nav>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 0"}}>
        <a href="priceiq/index.html" style={{padding:"6px 12px",borderRadius:8,fontSize:12,fontWeight:700,textDecoration:"none",background:"rgba(240,192,64,0.15)",color:"#f0c040",border:"1px solid rgba(240,192,64,0.3)",display:"flex",alignItems:"center",gap:5}}>💰 PriceIQ</a>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>{db.systemes.length} systèmes</div>
      </div>
    </div>
    <div style={{maxWidth:960,margin:"0 auto",padding:"22px 16px"}}>

      {page==="vent"&&<PageVent projet={projet} setProjet={setProjet} setPage={setPage}/>}
      {page==="comparateur"&&<PageComparateur db={db} projet={projet} setProjet={setProjet} setPage={setPage}/>}
      {page==="controle"&&<PageControleSolaire projet={projet} setProjet={setProjet}/>}
      {page==="prescription"&&<PagePrescription projet={projet} setProjet={setProjet} setPage={setPage}/>}
      {page==="metre"&&<PageMetre projet={projet}/>}
      {page==="fleche"&&<PageFleche projet={projet}/>}
      {page==="securite"&&<PageSecurite db={db}/>}
      {page==="projets"&&<PageProjets projet={projet} setProjet={setProjet} setPage={setPage} onToast={showToast}/>}

}

const container=document.getElementById('root');
const root=ReactDOM.createRoot(container);
root.render(React.createElement(App));
</script>
